{% extends "GeoDataHub/base.html" %}
{% load static %}

{% block title %}快速標記 - GeoDataHub{% endblock %}

{% block extra_css %}
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<style>
    .map-mark-page {
        height: calc(100vh - 70px);
        display: flex;
    }
    
    .mark-sidebar {
        width: 380px;
        flex-shrink: 0;
        background: white;
        border-right: 1px solid var(--border);
        display: flex;
        flex-direction: column;
        overflow-y: auto;
    }
    
    .mark-header {
        padding: 1.25rem;
        border-bottom: 1px solid var(--border);
        display: flex;
        align-items: center;
        gap: 0.75rem;
        background: var(--primary-bg);
    }
    
    .mark-header h2 {
        font-family: var(--font-heading);
        font-size: 1.125rem;
        font-weight: 700;
        color: var(--primary);
        margin: 0;
    }
    
    .mark-form {
        padding: 1.25rem;
        flex: 1;
    }
    
    .form-group { margin-bottom: 1rem; }
    .form-label { display: block; font-weight: 600; font-size: 0.8125rem; color: var(--text-primary); margin-bottom: 0.375rem; }
    .form-input, .form-select, .form-textarea {
        width: 100%;
        padding: 0.625rem 0.875rem;
        border: 2px solid var(--border);
        border-radius: var(--radius-md);
        font-family: var(--font-body);
        font-size: 0.9375rem;
    }
    .form-input:focus, .form-select:focus, .form-textarea:focus { outline: none; border-color: var(--primary); }
    
    .coord-box {
        background: var(--primary-bg);
        padding: 0.75rem;
        border-radius: var(--radius-md);
        font-family: monospace;
        font-size: 0.875rem;
        color: var(--primary);
    }
    
    .mark-map {
        flex: 1;
        position: relative;
    }
    
    #map { width: 100%; height: 100%; }
    
    .map-hint {
        position: absolute;
        top: 1rem;
        left: 1rem;
        z-index: 1000;
        background: white;
        padding: 0.75rem 1rem;
        border-radius: var(--radius-lg);
        box-shadow: var(--shadow-md);
        font-size: 0.875rem;
        display: flex;
        align-items: center;
        gap: 0.5rem;
    }
</style>
{% endblock %}

{% block content %}
<div class="map-mark-page">
    <!-- Sidebar Form -->
    <aside class="mark-sidebar">
        <div class="mark-header">
            <a href="{% url 'geodatahub:map' %}" class="re-btn re-btn--secondary re-btn--sm">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
            </a>
            <h2>快速標記</h2>
        </div>
        
        <form id="mark-form" method="post" action="{% url 'geodatahub:source_create' %}" class="mark-form">
            {% csrf_token %}
            
            <div class="form-group">
                <label class="form-label">標題 *</label>
                <input type="text" name="title" class="form-input" required placeholder="資料標題">
            </div>
            
            <div class="form-group">
                <label class="form-label">分類</label>
                <select name="category" class="form-select">
                    <option value="">選擇分類</option>
                    {% for cat in categories %}
                    <option value="{{ cat.id }}">{{ cat.icon }} {{ cat.name }}</option>
                    {% endfor %}
                </select>
            </div>
            
            <div class="form-group">
                <label class="form-label">來源類型</label>
                <select name="source_type" class="form-select">
                    <option value="upload">上傳檔案</option>
                    <option value="link">外部連結</option>
                    <option value="opensearch">OpenSearch</option>
                </select>
            </div>
            
            <div class="form-group">
                <label class="form-label">描述</label>
                <textarea name="description" class="form-textarea" rows="3" placeholder="資料描述..."></textarea>
            </div>
            
            <hr style="border: none; border-top: 1px solid var(--border); margin: 1.25rem 0;">
            
            <div class="form-group">
                <label class="form-label">📍 位置 (點擊地圖選取)</label>
                <div class="coord-box" id="coord-display">尚未選取</div>
            </div>
            
            <input type="hidden" name="latitude" id="latitude">
            <input type="hidden" name="longitude" id="longitude">
            
            <div class="form-group">
                <label class="form-label">地址</label>
                <input type="text" name="address" id="address" class="form-input" placeholder="地址">
            </div>
            
            <input type="hidden" name="country" value="台灣">
            <input type="hidden" name="is_visible" value="on">
            
            <button type="submit" class="re-btn re-btn--primary" style="width: 100%; margin-top: 1rem;">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="20 6 9 17 4 12"/></svg>
                儲存
            </button>
        </form>
    </aside>
    
    <!-- Map -->
    <main class="mark-map">
        <div id="map"></div>
        <div class="map-hint">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>
            點擊地圖選取位置
        </div>
    </main>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
    let map, marker;
    
    document.addEventListener('DOMContentLoaded', function() {
        map = L.map('map').setView([23.6978, 120.9605], 7);
        L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', { attribution: '© OSM © CARTO' }).addTo(map);
        map.on('click', e => placeMarker(e.latlng.lat, e.latlng.lng));
    });
    
    function placeMarker(lat, lng) {
        if (marker) map.removeLayer(marker);
        const icon = L.divIcon({
            html: `<svg width="36" height="36" viewBox="0 0 24 24" fill="none"><path d="M12 3L2 12h3v8h6v-6h2v6h6v-8h3L12 3z" fill="#0F766E" stroke="white" stroke-width="2"/></svg>`,
            className: '', iconSize: [36, 36], iconAnchor: [18, 32]
        });
        marker = L.marker([lat, lng], { icon, draggable: true }).addTo(map);
        marker.on('dragend', e => { const pos = e.target.getLatLng(); updateCoords(pos.lat, pos.lng); });
        updateCoords(lat, lng);
        
        // Reverse Geocode
        fetch('{% url "geodatahub:api_reverse_geocode" %}?lat=' + lat + '&lng=' + lng)
            .then(r => r.json())
            .then(d => { if (d.success && d.result.display_name) document.getElementById('address').value = d.result.display_name.substring(0, 200); });
    }
    
    function updateCoords(lat, lng) {
        document.getElementById('latitude').value = lat.toFixed(8);
        document.getElementById('longitude').value = lng.toFixed(8);
        document.getElementById('coord-display').textContent = `${lat.toFixed(6)}, ${lng.toFixed(6)}`;
    }
</script>
{% endblock %}
