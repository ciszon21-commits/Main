{% extends 'InterviewAssessment/base.html' %}

{% block content %}
<div class="min-h-full flex flex-col justify-center py-12 sm:px-6 lg:px-8">
    <div class="sm:mx-auto sm:w-full sm:max-w-md text-center">
        <svg class="mx-auto h-24 w-24 text-green-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
        <h2 class="mt-6 text-3xl font-extrabold text-gray-900">
            測驗完成!
        </h2>
        <p class="mt-2 text-sm text-gray-600">
            感謝您的作答，您的成績已紀錄。
        </p>
        
        {% if attempt.score is not None %}
        <div class="mt-8 bg-white p-6 rounded-lg shadow">
            <h3 class="text-lg font-medium text-gray-900">您的分數</h3>
            <div class="mt-2 text-5xl font-bold text-indigo-600">
                {{ attempt.percentage }}%
            </div>
            <p class="mt-2 text-sm text-gray-500">({{ attempt.score }} / {{ attempt.max_score }})</p>
        </div>
        {% endif %}
        
        <div class="mt-6">
            <a href="/" class="text-indigo-600 hover:text-indigo-500 font-medium">返回首頁</a>
        </div>
    </div>
</div>
{% endblock %}
