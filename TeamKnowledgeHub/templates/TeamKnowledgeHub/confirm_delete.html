{% load static %}
<!DOCTYPE html>
<html lang="zh-Hant">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>確認刪除 - 團隊知識管理</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'TeamKnowledgeHub/css/styles.css' %}">
    <link rel="icon" href="{% static 'favicon.ico' %}" type="image/x-icon">
</head>

<body>
    <!-- Banner Section -->
    <div class="banner banner-sm banner-danger">
        <div class="banner-content">
            <div class="banner-info">
                <a href="{{ back_url }}" class="back-link">← 返回</a>
                <h1 class="banner-title">確認刪除</h1>
            </div>
        </div>
    </div>

    <!-- Main Content -->
    <div class="container">
        <div class="delete-confirm-container">
            <div class="delete-icon">
                <svg width="64" height="64" fill="currentColor" viewBox="0 0 16 16">
                    <path d="M8 15A7 7 0 1 1 8 1a7 7 0 0 1 0 14zm0 1A8 8 0 1 0 8 0a8 8 0 0 0 0 16z" />
                    <path
                        d="M4.646 4.646a.5.5 0 0 1 .708 0L8 7.293l2.646-2.647a.5.5 0 0 1 .708.708L8.707 8l2.647 2.646a.5.5 0 0 1-.708.708L8 8.707l-2.646 2.647a.5.5 0 0 1-.708-.708L7.293 8 4.646 5.354a.5.5 0 0 1 0-.708z" />
                </svg>
            </div>
            <h2>確定要刪除此{{ object_type }}嗎？</h2>
            <p class="delete-target">「{{ object }}」</p>
            <p class="delete-warning">此操作無法復原，相關資料將會一併刪除。</p>

            <form method="post" class="delete-form">
                {% csrf_token %}
                <div class="form-actions">
                    <a href="{{ back_url }}" class="btn btn-secondary">取消</a>
                    <button type="submit" class="btn btn-danger">確認刪除</button>
                </div>
            </form>
        </div>
    </div>
</body>

</html>
