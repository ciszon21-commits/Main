{% load static %}
<!DOCTYPE html>
<html lang="zh-Hant">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>確認刪除 - 團隊知識管理</title>
    <link rel="stylesheet" href="{% static 'TeamKnowledgeHub/css/styles.css' %}">
    <link rel="icon" href="{% static 'favicon.ico' %}" type="image/x-icon">
</head>

<body>
    <!-- Page Header -->
    <header class="page-header" style="background: linear-gradient(135deg, #3D1F23 0%, #4A2329 100%);">
        <div class="page-header-content">
            <div class="page-header-left">
                <a href="{{ back_url }}" class="back-link">
                    <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                        <path d="M19 12H5M12 19l-7-7 7-7"/>
                    </svg>
                    取消
                </a>
                <div>
                    <h1 class="page-title">確認刪除{{ object_type }}</h1>
                </div>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <div class="container">
        <div class="form-container">
            <div class="card" style="text-align: center; padding: 40px 24px;">
                <svg width="64" height="64" fill="none" stroke="var(--danger)" stroke-width="1.5" viewBox="0 0 24 24" style="margin-bottom: 20px; opacity: 0.8;">
                    <polyline points="3 6 5 6 21 6"/>
                    <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>
                    <line x1="10" y1="11" x2="10" y2="17"/>
                    <line x1="14" y1="11" x2="14" y2="17"/>
                </svg>
                
                <h3 style="font-size: 1.25rem; margin-bottom: 12px; color: var(--text-primary);">
                    確定要刪除此{{ object_type }}嗎？
                </h3>
                
                <p style="color: var(--text-secondary); margin-bottom: 8px; font-size: 1.1rem; font-weight: 500;">
                    「{{ object }}」
                </p>
                
                <p style="color: var(--text-muted); margin-bottom: 24px;">
                    此操作無法復原，請謹慎操作。
                </p>
                
                <form method="post" style="display: flex; justify-content: center; gap: 12px;">
                    {% csrf_token %}
                    <a href="{{ back_url }}" class="btn btn-secondary">
                        <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                            <path d="M19 12H5M12 19l-7-7 7-7"/>
                        </svg>
                        取消
                    </a>
                    <button type="submit" class="btn btn-primary" style="background: var(--danger);">
                        <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                            <polyline points="3 6 5 6 21 6"/>
                            <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>
                        </svg>
                        確認刪除
                    </button>
                </form>
            </div>
        </div>
    </div>
</body>

</html>
