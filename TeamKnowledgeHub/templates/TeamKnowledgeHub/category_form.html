{% load static %}
<!DOCTYPE html>
<html lang="zh-Hant">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ title }} - {{ team.name }}</title>
    <link rel="stylesheet" href="{% static 'TeamKnowledgeHub/css/styles.css' %}">
    <link rel="icon" href="{% static 'favicon.ico' %}" type="image/x-icon">
</head>

<body>
    <!-- Page Header -->
    <header class="page-header">
        <div class="page-header-content">
            <div class="page-header-left">
                <a href="{% url 'knowledge:team_detail' team.pk %}" class="back-link">
                    <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                        <path d="M19 12H5M12 19l-7-7 7-7"/>
                    </svg>
                    返回 {{ team.name }}
                </a>
                <div>
                    <h1 class="page-title">{{ title }}</h1>
                    <p class="page-subtitle">{{ topic.name }}</p>
                </div>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <div class="container">
        <div class="form-container">
            <form method="post" class="form">
                {% csrf_token %}
                
                <div class="form-group">
                    <label for="id_name">
                        分類名稱 <span class="required">*</span>
                    </label>
                    <input type="text" 
                           name="name" 
                           id="id_name" 
                           value="{{ form.name.value|default:'' }}"
                           placeholder="輸入分類名稱..."
                           required>
                    {% if form.name.errors %}
                    <span class="error-text">{{ form.name.errors.0 }}</span>
                    {% endif %}
                </div>
                
                <div class="form-group">
                    <label for="id_order">排序</label>
                    <input type="number" 
                           name="order" 
                           id="id_order" 
                           value="{{ form.order.value|default:0 }}"
                           min="0"
                           style="width: 120px;">
                    {% if form.order.errors %}
                    <span class="error-text">{{ form.order.errors.0 }}</span>
                    {% endif %}
                    <span class="help-text">數字越小排序越前面</span>
                </div>
                
                <div class="form-actions">
                    <a href="{% url 'knowledge:team_detail' team.pk %}" class="btn btn-secondary">取消</a>
                    <button type="submit" class="btn btn-primary">
                        <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                            <path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/>
                            <polyline points="17 21 17 13 7 13 7 21"/>
                            <polyline points="7 3 7 8 15 8"/>
                        </svg>
                        儲存
                    </button>
                </div>
            </form>
        </div>
    </div>
</body>

</html>
