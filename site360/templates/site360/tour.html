<!DOCTYPE html>
<html>

<head>
    <title>{{ project.name }} - 360 View</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Pannellum CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pannellum@2.5.6/build/pannellum.css" />
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">

    <style>
        body,
        html {
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
        }

        #panorama {
            width: 100%;
            height: 100vh;
        }

        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            /* Let clicks pass through to Pannellum */
            z-index: 10;
        }

        /* Re-enable pointer events for specific UI elements */
        .interactive-ui {
            pointer-events: auto;
        }

        #title-overlay {
            position: absolute;
            top: 10px;
            left: 10px;
            color: white;
            text-shadow: 1px 1px 3px black;
        }

        #controls-overlay {
            position: absolute;
            top: 10px;
            right: 10px;
            display: flex;
            gap: 10px;
        }

        /* Hotspot Tooltips */
        .custom-hotspot {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.8);
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            transition: transform 0.2s;
            box-shadow: 0 0 5px rgba(0, 0, 0, 0.5);
        }

        .custom-hotspot:hover {
            transform: scale(1.2);
        }

        .custom-hotspot i {
            font-size: 16px;
        }

        .hotspot-text {
            color: #d9534f;
        }

        .hotspot-image {
            color: #0d6efd;
        }

        .hotspot-video {
            color: #198754;
        }

        /* Edit Mode Styles */
        body.edit-mode #panorama {
            cursor: crosshair;
        }

        /* Prevent Pannellum from capturing clicks when modal is open */
        body.modal-open #panorama {
            pointer-events: none;
        }

        #instruction-overlay {
            position: absolute;
            bottom: 50px;
            left: 50%;
            transform: translateX(-50%);
            background-color: rgba(0, 0, 0, 0.7);
            color: white;
            padding: 10px 20px;
            border-radius: 20px;
            font-size: 1.1rem;
            z-index: 20;
            display: none;
            pointer-events: none;
            white-space: nowrap;
        }
    </style>
</head>

<body>

    <div id="ui-layer">
        <div id="title-overlay" class="interactive-ui">
            <h2>{{ project.name }}</h2>
            <p id="scene-title">Loading...</p>
        </div>

        <div id="controls-overlay" class="interactive-ui">
            <a href="{% url 'site360:project_detail' project.pk %}" class="btn btn-secondary btn-sm">
                <i class="fas fa-arrow-left"></i> 返回
            </a>
            <button id="toggle-edit-btn" class="btn btn-outline-warning btn-sm" onclick="toggleEditMode()">
                <i class="fas fa-edit"></i> 編輯模式
            </button>
        </div>

        <div id="instruction-overlay">
            <i class="fas fa-mouse-pointer"></i> 雙擊畫面任意處以新增熱點
        </div>
    </div>

    <div id="panorama"></div>

    <!-- Add Hotspot Modal -->
    <div class="modal fade" id="addHotspotModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">新增熱點</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="addHotspotForm">
                        <input type="hidden" name="scene_id" id="sceneIdInput">
                        <input type="hidden" name="pitch" id="pitchInput">
                        <input type="hidden" name="yaw" id="yawInput">

                        <div class="mb-3">
                            <label class="form-label">類型</label>
                            <select class="form-select" name="type" id="typeSelect" onchange="updateFormFields()">
                                <option value="text">文字公告</option>
                                <option value="image">照片說明</option>
                                <option value="video">影片說明</option>
                            </select>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">標題</label>
                            <input type="text" class="form-control" name="title" required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">詳細說明</label>
                            <textarea class="form-control" name="description" rows="3"></textarea>
                        </div>

                        <div class="mb-3 d-none" id="imageField">
                            <label class="form-label">上傳圖片</label>
                            <input type="file" class="form-control" name="image" accept="image/*">
                        </div>

                        <div class="mb-3 d-none" id="videoField">
                            <label class="form-label">上傳影片</label>
                            <input type="file" class="form-control" name="video" accept="video/*">
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-primary" onclick="submitHotspot()">儲存</button>
                </div>
            </div>
        </div>
    </div>

    <!-- View/Delete Hotspot Modal -->
    <div class="modal fade" id="viewHotspotModal" tabindex="-1">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="viewTitle">熱點標題</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <div id="viewMedia" class="mb-3 text-center"></div>
                    <p id="viewDescription"></p>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-danger d-none" id="deleteBtn"
                        onclick="deleteCurrentHotspot()">刪除熱點</button>
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">關閉</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/jquery@3.6.0/dist/jquery.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/pannellum@2.5.6/build/pannellum.js"></script>

    <script>
        let viewer;
        let isEditMode = false;
        let currentHotspotId = null;
        let tourData = {};

        function toggleEditMode() {
            isEditMode = !isEditMode;
            if (isEditMode) {
                document.body.classList.add('edit-mode');
                $('#toggle-edit-btn').removeClass('btn-outline-warning').addClass('btn-warning').html('<i class="fas fa-check"></i> 結束編輯');
                $('#instruction-overlay').fadeIn();
            } else {
                document.body.classList.remove('edit-mode');
                $('#toggle-edit-btn').removeClass('btn-warning').addClass('btn-outline-warning').html('<i class="fas fa-edit"></i> 編輯模式');
                $('#instruction-overlay').fadeOut();
            }
        }

        function updateFormFields() {
            const type = $('#typeSelect').val();
            $('#imageField').addClass('d-none');
            $('#videoField').addClass('d-none');
            if (type === 'image') $('#imageField').removeClass('d-none');
            if (type === 'video') $('#videoField').removeClass('d-none');
        }

        // Custom tooltip renderer for hotspots
        window.hotspotTooltip = function (hotSpotDiv, args) {
            hotSpotDiv.classList.add('custom-hotspot');
            let iconClass = 'fa-info-circle';
            let colorClass = 'hotspot-text';

            if (args.type === 'image') { iconClass = 'fa-camera'; colorClass = 'hotspot-image'; }
            if (args.type === 'video') { iconClass = 'fa-video'; colorClass = 'hotspot-video'; }

            hotSpotDiv.classList.add(colorClass);
            hotSpotDiv.innerHTML = `<i class="fas ${iconClass}"></i>`;

            // Handle click
            hotSpotDiv.onclick = function (e) {
                e.stopPropagation(); // Prevent viewer click
                showHotspotModal(args);
            };
        };

        function showHotspotModal(data) {
            currentHotspotId = data.id;
            $('#viewTitle').text(data.title);
            $('#viewDescription').text(data.description);

            let mediaHtml = '';
            if (data.type === 'image' && data.image) {
                mediaHtml = `<img src="${data.image}" class="img-fluid" style="max-height: 400px;">`;
            } else if (data.type === 'video' && data.video) {
                // Use a wrapper and handle events in JS to be cleaner and more robust
                mediaHtml = `<div class="video-wrapper ratio ratio-16x9"><video controls class="w-100" style="max-height: 400px; object-fit: contain;"><source src="${data.video}" type="video/mp4">Your browser does not support the video tag.</video></div>`;
            }
            $('#viewMedia').html(mediaHtml);

            // Show delete button only in edit mode
            if (isEditMode) {
                $('#deleteBtn').removeClass('d-none');
            } else {
                $('#deleteBtn').addClass('d-none');
            }

            new bootstrap.Modal(document.getElementById('viewHotspotModal')).show();
        }

        function loadTour() {
            // Append current URL query parameters (like ?scene_id=123) to the API call
            const apiUrl = "{% url 'site360:project_tour_data' project.pk %}" + window.location.search;

            fetch(apiUrl)
                .then(response => response.json())
                .then(data => {
                    tourData = data;

                    // Pre-process data to convert string function names to actual functions
                    for (const sceneId in data.scenes) {
                        const scene = data.scenes[sceneId];
                        if (scene.hotSpots) {
                            scene.hotSpots.forEach(hs => {
                                if (hs.createTooltipFunc && typeof hs.createTooltipFunc === 'string') {
                                    // Pannellum expects a function reference
                                    if (window[hs.createTooltipFunc]) {
                                        hs.createTooltipFunc = window[hs.createTooltipFunc];
                                    }
                                }
                            });
                        }
                    }

                    // Disable double click zoom to allow our custom double click handler
                    if (!data.default) data.default = {};
                    data.default.doubleClickZoom = false;

                    if (viewer) {
                        viewer.destroy();
                    }

                    viewer = pannellum.viewer('panorama', data);

                    viewer.on('load', function () {
                        const currentSceneId = viewer.getScene();
                        if (data.scenes[currentSceneId]) {
                            document.getElementById('scene-title').innerText = data.scenes[currentSceneId].title;
                        }
                    });

                    // Double click event for adding hotspot (Native DOM event)
                    document.getElementById('panorama').addEventListener('dblclick', function (event) {
                        if (!isEditMode) return;

                        // Pannellum's mouseEventToCoords works with standard events
                        const coords = viewer.mouseEventToCoords(event);

                        // Open Add Modal
                        $('#sceneIdInput').val(viewer.getScene());
                        $('#pitchInput').val(coords[0]);
                        $('#yawInput').val(coords[1]);

                        // Reset form
                        $('#addHotspotForm')[0].reset();
                        updateFormFields();

                        new bootstrap.Modal(document.getElementById('addHotspotModal')).show();
                    });
                })
                .catch(error => {
                    console.error('Error:', error);
                });
        }

        function submitHotspot() {
            const formData = new FormData(document.getElementById('addHotspotForm'));
            // sceneIdInput value is actually the Pannellum scene ID (string), which happens to be our Scene database ID.

            fetch("{% url 'site360:save_hotspot' %}", {
                method: 'POST',
                body: formData
            })
                .then(response => response.json())
                .then(data => {
                    if (data.status === 'success') {
                        bootstrap.Modal.getInstance(document.getElementById('addHotspotModal')).hide();
                        // Reload viewer to show new hotspot (keeping current scene)
                        const currentScene = viewer.getScene();
                        const currentPitch = viewer.getPitch();
                        const currentYaw = viewer.getYaw();

                        loadTour(); // Reload all data
                        // Ideally we should wait for load and then restore position, but simple reload puts us at start of scene usually.
                        // Or we can manipulate the viewer configuration directly but reloading data is safer for data consistency.
                    } else {
                        alert('Save failed: ' + data.message);
                    }
                });
        }

        function deleteCurrentHotspot() {
            if (!currentHotspotId) return;
            if (!confirm('確定要刪除此熱點嗎？')) return;

            fetch(`/site360/api/hotspot/delete/${currentHotspotId}/`, {
                method: 'POST'
            })
                .then(response => response.json())
                .then(data => {
                    if (data.status === 'success') {
                        bootstrap.Modal.getInstance(document.getElementById('viewHotspotModal')).hide();
                        loadTour();
                    } else {
                        alert('Delete failed: ' + data.message);
                    }
                });
        }

        // Initialize
        loadTour();

        // Aggressively stop propagation for video controls
        // This prevents clicks on the video timeline from bubbling up to Pannellum or Bootstrap handlers
        // which might cause weird behavior (like resetting focus or reloading).
        $(document).on('mousedown mouseup click touchstart touchend pointerdown pointerup mousemove', '.video-wrapper video', function (e) {
            e.stopPropagation();
        });

    </script>

</body>

</html>
