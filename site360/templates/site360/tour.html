            // Set reference type to restrict options
            $('#refResourceType').val(resource.type);

            // Important: Do NOT clear hotspotIdInput if we are editing an existing hotspot (currentHotspotId is set)
            // If we are adding a new hotspot (currentHotspotId is null), then clear it to ensure creation.
            // Check if form has an ID already? NO, check currentHotspotId variable or the input value itself BEFORE clearing?
            // Actually, if we are in Add Modal, we might have clicked "Add" (id empty) or "Edit" (id set).
            // We should respect the current state of hotspotIdInput UNLESS we want to force something.
            // But here, the user wants to Import *into* the current form.
            // So we should NOT touch hotspotIdInput at all. Let it stay as is.
            if (!currentHotspotId) {
                $('#hotspotIdInput').val(''); // Only ensure empty if we are adding new
            } else {
                $('#hotspotIdInput').val(currentHotspotId); // Ensure it keeps the current ID
            }

            $('#refHotspotId').val(resource.id);
            $('#clearSourceInput').val(''); // Ensure clear flag is reset


            // Set Icon
            if (resource.icon) {
                // Try to find icon radio or just select Custom if not in list (simplification: assume standard icons or just keep what it is if hidden)
                // For now, let's try to match standard icons.
                const iconRadio = $(`input[name="icon"][value="${resource.icon}"]`);
                if (iconRadio.length) {
                    iconRadio.prop('checked', true);
                }
            }
            if (resource.icon_color) {
                $('#iconColorInput').val(resource.icon_color);
                $('.color-option').removeClass('selected');
                $(`.color-option[data-color="${resource.icon_color}"]`).addClass('selected');
            }

            // Show Notice
            $('#importNotice').removeClass('d-none');
            $('#sourceUpdateAlert').addClass('d-none'); // Hide update alert as we just imported fresh content
            $('#importTitle').text(resource.title);

            // Handle Image Preview
            if ((resource.type === 'image' || resource.type === 'image_hover') && resource.thumb_url) {
                const previewContainer = $('#importedImagePreview');
                previewContainer.removeClass('d-none');
                previewContainer.find('img').attr('src', resource.thumb_url);
                $('input[name="image"]').prop('disabled', true).addClass('d-none'); // Hide input
            } else {
                $('#importedImagePreview').addClass('d-none');
                $('input[name="image"]').prop('disabled', false).removeClass('d-none');
            }

            // Handle Video Preview
            if ((resource.type === 'video' || resource.type === 'video_hover') && resource.video_url) {
                const videoContainer = $('#importedVideoPreview');
                videoContainer.removeClass('d-none');
                videoContainer.find('video').attr('src', resource.video_url);
                $('input[name="video"]').prop('disabled', true).addClass('d-none');
            } else {
                $('#importedVideoPreview').addClass('d-none');
                $('input[name="video"]').prop('disabled', false).removeClass('d-none');
            }

            // Trigger type change to update UI
            updateFormFields();

            // Close Library Modal
            bootstrap.Modal.getInstance(document.getElementById('resourceLibraryModal')).hide();
        };

        window.clearImport = function () {
            // Clear the reference
            $('#refHotspotId').val('');
            $('#refResourceType').val(''); // Clear the reference type restriction
            $('#importNotice').addClass('d-none');
            $('#sourceUpdateAlert').addClass('d-none'); // Hide source update alert

            $('#importedImagePreview').addClass('d-none');
            $('input[name="image"]').prop('disabled', false).removeClass('d-none');

            $('#importedVideoPreview').addClass('d-none');
            $('#importedVideoPreview video').attr('src', ''); // Stop playback
            $('input[name="video"]').prop('disabled', false).removeClass('d-none');

            // Do NOT reset the form here, as it clears the hotspot_id and other user edits
            // $('#addHotspotForm')[0].reset();

            // 重新設置 clear_source，因為 reset 會清除它 (雖然現在移除了 reset，但保持這行無害)
            $('#clearSourceInput').val('true');

            // Trigger type change to update UI (unlock options)
            updateFormFields();
        };
    </script>
