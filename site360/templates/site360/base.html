{% load static %}
<!DOCTYPE html>
<html lang="zh-Hant">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Site360 - 360照片瀏覽{% endblock %}</title>
    <link rel="shortcut icon" href="{% static 'favicon.ico' %}">
    <!-- Bootstrap CSS for quick styling -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f8f9fa;
        }

        .navbar-brand {
            font-weight: bold;
        }

        .card {
            border: none;
            transition: transform 0.2s;
        }

        .card:hover {
            transform: translateY(-5px);
        }
    </style>
    {% block extra_css %}{% endblock %}
</head>

<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="{% url 'site360:project_list' %}"><i class="fas fa-cube"></i> Sino360</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="{% url 'site360:project_map' %}"><i class="fas fa-map-marked-alt"></i>
                            專案地圖</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="{% url 'site360:project_list' %}">專案列表</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/admin/">後台管理</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <main>
        {% block content %}{% endblock %}
    </main>

    <div class="bar" style="position:fixed;bottom:0px;width:100%;z-index:9999;">
        <h3 class="ui bottom attached inverted header"
            style="line-height:30px; font-size:12px; font-family:微軟正黑體; margin-bottom: 0; background-color: #1b1c1d; color: white; padding: 5px 15px;">
            <img src="{% static 'favicon.ico' %}" style="height: 20px; vertical-align: middle; margin-right: 5px;" />
            Copyright by SINOTECH Engineering Consultants, Ltd.
        </h3>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    {% block extra_js %}{% endblock %}
</body>

</html>
