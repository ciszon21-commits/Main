{% extends 'site360/base.html' %}
{% load static %}

{% block extra_css %}
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
<style>
    #map {
        height: 80vh;
        width: 100%;
        border-radius: 8px;
        box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
    }

    .popup-cover {
        width: 100%;
        height: 120px;
        object-fit: cover;
        border-radius: 4px;
        margin-bottom: 8px;
    }

    .popup-content h6 {
        margin-bottom: 5px;
        font-weight: bold;
    }

    .popup-content p {
        font-size: 0.9em;
        color: #666;
        margin-bottom: 8px;
    }
</style>
{% endblock %}

{% block content %}
<div class="container-fluid mt-4">
    <div class="row">
        <div class="col-12 px-4">
            <div class="d-flex justify-content-between align-items-center mb-3">
                <h2 class="mb-0"><i class="fas fa-map-marked-alt text-primary"></i> 專案地圖總覽</h2>
                <a href="{% url 'site360:project_list' %}" class="btn btn-outline-secondary">
                    <i class="fas fa-list"></i> 返回列表
                </a>
            </div>
            <div id="map"></div>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>

<script>
    document.addEventListener('DOMContentLoaded', function () {
        // Initialize map (Default: Taiwan center)
        const map = L.map('map').setView([23.5, 121.0], 8);

        // Add OSM tile layer
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
        }).addTo(map);

        // Define Red Icon
        const redIcon = new L.Icon({
            iconUrl: 'https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-2x-red.png',
            shadowUrl: 'https://cdnjs.cloudflare.com/ajax/libs/leaflet/0.7.7/images/marker-shadow.png',
            iconSize: [25, 41],
            iconAnchor: [12, 41],
            popupAnchor: [1, -34],
            shadowSize: [41, 41]
        });

        // Fetch project data
        fetch('{% url "site360:project_map_data" %}')
            .then(response => response.json())
            .then(data => {
                if (data.projects.length === 0) {
                    L.popup()
                        .setLatLng([23.5, 121.0])
                        .setContent("目前沒有設定座標的專案。")
                        .openOn(map);
                    return;
                }

                const markers = L.featureGroup();

                data.projects.forEach(project => {
                    const marker = L.marker([project.lat, project.lng], { icon: redIcon }).addTo(map);

                    let popupHtml = `<div class="popup-content">`;
                    if (project.cover) {
                        popupHtml += `<img src="${project.cover}" class="popup-cover" alt="${project.name}">`;
                    }
                    popupHtml += `<h6>${project.name}</h6>
                                  <p>${project.description}</p>
                                  <a href="${project.url}" class="btn btn-info text-white btn-sm w-100">查看專案</a>
                                  </div>`;

                    marker.bindPopup(popupHtml);
                    markers.addLayer(marker);
                });

                // Fit map bounds to show all markers
                if (data.projects.length > 0) {
                    map.fitBounds(markers.getBounds(), { padding: [50, 50] });
                }
            })
            .catch(error => {
                console.error('Error loading map data:', error);
            });
    });
</script>
{% endblock %}
