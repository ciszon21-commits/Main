{% extends 'site360/base.html' %}

{% block content %}
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card border-danger shadow">
                <div class="card-header bg-danger text-white">
                    <h5 class="mb-0"><i class="fas fa-exclamation-triangle"></i> 確認刪除專案</h5>
                </div>
                <div class="card-body">
                    <div class="alert alert-warning">
                        <h4 class="alert-heading">警告！此操作無法復原！</h4>
                        <p class="mb-0">您即將刪除專案 <strong>{{ project.name }}</strong>。</p>
                        <hr>
                        <p class="mb-0">刪除此專案將會一併刪除：</p>
                        <ul>
                            <li>所有關聯的場景 ({{ project.scenes.count }} 個)</li>
                            <li>所有場景內的熱點</li>
                            <li>所有上傳的照片和影片檔案</li>
                        </ul>
                    </div>

                    <form method="post">
                        {% csrf_token %}
                        <div class="d-flex justify-content-end gap-2">
                            <a href="{% url 'site360:project_list' %}" class="btn btn-secondary">
                                <i class="fas fa-times"></i> 取消
                            </a>
                            <button type="submit" class="btn btn-danger">
                                <i class="fas fa-trash-alt"></i> 確認刪除
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
