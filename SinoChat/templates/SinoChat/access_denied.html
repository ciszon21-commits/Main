{% extends "SinoTemplate/base.html" %}

{% block title %}無法存取 - Sinotech 聊天{% endblock %}

{% block head_block %}
<!-- Bootstrap Icons -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
<style>
.access-denied {
    max-width: 480px;
    margin: 100px auto;
    text-align: center;
    padding: 40px 20px;
}

.access-denied i {
    font-size: 80px;
    color: #C41E3A;
    margin-bottom: 20px;
}

.access-denied h2 {
    margin-bottom: 16px;
    color: #333;
}

.access-denied p {
    color: #666;
    margin-bottom: 24px;
}

.back-btn {
    display: inline-block;
    background: #C41E3A;
    color: white;
    padding: 12px 24px;
    border-radius: 8px;
    text-decoration: none;
}

.back-btn:hover {
    background: #A01830;
    color: white;
}
</style>
{% endblock %}

{% block main_block %}
<div class="access-denied">
    <i class="bi bi-lock"></i>
    <h2>無法存取此聊天室</h2>
    <p>「{{ room.name }}」是私人聊天室，您需要被邀請才能加入。</p>
    <a href="{% url 'sinochat:room_list' %}" class="back-btn">
        <i class="bi bi-arrow-left"></i> 返回聊天室列表
    </a>
</div>
{% endblock %}
