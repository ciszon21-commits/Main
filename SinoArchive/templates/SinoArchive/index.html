{% extends "base.html" %}

{% block no_menu_content %}

  <h2>測試SA路徑</h2>

  <div class="ui action input version_id_input">
    <input type="text" placeholder="version id...">
    <button class="ui button icon" onclick="callInFunction($(this))">
      <i class="search icon"></i>
    </button>
  </div>

  <script type="text/javascript">
    $('.version_id_input input').on('keyup', function(e){
      if (e.which != 13) return;
      callInFunction($('[onclick*=callInFunction]'));
    });

    function callInFunction($this){
      if ($this.hasClass('loading')) return;
      $this.addClass('loading');
      $.ajax({
        type: 'post',
        url: '/file/model/function/',
        data: {
          model: 'VersionOfFile',
          id: $('.version_id_input input').val(),
          function: 'get_archive_path',
        }, beforeSend: function(xhr) {
          xhr.setRequestHeader('X-CSRFToken', getCsrfToken());
        }, success: function(a){
          $this.removeClass('loading');
          console.log(a.data)
        }, error: function(a){
          console.log(a)
        }
      });
    }
  </script>
{% endblock %}
