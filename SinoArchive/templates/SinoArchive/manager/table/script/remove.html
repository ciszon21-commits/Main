
<script type="text/javascript">
  function archiveFolderRemove($this){
    if ($this.hasClass('loading')) return;
    $this.addClass('loading');
    let $aFolder = $this.closest('.archive_folder_tr');
    let aFolId = $aFolder.attr('tag');
    $.ajax({
      type: 'get',
      url: '/archive/model/function/',
      data: {
        model: 'ArchiveFolder',
        id: aFolId,
        function: 'remove_file',
      }, success: function(a){
        $this.removeClass('loading');
        displayArchiveFolderRemoveMessage($this, a.data);
      }, error: function(a){
        $this.removeClass('loading');
      }
    });
  }

  function displayArchiveFolderRemoveMessage($this, response){
    if (response.message == 'success') {
      reloadArchiveFolderTr($this);
    } else if (response.message == 'noArchiveStore') {
      let $aFolder = $this.closest('.archive_folder_tr');
      let name = $aFolder.find('.name').text();
      let message = '';
      message += '備份資料夾 ' + name + '\n';
      message += '沒有找到對應的 DocCollab_ArchiveStorePath';
      alert(message);
    }
  }


</script>
