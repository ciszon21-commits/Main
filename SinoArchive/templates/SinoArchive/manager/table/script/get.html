
<script type="text/javascript">
  function getArchiveFolderFileDetails($this){
    if ($this.hasClass('loading')) return;
    let aFolId = $this.closest('.archive_folder_tr').attr('tag');
    $this.addClass('loading');
    $.ajax({
      type: 'get',
      url: '/archive/model/function/',
      data: {
        model: 'ArchiveFolder',
        id: aFolId,
        function: 'get_file_details',
      }, success: function(a){
        $this.removeClass('loading');
        console.log(a)
      }, error: function(a){
        $this.removeClass('loading');
        console.log(a)
      }
    });
  }
</script>
