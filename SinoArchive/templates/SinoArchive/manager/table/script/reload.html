
<script type="text/javascript">
  function reloadArchiveFolderTr($this){
    let $aFolder = $this.closest('.archive_folder_tr');
    include({
      type: 'archive',
      selector: $aFolder,
      template_name: 'SinoArchive/manager/table/tr.html',
      data: {aFolId: $aFolder.attr('tag')},
      content_only: true,
    });
  }

  function reloadDynamicFolderDetail($this){
    let $aFolder = $this.closest('.archive_folder_tr');
    let $next = $aFolder.next();
    if (!$next.hasClass('archive_folder_tr')) $next.remove();
    include({
      type: 'archive',
      selector: $('<tr></tr>').insertAfter($aFolder),
      template_name: 'SinoArchive/manager/table/dynamic_tr.html',
      data: {aFolId: $aFolder.attr('tag')},
      content_only: true,
    });
  }
</script>
