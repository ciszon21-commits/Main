
{% load base %}

{% with aFolder.get_detail as detail %}

  <tr>
    <td>尺寸</td>
    <td>{{ detail.size }}</td>
    <td>數量</td>
    <td>{{ detail.count }}</td>

    <td colspan="10">
      <div>
        <b>存在檔案：</b>
        {{ detail.exist|base_len }}
      </div>
      <div>
        <b>不存在：</b>
        {{ detail.none|base_len }}
      </div>
    </td>

  </tr>

{% endwith %}
