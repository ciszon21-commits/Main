version: '3.8'

services:
  db:
    image: postgis/postgis:15-3.3
    environment:
      POSTGRES_USER: siteana
      POSTGRES_PASSWORD: siteana_password
      POSTGRES_DB: siteana
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  martin:
    image: maplibre/martin:latest
    environment:
      - DATABASE_URL=postgresql://siteana:siteana_password@db:5432/siteana
    ports:
      - "3000:3000"
    depends_on:
      - db

volumes:
  postgres_data:
