{% load static %}
<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}中興Single搜尋{% endblock %}</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700&family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary-blue: #1a73e8;
            --primary-blue-hover: #1557b0;
            --text-primary: #202124;
            --text-secondary: #5f6368;
            --text-link: #1a0dab;
            --text-url: #006621;
            --border-color: #dfe1e5;
            --bg-color: #fff;
            --bg-hover: #f8f9fa;
            --shadow: 0 1px 6px rgba(32, 33, 36, 0.28);
        }

        body {
            font-family: 'Roboto', 'Noto Sans TC', Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-primary);
            line-height: 1.58;
            min-height: 100vh;
        }

        /* Header */
        .header {
            display: flex;
            align-items: center;
            padding: 16px 24px;
            border-bottom: 1px solid var(--border-color);
            position: sticky;
            top: 0;
            background: var(--bg-color);
            z-index: 100;
        }

        .header-logo {
            display: flex;
            align-items: center;
            text-decoration: none;
            margin-right: 30px;
        }

        .header-logo img {
            height: 30px;
        }

        .header-logo-text {
            font-size: 22px;
            font-weight: 500;
            color: var(--text-primary);
            margin-left: 8px;
        }

        .header-logo-text span {
            color: var(--primary-blue);
        }

        /* Search Box */
        .search-box {
            flex: 1;
            max-width: 692px;
            position: relative;
        }

        .search-input-wrapper {
            display: flex;
            align-items: center;
            border: 1px solid var(--border-color);
            border-radius: 24px;
            padding: 6px 8px 6px 16px;
            background: var(--bg-color);
            transition: box-shadow 0.2s;
        }

        .search-input-wrapper:hover,
        .search-input-wrapper:focus-within {
            box-shadow: var(--shadow);
            border-color: transparent;
        }

        .search-icon {
            color: #9aa0a6;
            margin-right: 12px;
        }

        .search-input {
            flex: 1;
            border: none;
            outline: none;
            font-size: 16px;
            color: var(--text-primary);
            background: transparent;
        }

        .search-input::placeholder {
            color: #9aa0a6;
        }

        .search-clear {
            width: 24px;
            height: 24px;
            cursor: pointer;
            color: #70757a;
            display: none;
            align-items: center;
            justify-content: center;
        }

        .search-clear.visible {
            display: flex;
        }

        .search-submit {
            width: 40px;
            height: 40px;
            border: none;
            background: var(--primary-blue);
            color: white;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-left: 8px;
            transition: background 0.2s;
        }

        .search-submit:hover {
            background: var(--primary-blue-hover);
        }

        .header-nav {
            display: flex;
            align-items: center;
            gap: 16px;
            margin-left: auto;
        }

        .header-link {
            color: var(--text-secondary);
            text-decoration: none;
            font-size: 14px;
            padding: 8px 12px;
            border-radius: 4px;
            transition: background 0.2s;
        }

        .header-link:hover {
            background: var(--bg-hover);
        }

        /* Main Content */
        .main-content {
            {% block main_style %}{% endblock %}
        }

        /* Buttons */
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 10px 24px;
            border-radius: 4px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
            text-decoration: none;
            border: none;
        }

        .btn-primary {
            background: var(--primary-blue);
            color: white;
        }

        .btn-primary:hover {
            background: var(--primary-blue-hover);
        }

        .btn-secondary {
            background: var(--bg-hover);
            color: var(--text-primary);
            border: 1px solid var(--border-color);
        }

        .btn-secondary:hover {
            border-color: #c6c6c6;
            background: #f1f3f4;
        }

        /* Category Tags */
        .category-tag {
            display: inline-flex;
            align-items: center;
            padding: 4px 12px;
            border-radius: 16px;
            font-size: 13px;
            background: #e8f0fe;
            color: var(--primary-blue);
            margin-right: 8px;
            margin-bottom: 8px;
            cursor: pointer;
            transition: background 0.2s;
        }

        .category-tag:hover {
            background: #d2e3fc;
        }

        .category-tag .icon {
            margin-right: 6px;
        }

        /* Footer */
        .footer {
            background: #f2f2f2;
            border-top: 1px solid var(--border-color);
            padding: 16px 24px;
            margin-top: auto;
        }

        .footer-content {
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: var(--text-secondary);
            font-size: 13px;
        }

        .footer-link {
            color: var(--text-secondary);
            text-decoration: none;
        }

        .footer-link:hover {
            text-decoration: underline;
        }

        /* Icons (inline SVG) */
        .icon-search {
            width: 20px;
            height: 20px;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .header {
                flex-wrap: wrap;
                gap: 12px;
            }

            .search-box {
                order: 3;
                flex-basis: 100%;
                max-width: none;
            }

            .header-nav {
                margin-left: 0;
            }
        }

        {% block extra_css %}{% endblock %}
    </style>
</head>
<body>
    {% block header %}
    <header class="header">
        <a href="{% url 'opensearch:home' %}" class="header-logo">
            <span class="header-logo-text">Single<span>Search</span></span>
        </a>
        
        {% block search_header %}{% endblock %}
        
        <nav class="header-nav">
            <a href="{% url 'opensearch:advanced' %}" class="header-link">進階搜尋</a>
            <a href="{% url 'home:home' %}" class="header-link">返回主站</a>
        </nav>
    </header>
    {% endblock %}

    <main class="main-content">
        {% block content %}{% endblock %}
    </main>

    <footer class="footer">
        <div class="footer-content">
            <span>© 2026 中興工程顧問股份有限公司</span>
            <span>Powered by 研資部BIM應用組</span>
        </div>
    </footer>

    {% block extra_js %}{% endblock %}
</body>
</html>
