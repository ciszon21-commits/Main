{% extends "BFGExcavation/base.html" %}
{% block title %}確認刪除{% endblock %}

{% block content %}
<div style="max-width:560px;margin:40px auto;">
    <div class="card">
        <div class="card-header" style="border-color:rgba(239,68,68,0.3);">
            <span class="card-title" style="color:var(--red-error);">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M10.29 3.86L1.82 18a2 2 0 001.71 3h16.94a2 2 0 001.71-3L13.71 3.86a2 2 0 00-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
                確認刪除基礎資料
            </span>
        </div>
        <div class="card-body">
            <div class="alert alert-error">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
                <span>此操作無法復原，資料刪除後將永久消失。</span>
            </div>

            <div style="background:var(--bg-surface);border-radius:var(--radius);padding:16px;margin-bottom:20px;">
                <div style="display:grid;grid-template-columns:auto 1fr;gap:8px 16px;font-size:0.875rem;">
                    <span style="color:var(--text-muted);">計畫編號</span>
                    <span class="mono" style="font-weight:600;">{{ object.project_code }}</span>
                    <span style="color:var(--text-muted);">橋梁名稱</span>
                    <span style="font-weight:600;">{{ object.bridge_name }}</span>
                    <span style="color:var(--text-muted);">基礎標識</span>
                    <span class="mono" style="font-weight:700;color:var(--red-error);">{{ object.bridge_id }}</span>
                    <span style="color:var(--text-muted);">柱底EL</span>
                    <span class="mono">{{ object.column_base_el }} m</span>
                </div>
            </div>

            <form method="post">
                {% csrf_token %}
                <div style="display:flex;gap:10px;justify-content:flex-end;">
                    <a href="{% url 'bfg:dashboard' %}" class="btn btn-outline">取消，保留資料</a>
                    <button type="submit" class="btn btn-danger">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3,6 5,6 21,6"/><path d="M19 6l-1 14a2 2 0 01-2 2H8a2 2 0 01-2-2L5 6m5 0V4a1 1 0 011-1h2a1 1 0 011 1v2"/></svg>
                        確認刪除
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
