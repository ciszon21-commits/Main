        const LucideIcon = ({ name, size = 24, className = "", ...props }) => {
            if (typeof lucide === 'undefined' || !lucide.icons) return <span className="w-6 h-6 bg-gray-200" />;
            const iconDef = lucide.icons[name];
            if (!iconDef) return null;
            const [tag, attrs, children] = iconDef;
            const toCamel = (s) => s.replace(/-([a-z])/g, (g) => g[1].toUpperCase());
            const formatAttrs = (attributes) => {
                const res = {};
                for (const key in attributes) {
                    const val = attributes[key];
                    if (key === 'class') res.className = val;
                    else if (key.startsWith('stroke-')) res[toCamel(key)] = val;
                    else if (key === 'fill-rule') res.fillRule = val;
                    else if (key === 'clip-rule') res.clipRule = val;
                    else res[key] = val;
                }
                return res;
            };
            return (
                <svg {...formatAttrs(attrs)} width={size} height={size} className={`lucide lucide-${name.toLowerCase()} ${className}`} {...props}>
                    {children.map(([childTag, childAttrs], i) => React.createElement(childTag, { ...formatAttrs(childAttrs), key: i }))}
                </svg>
            );
        };

        // --- Compose Modal Component (Extracted for state management) ---
        const ComposeModal = ({ activeTab, isManager, onClose, MOCK_USER, bgPrimary, borderPrimary }) => {
            const fileInputRef = useRef(null);
            const [previewImage, setPreviewImage] = useState(null);
            const [mailTarget, setMailTarget] = useState(MANAGERS[0].email);
            
            // State for R&D custom inputs
            const [selectedPackage, setSelectedPackage] = useState("");
            const [selectedProblemType, setSelectedProblemType] = useState("");

            const handleFileChange = (e) => {
                const file = e.target.files[0];
                if (file) {
                    const reader = new FileReader();
                    reader.onloadend = () => setPreviewImage(reader.result);
                    reader.readAsDataURL(file);
                }
            };

            const handlePaste = (e) => {
                const items = e.clipboardData.items;
                for (let i = 0; i < items.length; i++) {
                    if (items[i].type.indexOf("image") !== -1) {
                        const blob = items[i].getAsFile();
                        const reader = new FileReader();
                        reader.onloadend = () => setPreviewImage(reader.result);
                        reader.readAsDataURL(blob);
                        e.preventDefault(); 
                        return;
                    }
                }

                                                <div className="relative w-full">
                                                    <Search className="absolute left-3 top-1/2 transform -translate-y-1/2 text-slate-400" size={18} />
                                                    <input type="text" value={searchTerm} onChange={(e) => setSearchTerm(e.target.value)} placeholder={activeTab === 'market' ? "搜尋好物..." : "搜尋文章、報修或公告..."} className="w-full pl-10 pr-4 py-2 bg-white rounded-full border-none shadow-sm focus:ring-2 focus:ring-[#00A0B0] focus:outline-none transition-shadow" />
                                                </div>
                                                {activeTab === 'rnd' && (
                                                    <div className="ml-3 flex items-center bg-slate-100 rounded-full p-1 text-xs whitespace-nowrap shrink-0">
                                                        {[
                                                            { value: 'All', label: '全部' },
                                                            { value: '最新公告', label: '最新公告' },
                                                            { value: 'Bug報修', label: 'Bug報修' },
                                                            { value: '功能建議', label: '功能建議' }
                                                        ].map((cat) => (
                                                            <button key={cat.value} onClick={() => setSelectedCategory(cat.value)} className={`px-3 py-1 rounded-full transition-all ${selectedCategory === cat.value ? 'bg-white shadow-sm text-[#00A0B0] font-bold' : 'text-slate-500 hover:text-slate-700'}`}>{cat.label}</button>
                                                        ))}
                                                    </div>
                                                )}
                                            </div>
                                            <div className="flex items-center space-x-3">
                                                {activeTab !== 'mailbox' && (
                                                    <button onClick={() => setShowCompose(true)} className={`px-4 py-2 ${bgPrimary} text-white rounded-full font-bold shadow-md hover:shadow-lg transition flex items-center whitespace-nowrap ml-4`}>
                                                        <Plus size={18} className="mr-1"/>
                                                        {activeTab === 'rnd' ? '我要報修/擲茭' : activeTab === 'market' ? '刊登物品' : '發布話題'}
                                                    </button>
                                                )}
                                            </div>
                                        </div>
                                    )}

                                    <div className="space-y-4 animate-fade-in">
                                        {(activeTab === 'rnd' || activeTab === 'profile') && filteredPosts.filter(p => p.type === 'rnd').map(post => (
                                            <div key={post.id} onClick={() => handlePostClick(post)} className="bg-white rounded-xl p-5 shadow-sm border border-slate-100 hover:shadow-md transition cursor-pointer group">
                                                <div className="flex justify-between items-start mb-3">
                                                    <div className="flex items-center space-x-2">
                                                        <span className={`px-2 py-0.5 rounded text-xs font-medium bg-slate-100 text-slate-600`}>{post.category}</span>
                                                        <StatusBadge status={post.status} type="rnd" />
                                                        {post.priority === 'High' && <span className="text-xs text-red-500 bg-red-50 px-2 py-0.5 rounded flex items-center"><AlertCircle size={10} className="mr-1"/>急</span>}
                                                    </div>
                                                    <button className="text-slate-300 hover:text-slate-500 opacity-0 group-hover:opacity-100 transition"><MoreHorizontal size={18} /></button>
                                                </div>
                                                <h3 className="text-lg font-bold text-slate-800 mb-2 group-hover:text-[#00A0B0] transition-colors">{post.title}</h3>
                                                <p className="text-slate-600 text-sm line-clamp-2 mb-4">{post.content}</p>
                                                <div className="flex items-center justify-between text-xs text-slate-400 border-t pt-3">
                                                    <div className="flex items-center space-x-2"><span className="font-medium text-slate-500">{post.author}</span><span>•</span><span>{post.date}</span></div>
                                                    <div className="flex items-center space-x-4"><span className="flex items-center space-x-1"><Eye size={14}/> <span>{post.views}</span></span><span className="flex items-center space-x-1"><Heart size={14} className={post.isLiked ? "fill-red-400 text-red-400" : ""}/> <span>{post.likes}</span></span><span className="flex items-center space-x-1"><MessageCircle size={14}/> <span>{post.comments}</span></span></div>
                                                </div>
                                            </div>
                                        ))}

                                        {(activeTab === 'market' || activeTab === 'profile') && (
                                            <div className={`${activeTab === 'market' ? 'grid grid-cols-2 gap-4' : 'space-y-4'}`}>
                                                {/* Profile view mixed rendering - handled by map below */}
                                            </div>
                                        )}
                                        {/* Combined mapping for profile to handle order if needed, but here separating by type for layout control */}
                                        {activeTab === 'profile' && filteredPosts.map(post => {
                                            if (post.type === 'market') {
                                                 return (
                                                    <div key={post.id} onClick={() => handlePostClick(post)} className="bg-white rounded-xl overflow-hidden shadow-sm border border-slate-100 hover:shadow-md transition group cursor-pointer flex flex-row h-40 mb-4">
                                                        <div className="w-40 relative bg-slate-200"><img src={post.image} alt={post.title} className="w-full h-full object-cover" /><div className="absolute top-2 left-2"><StatusBadge status={post.status} type="market" /></div></div>
                                                        <div className="p-4 flex-1 flex flex-col justify-between"><div><div className="flex justify-between items-start"><h3 className="font-bold text-slate-800 truncate text-lg">{post.title}</h3><span className="text-xs bg-slate-100 px-2 py-1 rounded text-slate-500">跳蚤市場</span></div><p className="text-[#00A0B0] font-bold mt-1">{post.priceLabel ? post.priceLabel : `$${post.price}`}</p></div><div className="flex items-center justify-between text-xs text-slate-500"><span>{post.date}</span><button className={`px-3 py-1 rounded border ${borderPrimary} ${primaryColor} hover:bg-[#E6F6F7]`}>查看詳情</button></div></div>
                                                    </div>
                                                );
                                            }
                                            return null; // RND & Gossip handled above
                                        })}

                                        {activeTab === 'market' && (
                                            <div className="grid grid-cols-2 gap-4">
                                                {filteredPosts.map(post => (
                                                    <div key={post.id} onClick={() => handlePostClick(post)} className="bg-white rounded-xl overflow-hidden shadow-sm border border-slate-100 hover:shadow-md transition group cursor-pointer">
                                                        <div className="relative h-48 bg-slate-200 overflow-hidden"><img src={post.image} alt={post.title} className="w-full h-full object-cover group-hover:scale-105 transition duration-500" /><div className="absolute top-3 left-3"><StatusBadge status={post.status} type="market" /></div><div className="absolute bottom-3 right-3 bg-black/60 backdrop-blur-sm text-white px-3 py-1 rounded-full text-sm font-bold flex items-center">{post.price === 0 && <span className="mr-1">🎁</span>}{post.priceLabel ? post.priceLabel : `$${post.price}`}</div></div>
                                                        <div className="p-4"><h3 className="font-bold text-slate-800 mb-1 truncate">{post.title}</h3><div className="flex items-center space-x-2 text-xs text-slate-500 mb-4"><span className="bg-slate-100 px-2 py-0.5 rounded">{post.condition}</span><span>{post.date}</span><span>•</span><span>{post.author}</span></div>{post.status !== '已售出' ? <button className={`w-full py-2 rounded-lg border ${borderPrimary} ${primaryColor} hover:bg-[#E6F6F7] text-sm font-medium transition`}>詳細資訊</button> : <button disabled className="w-full py-2 rounded-lg bg-slate-100 text-slate-400 text-sm font-medium cursor-not-allowed">已結束交易</button>}</div>
                                                    </div>
                                                ))}
                                            </div>
                                        )}

                                        {(activeTab === 'gossip' || (activeTab === 'profile' && filteredPosts.some(p => p.type === 'gossip'))) && filteredPosts.filter(p => p.type === 'gossip').map(post => (
                                             <div key={post.id} onClick={() => handlePostClick(post)} className="bg-white rounded-xl p-5 shadow-sm border border-slate-100 relative group cursor-pointer mb-4">
                                                {post.visibility !== '全部門' && <div className="absolute top-0 right-0 bg-purple-100 text-purple-600 text-[10px] px-2 py-1 rounded-bl-lg rounded-tr-xl font-bold flex items-center"><User size={10} className="mr-1"/> {post.visibility}</div>}
                                                <div className="flex items-start space-x-3 mb-3"><div className={`w-10 h-10 rounded-full flex items-center justify-center text-xl shadow-inner ${post.isAnonymous ? 'bg-slate-200' : 'bg-[#E6F6F7]'}`}>{post.isAnonymous ? "🤐" : <img src={`https://i.pravatar.cc/150?u=${post.id}`} className="w-full h-full rounded-full" alt="avatar"/>}</div><div><div className="font-bold text-slate-800 flex items-center">{post.author}{post.isAnonymous && <span className="ml-2 text-xs font-normal text-slate-500 bg-slate-100 px-1.5 rounded border border-slate-200">匿名</span>}</div><div className="text-xs text-slate-400">{post.date}</div></div></div>
                                                <div className="pl-13 text-slate-700 mb-4 whitespace-pre-line leading-relaxed line-clamp-3">{post.content}</div>
                                                <div className="flex items-center space-x-6 text-slate-400 text-sm pl-1"><button className={`flex items-center space-x-1 hover:${primaryColor} transition`}><Heart size={16} className={post.isLiked ? "fill-red-400 text-red-400" : ""}/> <span>{post.likes}</span></button><button className={`flex items-center space-x-1 hover:${primaryColor} transition`}><MessageCircle size={16}/> <span>{post.comments}</span></button><span className="flex-1"></span><button className="opacity-0 group-hover:opacity-100 transition text-slate-300 hover:text-slate-500">檢舉</button></div>
                                            </div>
                                        ))}

                                        {activeTab === 'mailbox' && (
                                            <div className="space-y-6">
                                                <div className="bg-white rounded-xl p-6 shadow-sm border border-slate-100 text-center">
                                                    <div className="w-12 h-12 bg-[#E6F6F7] rounded-full flex items-center justify-center mx-auto mb-3"><Mail size={24} className="text-[#00A0B0]" /></div>
                                                    <h3 className="text-lg font-bold text-slate-800 mb-1">主管信箱</h3>
                                                    <p className="text-slate-500 text-sm mb-4">私密的溝通管道，僅您與選定的主管可見。</p>
                                                    <button onClick={() => setShowCompose(true)} className={`${bgPrimary} text-white px-6 py-2 rounded-full shadow-lg shadow-[#00A0B0]/30 hover:shadow-[#00A0B0]/40 transition flex items-center justify-center mx-auto`}><Plus size={18} className="mr-1"/> 撰寫新信件</button>
                                                </div>
                                            </div>
                                        )}

                                        {activeTab === 'dashboard' && isManager && (
                                            <div className="space-y-6 animate-fade-in">
                                                <div className="grid grid-cols-3 gap-4">
                                                    <div className="bg-white p-4 rounded-xl shadow-sm border border-slate-100"><div className="text-slate-500 text-xs mb-1">待處理案件</div><div className="text-2xl font-bold text-orange-500">{posts.filter(p => p.type === 'rnd' && p.status === '待確認').length}</div></div>
                                                    <div className="bg-white p-4 rounded-xl shadow-sm border border-slate-100"><div className="text-slate-500 text-xs mb-1">本週報修總數</div><div className={`text-2xl font-bold ${primaryColor}`}>{posts.filter(p => p.type === 'rnd').length}</div></div>
                                                    <div className="bg-white p-4 rounded-xl shadow-sm border border-slate-100"><div className="text-slate-500 text-xs mb-1">平均處理天數</div><div className="text-2xl font-bold text-slate-700">1.5 <span className="text-xs font-normal text-slate-400">天</span></div></div>
                                                </div>
                                                <div className="bg-white rounded-xl shadow-sm overflow-hidden border border-slate-100">
                                                    <div className="px-5 py-4 border-b border-slate-100 font-bold text-slate-800 flex justify-between items-center bg-slate-50/50"><span>案件進度管控</span><button className="text-xs text-[#00A0B0] hover:underline flex items-center"><DollarSign size={12} className="mr-1"/>匯出報表</button></div>
                                                    {posts.filter(p => p.type === 'rnd').map(post => (
                                                        <div key={post.id} className="p-4 border-b border-slate-50 flex flex-row items-center justify-between hover:bg-slate-50 transition cursor-pointer" onClick={(e) => { if(e.target.tagName !== 'SELECT') handlePostClick(post); }}>
                                                            <div className="flex-1 mb-0"><div className="flex items-center space-x-2 mb-1"><span className="text-xs font-medium bg-slate-100 px-1.5 py-0.5 rounded text-slate-600">{post.category}</span>{post.priority === 'High' && <span className="w-2 h-2 rounded-full bg-red-500"></span>}<span className="text-sm font-medium text-slate-800 hover:text-[#00A0B0]">{post.title}</span></div><div className="text-xs text-slate-400 flex items-center"><User size={10} className="mr-1"/> {post.author} <span className="mx-2">•</span> <Clock size={10} className="mr-1"/> {post.date}</div></div>
                                                            <div className="flex items-center space-x-2" onClick={(e) => e.stopPropagation()}><select className={`text-xs border border-slate-200 rounded px-3 py-1.5 bg-white focus:outline-none focus:border-[#00A0B0] font-medium text-slate-600 cursor-pointer hover:border-[#00A0B0]`} defaultValue={post.status} onChange={(e) => { const newStatus = e.target.value; setPosts(posts.map(p => p.id === post.id ? {...p, status: newStatus} : p)); }}><option value="待確認">🟠 待確認</option><option value="已排定">🔵 已排定</option><option value="處理中">🟢 處理中</option><option value="已完成">⚪ 已完成</option></select></div>
                                                        </div>
                                                    ))}
                                                </div>
                                            </div>
                                        )}
                                    </div>
                                </>
                            )}
                        </main>

                        {showCompose && <ComposeModal activeTab={activeTab} isManager={isManager} onClose={() => setShowCompose(false)} MOCK_USER={MOCK_USER} bgPrimary={bgPrimary} borderPrimary={borderPrimary} />}
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<DepartmentWishingWell />);
    </script>
</body>
</html>
