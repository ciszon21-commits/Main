{% extends 'NewsSubscriber/base.html' %}

{% block content %}
<div class="card" style="max-width: 600px; margin: 0 auto;">
    <h1>新增主題</h1>
    <form method="post">
        {% csrf_token %}
        <div class="form-group">
            <label for="id_name">主題名稱:</label>
            {{ form.name }}
        </div>
        <button type="submit" class="btn">儲存</button>
        <a href="{% url 'news_subscriber:topic_list' %}" class="btn" style="background-color: #95a5a6;">取消</a>
    </form>
</div>
{% endblock %}
