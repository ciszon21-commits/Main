{% extends 'NewsSubscriber/base.html' %}

{% block content %}
<div class="card" style="max-width: 600px; margin: 0 auto;">
    <h1>新增關鍵字 - {{ topic.name }}</h1>
    <form method="post">
        {% csrf_token %}
        <div class="form-group">
            <label for="id_word">關鍵字:</label>
            {{ form.word }}
        </div>
        <button type="submit" class="btn">儲存</button>
        <a href="{% url 'news_subscriber:topic_detail' topic.id %}" class="btn"
            style="background-color: #95a5a6;">取消</a>
    </form>
</div>
{% endblock %}
