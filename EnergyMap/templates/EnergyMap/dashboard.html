{% load static %}
<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>台電即時發電儀表板 | EnergyMap</title>
    <meta name="description" content="台灣電力公司即時發電數據視覺化儀表板，各能源類型發電占比圓餅圖">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Noto+Sans+TC:wght@300;400;500;600;700;900&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <style>
        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --bg-primary: #0a0e1a;
            --bg-secondary: #111827;
            --bg-card: #1a1f35;
            --bg-card-hover: #222847;
            --text-primary: #f1f5f9;
            --text-secondary: #94a3b8;
            --text-muted: #64748b;
            --border-color: rgba(255,255,255,0.06);
            --accent-blue: #3b82f6;
            --accent-cyan: #06b6d4;
            --accent-green: #22c55e;
            --accent-yellow: #eab308;
            --glow-blue: rgba(59,130,246,0.15);
        }

        body {
            font-family: 'Inter', 'Noto Sans TC', sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* Animated background */
        body::before {
            content: '';
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background:
                radial-gradient(ellipse at 20% 20%, rgba(59,130,246,0.08) 0%, transparent 50%),
                radial-gradient(ellipse at 80% 80%, rgba(6,182,212,0.06) 0%, transparent 50%),
                radial-gradient(ellipse at 50% 50%, rgba(168,85,247,0.04) 0%, transparent 50%);
            pointer-events: none;
            z-index: 0;
        }

        .app-container { position: relative; z-index: 1; }

        /* ===== NAV ===== */
        .top-nav {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 24px;
            background: rgba(17,24,39,0.8);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--border-color);
            position: sticky; top: 0; z-index: 100;
        }
        .nav-brand {
            display: flex;
            align-items: center;
            gap: 12px;
            font-weight: 700;
            font-size: 20px;
            letter-spacing: -0.5px;
        }
        .nav-brand .icon {
            width: 36px; height: 36px;
            background: linear-gradient(135deg, var(--accent-blue), var(--accent-cyan));
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #f8fafc;
        }
        .nav-brand .icon svg {
            width: 20px;
            height: 20px;
        }
        .nav-links {
            display: flex;
            gap: 4px;
        }
        .nav-actions {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .nav-links a {
            color: var(--text-secondary);
            text-decoration: none;
            padding: 8px 20px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 500;
            transition: all 0.2s;
        }
        .nav-links a:hover { color: var(--text-primary); background: rgba(255,255,255,0.05); }
        .nav-links a.active {
            color: var(--accent-blue);
            background: var(--glow-blue);
        }
        .refresh-btn {
            border: 1px solid rgba(255,255,255,0.1);
            background: rgba(255,255,255,0.04);
            color: var(--text-primary);
            border-radius: 10px;
            padding: 8px 14px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }
        .refresh-btn:hover {
            background: rgba(59,130,246,0.12);
            border-color: rgba(59,130,246,0.28);
        }
        .refresh-btn:disabled {
            opacity: 0.65;
            cursor: wait;
        }
        .refresh-btn-label {
            line-height: 1;
        }
        .cooldown-ring {
            --progress: 1turn;
            width: 14px;
            height: 14px;
            border-radius: 50%;
            position: relative;
            flex-shrink: 0;
            background: conic-gradient(var(--accent-blue) var(--progress), rgba(255,255,255,0.12) 0);
        }
        .cooldown-ring::after {
            content: '';
            position: absolute;
            inset: 3px;
            border-radius: 50%;
            background: rgba(17,24,39,0.98);
        }
        .refresh-btn:disabled .cooldown-ring {
            background: conic-gradient(#93c5fd var(--progress), rgba(255,255,255,0.08) 0);
        }

        /* ===== MAIN ===== */
        .main-content {
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px 24px 24px;
        }

        /* Header */
        .page-header {
            margin-bottom: 20px;
        }
        .page-header h1 {
            font-size: 24px;
            font-weight: 800;
            letter-spacing: -1px;
            background: linear-gradient(135deg, #fff 0%, #94a3b8 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 8px;
        }
        .page-header .subtitle {
            color: var(--text-secondary);
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .page-header .subtitle a {
            color: var(--text-primary);
        }
        .page-header .subtitle a:hover {
            color: #ffffff;
        }
        .update-badge {
            background: rgba(34,197,94,0.15);
            color: #22c55e;
            padding: 3px 10px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            display: inline-flex;
            align-items: center;
            gap: 5px;
        }
        .update-badge .dot {
            width: 6px; height: 6px;
            background: #22c55e;
            border-radius: 50%;
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }

        /* Grid layout */
        .dashboard-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            grid-template-areas:
                "chart stats"
                "detail detail";
            gap: 18px;
            align-items: stretch;
        }

        /* Cards */
        .card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 18px;
            transition: all 0.3s ease;
        }
        .card:hover {
            border-color: rgba(59,130,246,0.2);
            box-shadow: 0 0 30px rgba(59,130,246,0.05);
        }
        .card-title {
            font-size: 13px;
            font-weight: 600;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 14px;
        }

        /* Chart card */
        .chart-card {
            grid-area: chart;
            display: flex;
            flex-direction: column;
            min-height: 100%;
        }
        .chart-container {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            min-height: 320px;
        }
        .chart-center-text {
            position: absolute;
            text-align: center;
            pointer-events: none;
        }
        .chart-center-text .value {
            font-size: 32px;
            font-weight: 800;
            letter-spacing: -1.5px;
            color: var(--text-primary);
        }
        .chart-center-text .label {
            font-size: 12px;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-top: 2px;
        }

        /* Summary panel */
        .stats-panel {
            grid-area: stats;
            display: flex;
            flex-direction: column;
            gap: 10px;
            height: 100%;
        }
        .stat-label {
            font-size: 12px;
            color: var(--text-muted);
            margin-bottom: 6px;
            font-weight: 500;
        }
        .stat-value {
            font-size: 20px;
            font-weight: 700;
            letter-spacing: -0.5px;
        }
        .stat-pct {
            font-size: 12px;
            color: var(--text-secondary);
            margin-top: 4px;
        }
        .type-list-card {
            display: flex;
            flex-direction: column;
            min-height: 0;
            flex: 1;
        }
        .type-list {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 8px;
            overflow: auto;
            padding-right: 4px;
            align-content: start;
        }
        .type-button {
            width: 100%;
            border: 1px solid var(--border-color);
            background: rgba(255,255,255,0.02);
            border-radius: 14px;
            padding: 11px 13px;
            color: inherit;
            display: flex;
            align-items: center;
            gap: 10px;
            text-align: left;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .type-button:hover {
            background: rgba(255,255,255,0.05);
            border-color: rgba(255,255,255,0.12);
            transform: translateY(-1px);
        }
        .type-button.is-active {
            background: rgba(59,130,246,0.12);
            border-color: rgba(59,130,246,0.35);
            box-shadow: inset 0 0 0 1px rgba(59,130,246,0.12);
        }
        .type-button:focus-visible {
            outline: 2px solid rgba(96,165,250,0.9);
            outline-offset: 2px;
        }
        .energy-swatch {
            width: 12px;
            height: 12px;
            border-radius: 999px;
            background: var(--swatch-color, var(--accent-blue));
            box-shadow: 0 0 0 4px color-mix(in srgb, var(--swatch-color, var(--accent-blue)) 16%, transparent);
            flex-shrink: 0;
        }
        .type-info {
            flex: 1;
            min-width: 0;
        }
        .type-name {
            font-size: 13px;
            font-weight: 600;
            color: var(--text-primary);
            display: flex;
            align-items: baseline;
            gap: 8px;
            flex-wrap: wrap;
        }
        .type-name .type-en {
            font-size: 11px;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.08em;
        }
        .type-meta {
            display: flex;
            flex-direction: column;
            gap: 2px;
            margin-top: 4px;
            font-size: 11px;
            color: var(--text-secondary);
        }
        .type-meta strong {
            color: var(--text-primary);
            font-weight: 700;
        }
        .type-share {
            text-align: right;
            min-width: 52px;
        }
        .type-share strong {
            display: block;
            font-size: 15px;
            color: var(--text-primary);
            letter-spacing: -0.03em;
        }
        .type-share span {
            font-size: 11px;
            color: var(--text-muted);
        }

        /* Detail card */
        .detail-card {
            grid-area: detail;
        }
        .detail-placeholder {
            min-height: 240px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-muted);
            text-align: center;
            border: 1px dashed rgba(255,255,255,0.08);
            border-radius: 14px;
            background: rgba(255,255,255,0.02);
            padding: 24px;
        }
        .detail-stack {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }
        .detail-header {
            display: flex;
            justify-content: space-between;
            gap: 16px;
            align-items: flex-start;
        }
        .detail-title {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .detail-title h2 {
            font-size: 18px;
            font-weight: 700;
            letter-spacing: -0.04em;
        }
        .detail-title p {
            margin-top: 4px;
            color: var(--text-secondary);
            font-size: 12px;
        }
        .detail-summary {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: flex-end;
        }
        .metric-pill {
            min-width: 110px;
            padding: 10px 12px;
            border-radius: 12px;
            border: 1px solid var(--border-color);
            background: rgba(255,255,255,0.03);
        }
        .metric-pill-label {
            font-size: 11px;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.08em;
        }
        .metric-pill-value {
            margin-top: 6px;
            font-size: 16px;
            font-weight: 700;
            color: var(--text-primary);
        }
        .detail-content-grid {
            display: grid;
            grid-template-columns: minmax(280px, 0.9fr) minmax(0, 1.2fr);
            gap: 16px;
            align-items: start;
        }
        .detail-chart-panel,
        .detail-accordion-panel {
            border: 1px solid var(--border-color);
            border-radius: 16px;
            background: rgba(255,255,255,0.02);
            padding: 16px;
        }
        .detail-subheading {
            font-size: 12px;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.08em;
            margin-bottom: 12px;
        }
        .detail-chart-wrap {
            position: relative;
            min-height: 320px;
        }
        .detail-chart-wrap canvas {
            width: 100% !important;
            height: 100% !important;
        }
        .detail-chart-meta {
            margin-top: 14px;
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 10px;
        }
        .detail-chart-stat {
            border: 1px solid rgba(255,255,255,0.06);
            border-radius: 12px;
            padding: 10px 12px;
            background: rgba(255,255,255,0.025);
        }
        .detail-chart-stat-label {
            font-size: 11px;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.06em;
        }
        .detail-chart-stat-value {
            margin-top: 6px;
            font-size: 15px;
            font-weight: 700;
            color: var(--text-primary);
        }
        .plant-accordion {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .plant-accordion-item {
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 14px;
            background: rgba(255,255,255,0.02);
            overflow: hidden;
        }
        .plant-accordion-item[open] {
            border-color: rgba(255,255,255,0.14);
            background: rgba(255,255,255,0.035);
        }
        .plant-flat-item {
            padding: 14px 16px;
        }
        .plant-accordion-summary {
            list-style: none;
            cursor: pointer;
            padding: 14px 16px;
        }
        .plant-accordion-summary::-webkit-details-marker {
            display: none;
        }
        .plant-accordion-summary::marker {
            display: none;
        }
        .plant-summary-row {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            gap: 12px;
        }
        .plant-summary-left {
            min-width: 0;
        }
        .plant-name {
            font-size: 14px;
            font-weight: 700;
            color: var(--text-primary);
        }
        .plant-subtitle {
            margin-top: 4px;
            font-size: 11px;
            color: var(--text-muted);
        }
        .plant-summary-right {
            text-align: right;
            flex-shrink: 0;
        }
        .plant-summary-right strong {
            display: block;
            font-size: 16px;
            font-weight: 700;
            color: var(--text-primary);
        }
        .plant-summary-right span {
            font-size: 11px;
            color: var(--text-muted);
        }
        .viz-track {
            width: 100%;
            height: 8px;
            border-radius: 999px;
            background: rgba(148,163,184,0.16);
            overflow: hidden;
        }
        .viz-track.signed {
            position: relative;
            height: 10px;
            background: rgba(148,163,184,0.1);
        }
        .viz-track.signed::after {
            content: '';
            position: absolute;
            top: -2px;
            bottom: -2px;
            left: 50%;
            width: 1px;
            background: rgba(255,255,255,0.2);
        }
        .viz-fill {
            height: 100%;
            min-width: 6px;
            border-radius: inherit;
        }
        .viz-fill.charge,
        .viz-fill.discharge {
            position: absolute;
            top: 0;
            bottom: 0;
            min-width: 0;
        }
        .viz-fill.discharge {
            left: 50%;
            border-radius: 0 999px 999px 0;
        }
        .viz-fill.charge {
            right: 50%;
            border-radius: 999px 0 0 999px;
        }
        .plant-viz {
            margin-top: 12px;
        }
        .accordion-body {
            padding: 0 16px 14px;
        }
        .plant-flat-item .accordion-body {
            padding: 12px 0 0;
        }
        .unit-list {
            margin-top: 14px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .unit-row {
            padding-top: 8px;
            border-top: 1px solid rgba(255,255,255,0.06);
        }
        .unit-row:first-child {
            padding-top: 0;
            border-top: 0;
        }
        .unit-row-top {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            gap: 10px;
            margin-bottom: 8px;
        }
        .unit-title-line {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }
        .unit-name {
            font-size: 12px;
            font-weight: 600;
            color: var(--text-primary);
        }
        .unit-status-tag {
            display: inline-flex;
            align-items: center;
            min-height: 20px;
            padding: 2px 8px;
            border-radius: 999px;
            font-size: 10px;
            font-weight: 700;
            letter-spacing: 0.04em;
        }
        .unit-status-tag.warn {
            background: rgba(239, 68, 68, 0.12);
            color: #f87171;
            border: 1px solid rgba(239, 68, 68, 0.24);
        }
        .unit-status-tag.info {
            background: rgba(245, 158, 11, 0.12);
            color: #fbbf24;
            border: 1px solid rgba(245, 158, 11, 0.22);
        }
        .note-ref {
            display: inline-flex;
            align-items: center;
            margin-left: 4px;
            padding: 1px 6px;
            border-radius: 999px;
            border: 1px solid rgba(96, 165, 250, 0.28);
            background: rgba(59, 130, 246, 0.12);
            color: #93c5fd;
            font-size: 10px;
            font-weight: 700;
            cursor: help;
            vertical-align: middle;
        }
        #dashboard-note-tooltip {
            display: none;
            position: fixed;
            max-width: 320px;
            background: #0d1117;
            border: 1px solid rgba(59, 130, 246, 0.35);
            color: #cbd5e1;
            font-size: 11px;
            line-height: 1.6;
            padding: 10px 12px;
            border-radius: 10px;
            box-shadow: 0 12px 32px rgba(0, 0, 0, 0.7);
            z-index: 99999;
            white-space: pre-line;
            pointer-events: none;
        }
        #dashboard-note-tooltip strong {
            display: block;
            color: #93c5fd;
            margin-bottom: 4px;
        }
        .unit-subtype {
            font-size: 11px;
            color: var(--text-muted);
            margin-top: 2px;
        }
        .unit-values {
            text-align: right;
            font-size: 12px;
            color: var(--text-secondary);
        }
        .unit-values strong {
            display: block;
            font-size: 13px;
            color: var(--text-primary);
        }
        .unit-meta {
            margin-top: 6px;
            display: flex;
            justify-content: flex-start;
            gap: 10px;
            font-size: 11px;
            color: var(--text-muted);
            flex-wrap: wrap;
        }
        .storage-flow-tag {
            display: inline-flex;
            align-items: center;
            padding: 2px 8px;
            border-radius: 999px;
            font-size: 10px;
            font-weight: 700;
            letter-spacing: 0.04em;
        }
        .storage-flow-tag.charge {
            color: #fbbf24;
            background: rgba(245,158,11,0.12);
            border: 1px solid rgba(245,158,11,0.22);
        }
        .storage-flow-tag.discharge {
            color: #c084fc;
            background: rgba(168,85,247,0.14);
            border: 1px solid rgba(168,85,247,0.26);
        }
        .storage-flow-tag.idle {
            color: #cbd5e1;
            background: rgba(148,163,184,0.12);
            border: 1px solid rgba(148,163,184,0.2);
        }
        .detail-note {
            margin-top: 18px;
            font-size: 12px;
            color: var(--text-muted);
        }

        /* Loading */
        .loading-overlay {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 300px;
            flex-direction: column;
            gap: 16px;
        }
        .spinner {
            width: 40px; height: 40px;
            border: 3px solid var(--border-color);
            border-top-color: var(--accent-blue);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .loading-text {
            color: var(--text-muted);
            font-size: 13px;
        }

        /* Error */
        .error-msg {
            color: #ef4444;
            background: rgba(239,68,68,0.1);
            padding: 16px 20px;
            border-radius: 10px;
            border: 1px solid rgba(239,68,68,0.2);
            font-size: 14px;
        }

        /* Total stat card */
        .total-stat-card {
            background: linear-gradient(135deg, rgba(59,130,246,0.15), rgba(6,182,212,0.1));
            border: 1px solid rgba(59,130,246,0.2);
        }
        .total-stat-card .stat-value {
            font-size: 32px;
            font-weight: 800;
            background: linear-gradient(135deg, #3b82f6, #06b6d4);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* Responsive */
        @media (max-width: 900px) {
            .dashboard-grid {
                grid-template-columns: 1fr;
                grid-template-areas:
                    "chart"
                    "stats"
                    "detail";
            }
            .main-content { padding: 16px; }
            .top-nav { padding: 12px 16px; }
            .type-list { grid-template-columns: 1fr; }
            .detail-header {
                flex-direction: column;
            }
            .detail-summary {
                justify-content: flex-start;
            }
            .detail-content-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="app-container">
        <!-- Navigation -->
        <nav class="top-nav">
            <div class="nav-brand">
                <div class="icon" aria-hidden="true"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m11 7-3 5h4l-3 5"/><path d="M14.856 6H16a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2h-2.935"/><path d="M22 14v-4"/><path d="M5.14 18H4a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h2.936"/></svg></div>
                <span>EnergyMap</span>
            </div>
            <div class="nav-actions">
                <div class="nav-links">
                    <a href="{% url 'EnergyMap:dashboard' %}" class="active">儀表板</a>
                    <a href="{% url 'EnergyMap:map' %}">電廠地圖</a>
                </div>
                <button class="refresh-btn" id="refreshPageBtn" type="button">
                    <span class="cooldown-ring" id="refreshCooldownRing" aria-hidden="true"></span>
                    <span class="refresh-btn-label" id="refreshPageBtnLabel">重新整理</span>
                </button>
            </div>
        </nav>

        <!-- Main Content -->
        <main class="main-content">
            <!-- Header -->
            <div class="page-header">
                <h1>即時發電量儀表板</h1>
                <div class="subtitle">
                    <span>資料來源：<a href="https://www.taipower.com.tw/2289/2363/2367/2368/10266/normalPost">台灣電力公司</a></span>
                    <span id="updateBadge" class="update-badge" style="display:none;">
                        <span class="dot"></span>
                        <span id="updateTime">載入中...</span>
                    </span>
                </div>
            </div>

            <!-- Dashboard Grid -->
            <div class="dashboard-grid" id="dashboardContent">
                <!-- Loading state -->
                <div class="card chart-card">
                    <div class="loading-overlay" id="chartLoading">
                        <div class="spinner"></div>
                        <div class="loading-text">正在從台電擷取即時資料...</div>
                    </div>
                    <div class="card-title">發電占比分析</div>
                    <div class="chart-container" id="chartWrapper" style="display:none;">
                        <canvas id="energyChart"></canvas>
                        <div class="chart-center-text">
                            <div class="value" id="totalValue">--</div>
                            <div class="label" id="chartCenterLabel">總發電量 MW</div>
                        </div>
                    </div>
                </div>

                <!-- Stats panel -->
                <div class="stats-panel" id="statsPanel">
                    <div class="card total-stat-card">
                        <div class="stat-label" id="totalGenerationLabel">系統總發電量</div>
                        <div class="stat-value" id="totalGenerationStat">--</div>
                        <div class="stat-pct">即時數據</div>
                    </div>
                    <div class="card type-list-card">
                        <div class="card-title">能源類型</div>
                        <div class="type-list" id="categoryList"></div>
                    </div>
                </div>

                <!-- Legend detail -->
                <div class="card detail-card" id="detailCard" style="display:none;">
                    <div class="card-title">各能源類型詳情</div>
                    <div id="legendDetail">
                        <div class="detail-placeholder">請從右側選擇能源類型以查看電廠與機組資料。</div>
                    </div>
                </div>
            </div>
        </main>
    </div>
    <div id="dashboard-note-tooltip" aria-hidden="true"></div>

    <script src="{% static 'EnergyMap/refresh.js' %}"></script>
    <script>
        if (window.initRefreshCooldown) {
            window.initRefreshCooldown();
        }

        const categoryList = document.getElementById('categoryList');
        const legendDetail = document.getElementById('legendDetail');
        const detailCard = document.getElementById('detailCard');
        const chartLoading = document.getElementById('chartLoading');
        const chartWrapper = document.getElementById('chartWrapper');
        const dashboardNoteTooltip = document.getElementById('dashboard-note-tooltip');

        let energyChart = null;
        let detailPieChart = null;
        let typeRecords = [];
        let selectedTypeKey = null;
        let totalGeneration = 0;
        let totalSupplyGeneration = 0;
        let dashboardLoadPromise = null;
        const AUTO_REFRESH_INTERVAL_MS = 300000;

        function buildPlantLocationsApiUrl() {
            const url = new URL('{% url "EnergyMap:api_plant_locations" %}', window.location.origin);
            if (window.consumeEnergyMapForceRefresh && window.consumeEnergyMapForceRefresh()) {
                url.searchParams.set('refresh', '1');
            }
            return url.toString();
        }

        function setChartLoadingError(message) {
            chartLoading.textContent = `⚠️ ${message}`;
        }
        const FLAT_UNIT_TYPE_KEYS = new Set(['solar', 'wind', 'cogen', 'OtherRenewableEnergy']);
        const WIND_ACCORDION_KEYWORDS = ['雲林', '海龍二'];
        const NOTE_REFERENCES = {
            '4': '澎湖尖山：僅含澎湖本島尖山電廠。金門塔山：含大、小金門所有電廠。馬祖珠山：含南竿、北竿及珠山等電廠。離島其他：含蘭嶼、綠島、小琉球、連江縣[馬祖]離島（東引、東莒、西莒）及澎湖縣離島(七美、望安、虎井，但不含吉貝、鳥嶼)等電廠。顯示之發電量為毛發電量。',
            '5': '核能電廠全黑起動氣渦輪機，其淨尖峰能力15.5萬瓩，但其裝置容量不計入台電系統裝置容量，發電量計入燃油(輕油)發電。',
            '6': '北部小水力: 圓山、天埤、軟橋、石圳聯通管。中部小水力: 后里、社寮、景山、北山、濁水、湖山、集集南岸。南部小水力: 六龜、竹門。東部小水力: 銅門、龍溪、水簾、清水、清流、初英、榕樹、溪口、東興。',
            '7': '太陽能購電：所顯示之發電量係參考購電取樣發電量分區比例估算得出。購售電件數請參考本公司首頁：資訊揭露→發電資訊→購入電力概況→購入電力分布情形。',
            '8': '淨發電量若標示為 N/A，表示無即時資訊。',
            '9': '本網頁資料為每10分鐘更新，請重新整理頁面，可顯示最新資訊。',
            '10': '電廠(機組)換發/取得電業執照前進行測試(試運轉)等程序時，該電廠(機組)暫不計入裝置容量且不揭露其發電百分比。',
            '11': '備註欄補充說明：(1) 水文限制。(2) 燃料限制。(3) 環保限制。(4) 空污減載。(5) 環保停機(檢修)。(6) 運轉限制。(7) EOH限制。(8) 部分歲修。(9) 部分檢修。(10) 部分故障。(11) 合約限制。(12) 電源線限制。(13) 機組安檢。(14) 輔機檢修。(15) 外溫高限制。(16) 歲修逾排程。(17) 測試停機。(18) 測試運轉。',
            '12': '興達#4機自113年起第一、四季不運轉，114年起轉為備用機組，僅於第二、三季當預估供電餘裕(率)低於8%時啟用。',
            '13': '裝置容量20MW以上且併接電壓等級69仟伏以上之機組單獨呈現，其餘則整併一筆資料。',
            '14': '大林#5機111年12月31日除役並轉為緊急備用電力設施。',
            '15': '興達#1機112年9月30日除役並轉為緊急備用電力設施；興達#2機112年12月31日除役並轉為緊急備用電力設施；興達#3機114年10月1日除役並轉為緊急備用電力設施。',
            '16': '電池係指「能量型電池儲能」，且裝置容量係指電力交易平台「電能移轉複合動態調節備轉」該小時得標容量。'
        };

        function escapeHtml(value) {
            return String(value ?? '')
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        }

        function escapeAttr(value) {
            return escapeHtml(value).replace(/`/g, '&#96;');
        }

        function stripNoteSuffixes(name) {
            return String(name || '').replace(/\(註\d+\)/g, '').trim();
        }

        function extractNoteCodes(name) {
            return Array.from(String(name || '').matchAll(/\(註(\d+)\)/g)).map((match) => match[1]);
        }

        function renderNameWithNotes(name, className) {
            const cleanName = stripNoteSuffixes(name);
            const noteHtml = extractNoteCodes(name).map((code) => {
                const body = NOTE_REFERENCES[code] || '無對應備註說明';
                return `<span class="note-ref" data-note-code="${escapeAttr(code)}" data-note-body="${escapeAttr(body)}">(註${escapeHtml(code)})</span>`;
            }).join('');
            return `<span class="${className}">${escapeHtml(cleanName)}</span>${noteHtml}`;
        }

        function positionDashboardNoteTooltip(event) {
            const offset = 14;
            const tooltipRect = dashboardNoteTooltip.getBoundingClientRect();
            let left = event.clientX + offset;
            let top = event.clientY + offset;

            if (left + tooltipRect.width > window.innerWidth - 12) {
                left = window.innerWidth - tooltipRect.width - 12;
            }
            if (top + tooltipRect.height > window.innerHeight - 12) {
                top = event.clientY - tooltipRect.height - offset;
            }

            dashboardNoteTooltip.style.left = `${Math.max(12, left)}px`;
            dashboardNoteTooltip.style.top = `${Math.max(12, top)}px`;
        }

        document.addEventListener('mouseover', (event) => {
            const target = event.target.closest('[data-note-code]');
            if (!target) {
                return;
            }

            dashboardNoteTooltip.innerHTML = `
                <strong>註${escapeHtml(target.dataset.noteCode || '')}</strong>
                <span>${escapeHtml(target.dataset.noteBody || '')}</span>
            `;
            dashboardNoteTooltip.style.display = 'block';
            positionDashboardNoteTooltip(event);
        });

        document.addEventListener('mousemove', (event) => {
            if (dashboardNoteTooltip.style.display === 'block') {
                positionDashboardNoteTooltip(event);
            }
        });

        document.addEventListener('mouseout', (event) => {
            if (!event.target.closest('[data-note-code]')) {
                return;
            }

            dashboardNoteTooltip.style.display = 'none';
        });

        function formatNumber(value) {
            const numeric = Number(value || 0);
            return numeric.toLocaleString('zh-Hant-TW', {
                minimumFractionDigits: Number.isInteger(numeric) ? 0 : 1,
                maximumFractionDigits: 1,
            });
        }

        function formatMw(value) {
            return `${formatNumber(value)} MW`;
        }

        function toRgba(hex, alpha) {
            const normalized = String(hex || '').replace('#', '').trim();
            const safeHex = normalized.length === 3
                ? normalized.split('').map((char) => char + char).join('')
                : normalized.padEnd(6, '0').slice(0, 6);

            const r = parseInt(safeHex.slice(0, 2), 16);
            const g = parseInt(safeHex.slice(2, 4), 16);
            const b = parseInt(safeHex.slice(4, 6), 16);

            return `rgba(${r}, ${g}, ${b}, ${alpha})`;
        }

        function buildPlantPalette(baseColor, count) {
            return Array.from({ length: count }, (_, index) => {
                const alpha = Math.max(0.28, 1 - (index * 0.1));
                return toRgba(baseColor, alpha);
            });
        }

        function scrollDetailIntoView() {
            requestAnimationFrame(() => {
                detailCard.scrollIntoView({
                    behavior: 'smooth',
                    block: 'start',
                });
            });
        }

        function usesUnitLabel(typeKey) {
            return FLAT_UNIT_TYPE_KEYS.has(typeKey);
        }

        function getCountLabel(typeKey, count) {
            return usesUnitLabel(typeKey)
                ? `${count} 個發電單元`
                : `${count} 部機組`;
        }

        function getUnitShareLabel(typeKey) {
            return usesUnitLabel(typeKey) ? '單元占本站' : '機組占本站';
        }

        function getDetailTitle(typeKey, zhLabel) {
            return usesUnitLabel(typeKey)
                ? `${zhLabel}電廠與發電單元輸出`
                : `${zhLabel}電廠與機組輸出`;
        }

        function getUnitCountStatLabel(typeKey) {
            return usesUnitLabel(typeKey) ? '發電單元數量' : '機組數量';
        }

        function isBatteryStoragePlant(typeKey, plant) {
            return typeKey === 'EnergyStorageSystem' && Boolean(plant?.is_storage_asset);
        }

        function getPlantOfficialGeneration(plant) {
            return Number(plant?.total_official_generation ?? plant?.total_generation ?? 0);
        }

        function isBatteryStorageUnit(typeKey, unit, plant) {
            if (isBatteryStoragePlant(typeKey, plant)) {
                return true;
            }

            return typeKey === 'EnergyStorageSystem' && /Battery|電池/i.test(String(unit?.sub_type || ''));
        }

        function getStorageState(discharge, charge, netOutput) {
            if (charge > 0 && discharge <= 0) {
                return 'charging';
            }
            if (discharge > 0 && charge <= 0) {
                return 'discharging';
            }
            if (netOutput < 0) {
                return 'charging';
            }
            if (netOutput > 0) {
                return 'discharging';
            }
            return 'idle';
        }

        function getStorageStateText(state) {
            return state === 'charging'
                ? '充電中'
                : state === 'discharging'
                    ? '放電中'
                    : '待機中';
        }

        function getSignedValueText(value) {
            const numeric = Number(value || 0);
            return `${numeric > 0 ? '+' : ''}${formatNumber(numeric)} MW`;
        }

        function buildSignedBar(discharge, charge, capacity, dischargeColor) {
            const scale = Math.max(Number(capacity || 0), Number(discharge || 0), Number(charge || 0), 1);
            const dischargeWidth = Math.min((Number(discharge || 0) / scale) * 50, 50);
            const chargeWidth = Math.min((Number(charge || 0) / scale) * 50, 50);

            return `
                <div class="viz-track signed">
                    <div class="viz-fill charge" style="width:${chargeWidth}%; background:#f59e0b;"></div>
                    <div class="viz-fill discharge" style="width:${dischargeWidth}%; background:${dischargeColor};"></div>
                </div>
            `;
        }

        function renderStorageFlowMeta(discharge, charge, netOutput) {
            const state = getStorageState(discharge, charge, netOutput);
            const tags = [];

            if (charge > 0) {
                tags.push(`<span class="storage-flow-tag charge">充電 ${formatMw(charge)}</span>`);
            }
            if (discharge > 0) {
                tags.push(`<span class="storage-flow-tag discharge">放電 ${formatMw(discharge)}</span>`);
            }
            if (!tags.length) {
                tags.push(`<span class="storage-flow-tag idle">${getStorageStateText(state)}</span>`);
            }

            tags.push(`<span>淨輸出 ${getSignedValueText(netOutput)}</span>`);
            return tags.join('');
        }

        function shouldUseAccordionForPlant(typeKey, plant) {
            if (!usesUnitLabel(typeKey)) {
                return true;
            }

            if (typeKey !== 'wind') {
                return false;
            }

            return WIND_ACCORDION_KEYWORDS.some((keyword) => plant.name.includes(keyword));
        }

        function shouldRenderPlantInline(typeKey, plant) {
            return !shouldUseAccordionForPlant(typeKey, plant) || (plant.units || []).length <= 1;
        }

        function getDisplayUnitCount(typeKey, plants) {
            return plants.reduce((sum, plant) => {
                return sum + (shouldRenderPlantInline(typeKey, plant) ? 1 : plant.units.length);
            }, 0);
        }

        function getUnitStatusText(note) {
            const value = String(note || '').trim();
            return value || '';
        }

        function getStatusClass(note) {
            const value = String(note || '').trim();
            if (!value) {
                return '';
            }

            return ['歲修', '停機', '故障', '除役'].some((keyword) => value.includes(keyword))
                ? 'warn'
                : 'info';
        }

        function renderStatusTag(note) {
            const text = getUnitStatusText(note);
            if (!text) {
                return '';
            }

            const statusClass = getStatusClass(text);
            return `<span class="unit-status-tag ${statusClass}">${escapeHtml(text)}</span>`;
        }

        function renderUnitRow(unit, options) {
            const {
                typeKey,
                plantColor,
                totalGeneration,
                fallbackName,
                fallbackSubtype,
                fallbackCapacity,
                fallbackGeneration,
                forcedShare,
                forcedStatus,
                hideShareLabel,
                plant,
            } = options;

            const generation = fallbackGeneration ?? unit?.generation ?? 0;
            const capacity = fallbackCapacity ?? unit?.capacity ?? 0;
            const share = forcedShare ?? (
                totalGeneration > 0
                    ? ((generation / totalGeneration) * 100).toFixed(1)
                    : '0.0'
            );
            const width = Math.max(
                6,
                Math.round((Math.abs(generation || 0) / Math.max(Math.abs(totalGeneration || 0), 1)) * 100)
            );
            const statusText = forcedStatus ?? getUnitStatusText(unit?.note);
            const unitName = fallbackName ?? unit?.name ?? '單元';
            const rawSubtype = fallbackSubtype ?? unit?.sub_type ?? '';
            const unitSubtype = rawSubtype && !/未分類/.test(rawSubtype) && rawSubtype !== '機組'
                ? rawSubtype
                : (usesUnitLabel(typeKey) ? '發電單元' : '');
            const statusTag = renderStatusTag(statusText);
            const isStorage = isBatteryStorageUnit(typeKey, unit, plant);
            const discharging = Number(unit?.discharging_generation ?? (generation > 0 ? generation : 0));
            const charging = Number(unit?.charging_generation ? Math.abs(unit.charging_generation) : 0);
            const barHtml = isStorage
                ? buildSignedBar(discharging, charging, capacity, plantColor)
                : `
                    <div class="viz-track">
                        <div class="viz-fill" style="width:${width}%; background:${plantColor};"></div>
                    </div>
                `;
            const metaHtml = isStorage
                ? `<div class="unit-meta">${renderStorageFlowMeta(discharging, charging, generation)}</div>`
                : (hideShareLabel ? '' : `
                    <div class="unit-meta">
                        <span>${getUnitShareLabel(typeKey)} ${share}%</span>
                    </div>
                `);

            return `
                <div class="unit-row">
                    <div class="unit-row-top">
                        <div>
                            <div class="unit-title-line">
                                ${renderNameWithNotes(unitName, 'unit-name')}
                                ${statusTag}
                            </div>
                            ${unitSubtype ? `<div class="unit-subtype">${escapeHtml(unitSubtype)}</div>` : ''}
                        </div>
                        <div class="unit-values">
                            <strong>${isStorage ? getSignedValueText(generation) : formatMw(generation)}</strong>
                            <span>裝置 ${formatMw(capacity)}</span>
                        </div>
                    </div>
                    ${barHtml}
                    ${metaHtml}
                </div>
            `;
        }

        function buildTypeRecords(data) {
            const plantsByType = new Map();

            (data.panel_plants || []).forEach((plant) => {
                if (!plantsByType.has(plant.type_key)) {
                    plantsByType.set(plant.type_key, []);
                }

                const normalizedUnits = [...(plant.units || [])].sort(
                    (a, b) => Math.abs(b.generation || 0) - Math.abs(a.generation || 0)
                );

                plantsByType.get(plant.type_key).push({
                    ...plant,
                    units: normalizedUnits,
                });
            });

            return (data.categories || [])
                .map((category) => {
                    const plants = (plantsByType.get(category.key) || []).sort(
                        (a, b) => Math.abs(getPlantOfficialGeneration(b)) - Math.abs(getPlantOfficialGeneration(a))
                    );
                    const storagePlants = plants.filter((plant) => isBatteryStoragePlant(category.key, plant));
                    const totalCapacityByPlant = plants.reduce(
                        (sum, plant) => sum + Number(plant.total_capacity || 0),
                        0
                    );
                    const totalCapacityByUnit = plants.reduce(
                        (sum, plant) => sum + (plant.units || []).reduce(
                            (unitSum, unit) => unitSum + Number(unit.capacity || 0),
                            0
                        ),
                        0
                    );
                    const totalCharging = storagePlants.reduce(
                        (sum, plant) => sum + Number(plant.total_charging || 0),
                        0
                    );
                    const totalDischarging = storagePlants.reduce(
                        (sum, plant) => sum + Number(plant.total_discharging || 0),
                        0
                    );
                    const netGeneration = plants.reduce(
                        (sum, plant) => sum + Number(plant.net_output ?? plant.total_generation ?? 0),
                        0
                    );
                    const officialGeneration = Number(category.generation || 0);
                    const chartGeneration = Math.max(officialGeneration, 0);
                    const storageState = getStorageState(totalDischarging, totalCharging, netGeneration);

                    return {
                        ...category,
                        plants,
                        plantCount: plants.length,
                        unitCount: plants.reduce((sum, plant) => sum + (plant.units || []).length, 0),
                        displayUnitCount: getDisplayUnitCount(category.key, plants),
                        totalCapacity: Math.max(totalCapacityByPlant, totalCapacityByUnit),
                        officialGeneration,
                        netGeneration,
                        chartGeneration,
                        totalCharging,
                        totalDischarging,
                        isBatteryStorageType: category.key === 'EnergyStorageSystem' && storagePlants.length > 0,
                        storageState,
                    };
                })
                .filter((item) => item.chartGeneration > 0 || item.netGeneration !== 0 || item.plantCount > 0)
                .sort((a, b) => b.generation - a.generation);
        }

        function renderCategoryList() {
            categoryList.innerHTML = typeRecords.map((type) => {
                const percentage = totalSupplyGeneration > 0
                    ? ((type.chartGeneration / totalSupplyGeneration) * 100).toFixed(1)
                    : '0.0';
                const isActive = type.key === selectedTypeKey;
                const primaryText = `<strong>${formatMw(type.generation)}</strong> 發電量`;
                const secondaryText = type.isBatteryStorageType
                    ? `${type.plantCount} 座電廠 · ${getStorageStateText(type.storageState)}${type.totalCharging > 0 ? ` · 充電 ${formatMw(type.totalCharging)}` : ''}${type.totalDischarging > 0 ? ` · 放電 ${formatMw(type.totalDischarging)}` : ''}`
                    : `${type.plantCount} 座電廠 · ${getCountLabel(type.key, type.displayUnitCount || type.unitCount)}`;
                const shareHtml = `<strong>${percentage}%</strong><span>占比</span>`;

                return `
                    <button
                        class="type-button${isActive ? ' is-active' : ''}"
                        type="button"
                        data-type-key="${escapeHtml(type.key)}"
                        aria-pressed="${isActive ? 'true' : 'false'}"
                    >
                        <span class="energy-swatch" style="--swatch-color:${escapeHtml(type.color)};"></span>
                        <span class="type-info">
                            <span class="type-name">
                                <span>${escapeHtml(type.zh)}</span>
                                <span class="type-en">${escapeHtml(type.en)}</span>
                            </span>
                            <span class="type-meta">
                                <span>${primaryText}</span>
                                <span>${secondaryText}</span>
                            </span>
                        </span>
                        <span class="type-share">
                            ${shareHtml}
                        </span>
                    </button>
                `;
            }).join('');

            categoryList.querySelectorAll('[data-type-key]').forEach((button) => {
                button.addEventListener('click', () => {
                    selectType(button.dataset.typeKey);
                });
            });
        }

        function renderPlantAccordion(selected, displayPlants, colors) {
            return displayPlants.map((plant, index) => {
                const renderInline = shouldRenderPlantInline(selected.key, plant);
                const hasExplicitGroupLabel = plant.group_label
                    && plant.group_label !== '多個子分類'
                    && !/未分類/.test(plant.group_label);
                const groupText = hasExplicitGroupLabel ? escapeHtml(plant.group_label) : '';
                const unitCountText = (plant.units || []).length > 1
                    ? getCountLabel(selected.key, plant.units.length)
                    : '';
                const accordionSubtitle = groupText && unitCountText
                    ? `${groupText} · ${unitCountText}`
                    : (groupText || unitCountText);
                const officialPlantGeneration = getPlantOfficialGeneration(plant);
                const plantShare = selected.detailOfficialGeneration > 0
                    ? ((officialPlantGeneration / selected.detailOfficialGeneration) * 100).toFixed(1)
                    : '0.0';
                const plantColor = colors[index];
                const isStoragePlant = isBatteryStoragePlant(selected.key, plant);
                const plantHeaderValue = isStoragePlant
                    ? getSignedValueText(plant.net_output)
                    : formatMw(plant.total_generation);
                const plantHeaderMeta = isStoragePlant
                    ? `${getStorageStateText(plant.power_flow)} · 裝置 ${formatMw(plant.total_capacity || 0)}`
                    : `${plantShare}% · 裝置 ${formatMw(plant.total_capacity || 0)}`;

                if (renderInline) {
                    const inlineUnit = (plant.units || [])[0];
                    const inlineStatusTag = renderStatusTag(inlineUnit?.note);
                    const inlineSubtitle = groupText || (usesUnitLabel(selected.key) ? '發電單元' : '');
                    const inlineDisplayName = inlineUnit?.name || plant.name;
                    const inlineBar = isStoragePlant
                        ? buildSignedBar(plant.total_discharging, plant.total_charging, plant.total_capacity, plantColor)
                        : `
                            <div class="viz-track">
                                <div class="viz-fill" style="width:100%; background:${plantColor};"></div>
                            </div>
                        `;
                    const inlineMeta = isStoragePlant
                        ? `<div class="unit-meta">${renderStorageFlowMeta(plant.total_discharging, plant.total_charging, plant.net_output)}</div>`
                        : '';
                    return `
                        <article class="plant-accordion-item plant-flat-item">
                            <div class="plant-summary-row">
                                <div class="plant-summary-left">
                                    <div class="unit-title-line">
                                        ${renderNameWithNotes(inlineDisplayName, 'plant-name')}
                                        ${inlineStatusTag}
                                    </div>
                                    ${inlineSubtitle ? `<div class="plant-subtitle">${inlineSubtitle}</div>` : ''}
                                </div>
                                <div class="plant-summary-right">
                                    <strong>${plantHeaderValue}</strong>
                                    <span>${plantHeaderMeta}</span>
                                </div>
                            </div>
                            <div class="plant-viz">
                                ${inlineBar}
                            </div>
                            ${inlineMeta}
                        </article>
                    `;
                }

                const unitsHtml = (plant.units || []).map((unit) => {
                    return renderUnitRow(unit, {
                        typeKey: selected.key,
                        plantColor,
                        totalGeneration: officialPlantGeneration,
                        plant,
                    });
                }).join('');

                return `
                    <details class="plant-accordion-item">
                        <summary class="plant-accordion-summary">
                            <div class="plant-summary-row">
                                <div class="plant-summary-left">
                                    ${renderNameWithNotes(plant.name, 'plant-name')}
                                    ${accordionSubtitle ? `<div class="plant-subtitle">${accordionSubtitle}</div>` : ''}
                                </div>
                                <div class="plant-summary-right">
                                    <strong>${plantHeaderValue}</strong>
                                    <span>${plantHeaderMeta}</span>
                                </div>
                            </div>
                        </summary>
                        <div class="accordion-body">
                            <div class="unit-list">${unitsHtml}</div>
                        </div>
                    </details>
                `;
            }).join('');
        }

        function renderDetailPieChart(selected, displayPlants, colors) {
            const detailCanvas = document.getElementById('plantShareChart');
            if (!detailCanvas) {
                return;
            }

            const chartPlants = displayPlants.filter((plant) => getPlantOfficialGeneration(plant) > 0);
            const chartColors = colors.filter((_, index) => getPlantOfficialGeneration(displayPlants[index]) > 0);

            if (detailPieChart) {
                detailPieChart.destroy();
            }

            if (!chartPlants.length) {
                detailPieChart = null;
                return;
            }

            const ctx = detailCanvas.getContext('2d');
            detailPieChart = new Chart(ctx, {
                type: 'doughnut',
                data: {
                    labels: chartPlants.map((plant) => plant.name),
                    datasets: [{
                        data: chartPlants.map((plant) => getPlantOfficialGeneration(plant)),
                        backgroundColor: chartColors,
                        borderColor: 'rgba(10,14,26,0.9)',
                        borderWidth: 2,
                        hoverOffset: 6,
                    }],
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    cutout: '58%',
                    plugins: {
                        legend: {
                            display: false,
                        },
                        tooltip: {
                            backgroundColor: 'rgba(17,24,39,0.95)',
                            titleColor: '#f1f5f9',
                            bodyColor: '#94a3b8',
                            borderColor: 'rgba(255,255,255,0.1)',
                            borderWidth: 1,
                            cornerRadius: 10,
                            padding: 12,
                            callbacks: {
                                label: function(ctx) {
                                    const value = Number(ctx.parsed || 0);
                                    const share = selected.detailOfficialGeneration > 0
                                        ? ((value / selected.detailOfficialGeneration) * 100).toFixed(1)
                                        : '0.0';
                                    return `${formatMw(value)} (${share}%)`;
                                },
                            },
                        },
                    },
                },
            });
        }

        function renderDetail() {
            const selected = typeRecords.find((type) => type.key === selectedTypeKey);

            if (!selected) {
                detailCard.style.display = 'none';
                if (detailPieChart) {
                    detailPieChart.destroy();
                    detailPieChart = null;
                }
                legendDetail.innerHTML = '<div class="detail-placeholder">請從右側選擇能源類型以查看電廠與機組資料。</div>';
                return;
            }

            detailCard.style.display = '';

            const percentage = totalGeneration > 0
                ? ((selected.generation / totalGeneration) * 100).toFixed(1)
                : '0.0';
            const displayPlants = selected.plants;
            const detailGeneration = Number(selected.generation || 0);
            const detailCapacity = displayPlants.reduce((sum, plant) => sum + Number(plant.total_capacity || 0), 0);
            const detailPlantCount = displayPlants.length;
            const detailUnitCount = getDisplayUnitCount(selected.key, displayPlants);
            selected.detailOfficialGeneration = displayPlants.reduce((sum, plant) => sum + getPlantOfficialGeneration(plant), 0);
            selected.detailNetGeneration = displayPlants.reduce((sum, plant) => sum + Number((plant.net_output ?? plant.total_generation) || 0), 0);
            const notes = [...new Set(
                displayPlants.flatMap((plant) => (plant.units || []).map((unit) => (unit.note || '').trim()).filter(Boolean))
            )];
            const plantColors = buildPlantPalette(selected.color, displayPlants.length);

            legendDetail.innerHTML = `
                <div class="detail-stack">
                    <div class="detail-header">
                        <div class="detail-title">
                            <span class="energy-swatch" style="--swatch-color:${escapeHtml(selected.color)};"></span>
                            <div>
                                <h2>${escapeHtml(getDetailTitle(selected.key, selected.zh))}</h2>
                                <p>${escapeHtml(selected.en)} · 共 ${detailPlantCount} 座電廠，${getCountLabel(selected.key, detailUnitCount)}</p>
                            </div>
                        </div>
                        <div class="detail-summary">
                            <div class="metric-pill">
                                <div class="metric-pill-label">能源占比</div>
                                <div class="metric-pill-value">${percentage}%</div>
                            </div>
                            <div class="metric-pill">
                                <div class="metric-pill-label">總發電量</div>
                                <div class="metric-pill-value">${formatMw(detailGeneration)}</div>
                            </div>
                            ${selected.isBatteryStorageType ? `
                            <div class="metric-pill">
                                <div class="metric-pill-label">淨輸出</div>
                                <div class="metric-pill-value">${getSignedValueText(selected.detailNetGeneration)}</div>
                            </div>
                            ` : ''}
                            <div class="metric-pill">
                                <div class="metric-pill-label">總裝置容量</div>
                                <div class="metric-pill-value">${formatMw(detailCapacity)}</div>
                            </div>
                        </div>
                    </div>
                    <div class="detail-content-grid">
                        <div class="detail-chart-panel">
                            <div class="detail-subheading">電廠發電占比</div>
                            <div class="detail-chart-wrap">
                                <canvas id="plantShareChart"></canvas>
                            </div>
                            <div class="detail-chart-meta">
                                <div class="detail-chart-stat">
                                    <div class="detail-chart-stat-label">電廠數量</div>
                                    <div class="detail-chart-stat-value">${detailPlantCount} 座</div>
                                </div>
                                <div class="detail-chart-stat">
                                    <div class="detail-chart-stat-label">${getUnitCountStatLabel(selected.key)}</div>
                                    <div class="detail-chart-stat-value">${getCountLabel(selected.key, detailUnitCount)}</div>
                                </div>
                            </div>
                        </div>
                        <div class="detail-accordion-panel">
                            <div class="detail-subheading">電廠與機組明細</div>
                            ${displayPlants.length
                                ? `<div class="plant-accordion">${renderPlantAccordion(selected, displayPlants, plantColors)}</div>`
                                : '<div class="detail-placeholder">目前沒有可顯示的電廠與機組資料。</div>'}
                        </div>
                    </div>
                    ${notes.length
                        ? `<div class="detail-note">備註：${notes.map(escapeHtml).join(' / ')}</div>`
                        : ''}
                </div>
            `;

            if (displayPlants.length) {
                renderDetailPieChart(selected, displayPlants, plantColors);
            } else if (detailPieChart) {
                detailPieChart.destroy();
                detailPieChart = null;
            }
        }

        function syncChartSelection() {
            if (!energyChart) {
                return;
            }

            const chartTypes = typeRecords.filter((type) => type.chartGeneration > 0);
            const index = chartTypes.findIndex((type) => type.key === selectedTypeKey);
            energyChart.setActiveElements(index >= 0 ? [{ datasetIndex: 0, index }] : []);
            energyChart.update();
        }

        function selectType(typeKey) {
            const nextTypeKey = selectedTypeKey === typeKey ? null : typeKey;
            const shouldScroll = Boolean(nextTypeKey);

            selectedTypeKey = nextTypeKey;
            renderCategoryList();
            renderDetail();
            syncChartSelection();

            if (shouldScroll) {
                scrollDetailIntoView();
            }
        }

        function renderChart() {
            const chartTypes = typeRecords.filter((type) => type.chartGeneration > 0);
            const labels = chartTypes.map((type) => type.zh);
            const values = chartTypes.map((type) => type.chartGeneration);
            const colors = chartTypes.map((type) => type.color);

            chartLoading.style.display = 'none';
            chartWrapper.style.display = 'flex';

            if (energyChart) {
                energyChart.destroy();
            }

            const ctx = document.getElementById('energyChart').getContext('2d');
            energyChart = new Chart(ctx, {
                type: 'doughnut',
                data: {
                    labels,
                    datasets: [{
                        data: values,
                        backgroundColor: colors,
                        borderColor: 'rgba(10,14,26,0.8)',
                        borderWidth: 3,
                        hoverBorderColor: '#fff',
                        hoverBorderWidth: 2,
                        hoverOffset: 8,
                    }],
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    cutout: '62%',
                    onClick: (_, elements) => {
                        if (!elements.length) {
                            return;
                        }
                        const selected = chartTypes[elements[0].index];
                        if (selected) {
                            selectType(selected.key);
                        }
                    },
                    plugins: {
                        legend: { display: false },
                        tooltip: {
                            backgroundColor: 'rgba(17,24,39,0.95)',
                            titleColor: '#f1f5f9',
                            bodyColor: '#94a3b8',
                            borderColor: 'rgba(255,255,255,0.1)',
                            borderWidth: 1,
                            cornerRadius: 10,
                            padding: 14,
                            titleFont: { family: 'Inter, Noto Sans TC', weight: '600', size: 14 },
                            bodyFont: { family: 'Inter, Noto Sans TC', size: 13 },
                            callbacks: {
                                label: function(ctx) {
                                    const pct = totalSupplyGeneration > 0
                                        ? ((ctx.parsed / totalSupplyGeneration) * 100).toFixed(1)
                                        : '0.0';
                                    return `${formatMw(ctx.parsed)} (${pct}%)`;
                                },
                            },
                        },
                    },
                    animation: {
                        animateRotate: true,
                        duration: 1200,
                        easing: 'easeOutQuart',
                    },
                },
            });

            syncChartSelection();
        }

        async function loadDashboardData(options = {}) {
            const { preserveSelection = true, silent = false } = options;

            if (dashboardLoadPromise) {
                return dashboardLoadPromise;
            }

            dashboardLoadPromise = (async function() {
            try {
                const resp = await fetch(buildPlantLocationsApiUrl(), { cache: 'no-store' });
                const data = await resp.json();

                if (!data.success) {
                    setChartLoadingError(`無法載入資料: ${data.error || '未知錯誤'}`);
                    return;
                }

                typeRecords = buildTypeRecords(data);
                totalGeneration = typeRecords.reduce((sum, type) => sum + Number(type.generation || 0), 0);
                totalSupplyGeneration = totalGeneration;
                const previousSelectedTypeKey = preserveSelection ? selectedTypeKey : null;
                selectedTypeKey = previousSelectedTypeKey && typeRecords.some((type) => type.key === previousSelectedTypeKey)
                    ? previousSelectedTypeKey
                    : null;

                document.getElementById('updateTime').textContent = data.update_time;
                document.getElementById('updateBadge').style.display = 'inline-flex';
                document.getElementById('totalValue').textContent = formatNumber(totalGeneration);
                document.getElementById('totalGenerationStat').textContent = formatMw(totalGeneration);

                renderCategoryList();
                renderDetail();

                if (!typeRecords.length) {
                    setChartLoadingError('目前沒有可顯示的能源資料。');
                    return;
                }

                renderChart();
            } catch (err) {
                setChartLoadingError(`載入失敗: ${err.message}`);
            } finally {
                dashboardLoadPromise = null;
            }
            })();

            return dashboardLoadPromise;
        }

        loadDashboardData({ preserveSelection: false });
        window.setInterval(() => {
            if (document.visibilityState === 'visible') {
                loadDashboardData({ preserveSelection: true, silent: true });
            }
        }, AUTO_REFRESH_INTERVAL_MS);
    </script>
</body>
</html>
