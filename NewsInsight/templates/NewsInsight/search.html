<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NewsInsight - 輿情分析</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Google Fonts: Noto Sans TC -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700&display=swap"
        rel="stylesheet">
    <style>
        body {
            font-family: 'Noto Sans TC', sans-serif;
            background-color: #f8f9fa;
        }

        .header {
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            color: white;
            padding: 3rem 0;
            margin-bottom: 2rem;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        .search-card {
            border-radius: 15px;
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.05);
            border: none;
            background-color: white;
            padding: 2rem;
        }

        .btn-primary {
            background-color: #2a5298;
            border: none;
            padding: 0.75rem 2rem;
            border-radius: 8px;
            font-weight: 500;
            transition: all 0.3s;
        }

        .btn-primary:hover {
            background-color: #1e3c72;
            transform: translateY(-2px);
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }

        .form-label {
            font-weight: 500;
            color: #495057;
        }

        .form-control {
            border-radius: 8px;
            padding: 0.75rem 1rem;
        }

        .form-control:focus {
            box-shadow: 0 0 0 0.25rem rgba(42, 82, 152, 0.25);
            border-color: #2a5298;
        }
    </style>
</head>

<body>

    <div class="header text-center">
        <div class="container">
            <h1 class="display-4 fw-bold mb-3">NewsInsight 輿情分析</h1>
            <p class="lead mb-0">快速掌握關鍵字的新聞輿情、趨勢與重點</p>
        </div>
    </div>

    <div class="container mb-5">
        <div class="row justify-content-center">
            <div class="col-lg-8">
                <div class="search-card">
                    <h4 class="mb-4 text-center" style="color: #2a5298;">設定查詢條件</h4>

                    {% if error %}
                    <div class="alert alert-danger" role="alert">
                        {{ error }}
                    </div>
                    {% endif %}

                    <form action="{% url 'NewsInsight:index' %}" method="post">
                        {% csrf_token %}

                        <div class="mb-4">
                            <label for="keywords" class="form-label">搜尋關鍵字 <span class="text-danger">*</span></label>
                            <input type="text" class="form-control" id="keywords" name="keywords"
                                placeholder="例如: 台灣 人工智慧" required value="{{ keywords|default:'' }}">
                            <div class="form-text">可輸入單一或多個關鍵字（以空格分隔）</div>
                        </div>

                        <div class="row mb-4">
                            <div class="col-md-6">
                                <label for="start_date" class="form-label">起始日期 <span
                                        class="text-danger">*</span></label>
                                <input type="date" class="form-control" id="start_date" name="start_date"
                                    value="{{ start_date|default:'' }}" required>
                            </div>
                            <div class="col-md-6">
                                <label for="end_date" class="form-label">結束日期 <span class="text-danger">*</span></label>
                                <input type="date" class="form-control" id="end_date" name="end_date"
                                    value="{{ end_date|default:'' }}" required>
                            </div>
                        </div>

                        <div class="d-grid gap-2 text-center">
                            <button type="submit" class="btn btn-primary btn-lg" id="searchBtn" onclick="showLoading()">
                                <i class="bi bi-search"></i> 開始搜尋
                            </button>
                        </div>
                    </form>

                    <div id="loading" class="text-center mt-4" style="display: none;">
                        <div class="spinner-border text-primary" role="status">
                            <span class="visually-hidden">Loading...</span>
                        </div>
                        <p class="mt-2 text-muted">正在從 Google News 擷取資料並進行關鍵字分析，請稍候...</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <footer class="text-center py-4 mt-5 text-muted">
        <div class="container">
            <p class="mb-1 text-secondary" style="font-size: 0.95em;">資料來源：Google News</p>
            <p class="mb-0 text-secondary" style="font-size: 0.9em;">&copy; 2026 中興工程顧問股份有限公司園路部</p>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function () {
            var startInput = document.getElementById('start_date');
            var endInput = document.getElementById('end_date');
            var searchBtn = document.getElementById('searchBtn');

            function checkDates() {
                if (startInput.value && endInput.value) {
                    searchBtn.disabled = false;
                } else {
                    searchBtn.disabled = true;
                }
            }

            startInput.addEventListener('input', checkDates);
            endInput.addEventListener('input', checkDates);
            checkDates(); // validate immediately on page load
        });

        function showLoading() {
            var keyword = document.getElementById('keywords').value;
            if (keyword.trim() !== '') {
                document.getElementById('loading').style.display = 'block';
            }
        }
    </script>
</body>

</html>
