{% load static %}
<!DOCTYPE html>
<html lang="zh-Hant">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>隧道斷面自動生成及淨空包絡線檢核工具</title>
    <link rel="stylesheet" href="{% static 'CircleOptimizer/css/style.css' %}">
</head>

<body>
    <div class="container">
        <header>
            <h1>🚇 隧道斷面自動生成及淨空包絡線檢核工具</h1>
            <p class="subtitle">輸入8個控制點，自動生成最小化面積的3心圓或4心圓隧道斷面</p>
        </header>

        <div class="main-content">
            <!-- 左側：輸入區 -->
            <div class="input-section">
                <div class="card">
                    <h2>📍 淨空包絡線隧道斷面控制點座標</h2>
                    <p class="hint">請輸入8個控制點的座標，或在右側視覺化區域直接拖拉調整</p>

                    <div class="points-grid">
                        <div class="point-input" data-index="0">
                            <label>點 1:</label>
                            <input type="number" class="coord-x" placeholder="X" step="0.1" value="20">
                            <input type="number" class="coord-y" placeholder="Y" step="0.1" value="0">
                        </div>
                        <div class="point-input" data-index="1">
                            <label>點 2:</label>
                            <input type="number" class="coord-x" placeholder="X" step="0.1" value="20">
                            <input type="number" class="coord-y" placeholder="Y" step="0.1" value="15">
                        </div>
                        <div class="point-input" data-index="2">
                            <label>點 3:</label>
                            <input type="number" class="coord-x" placeholder="X" step="0.1" value="15">
                            <input type="number" class="coord-y" placeholder="Y" step="0.1" value="15">
                        </div>
                        <div class="point-input" data-index="3">
                            <label>點 4:</label>
                            <input type="number" class="coord-x" placeholder="X" step="0.1" value="15">
                            <input type="number" class="coord-y" placeholder="Y" step="0.1" value="20">
                        </div>
                        <div class="point-input" data-index="4">
                            <label>點 5:</label>
                            <input type="number" class="coord-x" placeholder="X" step="0.1" value="-15">
                            <input type="number" class="coord-y" placeholder="Y" step="0.1" value="20">
                        </div>
                        <div class="point-input" data-index="5">
                            <label>點 6:</label>
                            <input type="number" class="coord-x" placeholder="X" step="0.1" value="-15">
                            <input type="number" class="coord-y" placeholder="Y" step="0.1" value="15">
                        </div>
                        <div class="point-input" data-index="6">
                            <label>點 7:</label>
                            <input type="number" class="coord-x" placeholder="X" step="0.1" value="-20">
                            <input type="number" class="coord-y" placeholder="Y" step="0.1" value="15">
                        </div>
                        <div class="point-input" data-index="7">
                            <label>點 8:</label>
                            <input type="number" class="coord-x" placeholder="X" step="0.1" value="-20">
                            <input type="number" class="coord-y" placeholder="Y" step="0.1" value="0">
                        </div>
                    </div>

                    <button id="loadSampleBtn" class="btn btn-secondary">載入範例數據</button>
                </div>

                <div class="card">
                    <h2>⚙️ 圖形資訊</h2>
                    <div class="form-group">
                        <label for="shapeName">圖形名稱:</label>
                        <input type="text" id="shapeName" placeholder="例：測試圖形01" value="測試圖形">
                    </div>
                    <button id="createShapeBtn" class="btn btn-primary">創建圖形</button>
                    <div id="shapeInfo" class="info-box" style="display:none;">
                        <p><strong>圖形 ID:</strong> <span id="shapeId">-</span></p>
                    </div>
                </div>

                <div class="card">
                    <h2>🎯 斷面生成選項</h2>

                    <!-- 手動模式說明 -->
                    <div id="interactiveModeControls" class="mode-controls">
                        <div id="interactiveInstructions"
                            style="margin-top:15px; padding:15px; background:#e3f2fd; border-radius:6px;">
                            <p style="margin:0; color:#1976d2;">
                                <strong>使用說明：</strong><br>
                                1. 拖動圓心調整位置 (Arc 3/4 限制在垂直平分線上)<br>
                                2. 拖動圓周/角度點調整參數<br>
                                3. 圓弧1與圓弧2保持對稱
                            </p>
                        </div>
                    </div>

                    <div id="optimizeStatus" class="status-box"></div>
                </div>
            </div>

            <!-- 右側：視覺化區 -->
            <div class="visualization-section">
                <div class="card">
                    <h2>📊 隧道斷面視覺化</h2>
                    <div id="svgContainer">
                        <svg id="canvas" width="600" height="600" viewBox="-50 -50 100 100">
                            <defs>
                                <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="5" refY="3"
                                    orient="auto">
                                    <polygon points="0 0, 10 3, 0 6" fill="#999" />
                                </marker>
                            </defs>

                            <!-- 座標軸將由 JavaScript 動態繪製 -->

                            <!-- 控制點與圖形 -->
                            <g id="shapeGroup"></g>

                            <!-- 圓 -->
                            <g id="circlesGroup"></g>
                        </svg>
                    </div>
                </div>

                <!-- 結果顯示 -->
                <div class="card" id="resultsCard" style="display:none;">
                    <h2>📈 斷面參數</h2>
                    <div id="resultsContainer"></div>
                </div>

                <!-- 手動調整 -->
                <div class="card" id="adjustCard" style="display:none;">
                    <h2>🔧 手動微調</h2>
                    <div id="adjustContainer"></div>
                    <button id="saveAdjustBtn" class="btn btn-primary">保存調整</button>
                </div>
            </div>
        </div>
    </div>

    <script src="{% static 'CircleOptimizer/js/main.js' %}"></script>
</body>

</html>
