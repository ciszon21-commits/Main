"optional": true, "type": "Param_ScriptVariable"}], "outputs": [{"name": "out", "description": "Reports, errors, warnings, etc.", "optional": false, "type": "Param_String"}, {"name": "rays", "description": "A list of polylines representing the sun rays traced forward onto\r\nthe _source_geo and then through the context_.", "optional": false, "type": "Param_GenericObject"}, {"name": "int_pts", "description": "A data tree of intersection points one one branch for each of the\r\nrays above.", "optional": false, "type": "Param_GenericObject"}], "preset_items": [], "availability": "INSTANTIATED", "source": "C:/Program Files/ladybug_tools/grasshopper/ladybug_grasshopper/user_objects\\LB Surface Ray Tracing.ghuser", "id": "LB-069", "group": "幾何與環境分析", "hub_status": "待接入 Hub", "base_guid": "410755b1-224a-4c1e-a407-bf32fb45ea7e", "sha256": "f73df3bd69a59aa83d87dc7e42af1689c793ce84fcd8723988a73093d22116a7"}, {"file": "LB Thermal Shade Benefit.ghuser", "name": "LB Thermal Shade Benefit", "nickname": "", "category": "Ladybug", "subcategory": "3 :: Analyze Geometry", "guid": "e4d8086c-5031-4e25-91f5-8bec3fa51fb0", "description": "Visualize the desirability of shade in terms of proximity of conditions to\r\na favorable temerature range.\r\n_\r\nThe calculation runs by generating solar vectors for a data collection of input\r\ntemperature values. Solar vectors for hours when the temperature is above the\r\nupper temperature threshold contribute positively to shade desirability (shade_help)\r\nwhile solar vectors for hours when the temperature is below the lower temperature\r\nthreshold contribute negatively (shade_harm).\r\n_\r\nThe component outputs a colored mesh of the shade illustrating the net effect of\r\nshading each part of the _shade_geo. A higher saturation of blue indicates that\r\nshading the cell is desirable to avoid excessively hot temperatures. A higher\r\nsaturation of red indicates that shading the cell is harmful, blocking helpful\r\nsun in cold conditions that could bring conditions closer to the desired\r\ntemperature range. Desaturated cells indicate that shading the cell will have\r\nrelatively little effect on keeping the _study_region in the desired thermal range.\r\n_\r\nThe units for shade desirability are degree-days per unit area of shade, which are\r\nessentially the amount of time in days that sun is blocked by a given cell\r\nmultiplied by the degrees above (or below) the temperature thresholds during\r\nthat time. So, if a given square meter of input _shade_geo has a shade desirability\r\nof 10 degree-days per square meter, this means that a shade in this location\r\nprovides roughly 1 day of sun protection from conditions 10 degrees Celsius\r\nwarmer than the _up_threshold_ to the _study_region.\r\n_\r\nMore information on the methods used by this component can be found in the\r\nfollowing publication:\r\nMackey, Christopher; Sadeghipour Roudsari, Mostapha; Samaras, Panagiotis.\r\n“ComfortCover: A Novel Method for the Design of Outdoor Shades.” In Proceedings\r\nof Symposium on Simulation for Architecture and Urban Design. Washington, DC,\r\nUnited States, Apr 12-15 2015.\r\nhttps://drive.google.com/file/d/0Bz2PwDvkjovJQVRTRHhMSXZWZjQ/view?usp=sharing\r\n-", "version": "None", "inputs": [{"name": "north_", "description": "A number between -360 and 360 for the counterclockwise\r\ndifference between the North and the positive Y-axis in degrees.\r\n90 is West and 270 is East. This can also be Vector for the\r\ndirection to North. (Default: 0)", "optional": true, "type": "Param_ScriptVariable"}, {"name": "_location", "description": "A ladybug Location that has been output from the \"LB Import EPW\"\r\ncomponent or the \"LB Construct Location\" component.", "optional": true, "type": "Param_ScriptVariable"}, {"name": "_temperature", "description": "An hourly data collection with the unshaded temperature experienced\r\nat the _study_region. This temperature will be used to evaluate shade\r\nbenefit for this study region. This temperature data collection should\r\ntypically be informed by an analysis with the \"LB Outdoor Solar MRT\"\r\nor the \"LB Indoor Solar MRT\" component, which will account for the\r\nincreased temperature delta expereinced as a result of being in the\r\nsun. For evaluation of shade in terms of outdoor thermal comfort, the\r\nbest practice is to use the Universal Thermal Climate Index (UTCI)\r\ntemperature at the study region for this input. For evaluation of\r\nshade benefit in terms of indoor comfort,  the best practice is to\r\nuse the Standard Effective Temperature (SET) derived from the\r\n\"LB PMV Comfort\" component for this input. In both cases, the MRT\r\ninputs to the thermal comfort models should use solar-adjusted MRT.", "optional": true, "type": "Param_ScriptVariable"}, {"name": "_study_region", "description": "Rhino Breps and/or Rhino Meshes representing an area for which shading\r\ndesirability is being evaluated. This is often the region where a human\r\nsubject will sit (eg. a bench) or it could be the window of a building\r\nwhere an occupant might be standing or sitting.", "optional": true, "type": "Param_ScriptVariable"}, {"name": "_shade_geo", "description": "Rhino Breps and/or Rhino Meshes representing shading to be evaluated\r\nin terms of its benefit. Note that, in the case that multiple\r\nshading geometries are connected, this component does not account\r\nfor the interaction between the different shading surfaces and will\r\njust evaluate each part of the shade independently.", "optional": true, "type": "Param_ScriptVariable"}, {"name": "context_", "description": "Rhino Breps and/or Rhino Meshes representing context geometry that can\r\nblock sunlight to the _study_region, therefore discounting any benefit\r\nor harm that could come to the region.", "optional": true, "type": "Param_ScriptVariable"}, {"name": "_grid_size", "description": "A positive number in Rhino model units for the size of grid cells at\r\nwhich the input _shade_geo will be subdivided for shade benefit\r\nanalysis. The smaller the grid size, the higher the resolution of\r\nthe analysis and the longer the calculation will take.  So it is\r\nrecommended that one start with a large value here and decrease\r\nthe value as needed. However, the grid size should usually be\r\nsmaller than the dimensions of the smallest piece of the _shade_geo\r\nand context_ in order to yield meaningful results.", "optional": true, "type": "Param_ScriptVariable"}, {"name": "_up_threshold_", "description": "A number representing the temperature in Celsius above which\r\nshade is considered desirable/helpful. The default is 26C, which\r\ncorresponds to the upper limit of \"No Thermal Stress\" according\r\nto the UTCI thermal comfort model (above this, heat stress begins).\r\nA different value may be desirable for indoor thermal comfort studies.", "optional": true, "type": "Param_ScriptVariable"}, {"name": "_low_threshold_", "description": "A number representing the temperature in Celsius below which shade\r\nis considered harmful and access to the sun is preferable. The default\r\nis 9C, which corresponds to the lower limit of \"No Thermal Stress\"\r\naccording to the UTCI thermal comfort model (below this, cold stress\r\nbegins). A different value may be desirable for indoor thermal\r\ncomfort studies.", "optional": true, "type": "Param_ScriptVariable"}, {"name": "_timestep_", "description": "An integer for the number of timesteps per hour at which\r\nsun vectors will be generated for the analysis. Higher values will\r\nresult in the generation of more vectors, which will make the\r\nresulting shade mesh smoother and a better representation of shade\r\nbenefit and harm. However, the calculation will take\r\nlonger as there are more intersection operations to perform. The\r\ndefault is 1 timestep per hour, which is the coarsest resolution\r\navalable and the fastest calculation.", "optional": true, "type": "Param_ScriptVariable"}, {"name": "legend_par_", "description": "Optional legend parameters from the \"LB Legend Parameters\"\r\nthat will be used to customize the display of the results.", "optional": true, "type": "Param_ScriptVariable"}, {"name": "_cpu_count_", "description": "An integer to set the number of CPUs used in the execution of the\r\nintersection calculation. If unspecified, it will automatically default\r\nto one less than the number of CPUs currently available on the\r\nmachine or 1 if only one processor is available.", "optional": true, "type": "Param_ScriptVariable"}, {"name": "_run", "description": "Set to \"True\" to run the component and perform shade benefit analysis.", "optional": true, "type": "Param_ScriptVariable"}], "outputs": [{"name": "out", "description": "...", "optional": false, "type": "Param_String"}, {"name": "vectors", "description": "The sun vectors that were used to evaluate the shade (note that\r\nthese will increase as the _timestep_ increases).", "optional": false, "type": "Param_GenericObject"}, {"name": "points", "description": "Points across the study_region from which sun vectors are projected.", "optional": false, "type": "Param_GenericObject"}, {"name": "mesh", "description": "A colored mesh of the _shade_geo showing where shading is helpful (in blue),\r\nharmful (in red), or does not make much of a difference (white or\r\ndesaturated colors). Note that the colors can change depending upon\r\nthe input legend_par_.", "optional": false, "type": "Param_GenericObject"}, {"name": "legend", "description": "Legend showing the numeric values of degree-days per unit are of shade\r\nthat correspond to the colors in the shade mesh.", "optional": false, "type": "Param_GenericObject"}, {"name": "title", "description": "A text object for the study title.", "optional": false, "type": "Param_GenericObject"}, {"name": "shade_help", "description": "The cumulative degree-days per square area unit helped by shading each\r\ncell of the shade. If a given square meter of _shade_geo has a helpfulness\r\nof 10 degree-days/m2, this means that a shade in this location provides\r\n1 day of sun protection from conditions 10 degrees warmer than the\r\n_up_threshold_ to the _study_region.", "optional": false, "type": "Param_GenericObject"}, {"name": "shade_harm", "description": "The cumulative degree-days per square area unit harmed by shading each\r\ncell of the shade. If a given square meter of _shade_geo has a harmfulness\r\nof -10 degree-days, this means that a shade in this location blocks\r\n1 day of sun duirng conditions that are 10 degrees Celsius colder than\r\nthe _low_threshold_ to the _study_region.", "optional": false, "type": "Param_GenericObject"}, {"name": "shade_net", "description": "The sum of the helpfulness and harmfulness for each cell. This will be\r\nnegative if shading the cell has a net harmful effect and positive\r\nif the shade has a net helpful effect.", "optional": false, "type": "Param_GenericObject"}], "preset_items": [], "availability": "INSTANTIATED", "source": "C:/Program Files/ladybug_tools/grasshopper/ladybug_grasshopper/user_objects\\LB Thermal Shade Benefit.ghuser", "id": "LB-070", "group": "幾何與環境分析", "hub_status": "待接入 Hub", "base_guid": "410755b1-224a-4c1e-a407-bf32fb45ea7e", "sha256": "94121be97bfde1ac308bcf1fad1168d2da4e6ce46630e5bbdbe06ffbccfb770f"}, {"file": "LB View Factors.ghuser", "name": "LB View Factors", "nickname": "", "category": "Ladybug", "subcategory": "3 :: Analyze Geometry", "guid": "faa4c467-07f9-4dbb-9e24-020f5ce69986", "description": "Calculate view factors from a point or plane to a set of geometries.\r\n_\r\nView factors are used in many thermal comfort calculations such as mean radiant\r\ntemperture (MRT) or discomfort from radiant assymetry. \r\n-", "version": "None", "inputs": [{"name": "_study_point", "description": "A point or plane from which view vectors will be projected.\r\nNote that, if a point is connected, all view vectors will be\r\nweighted evenly (assuming no directional bias). However, if\r\na plane is connected, vectors will be weighted based on their\r\nangle to the plane normal, producing view factors for a surface\r\nin the connected plane. The first is useful for MRT calculations\r\nwhile the latter is needed for radiant assymetry calculations.\r\nThis input can also be a list of several points or planes.", "optional": true, "type": "Param_ScriptVariable"}, {"name": "_view_geo", "description": "A list of breps, surfaces, or meshes to which you want to compute\r\nview factors. Note that by meshing and joining several goemtries\r\ntogether, the combined view factor to these geometries can\r\nbe computed.", "optional": true, "type": "Param_ScriptVariable"}, {"name": "context_", "description": "Optional context geometry as breps, surfaces, or meshes that can\r\nblock the view to the _view_geo.", "optional": true, "type": "Param_ScriptVariable"}, {"name": "_resolution_", "description": "A positive integer for the number of times that the original\r\nview vectors are subdivided. 1 indicates that 145 evenly-spaced\r\nvectors are used to describe a hemisphere, 2 indicates that\r\n577 vectors describe a hemisphere, and each successive value will\r\nroughly quadruple the number of view vectors used. Setting this to\r\na high value will result in a more accurate analysis but will take\r\nlonger to run. (Default: 1).", "optional": true, "type": "Param_ScriptVariable"}, {"name": "_cpu_count_", "description": "An integer to set the number of CPUs used in the execution of the\r\nintersection calculation. If unspecified, it will automatically default\r\nto one less than the number of CPUs currently available on the\r\nmachine or 1 if only one processor is available.", "optional": true, "type": "Param_ScriptVariable"}, {"name": "_run", "description": "Set to True to run the component and claculate view factors.", "optional": true, "type": "Param_ScriptVariable"}], "outputs": [{"name": "out", "description": "...", "optional": false, "type": "Param_String"}, {"name": "view_vecs", "description": "A list of vectors which are projected from each of the points to evaluate view.", "optional": false, "type": "Param_GenericObject"}, {"name": "patch_mesh", "description": "A mesh that represents the sphere of view patches around the _study_point\r\nat the input _resolution_. There is one face per patch and this can be\r\nused along with the int_mtx to create a colored visualization of patches\r\ncorresponding to different geometries around the point. Specifically,\r\nthe \"LB Spaital Heatmap\" component is recommended for such visualizations.\r\nNote that only one sphere is ever output from here and, in the event\r\nthat several _study_points are connected, this sphere will be located\r\nat the first point. Therefore, to create visualizations for the other\r\npoints, this mesh should be moved using the difference between the\r\nfirst study point and following study points.", "optional": false, "type": "Param_GenericObject"}, {"name": "view_factors", "description": "A list of view factors that describe the fraction of sperical\r\nview taken up by the input surfaces.  These values range from 0 (no view)\r\nto 1 (full view).  If multiple _study_points have been connected,\r\nthis output will be a data tree with one list for each point.", "optional": false, "type": "Param_GenericObject"}, {"name": "int_mtx", "description": "A Matrix object that can be connected to the \"LB Deconstruct Matrix\"\r\ncomponent to obtain detailed vector-by-vector results of the study.\r\nEach sub-list (aka. branch of the Data Tree) represents one of the\r\npoints used for analysis. Each value in this sub-list corresponds\r\nto a vector used in the study and the value denotes the index of the\r\ngeometry that each view vector hit. This can be used to identify\r\nwhich view pathces are intersected by each geometry. If no geometry\r\nis intersected by a given vector, the value will be -1.", "optional": false, "type": "Param_GenericObject"}], "preset_items": [], "availability": "INSTANTIATED", "source": "C:/Program Files/ladybug_tools/grasshopper/ladybug_grasshopper/user_objects\\LB View Factors.ghuser", "id": "LB-071", "group": "幾何與環境分析", "hub_status": "待接入 Hub", "base_guid": "410755b1-224a-4c1e-a407-bf32fb45ea7e", "sha256": "cfc9d755b679dbadce7a7b678c4f9d23a8719bb4ba54a1856812647a29ee833f"}, {"file": "LB View From Sun.ghuser", "name": "LB View From Sun", "nickname": "", "category": "Ladybug", "subcategory": "3 :: Analyze Geometry", "guid": "6da0645b-878c-4cbe-863a-bf57ca6b2598", "description": "Open a new viewport in Rhino that shows the parallel-projected view from the sun.\r\n_\r\nThis is useful for understanding what parts of Rhino geometry are shaded at a\r\nparticular hour of the day.\r\n-", "version": "None", "inputs": [{"name": "_vector", "description": "A sun vector from which the the Rhino view will be generated.\r\nUse the \"LB SunPath\" component to generate sun vectors.", "optional": true, "type": "Param_ScriptVariable"}, {"name": "_center_pt_", "description": "The target point of the camera for the Rhino view that will be\r\ngenerated.  This point should be close to the Rhino geometry that\r\nyou are interested in viewing from the sun. If no point is provided,\r\nthe Rhino origin will be used (0, 0, 0).", "optional": true, "type": "Param_ScriptVariable"}, {"name": "width_", "description": "An optional interger for the width (in pixels) of the Rhino\r\nviewport that will be generated.", "optional": true, "type": "Param_ScriptVariable"}, {"name": "height_", "description": "An optional interger for the height (in pixels) of the Rhino\r\nviewport that will be generated.", "optional": true, "type": "Param_ScriptVariable"}, {"name": "mode_", "description": "An optional text input for the display mode of the Rhino viewport\r\nthat will be generated. For example: Wireframe, Shaded, Rendered, etc.", "optional": true, "type": "Param_ScriptVariable"}], "outputs": [{"name": "out", "description": "The name of the viewport that was opened.", "optional": false, "type": "Param_String"}], "preset_items": [], "availability": "INSTANTIATED", "source": "C:/Program Files/ladybug_tools/grasshopper/ladybug_grasshopper/user_objects\\LB View From Sun.ghuser", "id": "LB-072", "group": "幾何與環境分析", "hub_status": "待接入 Hub", "base_guid": "410755b1-224a-4c1e-a407-bf32fb45ea7e", "sha256": "9c9a650a3e162170d21dc08cf6989235e5fcd659b43d63ceab21bccc9deb8af9"}, {"file": "LB View Percent.ghuser", "name": "LB View Percent", "nickname": "", "category": "Ladybug", "subcategory": "3 :: Analyze Geometry", "guid": "86352834-cd31-4ff2-b382-5edc18099fd9", "description": "Evaluate the percent view to the outdoors or sky from input geometry through context.\r\n_\r\nSuch view calculations can be used to estimate the quality of a view to the\r\noutdoors from a given location on the indoors. They can also be used on\r\nthe outdoors to evaluate the openness of street canyons to the sky, which has\r\nimplications for the pedestrian expereince as well as the rate of radiant heat\r\nloss from urban surfaces and the sky at night.\r\n_\r\nNote that this component uses the CAD environment's ray intersection methods,\r\nwhich can be fast for geometries with low complexity but does not scale well\r\nfor complex geometries or many test points. For such complex studies,\r\nhoneybee-radiance should be used.\r\n-", "version": "None", "inputs": [{"name": "_view_type", "description": "Text or an integer representing the type of view analysis\r\nto conduct.  Choose from the following options.\r\n_\r\n0 - HorizontalRadial - The percentage of the 360 horizontal view\r\nplane that is not blocked by the context geometry.\r\n_\r\n1 - Horizontal30DegreeOffset - The percentage of the 360 horizontal\r\nview band bounded on top and bottom by a 30 degree offset from\r\nthe horizontal plane. 30 degrees corresponds roughly to the\r\nvertical limit of human peripheral vision.\r\n_\r\n2 - Spherical - The percentage of the sphere surrounding each of\r\nthe test points that is not blocked by context geometry. This\r\nis equivalent to a solid angle and gives equal weight to all\r\nportions of the sphere.\r\n_\r\n3 - SkyExposure - The percentage of the sky that is visible from\r\neach of the the test points. This is distinct from SkyView,\r\nwhich is the amount of sky seen by a surface. SkyExposure is\r\nequivalent to a solid angle and gives equal weight to all\r\nportions of the sky.\r\n_\r\n4 - SkyView - The percentage of the sky that is visible from the\r\n_geometry surfaces. This is distinct from SkyExposure, which\r\ntreats each part of the sky with equal weight. SkyView weights\r\nthe portions of the sky according to thier projection into\r\nthe plane of the surface being evaluated. So SkyView for a\r\nhorizontal surface would give more importance to the sky\r\npatches that are overhead vs. those near the horizon.", "optional": true, "type": "Param_ScriptVariable"}, {"name": "_resolution_", "description": "A positive integer for the number of times that the original\r\nview vectors are subdivided. 1 indicates that 145 evenly-spaced\r\nvectors are used to describe a hemisphere, 2 indicates that\r\n577 vectors describe a hemisphere, and each successive value will\r\nroughly quadruple the number of view vectors used. Setting this to\r\na high value will result in a more accurate analysis but will take\r\nlonger to run. (Default: 1).", "optional": true, "type": "Param_ScriptVariable"}, {"name": "_geometry", "description": "Rhino Breps and/or Rhino Meshes for which view analysis\r\nwill be conducted. If Breps are input, they will be subdivided using\r\nthe _grid_size to yeild individual points at which analysis will\r\noccur. If a Mesh is input, view analysis analysis will be\r\nperformed for each face of this mesh instead of subdividing it.", "optional": true, "type": "Param_ScriptVariable"}, {"name": "context_", "description": "Rhino Breps and/or Rhino Meshes representing context geometry\r\nthat can block view from the test _geometry.", "optional": true, "type": "Param_ScriptVariable"}, {"name": "_grid_size", "description": "A positive number in Rhino model units for the size of grid\r\ncells at which the input _geometry will be subdivided for direct sun\r\nanalysis. The smaller the grid size, the higher the resolution of\r\nthe analysis and the longer the calculation will take.  So it is\r\nrecommended that one start with a large value here and decrease\r\nthe value as needed. However, the grid size should usually be\r\nsmaller than the dimensions of the smallest piece of the _geometry\r\nand context_ in order to yield meaningful results.", "optional": true, "type": "Param_ScriptVariable"}, {"name": "_offset_dist_", "description": "A number for the distance to move points from the surfaces\r\nof the input _geometry.  Typically, this should be a small positive\r\nnumber to ensure points are not blocked by the mesh. (Default: 10 cm\r\nin the equivalent Rhino Model units).", "optional": true, "type": "Param_ScriptVariable"}, {"name": "_geo_block_", "description": "Set to \"True\" to count the input _geometry as opaque and\r\nset to \"False\" to discount the _geometry from the calculation and\r\nonly look at context_ that blocks the view.  The default depends on\r\nthe _view_type used.\r\n_\r\nIt is \"True\" for:\r\n* SkyExposure\r\n* SkyView\r\n_\r\nIt is \"False\" for:\r\n* HorizontalRadial\r\n* Horizonta30DegreeOffset\r\n* Spherical", "optional": true, "type": "Param_ScriptVariable"}, {"name": "legend_par_", "description": "Optional legend parameters from the \"LB Legend Parameters\"\r\nthat will be used to customize the display of the results.", "optional": true, "type": "Param_ScriptVariable"}, {"name": "_cpu_count_", "description": "An integer to set the number of CPUs used in the execution of the\r\nintersection calculation. If unspecified, it will automatically default\r\nto one less than the number of CPUs currently available on the\r\nmachine or 1 if only one processor is available.", "optional": true, "type": "Param_ScriptVariable"}, {"name": "_run", "description": "Set to \"True\" to run the component and perform view analysis of\r\nthe input _geometry.", "optional": true, "type": "Param_ScriptVariable"}], "outputs": [{"name": "out", "description": "...", "optional": false, "type": "Param_String"}, {"name": "points", "description": "The grid of points on the test _geometry that are be used to perform\r\nthe view analysis.", "optional": false, "type": "Param_GenericObject"}, {"name": "view_vecs", "description": "A list of vectors which are projected from each of the points\r\nto evaluate view.", "optional": false, "type": "Param_GenericObject"}, {"name": "results", "description": "A list of numbers that aligns with the points. Each number indicates\r\nthe percentage of the view_vecs that are not blocked by context geometry.", "optional": false, "type": "Param_GenericObject"}, {"name": "mesh", "description": "A colored mesh of the test _geometry representing the percentage of\r\nthe input _geometry's view that is not blocked by context.", "optional": false, "type": "Param_GenericObject"}, {"name": "legend", "description": "A legend that correspond to the colors of the mesh and shows the percentage\r\nof the view_vecs that are not blocked by context geometry.", "optional": false, "type": "Param_GenericObject"}, {"name": "title", "description": "A text object for the study title.", "optional": false, "type": "Param_GenericObject"}, {"name": "int_mtx", "description": "A Matrix object that can be connected to the \"LB Deconstruct Matrix\"\r\ncomponent to obtain detailed vector-by-vector results of the study.\r\nEach sub-list (aka. branch of the Data Tree) represents one of the\r\npoints used for analysis. The length of each sub-list matches the\r\nnumber of view_vecs used for the analysis. Each value in the sub-list\r\nis either a \"1\", indicating that the vector is visible for that\r\nvector, or a \"0\", indicating that the vector is not visible for\r\nthat vector.", "optional": false, "type": "Param_GenericObject"}], "preset_items": [], "availability": "INSTANTIATED", "source": "C:/Program Files/ladybug_tools/grasshopper/ladybug_grasshopper/user_objects\\LB View Percent.ghuser", "id": "LB-073", "group": "幾何與環境分析", "hub_status": "待接入 Hub", "base_guid": "410755b1-224a-4c1e-a407-bf32fb45ea7e", "sha256": "63a7570e1cf1dc09e0ae2598c09a9669170e9187db3885c0fd2dc1c5a2f56e9b"}, {"file": "LB View Rose.ghuser", "name": "LB View Rose", "nickname": "", "category": "Ladybug", "subcategory": "3 :: Analyze Geometry", "guid": "8aa5e6dc-e680-4870-aea9-15b7503380c8", "description": "Visualize the view openness around a given point as a colored mesh that fills a\r\ncircle, sphere, or hemisphere (depending on the specified view type).\r\n_\r\nThe input context will block the view, resulting in a decresed view rose size\r\nand a change in the view rose color.\r\n-", "version": "None", "inputs": [{"name": "_context", "description": "Rhino Breps or Meshes representing context geometry that can block\r\nthe view around the center point.", "optional": true, "type": "Param_ScriptVariable"}, {"name": "_center_pt", "description": "A point for the center of the view rose from which view openness\r\nwill be evaluated.", "optional": true, "type": "Param_ScriptVariable"}, {"name": "_radius_", "description": "A number for the radius of the view rose in Rhino model units. This is\r\nalso used to evaluate the distance at which context is no longer\r\nable to block the view from the center point. This value should\r\ntypically be increased if the view rose does not extend past the\r\n_context geometry. (Default: 100 meters in the current Rhino model\r\nunits system).", "optional": true, "type": "Param_ScriptVariable"}, {"name": "_view_type_", "description": "Text or an integer representing the type of view analysis to conduct.\r\nChoose from the following options. (Default: 0 - HorizontalRadial)\r\n_\r\n0 - HorizontalRadial - The percentage of the 360 horizontal view\r\nplane that is not blocked by the context geometry.\r\n_\r\n1 - Horizontal30DegreeOffset - The percentage of the 360 horizontal\r\nview band bounded on top and bottom by a 30 degree offset from\r\nthe horizontal plane. 30 degrees corresponds roughly to the\r\nvertical limit of human peripheral vision.\r\n_\r\n2 - Spherical - The percentage of the sphere surrounding each of\r\nthe test points that is not blocked by context geometry. This\r\nis equivalent to a solid angle and gives equal weight to all\r\nportions of the sphere.\r\n_\r\n3 - SkyExposure - The percentage of the sky that is visible from\r\neach of the the test points.", "optional": true, "type": "Param_ScriptVariable"}, {"name": "_resolution_", "description": "A positive integer for the number of times that the original\r\nview vectors are subdivided. For a circle, 1 indicates that 72\r\nevenly-spaced vectors are used to describe a circle, 2 indicates\r\nthat 144 vectors describe a circle, and each successive value will\r\nroughly double the number of view vectors used. For a dome, 1 indicates\r\nthat 1225 are used to describe the dome, 2 indicates that 5040\r\nview vectors describe the some and each successive value will\r\nroughly quadruple the number of view vectors used. Setting this to\r\na high value will result in a more accurate analysis but will take\r\nlonger to run. (Default: 1).", "optional": true, "type": "Param_ScriptVariable"}, {"name": "legend_par_", "description": "Optional legend parameters from the \"LB Legend Parameters\"\r\nthat will be used to customize the display of the results.", "optional": true, "type": "Param_ScriptVariable"}], "outputs": [{"name": "out", "description": "...", "optional": false, "type": "Param_String"}, {"name": "view_vecs", "description": "A list of vectors which are projected from each of the points\r\nto evaluate view.", "optional": false, "type": "Param_GenericObject"}, {"name": "results", "description": "A list of numbers that aligns with the vertices of the mesh. Each number\r\nindicates the distance from the _center_pt at which the view is\r\nblocked from a particular direction.", "optional": false, "type": "Param_GenericObject"}, {"name": "mesh", "description": "A colored mesh representing the visible area from the viewpoint past\r\nthe _context geometry. Colors indicate how open the view is from a\r\ngiven direction.", "optional": false, "type": "Param_GenericObject"}, {"name": "legend", "description": "A legend that correspond to the colors of the mesh and shows the distance\r\nat which vectors are blocked.", "optional": false, "type": "Param_GenericObject"}], "preset_items": [], "availability": "INSTANTIATED", "source": "C:/Program Files/ladybug_tools/grasshopper/ladybug_grasshopper/user_objects\\LB View Rose.ghuser", "id": "LB-074", "group": "幾何與環境分析", "hub_status": "待接入 Hub", "base_guid": "410755b1-224a-4c1e-a407-bf32fb45ea7e", "sha256": "310ef4499a41cafe941d2101366f465d17ba56bf709eca90a58c89f5fbb708f0"}, {"file": "LB Visibility Percent.ghuser", "name": "LB Visibility Percent", "nickname": "", "category": "Ladybug", "subcategory": "3 :: Analyze Geometry", "guid": "46cfab12-46f6-4521-952f-aa4793feb318", "description": "Evaluate the percent visibility from geometry to a specific set of points.\r\n_\r\nSuch visibility calculations can be used to understand the portions of a building\r\nfacade that can see a skyline or landmark when used on the outdoors. When used\r\non the indoors, they can evaluate the spectator view of a stage, screen, or other\r\npoint of interest.\r\n-", "version": "None", "inputs": [{"name": "_view_points", "description": "A list of points that characterize an area of interest to which\r\nvisibility is being evaluated. If the area of interest is more like\r\na surface than an individual point, the \"LB Generate Point Grid\"\r\ncomponent can be used to obtain a list of points that are evenly\r\ndistributed over the surface.", "optional": true, "type": "Param_ScriptVariable"}, {"name": "pt_weights_", "description": "An optional list of numbers that align with the _view_points\r\nand represent weights of importance for each point.  Weighted\r\nvalues should be between 0 and 1 and should be closer to 1 if a\r\ncertain point is more important. The default value for all points\r\nis 0, which means they all have an equal importance.", "optional": true, "type": "Param_ScriptVariable"}, {"name": "_geometry", "description": "Rhino Breps and/or Rhino Meshes for which visibility analysis\r\nwill be conducted. If Breps are input, they will be subdivided using\r\nthe _grid_size to yeild individual points at which analysis will\r\noccur. If a Mesh is input, visibility analysis analysis will be\r\nperformed for each face of this mesh instead of subdividing it.", "optional": true, "type": "Param_ScriptVariable"}, {"name": "context_", "description": "Rhino Breps and/or Rhino Meshes representing context geometry\r\nthat can block visibility from the test _geometry.", "optional": true, "type": "Param_ScriptVariable"}, {"name": "_grid_size", "description": "A positive number in Rhino model units for the size of grid\r\ncells at which the input _geometry will be subdivided for direct sun\r\nanalysis. The smaller the grid size, the higher the resolution of\r\nthe analysis and the longer the calculation will take.  So it is\r\nrecommended that one start with a large value here and decrease\r\nthe value as needed. However, the grid size should usually be\r\nsmaller than the dimensions of the smallest piece of the _geometry\r\nand context_ in order to yield meaningful results.", "optional": true, "type": "Param_ScriptVariable"}, {"name": "_offset_dist_", "description": "A number for the distance to move points from the surfaces\r\nof the input _geometry.  Typically, this should be a small positive\r\nnumber to ensure points are not blocked by the mesh. (Default: 10 cm\r\nin the equivalent Rhino Model units).", "optional": true, "type": "Param_ScriptVariable"}, {"name": "max_dist_", "description": "An optional number to set the maximum distance beyond which the\r\nend_points are no longer considered visible by the start_points.\r\nIf None, points with an unobstructed view to one another will be\r\nconsidered visible no matter how far they are from one another.", "optional": true, "type": "Param_ScriptVariable"}, {"name": "_geo_block_", "description": "Set to \"True\" to count the input _geometry as opaque and\r\nset to \"False\" to discount the _geometry from the calculation and\r\nonly look at context_ that blocks the visibility. (Default: True)", "optional": true, "type": "Param_ScriptVariable"}, {"name": "legend_par_", "description": "Optional legend parameters from the \"LB Legend Parameters\"\r\nthat will be used to customize the display of the results.", "optional": true, "type": "Param_ScriptVariable"}, {"name": "_cpu_count_", "description": "An integer to set the number of CPUs used in the execution of the\r\nintersection calculation. If unspecified, it will automatically default\r\nto one less than the number of CPUs currently available on the\r\nmachine or 1 if only one processor is available.", "optional": true, "type": "Param_ScriptVariable"}, {"name": "_run", "description": "Set to \"True\" to run the component and perform visibility analysis of\r\nthe input _geometry.", "optional": true, "type": "Param_ScriptVariable"}], "outputs": [{"name": "out", "description": "...", "optional": false, "type": "Param_String"}, {"name": "points", "description": "The grid of points on the test _geometry that are be used to perform\r\nthe visibility analysis.", "optional": false, "type": "Param_GenericObject"}, {"name": "results", "description": "A list of numbers that aligns with the points. Each number indicates\r\nthe percentage of the _view_points that are not blocked by context geometry.", "optional": false, "type": "Param_GenericObject"}, {"name": "mesh", "description": "A colored mesh of the test _geometry representing the percentage of\r\nthe input _geometry's visibility that is not blocked by context.", "optional": false, "type": "Param_GenericObject"}, {"name": "legend", "description": "A legend showing the number of hours that correspond to the colors\r\nof the mesh.", "optional": false, "type": "Param_GenericObject"}, {"name": "title", "description": "A text object for the study title.", "optional": false, "type": "Param_GenericObject"}, {"name": "int_mtx", "description": "A Matrix object that can be connected to the \"LB Deconstruct Matrix\"\r\ncomponent to obtain detailed point-by-point results of the study.\r\nEach sub-list (aka. branch of the Data Tree) represents one of the\r\ngeometry points used for analysis. The length of each sub-list matches\r\nthe number of _view_points used for the analysis. Each value in the\r\nsub-list is either a \"1\", indicating that the vector is visible\r\nfor that vector, or a \"0\", indicating that the vector is not visible\r\nfor that vector.", "optional": false, "type": "Param_GenericObject"}], "preset_items": [], "availability": "INSTANTIATED", "source": "C:/Program Files/ladybug_tools/grasshopper/ladybug_grasshopper/user_objects\\LB Visibility Percent.ghuser", "id": "LB-075", "group": "幾何與環境分析", "hub_status": "待接入 Hub", "base_guid": "410755b1-224a-4c1e-a407-bf32fb45ea7e", "sha256": "e694ddd711e7a7a7140487dc8310b8be5e86c403f569a3ca4870aba582bfcf15"}, {"file": "LB Activities Met List.ghuser", "name": "LB Activities Met List", "nickname": "", "category": "Ladybug", "subcategory": "4 :: Extra", "guid": "e856323e-a6a9-4f8b-b652-6172c5036224", "description": "Provides a list of available activites and outputs the metabolic rate of that activity for use in the Ladybug PMV comfort calculator.", "version": "Preset value list", "inputs": [], "outputs": [{"name": "Selection", "description": "Preset value list", "optional": false, "type": "ValueList"}], "preset_items": [{"name": "Sleeping", "expression": "0.7"}, {"name": "Reclining", "expression": "0.8"}, {"name": "Sitting", "expression": "1.0"}, {"name": "Typing", "expression": "1.1"}, {"name": "Standing", "expression": "1.2"}, {"name": "Driving", "expression": "1.5"}, {"name": "Cooking", "expression": "1.8"}, {"name": "House Cleaning", "expression": "2.7"}, {"name": "Strolling", "expression": "1.7"}, {"name": "Walking 2mph", "expression": "2.0"}, {"name": "Walking 3mph", "expression": "2.6"}, {"name": "Walking 4mph", "expression": "3.8"}, {"name": "Running 9mph", "expression": "9.5"}, {"name": "Lifting 10lbs", "expression": "2.1"}, {"name": "Lifting 100lbs", "expression": "4.0"}, {"name": "Shoveling", "expression": "4.4"}, {"name": "Dancing", "expression": "3.4"}, {"name": "Basketball", "expression": "6.3"}], "availability": "INSTANTIATED", "source": "C:/Program Files/ladybug_tools/grasshopper/ladybug_grasshopper/user_objects\\LB Activities Met List.ghuser", "id": "LB-076", "group": "輔助工具與預設選單", "hub_status": "待接入 Hub", "base_guid": "00027467-0d24-4fa7-b178-8dc0ac5f42ec", "sha256": "1faebe449c0f8fede2877a84bf1bf0d8dc7ff537ee8b9bf52ac5728cc70e807f"}, {"file": "LB Adaptive Comfort Parameters.ghuser", "name": "LB Adaptive Comfort Parameters", "nickname": "", "category": "Ladybug", "subcategory": "4 :: Extra", "guid": "97c5be8b-fd39-4a0e-b4d9-a573ba54a517", "description": "Create a set of parameters that define the acceptable conditions of the\r\nAdaptive thermal comfort model.\r\n-\r\nThese parameters can be plugged into any of the components that compute\r\nAdaptive thermal comfort.\r\n-", "version": "None", "inputs": [{"name": "_ashrae_or_en_", "description": "A boolean to note whether to use the ASHRAE-55 neutral\r\ntemperature function (True) or the european neutral function (False),\r\nwhich is consistent with EN-16798 (and the older EN-15251).\r\nPreference is given to EN-16798 in places where EN-16798 and\r\nEN-15251 differ (eg. the 1C lower cold threshold in EN-16798).\r\nNote that this input will also determine default values for\r\nmany of the other properties of this object.", "optional": true, "type": "Param_ScriptVariable"}, {"name": "_neutral_offset_", "description": "The number of degrees Celcius from the neutral temperature\r\nwhere the input operative temperature is considered acceptable.\r\nThe default is 2.5C when the neutral temperature function is ASHRAE-55\r\n(consistent with 90% PPD) and 3C when the neutral temperature\r\nfunction is EN-16798 (consistent with comfort class II). Note that,\r\nwhen the neutral temperature function is EN-16798, one degree\r\nCelsius is automatically added to the offset value input here to\r\nget the lower temperature threshold. This accounts for the fact that\r\nEN-16798 does not interpret the neutral offset symmetically.\r\n_\r\nFor ASHRAE-55, the following neutral offsets apply.\r\n* 90 PPD - 2.5C\r\n* 80 PPD - 3.5C\r\n_\r\nFor the EN standard, the following neutral offsets apply.\r\n* Class I - 2C\r\n* Class II - 3C\r\n* Class III - 4C", "optional": true, "type": "Param_ScriptVariable"}, {"name": "_avgm_or_runmean_", "description": "A boolean to note whether the prevailing outdoor\r\ntemperature is computed from the average monthly temperature (True) or\r\na weighted running mean of the last week (False).  The default is True\r\nwhen the neutral temperature function is ASHRAE-55 and False when the\r\nneutral temperature function is EN.", "optional": true, "type": "Param_ScriptVariable"}, {"name": "_discr_or_cont_vel_", "description": "A boolean to note whether discrete categories should be\r\nused to assess the effect of elevated air speed (True) or whether\r\na continuous function should be used (False). Note that continuous\r\nair speeds were only used in the older EN-15251 standard and are\r\nnot a part of the more recent EN-16798 standard.\r\nWhen unassigned, this will be True for discrete air speeds.", "optional": true, "type": "Param_ScriptVariable"}, {"name": "_cold_prevail_limit_", "description": "A number indicating the prevailing outdoor temperature\r\nbelow which acceptable indoor operative temperatures flat line.\r\nThe default is 10C, which is consistent with both ASHRAE-55 and\r\nEN-16798. However, 15C was used for the older EN-15251 standard.\r\nThis number cannot be greater than 22C and cannot be less than 10C.", "optional": true, "type": "Param_ScriptVariable"}, {"name": "_conditioning_", "description": "A number between 0 and 1 that represents how \"conditioned\"\r\nvs. \"free-running\" the building is.\r\n0 = free-running (completely passive with no air conditioning)\r\n1 = conditioned (no operable windows and fully air conditioned)\r\nThe default is 0 since both the ASHRAE-55 and the EN standards prohibit\r\nthe use of adaptive comfort methods when a heating/cooling system is active.\r\nWhen set to a non-zero number, a neutral temperature function for\r\nheated/cooled operation derived from the SCATs database will be used.\r\nFor more information on how adaptive comfort methods can be applied to\r\nconditioned buildings, see the neutral_temperature_conditioned function\r\nin the ladybug_comfort documentation.", "optional": true, "type": "Param_ScriptVariable"}], "outputs": [{"name": "adapt_par", "description": "An Adaptive comfort parameter object that can be plugged into\r\nany of the components that compute Adaptive thermal comfort.", "optional": false, "type": "Param_GenericObject"}], "preset_items": [], "availability": "INSTANTIATED", "source": "C:/Program Files/ladybug_tools/grasshopper/ladybug_grasshopper/user_objects\\LB Adaptive Comfort Parameters.ghuser", "id": "LB-077", "group": "輔助工具與預設選單", "hub_status": "待接入 Hub", "base_guid": "410755b1-224a-4c1e-a407-bf32fb45ea7e", "sha256": "0c6169a9a469dcff16b28be9966d9addaf7bc2c2c1e3a10a1c699c8d296782ca"}, {"file": "LB Area Aggregate.ghuser", "name": "LB Area Aggregate", "nickname": "", "category": "Ladybug", "subcategory": "4 :: Extra", "guid": "423a2e36-ff71-4670-89e3-4cad630ac822", "description": "Get a Data Collection that is aggregated by an area value.\r\n_\r\nNote that this component will raise a ValueError if the data type in the header\r\nof the data collection is not normalizable to yeild a useful type.\r\n-", "version": "None", "inputs": [{"name": "_data", "description": "A Data Collection to be aggregated by the input _area.", "optional": true, "type": "Param_ScriptVariable"}, {"name": "_area", "description": "A number representing area by which all of the data is aggregated.", "optional": true, "type": "Param_ScriptVariable"}, {"name": "_unit_", "description": "Text for the units that the area value is in. Acceptable inputs include\r\n'm2', 'ft2' and any other unit that is supported. (Default: m2).", "optional": true, "type": "Param_ScriptVariable"}], "outputs": [{"name": "data", "description": "A Ladybug data collection object aggregated by the input area", "optional": false, "type": "Param_GenericObject"}], "preset_items": [], "availability": "INSTANTIATED", "source": "C:/Program Files/ladybug_tools/grasshopper/ladybug_grasshopper/user_objects\\LB Area Aggregate.ghuser", "id": "LB-078", "group": "輔助工具與預設選單", "hub_status": "待接入 Hub", "base_guid": "410755b1-224a-4c1e-a407-bf32fb45ea7e", "sha256": "5eea043b5a94da20e91aa5808782a5976fc6624876b155369f3152e7ac3d6588"}, {"file": "LB Area Normalize.ghuser", "name": "LB Area Normalize", "nickname": "", "category": "Ladybug", "subcategory": "4 :: Extra", "guid": "8b177d16-01eb-49a4-b40d-6283825c9608", "description": "Get a Data Collection that is normalized by an area value.\r\n_\r\nNote that this component will raise a ValueError if the data type in the header\r\nof the data collection is not normalizable to yeild a useful type. Also note\r\nthat a ZeroDivisionError will be raised if the input area is equal to 0.\r\n-", "version": "None", "inputs": [{"name": "_data", "description": "A Data Collection to be normalized by the input _area.", "optional": true, "type": "Param_ScriptVariable"}, {"name": "_area", "description": "A number representing area by which all of the data is normalized.", "optional": true, "type": "Param_ScriptVariable"}, {"name": "_unit_", "description": "Text for the units that the area value is in. Acceptable inputs include\r\n'm2', 'ft2' and any other unit that is supported. (Default: m2).", "optional": true, "type": "Param_ScriptVariable"}], "outputs": [{"name": "data", "description": "A Ladybug data collection object derived that is normalized by the\r\ninput area.", "optional": false, "type": "Param_GenericObject"}], "preset_items": [], "availability": "INSTANTIATED", "source": "C:/Program Files/ladybug_tools/grasshopper/ladybug_grasshopper/user_objects\\LB Area Normalize.ghuser", "id": "LB-079", "group": "輔助工具與預設選單", "hub_status": "待接入 Hub", "base_guid": "410755b1-224a-4c1e-a407-bf32fb45ea7e", "sha256": "62bf9855344f477786b077a501bfbbfd6aba133d124b246ede34e9c86f663ff4"}, {"file": "LB Capture View.ghuser", "name": "LB Capture View", "nickname": "", "category": "Ladybug", "subcategory": "4 :: Extra", "guid": "7d65a68b-9d93-4f59-aa38-829c7b33751d", "description": "Capture views of the Rhino scene and save them to your hard drive as as a .png files.\r\n_\r\nThis is particularly useful when creating animations and one needs to automate\r\nthe capturing of views. Note that images will likely have a Rhino world axes icon\r\nin the lower left of the image unless you go to Options > Grid > and uncheck\r\n\"Show world axes icon\".\r\n-", "version": "None", "inputs": [{"name": "_file_name", "description": "The file name, which the image will be saved as. Note that, for\r\nanimations, each saved image should have a different name. Otherwise,\r\nthe previous image will be overwritten by each successive image.\r\nUnique names for each animation frame can be achieved by using the\r\nanimating slider to generate the file name.", "optional": true, "type": "Param_ScriptVariable"}, {"name": "_folder_", "description": "The folder into which the image file will be written. This should\r\nbe a complete path to the folder. If None, the images will be written\r\nto one of the following default locations:\r\n-\r\nWindows - C:/Users/[USERNAME]/ladybug_tools/resources/captured_views/\r\nMac - /Users/[USERNAME]/ladybug_tools/resources/captured_views/", "optional": true, "type": "Param_ScriptVariable"}, {"name": "viewport_", "description": "Text for the Rhino viewport name which will be captured. This can\r\nalso be a list of viewports in which case multiple views will be\r\ncaptured. If None, the default will be the active viewport (the\r\nlast viewport in which you navigated). Acceptable inputs include:\r\n-\r\nPerspective\r\nTop\r\nBottom\r\nLeft\r\nRight\r\nFront\r\nBack\r\nany view name that has been saved within the Rhino file", "optional": true, "type": "Param_ScriptVariable"}, {"name": "width_", "description": "Integer for the width of the image to be captured in pixels. If None,\r\nthe default is the width of the Rhino viewport currently on the screen.", "optional": true, "type": "Param_ScriptVariable"}, {"name": "height_", "description": "Integer for the height of the image to be captured in pixels. If None,\r\nthe default is the height of the Rhino viewport currently on the screen.", "optional": true, "type": "Param_ScriptVariable"}, {"name": "mode_", "description": "Text for the display mode of the viewport to be captured.If None, the default\r\nwill be the display mode of the active viewport (the last viewport in\r\nwhich you navigated). Acceptable inputs include:\r\n-\r\nWireframe\r\nShaded\r\nRendered\r\nGhosted\r\nX-Ray\r\nTechnical\r\nArtistic\r\nPen", "optional": true, "type": "Param_ScriptVariable"}, {"name": "transparent_", "description": "Boolean to note whether the captured .png file should have a\r\ntransparent background. If None or False, the image will have the\r\nRhino viewport background color.", "optional": true, "type": "Param_ScriptVariable"}, {"name": "_capture", "description": "Set to \"True\" to capture the image of the Rhino viewport.", "optional": true, "type": "Param_ScriptVariable"}], "outputs": [{"name": "Output", "description": "The file path of the image taken with this component.", "optional": false, "type": "Param_String"}], "preset_items": [], "availability": "INSTANTIATED", "source": "C:/Program Files/ladybug_tools/grasshopper/ladybug_grasshopper/user_objects\\LB Capture View.ghuser", "id": "LB-080", "group": "輔助工具與預設選單", "hub_status": "待接入 Hub", "base_guid": "410755b1-224a-4c1e-a407-bf32fb45ea7e", "sha256": "b541a5430c5255a01789e1e297d0ab795e0b28beef6dc4f959117aeb497d9ba3"}, {"file": "LB Clothing List.ghuser", "name": "LB Clothing List", "nickname": "", "category": "Ladybug", "subcategory": "4 :: Extra", "guid": "f0fb763e-53fe-4665-abe0-b757d931de51", "description": "Provides a list of clothing values based on selected apparel.\r\n\r\nPlug the output into a native Grasshopper Mass Addition component to get the total clothing level of the clothing ensemble.", "version": "Preset value list", "inputs": [], "outputs": [{"name": "Selection", "description": "Preset value list", "optional": false, "type": "ValueList"}], "preset_items": [{"name": "Underwear", "expression": "0.04"}, {"name": "Socks or panty hose", "expression": "0.02"}, {"name": "Knee socks", "expression": "0.06"}, {"name": "Shoes or sandals", "expression": "0.02"}, {"name": "Boots", "expression": "0.1"}, {"name": "T-shirt", "expression": "0.08"}, {"name": "Short-sleeve dress shirt", "expression": "0.19"}, {"name": "Long-sleeve dress shirt", "expression": "0.25"}, {"name": "Sleeveless blouse", "expression": "0.12"}, {"name": "Walking shorts", "expression": "0.08"}, {"name": "Trousers", "expression": "0.2"}, {"name": "Overalls", "expression": "0.3"}, {"name": "Coveralls", "expression": "0.49"}, {"name": "Sweatpants", "expression": "0.28"}, {"name": "Skirt", "expression": "0.18"}, {"name": "Shirtdress", "expression": "0.37"}, {"name": "Vest", "expression": "0.17"}, {"name": "Coat/Jacket/Blazer", "expression": "0.4"}], "availability": "INSTANTIATED", "source": "C:/Program Files/ladybug_tools/grasshopper/ladybug_grasshopper/user_objects\\LB Clothing List.ghuser", "id": "LB-081", "group": "輔助工具與預設選單", "hub_status": "待接入 Hub", "base_guid": "00027467-0d24-4fa7-b178-8dc0ac5f42ec", "sha256": "e5a4cc01963f8b2c5e4cd8bad015f8cf4ea2a480d53d3e14c4a365fc11954f0a"}, {"file": "LB Color Range.ghuser", "name": "LB Color Range", "nickname": "", "category": "Ladybug", "subcategory": "4 :: Extra", "guid": "59e01e6b-cd3d-4758-b1e2-3fcefda6a3bc", "description": "Use this component to access a library of typical gradients useful throughout Ladybug. \r\nThe output from this component should be plugged into the colors_ input of the\r\n\"Legend Parameters\" component.\r\n-\r\nNote that the colorblind friendly schemes have prioritized readability for red-green\r\ncolorblindness (deuteranomaly, protanomaly, protanopia, and deuteranopia), which\r\nis by far more common than blue-yellow colorblindness. However, they are not\r\nnecessarily ideal for all types of color blindness, though they are monotonic\r\nand perceptually uniform to all forms of color vision. This means that they should\r\nbe readable as a dark-to-light scale by anyone.\r\n-\r\nFor an image of each of the gardients in the library, check here:\r\nhttps://github.com/ladybug-tools/lbt-grasshopper/blob/master/gradients.png\r\n-", "version": "None", "inputs": [{"name": "_index_", "description": "An index refering to one of the following possible gradients:\r\n0 - Original Ladybug\r\n1 - Nuanced Ladybug\r\n2 - Multi-colored Ladybug\r\n3 - Ecotect\r\n4 - View Study\r\n5 - Shadow Study\r\n6 - Glare Study\r\n7 - Annual Comfort\r\n8 - Thermal Comfort\r\n9 - Peak Load Balance\r\n10 - Heat Sensation\r\n11 - Cold Sensation\r\n12 - Benefit/Harm\r\n13 - Harm\r\n14 - Benefit\r\n15 - Shade Benefit/Harm\r\n16 - Shade Harm\r\n17 - Shade Benefit\r\n18 - Energy Balance\r\n19 - Energy Balance w/ Storage\r\n20 - THERM\r\n21 - Cloud Cover\r\n22 - Black to White\r\n23 - Blue, Green, Red\r\n24 - Multicolored 2\r\n25 - Multicolored 3\r\n26 - OpenStudio Palette\r\n27 - Cividis (colorblind friendly)\r\n28 - Viridis (colorblind friendly)\r\n29 - Parula (colorblind friendly)", "optional": true, "type": "Param_ScriptVariable"}, {"name": "opacity_", "description": "An optional number between zero (fully transparent) and one\r\n(fully opaque) for the opacity of colors in the color\r\nrange. (Default: 1).", "optional": true, "type": "Param_ScriptVariable"}], "outputs": [{"name": "colors", "description": "A series of colors to be plugged into the \"LB Legend Parameters\"\r\ncomponent.", "optional": false, "type": "Param_GenericObject"}], "preset_items": [], "availability": "INSTANTIATED", "source": "C:/Program Files/ladybug_tools/grasshopper/ladybug_grasshopper/user_objects\\LB Color Range.ghuser", "id": "LB-082", "group": "輔助工具與預設選單", "hub_status": "待接入 Hub", "base_guid": "410755b1-224a-4c1e-a407-bf32fb45ea7e", "sha256": "443aa2f85da59fcfecbff9d1fb457afbc0311017f64e910f9336ece763ff7c0e"}, {"file": "LB Compass.ghuser", "name": "LB Compass", "nickname": "", "category": "Ladybug", "subcategory": "4 :: Extra", "guid": "36c30d14-32a8-42a0-837a-668c2e95e35b", "description": "Create a compass sign that indicates the direction of North in the Rhino scene.\r\n-", "version": "None", "inputs": [{"name": "_north_", "description": "A number between -360 and 360 for the counterclockwise difference\r\nbetween the North and the positive Y-axis in degrees. Counterclockwise\r\nmeans \"90 is West and 270 is East\". This can also be Vector for the\r\ndirection to North. (Default: 0)", "optional": true, "type": "Param_ScriptVariable"}, {"name": "_center_", "description": "A point for the center position of the compass in the Rhino\r\nscene. (Default: (0, 0, 0) aka. the Rhino scene origin).", "optional": true, "type": "Param_ScriptVariable"}, {"name": "_scale_", "description": "A number to set the scale of the compass. The default is 1,\r\nwhich corresponds to a radius of 10 meters in the current Rhino\r\nmodel's unit system.", "optional": true, "type": "Param_ScriptVariable"}], "outputs": [{"name": "compass", "description": "A set of circles, lines and text objects that mark the cardinal\r\ndirections in the Rhino scene.", "optional": false, "type": "Param_GenericObject"}], "preset_items": [], "availability": "INSTANTIATED", "source": "C:/Program Files/ladybug_tools/grasshopper/ladybug_grasshopper/user_objects\\LB Compass.ghuser", "id": "LB-083", "group": "輔助工具與預設選單", "hub_status": "待接入 Hub", "base_guid": "410755b1-224a-4c1e-a407-bf32fb45ea7e", "sha256": "54aa7b25ceb81eeee6aea7693cae8803dd6101a8f7ad65e8421d76fce0d4175a"}, {"file": "LB Construct Matrix.ghuser", "name": "LB Construct Matrix", "nickname": "", "category": "Ladybug", "subcategory": "4 :: Extra", "guid": "668bf6ea-63bd-424d-b472-3a00bb6855cf", "description": "Construct a Ladybug Matrix object from a Grasshopper Data Tree of values.\r\n-", "version": "None", "inputs": [{"name": "_values", "description": "A Grasshopper Data Tree of values to be merged into a matrix object.", "optional": true, "type": "Param_ScriptVariable"}], "outputs": [{"name": "matrix", "description": "A Ladybug Matrix object encapsulating all of the input values.", "optional": false, "type": "Param_GenericObject"}], "preset_items": [], "availability": "INSTANTIATED", "source": "C:/Program Files/ladybug_tools/grasshopper/ladybug_grasshopper/user_objects\\LB Construct Matrix.ghuser", "id": "LB-084", "group": "輔助工具與預設選單", "hub_status": "待接入 Hub", "base_guid": "410755b1-224a-4c1e-a407-bf32fb45ea7e", "sha256": "8e4eb1f888de05b6013d79cdcefc6cb09df0319e587373f3587ce48b6b3c3b42"}, {"file": "LB Contour Mesh.ghuser", "name": "LB Contour Mesh", "nickname": "", "category": "Ladybug", "subcategory": "4 :: Extra", "guid": "e5052095-b8e7-47ec-a82b-5445921dfa08", "description": "Create a contoured visualization of any mesh and corresponding numerical dataset.\r\n_\r\nThis component works similar in principle to the \"LB Mesh Threshold Selector\"\r\nexcept that it is intended to produce multiple contours (instead of one\r\ncontour defined by a single threshold).\r\n_\r\nIt includes options for lableing each contour with its threshold value and\r\nsmoothing the contours for a more appealing visualization.\r\n_\r\nIf the output of this component is not as smooth or visually appealing as expected,\r\nthis is often because there are not enough faces in the input mesh to draw a\r\nclear set of contours. Therefore lowering the mesh grid size used for the study\r\nor increasing the smoothness of mesh parameters will often yeild a better contour\r\nresult. Alternatively, connecting \"LB Legend Parameters\" with a lower seg_count_\r\ncan produce fewer contours, which may provide the algorithm with enough data to\r\ndraw the contours cleanly.\r\n-", "version": "None", "inputs": [{"name": "_values", "description": "A list of numbers that correspond to either the number of faces\r\nor vertices of the _mesh.", "optional": true, "type": "Param_ScriptVariable"}, {"name": "_mesh", "description": "A Mesh for which contours will be derived.", "optional": true, "type": "Param_ScriptVariable"}, {"name": "legend_par_", "description": "Ladybug LegendParameters to be used to customize the min/max and\r\nquantity of contours to draw. These can also be used to customize\r\nthe decimal count of the contours. If None, default legend parameters\r\nare used. (DefaultL None).", "optional": true, "type": "Param_ScriptVariable"}, {"name": "legend_title_", "description": "A text string for Legend title. Typically, the units\r\nof the data are used here but the type of data might also be used.\r\nDefault is an empty string.", "optional": true, "type": "Param_ScriptVariable"}, {"name": "global_title_", "description": "A text string to label the entire mesh.  It will be\r\ndisplayed in the lower left of the result mesh. Default is for no\r\ntitle.", "optional": true, "type": "Param_ScriptVariable"}, {"name": "_smooth_iter_", "description": "The number of times that the contours will be smoothed.\r\nSmoothing can make the contours more visually appealing but excessive\r\nsmoothing can cause contours to be far from the real threshold\r\nin the mesh. Set to zero to not perform any smoothing. (Default: 0).", "optional": true, "type": "Param_ScriptVariable"}, {"name": "label_text_hgt_", "description": "An optional number to set the size of the contour text labeld\r\nin model units. Set to zero to completely remove labels from the\r\nresulting output. Default is set to a fraction of the average\r\ncontour length.", "optional": true, "type": "Param_ScriptVariable"}], "outputs": [{"name": "out", "description": "Reports, errors, warnings, etc.", "optional": false, "type": "Param_String"}, {"name": "contours", "description": "A data tree (aka. list of lists) where each sub-list represents\r\ncontours associated with a specific threshold. Contours are\r\ncomposed of Rhino Polyline and Line objects.", "optional": false, "type": "Param_GenericObject"}, {"name": "labels", "description": "A data tree of of text objects that denote the numerical value associated\r\nwith each contour. The sub-lists of this data tree match the contours.", "optional": false, "type": "Param_GenericObject"}, {"name": "mesh", "description": "The input _mesh that has been colored with results.", "optional": false, "type": "Param_GenericObject"}, {"name": "legend", "description": "Geometry representing the legend for the mesh.", "optional": false, "type": "Param_GenericObject"}, {"name": "title", "description": "A text object for the global_title.", "optional": false, "type": "Param_GenericObject"}, {"name": "vis_set", "description": "A VisualizationSet object for drawing a detailed version of the\r\nheatmap in the Rhino scene. This can be connected to\r\nthe \"LB Preview Visualization Set\" component to display this\r\nversion of the heatmap in Rhino.", "optional": false, "type": "Param_GenericObject"}], "preset_items": [], "availability": "INSTANTIATED", "source": "C:/Program Files/ladybug_tools/grasshopper/ladybug_grasshopper/user_objects\\LB Contour Mesh.ghuser", "id": "LB-085", "group": "輔助工具與預設選單", "hub_status": "待接入 Hub", "base_guid": "410755b1-224a-4c1e-a407-bf32fb45ea7e", "sha256": "2148b0e133674933e70ff2b72ad41e72fbb10068e4c3327a65995691c49f91f0"}, {"file": "LB Create Legend.ghuser", "name": "LB Create Legend", "nickname": "", "category": "Ladybug", "subcategory": "4 :: Extra", "guid": "b38cbcf0-1718-41b8-beed-0e4fdf9a8766", "description": "Create a custom legend for any set of data or range. Creating a legend with this\r\ncomponent allows for a bit more flexibility than what can be achieved by working\r\nwith the legends automatically output from different studies.\r\n-", "version": "None", "inputs": [{"name": "_values", "description": "A list of numerical values or data collections that the legend refers\r\nto. This can also be the minimum and maximum numerical values of the\r\ndata. The legend's maximum and minimum values will be set by the max\r\nand min of the data set.", "optional": true, "type": "Param_ScriptVariable"}, {"name": "_base_plane_", "description": "An optional plane or point to set the location of the\r\nlegend. (Default: Rhino origin - (0, 0, 0))", "optional": true, "type": "Param_ScriptVariable"}, {"name": "title_", "description": "A text string representing a legend title. Legends are usually\r\ntitled with the units of the data.", "optional": true, "type": "Param_ScriptVariable"}, {"name": "legend_par_", "description": "Optional legend parameters from the \"LB Legend Parameters\" component.", "optional": true, "type": "Param_ScriptVariable"}, {"name": "leg_par2d_", "description": "Optional 2D LegendParameters from the \"LB Legend Parameters 2D\"\r\ncomponent, which will be used to customize a legend in the plane\r\nof the screen so that it functions like a head-up display (HUD).\r\nIf unspecified, the VisualizationSet will be rendered with 3D\r\nlegends in the Rhino scene much like the other native Ladybug\r\nTools components.", "optional": true, "type": "Param_ScriptVariable"}, {"name": "viewport_", "description": "Text for the name of the Rhino viewport to which the 2D legend will\r\nbe rendered. This input only has an effect when leg_par2d_ are\r\nconnected. Multiple viewports can be connected to have the legend\r\ndisplay in several viewports. If unspecified, the legend is rendered\r\nin all viewports. Acceptable inputs include:\r\n-\r\nPerspective\r\nTop\r\nBottom\r\nLeft\r\nRight\r\nFront\r\nBack\r\nany view name that has been saved within the Rhino file", "optional": true, "type": "Param_ScriptVariable"}], "outputs": [{"name": "mesh", "description": "A colored mesh for the legend colors.", "optional": false, "type": "Param_GenericObject"}, {"name": "title_obj", "description": "A text object for the  legend title.", "optional": false, "type": "Param_GenericObject"}, {"name": "label_objs", "description": "An array of text objects for the label text.", "optional": false, "type": "Param_GenericObject"}, {"name": "label_text", "description": "An array of text strings for the label text.", "optional": false, "type": "Param_GenericObject"}, {"name": "colors", "description": "An array of colors that align with the input _values. This can\r\nbe used to color geometry that aligns with the values.", "optional": false, "type": "Param_GenericObject"}], "preset_items": [], "availability": "INSTANTIATED", "source": "C:/Program Files/ladybug_tools/grasshopper/ladybug_grasshopper/user_objects\\LB Create Legend.ghuser", "id": "LB-086", "group": "輔助工具與預設選單", "hub_status": "待接入 Hub", "base_guid": "410755b1-224a-4c1e-a407-bf32fb45ea7e", "sha256": "1fb7b221073857544fad089f2692955dd68c3f9ac715792c4b9d3853f49f585d"}, {"file": "LB Deconstruct Matrix.ghuser", "name": "LB Deconstruct Matrix", "nickname": "", "category": "Ladybug", "subcategory": "4 :: Extra", "guid": "edcb03ed-db97-4709-b2b8-72074c97598b", "description": "Deconstruct a Ladybug Matrix object into a Grasshopper Data Tree of values.\r\n-", "version": "None", "inputs": [{"name": "_matrix", "description": "A Ladybug Matrix object such as the intersection matrices output\r\nfrom any of the ray-tracing components (eg. \"LB Direct Sun Hours\").", "optional": true, "type": "Param_ScriptVariable"}], "outputs": [{"name": "values", "description": "The numerical values of the matrix as a Grasshopper Data Tree.", "optional": false, "type": "Param_GenericObject"}], "preset_items": [], "availability": "INSTANTIATED", "source": "C:/Program Files/ladybug_tools/grasshopper/ladybug_grasshopper/user_objects\\LB Deconstruct Matrix.ghuser", "id": "LB-087", "group": "輔助工具與預設選單", "hub_status": "待接入 Hub", "base_guid": "410755b1-224a-4c1e-a407-bf32fb45ea7e", "sha256": "adae56b23b186953747093c111ea2760c05b50127134e0d57d9b145a52e0d2e7"}, {"file": "LB Deconstruct VisualizationSet.ghuser", "name": "LB Deconstruct VisualizationSet", "nickname": "", "category": "Ladybug", "subcategory": "4 :: Extra", "guid": "d758110c-b5b8-454e-ad39-a27f0785a1a0", "description": "Deconstruct a Ladybug VisualizationSet into all of its constituent objects.\r\n_\r\nThis includes Context Geometry, Analysis Geometry, and any data sets that are\r\nassociated with the analysis geometry. The last one is particularly helpful\r\nfor performing analysis in the data associated with a particular visualization.\r\n-", "version": "None", "inputs": [{"name": "_vis_set", "description": "VisualizationSet arguments from any Ladybug Tools component with a vis_set\r\noutput. This can also be the path to a .vsf file that exists on this\r\nmachine (these files are often written with the \"LB Dump VisualizationSet\"\r\ncomponent). Lastly, this input can be a custom VisualizationSet that\r\nhas been created with the Ladybug Tools SDK.", "optional": true, "type": "Param_ScriptVariable"}], "outputs": [{"name": "context", "description": "A list of geometry objects that constitute the context geometry of the\r\nVisualizationSet. When the VisualizationSet contains multiple context\r\ngeometry instances, this will be a data tree with one branch for\r\neach context object.", "optional": false, "type": "Param_GenericObject"}, {"name": "analysis", "description": "A list of geometry objects that constitute the analysis geometry of the\r\nVisualizationSet. When the VisualizationSet contains multiple analysis\r\ngeometry instances, this will be a data tree with one branch for\r\neach analysis object.", "optional": false, "type": "Param_GenericObject"}, {"name": "data", "description": "A list of numbers that constitue the data set associated with the analysis\r\ngeometry. In the event of multiple data sets assigned to the same\r\nanalysis geometry, this will be a data tree of numbers with one branch\r\nfor each data set. In the event of multiple analysis geometries, this\r\nwill be a nested data tree where the first number in the path matches\r\nthe analysis geometry branch and the last number matches the data set\r\nnumber.", "optional": false, "type": "Param_GenericObject"}], "preset_items": [], "availability": "INSTANTIATED", "source": "C:/Program Files/ladybug_tools/grasshopper/ladybug_grasshopper/user_objects\\LB Deconstruct VisualizationSet.ghuser", "id": "LB-088", "group": "輔助工具與預設選單", "hub_status": "待接入 Hub", "base_guid": "410755b1-224a-4c1e-a407-bf32fb45ea7e", "sha256": "8a0d75e5ec03aa145cc0b80100bb3c662f0d7ef4038a6fc1a38fac77713c08af"}, {"file": "LB Dump Data.ghuser", "name": "LB Dump Data", "nickname": "", "category": "Ladybug", "subcategory": "4 :: Extra", "guid": "b52947a3-2c7c-4350-81d3-a4d682ccae52", "description": "Dump any Ladybug data collections into a file. You can use \"LB Load Data\" component\r\nto load the data collections from the file back into Grasshopper.\r\n-", "version": "None", "inputs": [{"name": "_data", "description": "A list of Ladybug data collections to be written to a file.", "optional": true, "type": "Param_ScriptVariable"}, {"name": "_format_", "description": "Text or an integer to set the format of the output file.\r\nChoose from the options below. (Default: CSV).\r\n* 0 = CSV - Compact, human-readable, importable to spreadsheets\r\n* 1 = JSON - Cross-language and handles any types of collections\r\n* 2 = PKL - Compressed format only readable with Python", "optional": true, "type": "Param_ScriptVariable"}, {"name": "_name_", "description": "A name for the file to which the data collections will be\r\nwritten. (Default: 'data').", "optional": true, "type": "Param_ScriptVariable"}, {"name": "_folder_", "description": "An optional directory into which the data collections will be\r\nwritten.  The default is set to a user-specific simulation folder.", "optional": true, "type": "Param_ScriptVariable"}, {"name": "_dump", "description": "Set to \"True\" to save the data collection to a file.", "optional": true, "type": "Param_ScriptVariable"}], "outputs": [{"name": "out", "description": "Errors, warnings, etc.", "optional": false, "type": "Param_String"}, {"name": "data_file", "description": "The path of the file where the data collections are saved.", "optional": false, "type": "Param_GenericObject"}], "preset_items": [], "availability": "INSTANTIATED", "source": "C:/Program Files/ladybug_tools/grasshopper/ladybug_grasshopper/user_objects\\LB Dump Data.ghuser", "id": "LB-089", "group": "輔助工具與預設選單", "hub_status": "待接入 Hub", "base_guid": "410755b1-224a-4c1e-a407-bf32fb45ea7e", "sha256": "6891c35ee13e5d2636a7445a56b9ea73c13c8f63451ed6635a71d9b3a624df35"}, {"file": "LB Dump VisualizationSet.ghuser", "name": "LB Dump VisualizationSet", "nickname": "", "category": "Ladybug", "subcategory": "4 :: Extra", "guid": "b1b0ee69-b13c-4608-bc37-1f2a4cd4a3df", "description": "Dump a Ladybug VisualiztionSet into a file.\r\n_\r\nThe \"LB Preview VisualizationSet\" component can be used to visualize the content\r\nfrom the file back into Grasshopper.\r\n-", "version": "None", "inputs": [{"name": "_vis_set", "description": "A VisualizationSet object to be written to a file. This can also be\r\nVisualizationSet arguments from any Ladybug Tools component with\r\na vis_set output.", "optional": true, "type": "Param_ScriptVariable"}, {"name": "_format_", "description": "Text or an integer to set the format of the output file.\r\nChoose from the options below. (Default: SVG).\r\n* 0 = SVG - Interactive Scaleable Vector Graphic for web browsers\r\n* 1 = JSON - Cross-language and handles any types of collections\r\n* 2 = PKL - Compressed format only readable with Python", "optional": true, "type": "Param_ScriptVariable"}, {"name": "_svg_view_", "description": "An optional text string for the view for which the SVG will be generated.\r\nChoose from the options below. (Default: Top).\r\n* Top\r\n* Left\r\n* Right\r\n* Front\r\n* Back\r\n* NE\r\n* NW\r\n* SE\r\n* SW", "optional": true, "type": "Param_ScriptVariable"}, {"name": "_svg_width_", "description": "The screen width in pixels. (Default: 800).", "optional": true, "type": "Param_ScriptVariable"}, {"name": "_svg_height_", "description": "The screen height in pixels. (Default: 600).", "optional": true, "type": "Param_ScriptVariable"}, {"name": "legend_2d_", "description": "A boolean to note whether the geometry in the visulaization set\r\nshould be rendered using the 2D Legend Parameters instead of the 3D\r\nones. (Default: False).", "optional": true, "type": "Param_ScriptVariable"}, {"name": "_name_", "description": "A name for the file to which the VisualizationSet will be written.\r\nThe default is derived from the identifier of the visualization set.", "optional": true, "type": "Param_ScriptVariable"}, {"name": "_folder_", "description": "An optional directory into which the VisualizationSet will be\r\nwritten.  The default is set to a user-specific simulation folder.", "optional": true, "type": "Param_ScriptVariable"}, {"name": "_dump", "description": "Set to \"True\" to save the VisualizationSet to a file.", "optional": true, "type": "Param_ScriptVariable"}], "outputs": [{"name": "out", "description": "Errors, warnings, etc.", "optional": false, "type": "Param_String"}, {"name": "vs_file", "description": "The path of the file where the VisualisationSet is saved. The\r\n\"LB Preview VisualizationSet\" component can be used to visualize\r\nthe content from the file back into Grasshopper.", "optional": false, "type": "Param_GenericObject"}], "preset_items": [], "availability": "INSTANTIATED", "source": "C:/Program Files/ladybug_tools/grasshopper/ladybug_grasshopper/user_objects\\LB Dump VisualizationSet.ghuser", "id": "LB-090", "group": "輔助工具與預設選單", "hub_status": "待接入 Hub", "base_guid": "410755b1-224a-4c1e-a407-bf32fb45ea7e", "sha256": "c7d8de690b87b9c623155964ce344401545926d3a2c195e451e27579f700dd67"}, {"file": "LB Filter by Normal.ghuser", "name": "LB Filter by Normal", "nickname": "", "category": "Ladybug", "subcategory": "4 :: Extra", "guid": "8dcb6a08-5b74-409a-918a-4a31db7011c6", "description": "Filter or select faces of geometry based on their orientation.", "version": "None", "inputs": [{"name": "north_", "description": "A number between -360 and 360 for the counterclockwise difference between\r\nthe North and the positive Y-axis in degrees. 90 is West and 270\r\nis East. This can also be Vector for the direction to North. (Default: 0)", "optional": true, "type": "Param_ScriptVariable"}, {"name": "_geometry", "description": "Rhino Breps and/or Rhino Meshes which will be broken down into individual\r\nplanar faces and filtered based on the direction they face.", "optional": true, "type": "Param_ScriptVariable"}, {"name": "_orientation", "description": "Text for the direction that the geometry is facing. This can also be\r\na number between 0 and 360 for the azimuth (clockwise horizontal\r\ndegrees from North) that the geometry should face. Choose from\r\nthe following:\r\n_\r\n* N = North\r\n* NE = Northeast\r\n* E = East\r\n* SE = Southeast\r\n* S = South\r\n* SW = Southwest\r\n* W = West\r\n* NW = Northwest\r\n* Up = Upwards\r\n* Down = Downwards", "optional": true, "type": "Param_ScriptVariable"}, {"name": "_up_angle_", "description": "A number in degrees for the maximum declination angle from the positive\r\nZ Axis that is considerd up. This should be between 0 and 90 for\r\nthe results to be practical. (Default: 30).", "optional": true, "type": "Param_ScriptVariable"}, {"name": "_down_angle_", "description": "A number in degrees for the maximum angle difference from the newative\r\nZ Axis that is considerd down. This should be between 0 and 90 for\r\nthe results to be practical. (Default: 30).", "optional": true, "type": "Param_ScriptVariable"}, {"name": "_horiz_angle_", "description": "Angle in degrees for the horizontal deviation from _orientation\r\nthat is still considered to face that orientation. This should be\r\nbetween 0 and 90 for the results to be practical. Note that this input\r\nhas no effect when the input orientation is \"Up\" or \"Down\". (Default: 23).", "optional": true, "type": "Param_ScriptVariable"}], "outputs": [{"name": "out", "description": "...", "optional": false, "type": "Param_String"}, {"name": "sel_geo", "description": "Selected faces of the input geometry that are facing the direction\r\ncorresponding to the input criteria.", "optional": false, "type": "Param_GenericObject"}], "preset_items": [], "availability": "INSTANTIATED", "source": "C:/Program Files/ladybug_tools/grasshopper/ladybug_grasshopper/user_objects\\LB Filter by Normal.ghuser", "id": "LB-091", "group": "輔助工具與預設選單", "hub_status": "待接入 Hub", "base_guid": "410755b1-224a-4c1e-a407-bf32fb45ea7e", "sha256": "90e8208e9fb747b2d6cd5ee647b06d9c7148ad641bea94a424d883f3dd7a5379"}, {"file": "LB Generate Point Grid.ghuser", "name": "LB Generate Point Grid", "nickname": "", "category": "Ladybug", "subcategory": "4 :: Extra", "guid": "ecf696a2-0170-4357-830e-d99a6e656641", "description": "Genrate a mesh with corresponding test points from a Rhino Brep (or Mesh).\r\n_\r\nThe resulting mesh will be in a format that the \"LB Spatial Heatmap\" component\r\nwill accept.\r\n-", "version": "None", "inputs": [{"name": "_geometry", "description": "Brep or Mesh from which to generate the points and grid.", "optional": true, "type": "Param_ScriptVariable"}, {"name": "_grid_size", "description": "Number for the size of the test grid.", "optional": true, "type": "Param_ScriptVariable"}, {"name": "_offset_dist_", "description": "Number for the distance to move points from the surfaces\r\nof the input _geometry.  Typically, this should be a small positive\r\nnumber to ensure points are not blocked by the mesh. (Default: 0).", "optional": true, "type": "Param_ScriptVariable"}, {"name": "quad_only_", "description": "Boolean to note whether meshing should be done using Rhino's\r\ndefaults (False), which fills the entire _geometry to the edges\r\nwith both quad and tringulated faces, or a mesh with only quad\r\nfaces should be generated.\r\n_\r\nFOR ADVANCED USERS: This input can also be a vector object that will\r\nbe used to set the orientation of the quad-only grid. Note that,\r\nif a vector is input here that is not aligned with the plane of\r\nthe input _geometry, an error will be raised.", "optional": true, "type": "Param_ScriptVariable"}], "outputs": [{"name": "points", "description": "Test points at the center of each mesh face.", "optional": false, "type": "Param_GenericObject"}, {"name": "vectors", "description": "Vectors for the normal direction at each of the points.", "optional": false, "type": "Param_GenericObject"}, {"name": "face_areas", "description": "Area of each mesh face.", "optional": false, "type": "Param_GenericObject"}, {"name": "mesh", "description": "Analysis mesh that can be passed to the \"LB Spatial Heatmap\" component.", "optional": false, "type": "Param_GenericObject"}], "preset_items": [], "availability": "INSTANTIATED", "source": "C:/Program Files/ladybug_tools/gras
