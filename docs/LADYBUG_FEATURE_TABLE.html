Default is set to 0.7 clo for long sleeve shirt and pants. Typical values\r\ninclude the following.\r\n_\r\n* 1 clo = Three-piece suit\r\n* 0.5 clo = Shorts + T-shirt\r\n* 0 clo = No clothing", "optional": true, "type": "Param_ScriptVariable"}, {"name": "pmv_par_", "description": "Optional comfort parameters from the \"LB PMV Comfort Parameters\"\r\ncomponent to specify the criteria under which conditions are\r\nconsidered acceptable/comfortable. The default will assume a\r\nPPD threshold of 10% and no absolute humidity constraints.", "optional": true, "type": "Param_ScriptVariable"}, {"name": "_run", "description": "Set to True to run the component.", "optional": true, "type": "Param_ScriptVariable"}], "outputs": [{"name": "out", "description": "Reports, errors, warnings, etc.", "optional": false, "type": "Param_String"}, {"name": "pmv", "description": "Predicted Mean Vote (PMV).\r\n_\r\nPMV is a seven-point scale from cold (-3) to hot (+3) that was used\r\nin comfort surveys of P.O. Fanger.\r\n_\r\nEach interger value of the scale indicates the following:\r\n* -3 = Cold\r\n* -2 = Cool\r\n* -1 = Slightly Cool\r\n*  0 = Neutral\r\n* +1 = Slightly Warm\r\n* +2 = Warm\r\n* +3 = Hot", "optional": false, "type": "Param_GenericObject"}, {"name": "ppd", "description": "Percentage of People Dissatisfied (PPD).\r\n_\r\nSpecifically, this is defined by the percent of people who would have\r\na PMV beyond acceptable thresholds (typically \u003c-0.5 and >+0.5).\r\nNote that, with the PMV model, the best possible PPD achievable is 5%\r\nand most standards aim to have a PPD below 10%.", "optional": false, "type": "Param_GenericObject"}, {"name": "set", "description": "Standard Effective Temperature (SET) in Celcius.\r\n_\r\nThese temperatures describe what the given input conditions \"feel like\"\r\nin relation to a standard environment of 50% relative humidity,\r\n\u003c0.1 m/s average air speed, and mean radiant temperature equal to\r\naverage air temperature, in which the total heat loss from the skin\r\nof an imaginary occupant with an activity level of 1.0 met and a\r\nclothing level of 0.6 clo is the same as that from a person in the\r\nactual environment.", "optional": false, "type": "Param_GenericObject"}, {"name": "comfort", "description": "Integers noting whether the input conditions are acceptable\r\naccording to the assigned comfort_parameter.\r\n_\r\nValues are one of the following:\r\n* 0 = uncomfortable\r\n* 1 = comfortable", "optional": false, "type": "Param_GenericObject"}, {"name": "condition", "description": "Integers noting the thermal status of a subject according to\r\nthe assigned comfort_parameter.\r\n_\r\nValues are one of the following:\r\n* -2 = too dry (but thermally neutral)\r\n* -1 = cold\r\n*  0 = netural\r\n* +1 = hot\r\n* +2 = too humid (but thermally neutral)", "optional": false, "type": "Param_GenericObject"}, {"name": "heat_loss", "description": "A list of 6 terms for heat loss from the human energy\r\nbalance calculation that underlies PMV. Valeus are in W.\r\n_\r\nThe terms are ordered as follows:\r\n- Conduction\r\n- Sweating\r\n- Latent Respiration\r\n- Dry Respiration\r\n- Radiation\r\n- Convection", "optional": false, "type": "Param_GenericObject"}, {"name": "comf_obj", "description": "A Python object containing all inputs and results of the\r\nanalysis.  This can be plugged into components like the \"Comfort\r\nStatistics\" component to get further information.", "optional": false, "type": "Param_GenericObject"}], "preset_items": [], "availability": "INSTANTIATED", "source": "C:/Program Files/ladybug_tools/grasshopper/ladybug_grasshopper/user_objects\\LB PMV Comfort.ghuser", "id": "LB-039", "group": "資料與熱舒適分析", "hub_status": "待接入 Hub", "base_guid": "410755b1-224a-4c1e-a407-bf32fb45ea7e", "sha256": "6499c8ce60a6eeda33a47ae8c4a35c9e8d51b8a55aced34f34ec3b9e529de1c3"}, {"file": "LB Radiant Asymmetry.ghuser", "name": "LB Radiant Asymmetry", "nickname": "", "category": "Ladybug", "subcategory": "1 :: Analyze Data", "guid": "c72badc7-6b72-4061-913d-f4b7eb74239b", "description": "Calculate the percentage of people dissatisfied from radiant asymmetry.\r\n_\r\nThe comfort functions used here come from Figure 5.2.4.1 of ASHRAE 55 2010.\r\nNote that, if the resulting input results in a PPD beyond what is included\r\nin this Figure, the maximum PPD will simply be returned.\r\n-", "version": "None", "inputs": [{"name": "_radiant_diff", "description": "A number for the the radiant temperature difference between\r\ntwo sides of the same plane where an occupant is located [C].\r\nThis can also be a data collection representing the radiant\r\ntemperature difference over time [C].", "optional": true, "type": "Param_ScriptVariable"}, {"name": "_asymmetry_type", "description": "Text or an integer that representing the type of radiant\r\nasymmetry being evaluated. Occupants are more sensitive to warm\r\nceilings and cool walls than cool ceilings and warm walls.\r\nChoose from the following options.\r\n_\r\n* 0 = WarmCeiling\r\n* 1 = CoolWall\r\n* 2 = CoolCeiling\r\n* 3 = WarmWall", "optional": true, "type": "Param_ScriptVariable"}], "outputs": [{"name": "ppd", "description": "The percentage of people dissatisfied (PPD) for the input radiant asymmetry.", "optional": false, "type": "Param_GenericObject"}], "preset_items": [], "availability": "INSTANTIATED", "source": "C:/Program Files/ladybug_tools/grasshopper/ladybug_grasshopper/user_objects\\LB Radiant Asymmetry.ghuser", "id": "LB-040", "group": "資料與熱舒適分析", "hub_status": "待接入 Hub", "base_guid": "410755b1-224a-4c1e-a407-bf32fb45ea7e", "sha256": "57e7d674a8e09dcc16ca95aa1d2621a035044f246760f42ef98ed4e6a92eb5c5"}, {"file": "LB Relative Humidity from Dew Point.ghuser", "name": "LB Relative Humidity from Dew Point", "nickname": "", "category": "Ladybug", "subcategory": "1 :: Analyze Data", "guid": "c250a52f-5d74-4bab-b504-b9ce15e16519", "description": "Calculate relative humidity from Dry Bulb Temperature and Dew Point Temperature.\r\n-", "version": "None", "inputs": [{"name": "_dry_bulb", "description": "A value or data collection representing dry bulb temperature [C]", "optional": true, "type": "Param_ScriptVariable"}, {"name": "_dew_point", "description": "A value or data collection representing dew point temperature [C]", "optional": true, "type": "Param_ScriptVariable"}], "outputs": [{"name": "rel_humid", "description": "A data collection or value indicating the relative humidity [%]", "optional": false, "type": "Param_GenericObject"}], "preset_items": [], "availability": "INSTANTIATED", "source": "C:/Program Files/ladybug_tools/grasshopper/ladybug_grasshopper/user_objects\\LB Relative Humidity from Dew Point.ghuser", "id": "LB-041", "group": "資料與熱舒適分析", "hub_status": "待接入 Hub", "base_guid": "410755b1-224a-4c1e-a407-bf32fb45ea7e", "sha256": "49b1dc00587e586572c64ab0f9d5e0366d2923147152db484cf68abb597ac05a"}, {"file": "LB Solar MRT from Solar Components.ghuser", "name": "LB Solar MRT from Solar Components", "nickname": "", "category": "Ladybug", "subcategory": "1 :: Analyze Data", "guid": "359e04de-d219-422f-a9ef-0ad9cc2cd994", "description": "Calculate Mean Radiant Temperature (MRT) as a result of shortwave solar using\r\nhorizontal solar components (direct horizontal and diffuse horizontal solar).\r\n-\r\nThis component uses the SolarCal model of ASHRAE-55 to estimate the effects\r\nof shortwave solar and a simple sky exposure method to determine longwave\r\nradiant exchange.\r\n-", "version": "None", "inputs": [{"name": "_location", "description": "A Ladybug Location object.", "optional": true, "type": "Param_ScriptVariable"}, {"name": "_longwave_mrt", "description": "A single number or an hourly data collection with the long-wave\r\nmean radiant temperature around the person in degrees C.\r\nThis includes the temperature of the ground and any other\r\nsurfaces between the person and their view to the sky.\r\nTypically, air temperature is used when such surface\r\ntemperatures are unknown.", "optional": true, "type": "Param_ScriptVariable"}, {"name": "_dir_horiz_rad", "description": "Hourly Data Collection with the direct horizontal solar\r\nirradiance in W/m2.", "optional": true, "type": "Param_ScriptVariable"}, {"name": "_diff_horiz_rad", "description": "Hourly Data Collection with diffuse horizontal solar\r\nirradiance in W/m2.", "optional": true, "type": "Param_ScriptVariable"}, {"name": "fract_body_exp_", "description": "A single number between 0 and 1 or a data collection\r\nrepresenting the fraction of the body exposed to direct sunlight.\r\nNote that this does not include the body’s self-shading; only the\r\nshading from surroundings.\r\nDefault is 1 for a person standing in an open area.", "optional": true, "type": "Param_ScriptVariable"}, {"name": "_ground_ref_", "description": "A single number between 0 and 1 or a data collection\r\nthat represents the reflectance of the floor. Default is for 0.25\r\nwhich is characteristic of outdoor grass or dry bare soil.", "optional": true, "type": "Param_ScriptVariable"}, {"name": "_solar_body_par_", "description": "Optional solar body parameters from the \"LB Solar Body Parameters\"\r\nobject to specify the properties of the human geometry assumed in the\r\nshortwave MRT calculation. The default assumes average skin/clothing\r\nabsorptivity and a human subject always has their back to the sun\r\nat a 45-degree angle (SHARP = 135).", "optional": true, "type": "Param_ScriptVariable"}, {"name": "_run", "description": "Set to True to run the component.", "optional": true, "type": "Param_ScriptVariable"}], "outputs": [{"name": "out", "description": "Reports, errors, warnings, etc.", "optional": false, "type": "Param_String"}, {"name": "erf", "description": "Data collection of effective radiant field (ERF) in W/m2.", "optional": false, "type": "Param_GenericObject"}, {"name": "dmrt", "description": "Data collection of mean radiant temperature delta in C.", "optional": false, "type": "Param_GenericObject"}, {"name": "mrt", "description": "Data collection of mean radiant temperature in C.", "optional": false, "type": "Param_GenericObject"}], "preset_items": [], "availability": "INSTANTIATED", "source": "C:/Program Files/ladybug_tools/grasshopper/ladybug_grasshopper/user_objects\\LB Solar MRT from Solar Components.ghuser", "id": "LB-042", "group": "資料與熱舒適分析", "hub_status": "待接入 Hub", "base_guid": "410755b1-224a-4c1e-a407-bf32fb45ea7e", "sha256": "81895ab6cd0fa1f77a0189efde488bc38d0583ba07471b308f11ae21a9897ebb"}, {"file": "LB Thermal Indices.ghuser", "name": "LB Thermal Indices", "nickname": "", "category": "Ladybug", "subcategory": "1 :: Analyze Data", "guid": "7b45f29e-51c1-4152-b814-62475e5e577f", "description": "Calculate thermal indices that have historically been used by meteorologists.\r\nAll of them are \"feels like\" temperatures that attempt to account for factors\r\nbeyond sir temperature. These include the following:\r\n_\r\n* Wet Bulb Globe Temperature (WBGT)\r\n* Heat Index (HI)\r\n* Wind Chill Temperature (WCT)\r\n_\r\nMost of these indices have fallen out of use in favor of Universal Thermal\r\nClimate Index (UTCI). However, they are still used in some regions and are a\r\npart of older codes and standards.\r\n-", "version": "None", "inputs": [{"name": "_air_temp", "description": "Data Collection or individual value for air temperature in C.\r\nThis input is used by all three metrics.", "optional": true, "type": "Param_ScriptVariable"}, {"name": "_mrt_", "description": "Data Collection or individual value for mean radiant temperature\r\n(MRT) in C. Default is the same as the air_temp. This input only\r\naffects the WBGT.", "optional": true, "type": "Param_ScriptVariable"}, {"name": "_rel_humid", "description": "Data Collection or individual value for relative humidity in %.\r\nNote that percent values are between 0 and 100. This input affects\r\nWBGT as well as HI.", "optional": true, "type": "Param_ScriptVariable"}, {"name": "_wind_vel", "description": "Data Collection or individual value for meteoroligical wind velocity\r\nat 10 m above ground level in m/s. This is used by both WBGT and WCT.", "optional": true, "type": "Param_ScriptVariable"}], "outputs": [{"name": "wbgt", "description": "A data collection or value for Wet Bulb Globe Temperature (WBGT) [C].\r\nWBGT is a type of feels-like temperature that is widely used as a\r\nheat stress index (ISO 7243). It is incorporates the effect of\r\ntemperature, humidity, wind speed, and mean radiant temperature\r\n(optionally including the effect of sun).", "optional": false, "type": "Param_GenericObject"}, {"name": "heat_index", "description": "A data collection or value for Heat Index (HI) temperature [C].\r\nHeat index is derived from original work carried out by Robert G.\r\nSteadman, which defined heat index through large tables of empirical\r\ndata. The formula here approximates the heat index to within +/- 0.7C\r\nand is the result of a multivariate fit. Heat index was adopted by\r\nthe US's National Weather Service (NWS) in 1979.", "optional": false, "type": "Param_GenericObject"}, {"name": "wind_chill", "description": "A data collection or value for Wind Cill Temperature (WCT) [C].\r\nWind Chill Index is derived from original work carried out by\r\nGregorczuk. It qualifies thermal sensations of a person in\r\nwintertime. It is especially useful at low and very low air\r\ntemperature and at high wind speed.", "optional": false, "type": "Param_GenericObject"}], "preset_items": [], "availability": "INSTANTIATED", "source": "C:/Program Files/ladybug_tools/grasshopper/ladybug_grasshopper/user_objects\\LB Thermal Indices.ghuser", "id": "LB-043", "group": "資料與熱舒適分析", "hub_status": "待接入 Hub", "base_guid": "410755b1-224a-4c1e-a407-bf32fb45ea7e", "sha256": "c28af02bff03c50009401d2d67f1c821add47ae3f130ffa3e4b561a3fc2aab4d"}, {"file": "LB Time Interval Operation.ghuser", "name": "LB Time Interval Operation", "nickname": "", "category": "Ladybug", "subcategory": "1 :: Analyze Data", "guid": "bccb33be-75e8-470d-be99-f7aa07a3d18b", "description": "Perform time interval operations on an hourly data collection.\r\n_\r\nThis includes operations like:\r\n- Average\r\n- Total\r\n- Percentile\r\n_\r\nThese actions can be performed over the following time intervals:\r\n- Daily\r\n- Monthly\r\n- Monthly per Hour\r\n-", "version": "None", "inputs": [{"name": "_data", "description": "A Ladybug data collection object.", "optional": true, "type": "Param_ScriptVariable"}, {"name": "_operation_", "description": "Text indicating the operation that should be performed on\r\nthe input hourly data.\r\n_\r\nSuch text must be one of the following:\r\n- average\r\n- total\r\n- [a number between 0 and 100]\r\n_\r\nIn the case of the last option, the number will be interpreted as\r\na percentile of the data over the time period. For example,\r\ninputting 75 will return the 75th percentile value of each\r\nday/month/hour, inputting 0 will give the minimum value of each\r\nday/month/hour and inputting 100 will give the max value of each\r\nday/month/hour.\r\n_\r\nDefault is 'average' if the input data type is not cumulative and\r\n'total' if the data type is cumulative.", "optional": true, "type": "Param_ScriptVariable"}], "outputs": [{"name": "daily", "description": "Daily data collection derived from the input _data and _operation_.", "optional": false, "type": "Param_GenericObject"}, {"name": "monthly", "description": "Monthly data collection derived from the input _data and _operation_.", "optional": false, "type": "Param_GenericObject"}, {"name": "mon_per_hr", "description": "Monthly Per Hour data collection derived from the input\r\n_data and _operation_.", "optional": false, "type": "Param_GenericObject"}], "preset_items": [], "availability": "INSTANTIATED", "source": "C:/Program Files/ladybug_tools/grasshopper/ladybug_grasshopper/user_objects\\LB Time Interval Operation.ghuser", "id": "LB-044", "group": "資料與熱舒適分析", "hub_status": "待接入 Hub", "base_guid": "410755b1-224a-4c1e-a407-bf32fb45ea7e", "sha256": "aac60d427f72399b163054f1e67876851e1502a499bed884b949b212690529ac"}, {"file": "LB UTCI Comfort.ghuser", "name": "LB UTCI Comfort", "nickname": "", "category": "Ladybug", "subcategory": "1 :: Analyze Data", "guid": "09033858-4a95-446b-9705-01b6fb308b9e", "description": "Calculate Universal Thermal Climate Index (UTCI).\r\n-\r\nUTCI is a thermal comfort model strictly for the outdoors. It is an international\r\nstandard for outdoor temperature sensation (aka. \"feels-like\" temperature) and\r\nis one of the most common of such \"feels-like\" temperatures used by\r\nmeteorologists. UTCI that attempts to satisfy the following requirements:\r\n_\r\n1) Thermo-physiological significance in the whole range of heat exchange conditions.\r\n2) Valid in all climates, seasons, and scales.\r\n3) Useful for key applications in human biometeorology.\r\n_\r\nWhile UTCI is designed to be valid in all climates and seasons, it assumes\r\nthat human subjects are walking (with a metabolic rate around 2.4 met) and\r\nthat they naturally adapt their clothing with the outdoor temperature.\r\nFor outdoor situations that do not fit these criteria, the Physiological\r\nEquivalent Temperature (PET) model is recommended.\r\n-", "version": "None", "inputs": [{"name": "_air_temp", "description": "Data Collection or individual value for air temperature in C.", "optional": true, "type": "Param_ScriptVariable"}, {"name": "_mrt_", "description": "Data Collection or individual value for mean radiant temperature\r\n(MRT) in C. Default is the same as the air_temp.", "optional": true, "type": "Param_ScriptVariable"}, {"name": "_rel_humid", "description": "Data Collection or individual value for relative humidity in %.\r\nNote that percent values are between 0 and 100.", "optional": true, "type": "Param_ScriptVariable"}, {"name": "_wind_vel_", "description": "Data Collection or individual value for meteoroligical wind velocity\r\nat 10 m above ground level in m/s. Note that this meteorological\r\nvelocity at 10 m is simply 1.5 times the speed felt at ground\r\nlevel in the original Fiala model used to create the UTCI model.\r\nTherefore, multiplying air speed values at the height of the\r\nhuman subject by 1.5 will make them a suitable input for this\r\ncomponent. Default is a low speed of 0.5 m/s, which is the lowest\r\ninput speed that is recommended for the UTCI model.", "optional": true, "type": "Param_ScriptVariable"}, {"name": "utci_par_", "description": "Optional comfort parameters from the \"LB UTCI Comfort Parameters\"\r\ncomponent to specify the temperatures (in Celcius) that are\r\nconsidered acceptable/comfortable. The default will assume a that\r\nthe comfort range is between 9C and 26C.", "optional": true, "type": "Param_ScriptVariable"}, {"name": "_run", "description": "Set to True to run the component.", "optional": true, "type": "Param_ScriptVariable"}], "outputs": [{"name": "out", "description": "Reports, errors, warnings, etc.", "optional": false, "type": "Param_String"}, {"name": "utci", "description": "Universal Thermal Climate Index (UTCI) in Celcius.", "optional": false, "type": "Param_GenericObject"}, {"name": "comfort", "description": "Integers noting whether the input conditions result in no\r\nthermal stress.\r\n.\r\nValues are one of the following:\r\n* 0 = thermal stress\r\n* 1 = no thremal stress", "optional": false, "type": "Param_GenericObject"}, {"name": "condition", "description": "Integers noting the thermal status of a subject.\r\n.\r\nValues are one of the following:\r\n* -1 = cold\r\n*  0 = netural\r\n* +1 = hot", "optional": false, "type": "Param_GenericObject"}, {"name": "category", "description": "Integers noting the category that the UTCI conditions fall\r\nunder on an 11-point scale.\r\n.\r\nValues are one of the following:\r\n* -5 = Extreme Cold Stress       (UTCI \u003c -40)\r\n* -4 = Very Strong Cold Stress   (-40 \u003c= UTCI \u003c -27)\r\n* -3 = Strong Cold Stress        (-27 \u003c= UTCI \u003c -13)\r\n* -2 = Moderate Cold Stress      (-12 \u003c= UTCI \u003c 0)\r\n* -1 = Slight Cold Stress        (0 \u003c= UTCI \u003c 9)\r\n*  0 = No Thermal Stress         (9 \u003c= UTCI \u003c 26)\r\n* +1 = Slight Heat Stress        (26 \u003c= UTCI \u003c 28)\r\n* +2 = Moderate Heat Stress      (28 \u003c= UTCI \u003c 32)\r\n* +3 = Strong Heat Stress        (32 \u003c= UTCI \u003c 38)\r\n* +4 = Very Strong Heat Stress   (38 \u003c= UTCI \u003c 46)\r\n* +5 = Extreme Heat Stress       (46 \u003c UTCI)", "optional": false, "type": "Param_GenericObject"}, {"name": "comf_obj", "description": "A Python object containing all inputs and results of the\r\nanalysis.  This can be plugged into components like the \"Comfort\r\nStatistics\" component to get further information.", "optional": false, "type": "Param_GenericObject"}], "preset_items": [], "availability": "INSTANTIATED", "source": "C:/Program Files/ladybug_tools/grasshopper/ladybug_grasshopper/user_objects\\LB UTCI Comfort.ghuser", "id": "LB-045", "group": "資料與熱舒適分析", "hub_status": "待接入 Hub", "base_guid": "410755b1-224a-4c1e-a407-bf32fb45ea7e", "sha256": "bf358d59de0268caeb7b918628daf2d12d9cab6f4c2ab26c50e386193467301a"}, {"file": "LB Wind Speed.ghuser", "name": "LB Wind Speed", "nickname": "", "category": "Ladybug", "subcategory": "1 :: Analyze Data", "guid": "527f888c-918b-495e-b40a-4e79ba7b38f7", "description": "Calculate wind speed at a specific height above the ground for a given terrain type.\r\n_\r\nBy default, the component will calculate wind speed at a height of 1 meter, which\r\nis suitable for most thermal comfort models like PET and SET. Alternatively, by\r\nhooking up the output wind data to the \"LB Wind rose\" component, a wind rose\r\nfor any terrain or at height above the ground can be produced.\r\n_\r\nThis component uses the same wind profile function as used by the \"LB Wind Profile\"\r\ncomponent.\r\n-", "version": "None", "inputs": [{"name": "_met_wind_vel", "description": "A data collection of meteorological wind speed measured at\r\nthe _met_height_ with the _met_terrian [m/s]. Typically, this comes\r\nfrom the \"LB Import EPW\" component. This can also be a number for\r\nthe meteorological wind speed in m/s.", "optional": true, "type": "Param_ScriptVariable"}, {"name": "_height_", "description": "The height above the ground to be evaluated in meters. (Default: 1 meter,\r\nwhich is suitable for most thermal comfort models like PET and SET.).", "optional": true, "type": "Param_ScriptVariable"}, {"name": "_terrain_", "description": "Text string that sets the terrain class associated with the output air_speed.\r\nThis can also be an integer that codes for the terrain. (Default: city).\r\nMust be one the following.\r\n_\r\n0 = city - 50% of buildings above 21m over a distance of at least 2000m upwind.\r\n1 = suburban - suburbs, wooded areas.\r\n2 = country - open, with scattered objects generally less than 10m high.\r\n3 = water - flat areas downwind of a large water body (max 500m inland).", "optional": true, "type": "Param_ScriptVariable"}, {"name": "_met_height_", "description": "A number for the height above the ground at which the meteorological\r\nwind speed is measured in meters. (Default: 10 meters, which is the\r\nstandard used by most airports and EPW files).", "optional": true, "type": "Param_ScriptVariable"}, {"name": "_met_terrain_", "description": "Text string that sets the terrain class associated with the\r\nmeteorological wind speed. This can also be an integer that codes\r\nfor the terrain. (Default: country, which is typical of most\r\nairports where wind measurements are taken). Must be one the following.\r\n_\r\n0 = city - 50% of buildings above 21m over a distance of at least 2000m upwind.\r\n1 = suburban - suburbs, wooded areas.\r\n2 = country - open, with scattered objects generally less than 10m high.\r\n3 = water - flat areas downwind of a large water body (max 500m inland).", "optional": true, "type": "Param_ScriptVariable"}, {"name": "log_law_", "description": "A boolean to note whether the wind profile should use a logarithmic\r\nlaw to determine wind speeds instead of the default power law,\r\nwhich is used by EnergyPlus. (Default: False).", "optional": true, "type": "Param_ScriptVariable"}], "outputs": [{"name": "out", "description": "Reports, errors, warnings, etc.", "optional": false, "type": "Param_String"}, {"name": "air_speed", "description": "A data collection or single value for the air speed at the input\r\n_height_ above the ground for the input _terrain_. This can be plugged\r\ninto thermal comfort models like PET or SET/PMV. Alternatively, by\r\nconnecting the wind data to the \"LB Wind rose\" component, a wind rose\r\nfor the input _terrain_ and _height_ above the ground can be produced.", "optional": false, "type": "Param_GenericObject"}], "preset_items": [], "availability": "INSTANTIATED", "source": "C:/Program Files/ladybug_tools/grasshopper/ladybug_grasshopper/user_objects\\LB Wind Speed.ghuser", "id": "LB-046", "group": "資料與熱舒適分析", "hub_status": "待接入 Hub", "base_guid": "410755b1-224a-4c1e-a407-bf32fb45ea7e", "sha256": "50d7b6e94527b4b7c77f815f0100da1eb9fd5421e32eebb4c20d04c5f091efc6"}, {"file": "LB Adaptive Chart.ghuser", "name": "LB Adaptive Chart", "nickname": "", "category": "Ladybug", "subcategory": "2 :: Visualize Data", "guid": "dae78560-06c0-4851-af4f-641c1846b6b9", "description": "Draw an adaptive comfort chart in the Rhino scene and plot a set of prevailing and\r\nindoor operative temperature values on it.\r\n_\r\nConnected data can include outdoor temperatures from imported EPW weather data\r\nas well as indoor temperatures from an energy simulation.\r\n-", "version": "None", "inputs": [{"name": "_out_temp", "description": "Outdoor temperatures in one of the following formats:\r\n* A Data Collection of outdoor dry bulb temperatures recorded over\r\nthe entire year. This Data Collection must be continouous and\r\nmust either be an Hourly Collection or Daily Collection. In the event\r\nthat the input adapt_par_ has a _avgm_or_runmean_ set to True,\r\nMonthly collections are also acceptable here. Note that, because\r\nan annual input is required, this input collection does not have\r\nto align with the _air_temp or _mrt_ inputs.\r\n* A Data Collection of prevailing outdoor temperature values in C.\r\nThis Data Collection must align with the _air_temp or _mrt_\r\ninputs and bear the PrevailingOutdoorTemperature data type in\r\nits header.\r\n* A single prevailing outdoor temperature value in C to be used\r\nfor all of the _air_temp or _mrt_ inputs.", "optional": true, "type": "Param_ScriptVariable"}, {"name": "_air_temp", "description": "A hourly, daily, or sub-hourly data collection of temperature values\r\nfor indoor air temperature (or operative temperature). If this input\r\ndata collection is in in Farenheit, the entire chart will be drawn\r\nusing IP units.", "optional": true, "type": "Param_ScriptVariable"}, {"name": "_mrt_", "description": "A hourly, daily, or sub-hourly data collection for mean radiant temperature\r\n(MRT) in C. Default is the same as the air_temp, effectively\r\ninterpreting the _air_temp as operative tempreature.", "optional": true, "type": "Param_ScriptVariable"}, {"name": "_air_speed_", "description": "A number for the air speed values in m/s. Note that higher air speeds\r\nin the adaptive model only widen the upper boundary of the comfort\r\nrange at temperatures above 24 C and will not affect the lower temperature\r\nof the comfort range. Default is a very low speed of 0.1 m/s.", "optional": true, "type": "Param_ScriptVariable"}, {"name": "adapt_par_", "description": "Optional comfort parameters from the \"LB Adaptive Comfort Parameters\"\r\ncomponent to specify the criteria under which conditions are\r\nconsidered acceptable/comfortable. The default will use ASHRAE-55\r\nadaptive comfort criteria.", "optional": true, "type": "Param_ScriptVariable"}, {"name": "_base_pt_", "description": "A point to be used as the bottom-left-most point from which all\r\ngeometry of the plot will be generated. (Default: (0, 0, 0)).", "optional": true, "type": "Param_ScriptVariable"}, {"name": "_scale_", "description": "A number to set the dimensions of the chart. (Default: 1).", "optional": true, "type": "Param_ScriptVariable"}, {"name": "_prevail_range_", "description": "An optional domain (or number for the upper temperature), which\r\nwill be used to set the lower and upper boundaries of prevailing\r\noutdoor temperature on the chart. These should be in Celsius if the\r\nchart is plotted in Celsius and and Fahrenheit if it is in Fahrenheit.\r\nThe default is 10C to 33C when ASHRAE-55 is used and 10C to 30C when\r\nthe EN standard is used. This translates to 50F to 92F for ASHRAE-55\r\nand 50F to 86F for the EN standard.", "optional": true, "type": "Param_ScriptVariable"}, {"name": "_operat_range_", "description": "An optional domain (or number for the upper temperature), which\r\nwill be used to set the lower and upper boundaries of indoor\r\noperative temperature on the chart. These should be in Celsius if the\r\nchart is plotted in Celsius and and Fahrenheit if it is in Fahrenheit.\r\nThe default is 14C to 40C, which translates to 58F to 104F.", "optional": true, "type": "Param_ScriptVariable"}, {"name": "legend_par_", "description": "An optional LegendParameter object from the \"LB Legend Parameters\"\r\ncomponent to change the display of the Adaptive Chart.", "optional": true, "type": "Param_ScriptVariable"}, {"name": "data_", "description": "Optional data collections, which are aligned with the input _air_temp,\r\nwhich will be output from the data of this component and can be used\r\nto color points with data. This data can also be used along with\r\nthe statement_ below to select out data that meets certain conditions.", "optional": true, "type": "Param_ScriptVariable"}, {"name": "statement_", "description": "A conditional statement as a string (e.g. a > 25).\r\n.\r\nThe variable of the first data collection should always be named 'a'\r\n(without quotations), the variable of the second list should be\r\nnamed 'b', and so on.\r\n.\r\nFor example, if three data collections are connected to _data\r\nand the following statement is applied:\r\n'10 \u003c a \u003c 30 and b \u003c 33 and c > 2'\r\nThe resulting collections will only include values where the first\r\ndata collection is between 10 and 30, the second collection is less\r\nthan 33 and the third collection is greater than 2.\r\n.\r\nFor this component, the input indoor air temperature will always be\r\nthe last (or seconf-to-last) letter and this will be followed by\r\nthe input _mrt_ (if it is present).", "optional": true, "type": "Param_ScriptVariable"}, {"name": "period_", "description": "A Ladybug analysis period to be applied to the _out_temp and\r\n_air_temp of the input data_.", "optional": true, "type": "Param_ScriptVariable"}], "outputs": [{"name": "out", "description": "...", "optional": false, "type": "Param_String"}, {"name": "total_comfort", "description": "The percent of the data on the adaptive chart that is inside the\r\ncomfort polygon.", "optional": false, "type": "Param_GenericObject"}, {"name": "comfort_data", "description": "Data collection or a 0/1 value noting whether each of the data\r\npoints on the chart lies inside of the comfort polygon.\r\n_\r\nThis can be connected to the \"LB Create Legend\" component to generate\r\na list of colors that can be used to color the points output from\r\n\"LB Adaptive Chart\" component to see exactly which points are\r\ncomfortable and which are not.\r\n_\r\nValues are one of the following:\r\n0 = uncomfortable\r\n1 = comfortable", "optional": false, "type": "Param_GenericObject"}, {"name": "condition_data", "description": "Data collection of integers noting the thermal status of the human\r\nsubject according to the assigned comfort parameters.\r\n_\r\nThis can be connected to the \"LB Create Legend\" component to generate\r\na list of colors that can be used to color the points output from\r\n\"LB Adaptive Chart\" component to see exactly which points are\r\nhot, cold, and neutral.\r\n_\r\nValues are one of the following:\r\n* -1 = cold\r\n*  0 = netural\r\n* +1 = hot", "optional": false, "type": "Param_GenericObject"}, {"name": "polygon", "description": "Brep representing the range of comfort for the input parameters.", "optional": false, "type": "Param_GenericObject"}, {"name": "title", "description": "Text objects for the chart title and axes titles as well as a polyline for\r\nthe outer border of the chart.", "optional": false, "type": "Param_GenericObject"}, {"name": "prevail_lines", "description": "A list of line segments and text objects for the outdoor prevailing\r\ntemperature labels on the chart.", "optional": false, "type": "Param_GenericObject"}, {"name": "operative_lines", "description": "A list of line segments and text objects for the indoor operative\r\ntemperature labels on the chart.", "optional": false, "type": "Param_GenericObject"}, {"name": "mesh", "description": "A colored mesh showing the number of input hours that happen in each part\r\nof the adaptive chart.", "optional": false, "type": "Param_GenericObject"}, {"name": "legend", "description": "A colored legend showing the number of hours that correspond to\r\neach color.", "optional": false, "type": "Param_GenericObject"}, {"name": "points", "description": "Points representing each of the input prevailing and operative temperature values.\r\nBy default, this ouput is hidden and it should be connected it to a\r\nnative Grasshopper preview component to view it.", "optional": false, "type": "Param_GenericObject"}, {"name": "data", "description": "The input data_ with the input statements or the periods applied to it.\r\nThese can be deconstructed with the \"LB Deconstruct Data\" component\r\nand the resulting values can be plugged into the \"LB Create Legend\"\r\ncomponent to generate colors that can be used to color the points\r\nabove using the native Grasshopper \"Custom Preview\" component.", "optional": false, "type": "Param_GenericObject"}, {"name": "vis_set", "description": "An object containing VisualizationSet arguments for drawing a detailed\r\nversion of the Adaptive Chart in the Rhino scene. This can be\r\nconnected to the \"LB Preview Visualization Set\" component to display\r\nthis version of the Adaptive Chart in Rhino.", "optional": false, "type": "Param_GenericObject"}], "preset_items": [], "availability": "INSTANTIATED", "source": "C:/Program Files/ladybug_tools/grasshopper/ladybug_grasshopper/user_objects\\LB Adaptive Chart.ghuser", "id": "LB-047", "group": "圖表與視覺化", "hub_status": "待接入 Hub", "base_guid": "410755b1-224a-4c1e-a407-bf32fb45ea7e", "sha256": "5d1bddc6931ef13a7a189f96e120a20340b0daf1bb1c42214920ddc4e84da4a6"}, {"file": "LB Benefit Sky Matrix.ghuser", "name": "LB Benefit Sky Matrix", "nickname": "", "category": "Ladybug", "subcategory": "2 :: Visualize Data", "guid": "6f6a4e9e-1168-4212-8df4-90a6c3406bb1", "description": "Get a matrix representing the benefit/harm of radiation based on temperature data.\r\n_\r\nWhen this sky matrix is used in radiation studies or to produce radiation graphics,\r\npositive values represent helpful wintertime sun energy that can offset heating loads\r\nduring cold temperatures while negative values represent harmful summertime sun\r\nenergy that can increase cooling loads during hot temperatures.\r\n_\r\nRadiation benefit skies are particularly helpful for evaluating building massing\r\nand facade designs in terms of passive solar heat gain vs. cooling energy increase.\r\n_\r\nThis component uses Radiance's gendaymtx function to calculate the radiation\r\nfor each patch of the sky. Gendaymtx is written by Ian Ashdown and Greg Ward.\r\nMorere information can be found in Radiance manual at:\r\nhttp://www.radiance-online.org/learning/documentation/manual-pages/pdfs/gendaymtx.pdf\r\n-", "version": "None", "inputs": [{"name": "north_", "description": "A number between -360 and 360 for the counterclockwise\r\ndifference between the North and the positive Y-axis in degrees.\r\n90 is West and 270 is East. This can also be Vector for the\r\ndirection to North. (Default: 0)", "optional": true, "type": "Param_ScriptVariable"}, {"name": "_location", "description": "A ladybug Location that has been output from the \"LB Import EPW\"\r\ncomponent or the \"LB Construct Location\" component.", "optional": true, "type": "Param_ScriptVariable"}, {"name": "_temperature", "description": "An annual hourly DataCollection of temperature, which will be used\r\nto establish whether radiation is desired or not for each time step.", "optional": true, "type": "Param_ScriptVariable"}, {"name": "_bal_temp_", "description": "The temperature in Celsius between which radiation switches from being a\r\nbenefit to a harm. Typical residential buildings have balance temperatures\r\nas high as 18C and commercial buildings tend to have lower values\r\naround 12C. (Default 15C).", "optional": true, "type": "Param_ScriptVariable"}, {"name": "_bal_offset_", "description": "The temperature offset from the balance temperature in Celsius where\r\nradiation is neither harmful nor helpful. (Default: 2).", "optional": true, "type": "Param_ScriptVariable"}, {"name": "_direct_rad", "description": "An annual hourly DataCollection of Direct Normal Radiation such\r\nas that which is output from the \"LB Import EPW\" component or the\r\n\"LB Import STAT\" component.", "optional": true, "type": "Param_ScriptVariable"}, {"name": "_diffuse_rad", "description": "An annual hourly DataCollection of Diffuse Horizontal Radiation\r\nsuch as that which is output from the \"LB Import EPW\" component or\r\nthe \"LB Import STAT\" component.", "optional": true, "type": "Param_ScriptVariable"}, {"name": "_hoys_", "description": "A number or list of numbers between 0 and 8760 that respresent\r\nthe hour(s) of the year for which to generate the sky matrix. The\r\n\"LB Calculate HOY\" component can output this number given a month,\r\nday and hour. The \"LB Analysis Period\" component can output a\r\nlist of HOYs within a certain hour or date range. By default,\r\nthe matrix will be for the entire year.", "optional": true, "type": "Param_ScriptVariable"}, {"name": "high_density_", "description": "A Boolean to indicate whether the higher-density Reinhart sky\r\nmatrix should be generated (True), which has roughly 4 times the sky\r\npatches as the (default) original Tregenza sky (False). Note that,\r\nwhile the Reinhart sky has a higher resolution and is more accurate,\r\nit will result in considerably longer calculation time for incident\r\nradiation studies. The difference in sky resolution can be observed\r\nwith the \"LB Sky Dome\" component. (Default: False).", "optional": true, "type": "Param_ScriptVariable"}, {"name": "_ground_ref_", "description": "A number between 0 and 1 to note the average ground reflectance\r\nthat is associated with the sky matrix. (Default: 0.2).", "optional": true, "type": "Param_ScriptVariable"}, {"name": "_folder_", "description": "The folder in which the Radiance commands are executed to\r\nproduce the sky matrix. If None, it will be written to Ladybug's\r\ndefault EPW folder.", "optional": true, "type": "Param_ScriptVariable"}], "outputs": [{"name": "out", "description": "...", "optional": false, "type": "Param_String"}, {"name": "sky_mtx", "description": "A sky matrix object containing the radiation benefit/harm coming from each\r\npatch of the sky. This can be used for a radiation study, a radition rose,\r\nor a sky dome visualization. It can also be deconstructed into its\r\nindividual values with the \"LB Deconstruct Matrix\" component.", "optional": false, "type": "Param_GenericObject"}], "preset_items": [], "availability": "INSTANTIATED", "source": "C:/Program Files/ladybug_tools/grasshopper/ladybug_grasshopper/user_objects\\LB Benefit Sky Matrix.ghuser", "id": "LB-048", "group": "圖表與視覺化", "hub_status": "待接入 Hub", "base_guid": "410755b1-224a-4c1e-a407-bf32fb45ea7e", "sha256": "f160f02e102cd7953c5d92e662cc969e1be7ab18ae2fa9999047e0f9d09003be"}, {"file": "LB Cumulative Sky Matrix.ghuser", "name": "LB Cumulative Sky Matrix", "nickname": "", "category": "Ladybug", "subcategory": "2 :: Visualize Data", "guid": "1d6e5b24-6375-473d-80ee-9cd44e0dd7a2", "description": "Get a matrix containing radiation values from each patch of a sky dome.\r\n_\r\nCreating this matrix is a necessary pre-step before doing incident radiation\r\nanalysis with Rhino geometry or generating a radiation rose.\r\n_\r\nThis component uses Radiance's gendaymtx function to calculate the radiation\r\nfor each patch of the sky. Gendaymtx is written by Ian Ashdown and Greg Ward.\r\nMorere information can be found in Radiance manual at:\r\nhttp://www.radiance-online.org/learning/documentation/manual-pages/pdfs/gendaymtx.pdf\r\n-", "version": "None", "inputs": [{"name": "north_", "description": "A number between -360 and 360 for the counterclockwise\r\ndifference between the North and the positive Y-axis in degrees.\r\n90 is West and 270 is East. This can also be Vector for the\r\ndirection to North. (Default: 0)", "optional": true, "type": "Param_ScriptVariable"}, {"name": "_location", "description": "A ladybug Location that has been output from the \"LB Import EPW\"\r\ncomponent or the \"LB Construct Location\" component.", "optional": true, "type": "Param_ScriptVariable"}, {"name": "_direct_rad", "description": "An annual hourly DataCollection of Direct Normal Radiation such\r\nas that which is output from the \"LB Import EPW\" component or the\r\n\"LB Import STAT\" component.", "optional": true, "type": "Param_ScriptVariable"}, {"name": "_diffuse_rad", "description": "An annual hourly DataCollection of Diffuse Horizontal Radiation\r\nsuch as that which is output from the \"LB Import EPW\" component or\r\nthe \"LB Import STAT\" component.", "optional": true, "type": "Param_ScriptVariable"}, {"name": "_hoys_", "description": "A number or list of numbers between 0 and 8760 that respresent\r\nthe hour(s) of the year for which to generate the sky matrix. The\r\n\"LB Calculate HOY\" component can output this number given a month,\r\nday and hour. The \"LB Analysis Period\" component can output a\r\nlist of HOYs within a certain hour or date range. By default,\r\nthe matrix will be for the entire year.", "optional": true, "type": "Param_ScriptVariable"}, {"name": "high_density_", "description": "A Boolean to indicate whether the higher-density Reinhart sky\r\nmatrix should be generated (True), which has roughly 4 times the sky\r\npatches as the (default) original Tregenza sky (False). Note that,\r\nwhile the Reinhart sky has a higher resolution and is more accurate,\r\nit will result in considerably longer calculation time for incident\r\nradiation studies. The difference in sky resolution can be observed\r\nwith the \"LB Sky Dome\" component. (Default: False).", "optional": true, "type": "Param_ScriptVariable"}, {"name": "_ground_ref_", "description": "A number between 0 and 1 to note the average ground reflectance\r\nthat is associated with the sky matrix. (Default: 0.2).", "optional": true, "type": "Param_ScriptVariable"}, {"name": "_folder_", "description": "The folder in which the Radiance commands are executed to\r\nproduce the sky matrix. If None, it will be written to Ladybug's\r\ndefault EPW folder.", "optional": true, "type": "Param_ScriptVariable"}], "outputs": [{"name": "out", "description": "...", "optional": false, "type": "Param_String"}, {"name": "sky_mtx", "description": "A sky matrix object containing the radiation coming from each patch\r\nof the sky. This can be used for a radiation study, a radition rose,\r\nor a sky dome visualization. It can also be deconstructed into its\r\nindividual values with the \"LB Deconstruct Matrix\" component.", "optional": false, "type": "Param_GenericObject"}], "preset_items": [], "availability": "INSTANTIATED", "source": "C:/Program Files/ladybug_tools/grasshopper/ladybug_grasshopper/user_objects\\LB Cumulative Sky Matrix.ghuser", "id": "LB-049", "group": "圖表與視覺化", "hub_status": "輻射後端已使用", "base_guid": "410755b1-224a-4c1e-a407-bf32fb45ea7e", "sha256": "61ce67b02fd0886575e6199df26924ecb11724859a86903d4602c3ff693d041b"}, {"file": "LB Hourly Plot.ghuser", "name": "LB Hourly Plot", "nickname": "", "category": "Ladybug", "subcategory": "2 :: Visualize Data", "guid": "0c3d3e99-b365-4853-8de5-97a7d8ce7824", "description": "Create a colored plot of any hourly data collection.\r\n-", "version": "None", "inputs": [{"name": "_data", "description": "A HourlyContinuousCollection or HourlyDiscontinuousCollection\r\nwhich will be used to generate the hourly plot.", "optional": true, "type": "Param_ScriptVariable"}, {"name": "_base_pt_", "description": "An optional Point3D to be used as a starting point to generate\r\nthe geometry of the plot (Default: (0, 0, 0)).", "optional": true, "type": "Param_ScriptVariable"}, {"name": "_x_dim_", "description": "A number to set the X dimension of the mesh cells. (Default: 1 meters).", "optional": true, "type": "Param_ScriptVariable"}, {"name": "_y_dim_", "description": "A number to set the Y dimension of the mesh cells. (Default: 4 meters,\r\nunless a fine timestep collection is connected, in which case\r\n4.0 meters / timestep is used).", "optional": true, "type": "Param_ScriptVariable"}, {"name": "_z_dim_", "description": "A number to set the Z dimension of the entire chart. This will\r\nbe used to make the colored_mesh3d of the chart vary in the Z\r\ndimension according to the data. The value input here should usually be\r\nseveral times larger than the x_dim or y_dim in order to be noticable\r\n(e.g. 100). If 0, the colored_mesh3d will simply be flat. (Default: 0).", "optional": true, "type": "Param_ScriptVariable"}, {"name": "reverse_y_", "description": "Boolean to note whether the Y-axis of the chart is reversed\r\nIf True, time over the course of the day will flow from the top of\r\nthe chart to the bottom instead of the bottom to the top.", "optional": true, "type": "Param_ScriptVariable"}, {"name": "clock_24_", "description": "Boolean to note whether the hour labels on the Y-Axis of the chart\r\nshould be in 24-hour clock format (eg. 18:00) or they should be\r\nin 12-hour clock format (eg. 6PM).", "optional": true, "type": "Param_ScriptVariable"}, {"name": "legend_par_", "description": "An optional LegendParameter object to change the display of the\r\nHourlyPlot. This can also be a list of legend parameters to be\r\napplied to the different connected _data.", "optional": true, "type": "Param_ScriptVariable"}, {"name": "statement_", "description": "A conditional statement as a string (e.g. a > 25).\r\n.\r\nThe variable of the first data collection should always be named 'a'\r\n(without quotations), the variable of the second list should be\r\nnamed 'b', and so on.\r\n.\r\nFor example, if three data collections are connected to _data\r\nand the following statement is applied:\r\n'18 \u003c a \u003c 26 and b \u003c 80 and c > 2'\r\nThe resulting collections will only include values where the first\r\ndata collection is between 18 and 26, the second collection is less\r\nthan 80 and the third collection is greater than 2.", "optional": true, "type": "Param_ScriptVariable"}, {"name": "period_", "description": "A Ladybug analysis period to be applied to all of the input _data.", "optional": true, "type": "Param_ScriptVariable"}], "outputs": [{"name": "out", "description": "...", "optional": false, "type": "Param_String"}, {"name": "mesh", "description": "A colored mesh derived from the input _data. Multiple meshes will\r\nbe output for several data collections are input.", "optional": false, "type": "Param_GenericObject"}, {"name": "legend", "description": "Geometry representing the legend for each mesh.", "optional": false, "type": "Param_GenericObject"}, {"name": "borders", "description": "A list of lines and polylines representing different time\r\nintervals of the plot.", "optional": false, "type": "Param_GenericObject"}, {"name": "labels", "description": "A list of text objects that label the borders with the time\r\nintervals that they demarcate.", "optional": false, "type": "Param_GenericObject"}, {"name": "title", "description": "A text object for the global_title.", "optional": false, "type": "Param_GenericObject"}, {"name": "vis_set", "description": "An object containing VisualizationSet arguments for drawing a detailed\r\nversion of the Hourly Plot in the Rhino scene. This can be connected to\r\nthe \"LB Preview Visualization Set\" component to display this version\r\nof the Hourly Plot in Rhino.", "optional": false, "type": "Param_GenericObject"}], "preset_items": [], "availability": "INSTANTIATED", "source": "C:/Program Files/ladybug_tools/grasshopper/ladybug_grasshopper/user_objects\\LB Hourly Plot.ghuser", "id": "LB-050", "group": "圖表與視覺化", "hub_status": "待接入 Hub", "base_guid": "410755b1-224a-4c1e-a407-bf32fb45ea7e", "sha256": "174823fb406b577229905e4dc545b5b7aed2e5f39973c4db4b5773ed51dd936b"}, {"file": "LB Monthly Chart.ghuser", "name": "LB Monthly Chart", "nickname": "", "category": "Ladybug", "subcategory": "2 :: Visualize Data", "guid": "06a1531a-d5a1-4f92-b07c-f93f073fbec5", "description": "Create a chart in the Rhino scene with data organized by month.\r\n_\r\nData will display as a bar chart if the input data is monthly or daily. If the\r\ndata is hourly or sub-hourly, it will be plotted with lines and/or a colored\r\nmesh that shows the range of the data within specific percentiles.\r\n-", "version": "None", "inputs": [{"name": "_data", "description": "Data collections (eg. HourlyCollection, MonthlyCollection, or\r\nDailyCollection), which will be used to generate the monthly chart.", "optional": true, "type": "Param_ScriptVariable"}, {"name": "_base_pt_", "description": "An optional Point3D to be used as a starting point to generate\r\nthe geometry of the chart (Default: (0, 0, 0)).", "optional": true, "type": "Param_ScriptVariable"}, {"name": "_x_dim_", "description": "An optional number to set the X dimension of each month of the\r\nchart. (Default: 10 meters).", "optional": true, "type": "Param_ScriptVariable"}, {"name": "_y_dim_", "description": "An optional number to set the Y dimension of the entire\r\nchart (Default: 40 meters).", "optional": true, "type": "Param_ScriptVariable"}, {"name": "stack_", "description": "Boolean to note whether multiple connected monthly or daily input\r\n_data with the same units should be stacked on top of each other.\r\nOtherwise, all bars for monthly/daily data will be placed next to\r\neach other.  (Default: False).", "optional": true, "type": "Param_ScriptVariable"}, {"name": "percentile_", "description": "An optional number between 0 and 50 to be used for the percentile\r\ndifference from the mean that hourly data meshes display at. For example,\r\nusing 34 will generate hourly data meshes with a range of one standard\r\ndeviation from the mean. Note that this input only has significance when\r\nthe input data collections are hourly. (Default: 34)", "optional": true, "type": "Param_ScriptVariable"}, {"name": "time_marks_", "description": "Boolean to note whether the month labels should be replaced with\r\nmarks for the time of day in each month. This is useful for\r\ndisplaying hourly data, particularly when the input data is only\r\nfor a month and not the whole year.", "optional": true, "type": "Param_ScriptVariable"}, {"name": "global_title_", "description": "A text string to label the entire entire chart.  It will be\r\ndisplayed in the lower left of the output chart.  The default will\r\ndisplay the metadata of the input _data.", "optional": true, "type": "Param_ScriptVariable"}, {"name": "y_axis_title_", "description": "A text string to label the Y-axis of the chart.  This can\r\nalso be a list of 2 Y-axis titles if there are two different types\r\nof data connected to _data and there are two axes labels on either\r\nside of the chart.  The default will display the data type and\r\nunits of the first (and possibly the second) data collection\r\nconnected to _data.", "optional": true, "type": "Param_ScriptVariable"}, {"name": "legend_par_", "description": "An optional LegendParameter object to change the display\r\nof the chart (Default: None).", "optional": true, "type": "Param_ScriptVariable"}], "outputs": [{"name": "out", "description": "...", "optional": false, "type": "Param_String"}, {"name": "data_mesh", "description": "A list of colored meshes that represent the different input data.\r\nThese meshes will resemble a bar chart in the case of monthly or\r\ndaily data and will resemble a band between two ranges for hourly\r\nand sub-hourly data. Multiple lists of meshes will be output for\r\nseveral input data streams.", "optional": false, "type": "Param_GenericObject"}, {"name": "data_lines", "description": "A list of polylines that represent the input data. These will\r\nrepresent the average or total at each hour whenever the input data\r\nis hourly or monthly-per-hour data.", "optional": false, "type": "Param_GenericObject"}, {"name": "col_lines", "description": "A list of colored polylines that represent the input data. These\r\nwill only be output when the input data are monthly per hour.", "optional": false, "type": "Param_GenericObject"}, {"name": "legend", "description": "Geometry representing the legend for the chart, noting which\r\ncolors correspond to which input data.", "optional": false, "type": "Param_GenericObject"}, {"name": "borders", "description": "A list of lines and polylines representing the axes and intervals\r\nof the chart.", "optional": false, "type": "Param_GenericObject"}, {"name": "labels", "description": "A list of text objects that label the borders with month name\r\nand the intervals of the Y-axis.", "optional": false, "type": "Param_GenericObject"}, {"name": "y_title", "description": "A text oject for the Y-axis title.", "optional": false, "type": "Param_GenericObject"}, {"name": "title", "description": "A text object for the global_title.", "optional": false, "type": "Param_GenericObject"}, {"name": "vis_set", "description": "An object containing VisualizationSet arguments for drawing a detailed\r\nversion of the Monthly Chart in the Rhino scene. This can be connected to\r\nthe \"LB Preview Visualization Set\" component to display this version\r\nof the Monthly Chart in Rhino.", "optional": false, "type": "Param_GenericObject"}], "preset_items": [], "availability": "INSTANTIATED", "source": "C:/Program Files/ladybug_tools/grasshopper/ladybug_grasshopper/user_objects\\LB Monthly Chart.ghuser", "id": "LB-051", "group": "圖表與視覺化", "hub_status": "待接入 Hub", "base_guid": "410755b1-224a-4c1e-a407-bf32fb45ea7e", "sha256": "f6b6b164ecd6746f76be51785ce02dcd7352b135de6d9d5c1bdbb6c3188835d3"}, {"file": "LB PMV Polygon.ghuser", "name": "LB PMV Polygon", "nickname": "", "category": "Ladybug", "subcategory": "2 :: Visualize Data", "guid": "608a3bab-1d11-48bd-bc1a-593cb1f91a4a", "description": "Draw thermal comfort polygons on a Psychrometric Chart using the PMV model for\r\nindoor thermal comfort.\r\n_\r\nThis component can also plot passive strategy polygons on the psychrometric chart\r\nand can compute the number of hours that lie inside each of the comfort / strategy\r\npolygons.\r\n-", "version": "None", "inputs": [{"name": "_psych_chart", "description": "A hourly, daily, or sub-hourly data collection of temperature values\r\nor a single temperature value in Celcius to be used for the whole\r\nanalysis. If this input data collection is in in Farenheit, the\r\nentire chart will be drawn using IP units. Operative temperature\r\nshould be used if it is available. Otherwise, air temperature\r\n(aka. dry bulb temperature) is suitable.", "optional": true, "type": "Param_ScriptVariable"}, {"name": "_mrt_", "description": "A number or list of numbers for the mean radiant temperature. These\r\nshould be in Celsius if the Psychrometric Chart is in SI and\r\nFarenheit if the Psychrometric Chart is in IP. If None, a polygon for\r\noperative temperature will be plot, assuming that radiant temperature\r\nand air temperature are the same. (Default: None).", "optional": true, "type": "Param_ScriptVariable"}, {"name": "_air_speed_", "description": "A number or list of numbers for the air speed values in m/s. If None, a\r\nlow air speed of 0.1 m/s wil be used for all polygons. (Default: None).", "optional": true, "type": "Param_ScriptVariable"}, {"name": "_met_rate_", "description": "A number or list of numbers for the metabolic rate in met. If None, a met\r\nrate of 1.1 met will be used for all polygons, indicating a human\r\nsubject who is seated, typing. (Default: None).", "optional": true, "type": "Param_ScriptVariable"}, {"name": "_clothing_", "description": "A number or list of numbers for the clothing level in clo. If None, a clo\r\nlevel of 0.7 clo will be used for all polygons, indicating a human\r\nsubject with a long sleeve shirt and pants. (Default: None).", "optional": true, "type": "Param_ScriptVariable"}, {"name": "pmv_par_", "description": "Optional PMVParameter object to specify parameters under\r\nwhich conditions are considered acceptable. If None, default will\r\nassume a PPD threshold of 10%, no absolute humidity constraints\r\nand a still air threshold of 0.1 m/s.", "optional": true, "type": "Param_ScriptVariable"}, {"name": "merge_poly_", "description": "Boolean to note whether all comfort polygons should be merged\r\ninto a single polygon instead of separate polygons for each set of\r\ninput conditions. (Default: False).", "optional": true, "type": "Param_ScriptVariable"}, {"name": "strategies_", "description": "An optional text input of passive strategies to be plot on the\r\npsychrometric chart as polygons.  It is recommended that the\r\n\"LB Passive Strategy\" component be used to select which polygons\r\nto plot.", "optional": true, "type": "Param_ScriptVariable"}, {"name": "strategy_par_", "description": "Optional passive strategy parameters from the \"LB Passive Strategy\r\nParameters\" component. This can be used to adjust various inputs\r\nused to generate strategy polygons including the maximum comfortable\r\nair speed, the building balance temperature, and the temperature\r\nlimits for thermal mass and night flushing.", "optional": true, "type": "Param_ScriptVariable"}, {"name": "solar_data_", "description": "An annual hourly continuous data collection of irradiance\r\n(or radiation) in W/m2 (or Wh/m2) that aligns with the data\r\npoints on the psychrometric chart. This is only required when\r\nplotting a \"Passive Solar Heating\" strategy polygon on the chart.\r\nThe irradiance values should be incident on the orientation of\r\nthe passive solar heated windows. So using global horizontal\r\nradiation assumes that all windows are skylights (like a\r\ngreenhouse). The \"LB Directional Irradiance\" component can be\r\nused to get irradiance data for a specific surface orientation.", "optional": true, "type": "Param_ScriptVariable"}], "outputs": [{"name": "out", "description": "...", "optional": false, "type": "Param_String"}, {"name": "total_comfort", "description": "The percent of the data on the psychrometric chart that\r\nare inside all comfort and passive strategy polygons.", "optional": false, "type": "Param_GenericObject"}, {"name": "total_comf_data", "description": "Data collection or a 0/1 value noting whether each of the data\r\npoints on the psychrometric chart lies inside of a comfort polygon\r\nor a strategy polygon.\r\n_\r\nThis can be connected to the \"LB Create Legend\" component to generate\r\na list of colors that can be used to color the points output from\r\n\"LB Psychrometric Chart\" component to see exactly which points are\r\ncomfortable and which are not.\r\n_\r\nValues are one of the following:\r\n0 = uncomfortable\r\n1 = comfortable", "optional": false, "type": "Param_GenericObject"}, {"name": "polygon_names", "description": "A list of names for each of the polygons. This will include both the\r\ncomfort polygons and the passive strategy polygons. The order of these\r\nnames correspondsto the total_strategies and strategies_data outputs.", "optional": false, "type": "Param_GenericObject"}, {"name": "polygon_comfort", "description": "The percent of the input data that are in each of the comfort\r\nor passive strategy polygons. Each number here corresponds to the names\r\nin the polygon_names output above.", "optional": false, "type": "Param_GenericObject"}, {"name": "polygon_data", "description": "A list of data collections or 0/1 values indicating whether each \r\nof the data points on the psychrometric chart lies inside each of\r\nthe comfort or a strategy polygons. Each data collection or here corresponds\r\nto the names in the polygon_names output above.\r\n_\r\nValues are one of the following:\r\n0 = uncomfortable\r\n1 = comfortable", "optional": false, "type": "Param_GenericObject"}, {"name": "comfort_poly", "description": "Brep representing the range of comfort for the input mrt, air speed,\r\nmetabolic rate and clothing level. If multiple values have been\r\ninput, multiple polygons will be output here.", "optional": false, "type": "Param_GenericObject"}, {"name": "strategy_poly", "description": "Brep representing the area of the chart made comfortable by any\r\ninput passive strategies. If multiple strategies have been input to\r\nthe strategies_ input, multiple polygons will be output here.", "optional": false, "type": "Param_GenericObject"}], "preset_items": [], "availability": "INSTANTIATED", "source": "C:/Program Files/ladybug_tools/grasshopper/ladybug_grasshopper/user_objects\\LB PMV Polygon.ghuser", "id": "LB-052", "group": "圖表與視覺化", "hub_status": "待接入 Hub", "base_guid": "410755b1-224a-4c1e-a407-bf32fb45ea7e", "sha256": "3e7e05a08d87d96083cfeab5764a8983055694d8ca4f98501dbcbcf6b6a374c2"}, {"file": "LB Psychrometric Chart.ghuser", "name": "LB Psychrometric Chart", "nickname": "", "category": "Ladybug", "subcategory": "2 :: Visualize Data", "guid": "365d09f2-55fd-4002-85da-fb7ec3d018bd", "description": "Draw a psychrometric chart in the Rhino scene and plot a set of temperatures and\r\nhumidity values on it.\r\n_\r\nConnected data can be either outdoor temperature and humidty from imported EPW\r\nweather data or indoor temperature and humidity ratios from an energy simulation.\r\n-", "version": "None", "inputs": [{"name": "_temperature", "description": "A hourly, daily, or sub-hourly data collection of temperature values\r\nor a single temperature value in Celcius to be used for the whole\r\nanalysis. If this input data collection is in in Farenheit, the\r\nentire chart will be drawn using IP units. Operative temperature\r\nshould be used if it is available. Otherwise, air temperature\r\n(aka. dry bulb temperature) is suitable.", "optional": true, "type": "Param_ScriptVariable"}, {"name": "_rel_humidity", "description": "A hourly, daily, or sub-hourly data collection of relative humidity\r\nvalues in % or a single relative humidity value to be used for the\r\nwhole analysis. Note that the input data collection here must align\r\nwith the _temperature input.", "optional": true, "type": "Param_ScriptVariable"}, {"name": "_pressure_", "description": "A data collection of atmospheric pressure in Pascals or a single\r\nnumber for the average air pressure across the data plotted on the\r\nchart. It is recommended that the barometric pressure from the\r\n\"Import EPW\" component be used here as the default is not sutiable\r\nfor higher elevations. (Default: 101325 Pa; pressure at sea level).", "optional": true, "type": "Param_ScriptVariable"}, {"name": "_base_pt_", "description": "A point to be used as the bottom-left-most point from which all\r\ngeometry of the plot will be generated. (Default: (0, 0, 0)).", "optional": true, "type": "Param_ScriptVariable"}, {"name": "_scale_", "description": "A number to set the dimensions of the chart. (Default: 1).", "optional": true, "type": "Param_ScriptVariable"}, {"name": "_temp_range_", "description": "An optional domain (or number for the upper temperature), which\r\nwill be used to set the lower and upper boundaries of temperature\r\non the psychrometric chart. (Default: -20 to 55 when the chart is\r\nin SI; -5 to 115 when the chart is in IP).", "optional": true, "type": "Param_ScriptVariable"}, {"name": "plot_wet_bulb_", "description": "Boolean to note whether the psychrometric chart should be ploted\r\nwith lines of constant enthalpy (False) or lines of constant wet bulb\r\ntemperature (True).  (Default: False).", "optional": true, "type": "Param_ScriptVariable"}, {"name": "legend_par_", "description": "An optional LegendParameter object from the \"LB Legend Parameters\"\r\ncomponent to change the display of the Pyschrometric Chart.", "optional": true, "type": "Param_ScriptVariable"}, {"name": "data_", "description": "Optional data collections, which are aligned with the input _temperature\r\nand _rel_humidity, which will be output from the data of this\r\ncomponent and can be used to color points with data. This data\r\ncan also be used along with the statement_ below to select out\r\ndata that meets certain conditions.", "optional": true, "type": "Param_ScriptVariable"}, {"name": "statement_", "description": "A conditional statement as a string (e.g. a > 25).\r\n.\r\nThe variable of the first data collection should always be named 'a'\r\n(without quotations), the variable of the second list should be\r\nnamed 'b', and so on.\r\n.\r\nFor example, if three data collections are connected to _data\r\nand the following statement is applied:\r\n'18 \u003c a \u003c 26 and b \u003c 80 and c > 2'\r\nThe resulting collections will only include values where the first\r\ndata collection is between 18 and 26, the second collection is less\r\nthan 80 and the third collection is greater than 2.\r\n.\r\nFor this component, temperature will always be the second-to-last\r\nletter and relative humidity will be the last letter.", "optional": true, "type": "Param_ScriptVariable"}, {"name": "period_", "description": "A Ladybug analysis period to be applied to the _temperature and\r\n_rel_humidity of the input data_.", "optional": true, "type": "Param_ScriptVariable"}], "outputs": [{"name": "out", "description": "...", "optional": false, "type": "Param_String"}, {"name": "title", "description": "Text objects for the chart title and axes titles as well as a polyline for\r\nthe outer border of the chart. Note that the polyline for the border\r\nexcludes the saturation line.", "optional": false, "type": "Param_GenericObject"}, {"name": "temp_lines", "description": "A list of line segments and text objects for the temperature labels\r\non the chart.", "optional": false, "type": "Param_GenericObject"}, {"name": "rh_lines", "description": "A list of curves and text objects for the relative humidity labels\r\non the chart.", "optional": false, "type": "Param_GenericObject"}, {"name": "hr_lines", "description": "A list of line segments and text objects for the humidty ratio labels\r\non the chart.", "optional": false, "type": "Param_GenericObject"}, {"name": "enth_wb_lines", "description": "A list of line segments and text objects for the enthalpy or\r\nwet bulb temperature labels on the chart.", "optional": false, "type": "Param_GenericObject"}, {"name": "mesh", "description": "A colored mesh showing the number of input hours that happen in each part\r\nof the psychrometric chart.", "optional": false, "type": "Param_GenericObject"}, {"name": "legend", "description": "A colored legend showing the number of hours that correspond to\r\neach color.", "optional": false, "type": "Param_GenericObject"}, {"name": "points", "description": "Points representing each of the input temperature and humidity values.\r\nBy default, this ouput is hidden and it should be connected it to a\r\nnative Grasshopper preview component to view it.", "optional": false, "type": "Param_GenericObject"}, {"name": "data", "description": "The input data_ with the input statements or the periods applied to it.\r\nThese can be deconstructed with the \"LB Deconstruct Data\" component\r\nand the resulting values can be plugged into the \"LB Create Legend\"\r\ncomponent to generate colors that can be used to color the points\r\nabove using the native Grasshopper \"Custom Preview\" component.", "optional": false, "type": "Param_GenericObject"}, {"name": "psych_chart", "description": "A Psychrometric Chart object, which can be connected to any\r\nof the \"Comfort Polygon\" components in order to plot polygons on\r\nthe chart and perform thermal comfort analyses on the data.", "optional": false, "type": "Param_GenericObject"}, {"name": "vis_set", "description": "An object containing VisualizationSet arguments for drawing a detailed\r\nversion of the Psychrometric Chart in the Rhino scene. This can be\r\nconnected to the \"LB Preview Visualization Set\" component to display\r\nthis version of the Psychrometric Chart in Rhino.", "optional": false, "type": "Param_GenericObject"}], "preset_items": [], "availability": "INSTANTIATED", "source": "C:/Program Files/ladybug_tools/grasshopper/ladybug_grasshopper/user_objects\\LB Psychrometric Chart.ghuser", "id": "LB-053", "group": "圖表與視覺化", "hub_status": "待接入 Hub", "base_guid": "410755b1-224a-4c1e-a407-bf32fb45ea7e", "sha256": "f221febf4db27a38c488bf097cf086c6ffff9db4708ad020884c99efd1cbaafb"}, {"file": "LB Radiation Dome.ghuser", "name": "LB Radiation Dome", "nickname": "", "category": "Ladybug", "subcategory": "2 :: Visualize Data", "guid": "cf1732ea-b6a4-4a97-a7d4-c1de8b10ca4f", "description": "Visualize the radiation falling on an object from different directions over a dome.\r\n_\r\nThe Radiation Dome depicts the amount of solar energy received by all directions\r\nover a dome. This is useful for understanding the optimal orientation of solar\r\npanels and how the performance of the panel might change if it's orientation\r\nis off from the optimal position. It can also be used to identify the optimal\r\nwall orientation for passive solar heating when used with skies of\r\nradiation harm/benefit. When used with clear sky matrices, it can identify\r\nthe orientations that result in the highest and lowest peak cooling load.\r\n_\r\nThe Radiation Dome can be understood in different ways:\r\n1) It's a 3D representation of the \"LB Radiation Rose,\" depicting all tilt angles\r\n    for that rose at once.\r\n2) It's the reciprocal of the \"LB Sky Dome,\" since it shows how the radiation from\r\n    that sky falls onto a hemispherical object.\r\n3) It's an radiation study of a hemisphere. The results here are effectively the\r\n    same as running a hemisphere through the \"LB Incident Radiation\" component.\r\n-", "version": "None", "inputs": [{"name": "_sky_mtx", "description": "A Sky Matrix from the \"LB Cumulative Sky Matrix\" component or the\r\n\"LB Benefit Sky Matrix\" component, which describes the radiation\r\ncoming from the various patches of the sky.", "optional": true, "type": "Param_ScriptVariable"}, {"name": "context_", "description": "Rhino Breps and/or Rhino Meshes representing context geometry\r\nthat can block solar radiation to the center of the radiation dome.", "optional": true, "type": "Param_ScriptVariable"}, {"name": "_az_count_", "description": "An integer greater than or equal to 3, which notes the number of\r\nhorizontal orientations to be evaluated on the dome. (Default: 72).", "optional": true, "type": "Param_ScriptVariable"}, {"name": "_alt_count_", "description": "An integer greater than or equal to 3, which notes the number of\r\nvertical orientations to be evaluated on the dome. (Default: 18).", "optional": true, "type": "Param_ScriptVariable"}, {"name": "_center_pt_", "description": "A point for the center of the radiation dome. (Default: (0, 0, 0))", "optional": true, "type": "Param_ScriptVariable"}, {"name": "_scale_", "description": "A number to set the scale of the Radiation Dome. The default is 1,\r\nwhich corresponds to a radius of 100 meters in the current Rhino\r\nmodel's unit system.", "optional": true, "type": "Param_ScriptVariable"}, {"name": "projection_", "description": "Optional text for the name of a projection to use from the sky\r\ndome hemisphere to the 2D plane. If None, a 3D sky dome will be drawn\r\ninstead of a 2D one. (Default: None) Choose from the following:\r\n* Orthographic\r\n* Stereographic\r\n* Equidistant\r\n* Equisolid", "optional": true, "type": "Param_ScriptVariable"}, {"name": "irradiance_", "description": "Boolean to note whether the radiation dome should be plotted with units\r\nof cumulative Radiation (kWh/m2) [False] or with units of average\r\nIrradiance (W/m2) [True]. (Default: False).", "optional": true, "type": "Param_ScriptVariable"}, {"name": "show_comp_", "description": "Boolean to indicate whether only one dome with total radiation\r\nshould be displayed (False) or three domes with the solar radiation\r\ncomponents (total, direct, and diffuse) should be shown. (Default: False).", "optional": true, "type": "Param_ScriptVariable"}, {"name": "legend_par_", "description": "An optional LegendParameter object to change the display of the\r\nradiation dome (Default: None).", "optional": true, "type": "Param_ScriptVariable"}], "outputs": [{"name": "out", "description": "...", "optional": false, "type": "Param_String"}, {"name": "mesh", "description": "A colored mesh of a dome, representing the intensity of radiation/irradiance\r\nfrom different cardinal directions.", "optional": false, "type": "Param_GenericObject"}, {"name": "compass", "description": "A set of circles, lines and text objects that mark the cardinal\r\ndirections in relation to the radiation dome.", "optional": false, "type": "Param_GenericObject"}, {"name": "legend", "description": "A legend showing the kWh/m2 or W/m2 values that correspond to the colors\r\nof the mesh.", "optional": false, "type": "Param_GenericObject"}, {"name": "title", "description": "A text object for the title of the radiation dome.", "optional": false, "type": "Param_GenericObject"}, {"name": "dir_vecs", "description": "A list of vectors for each of the directions the dome is facing.\r\nAll vectors are unit vectors.", "optional": false, "type": "Param_GenericObject"}, {"name": "dir_values", "description": "Radiation values for each of the dome directions in kWh/m2 or W/m2.\r\nThis will be one list if show_comp_ is \"False\" and a list of 3\r\nlists (aka. a Data Tree) for total, direct, diffuse if show_comp_\r\nis \"True\".", "optional": false, "type": "Param_GenericObject"}, {"name": "max_pt", "description": "A point on the radiation dome with the greatest amount of solar\r\nradiation/irradiance. For a radiation benefit sky, this is the\r\norientation with the greatest benefit. This can be used to\r\nunderstand the optimalorientation of solar panels or the best\r\ndirection to face for passive solar heating.", "optional": false, "type": "Param_GenericObject"}, {"name": "max_info", "description": "Information about the direction with the greates amount of radiation.\r\nThis includes the altitude, azimuth, and radiation/irradiance value.", "optional": false, "type": "Param_GenericObject"}, {"name": "vis_set", "description": "An object containing VisualizationSet arguments for drawing a detailed\r\nversion of the Radiation Dome in the Rhino scene. This can be\r\nconnected to the \"LB Preview Visualization Set\" component to display\r\nthis version of the Radiation Dome in Rhino.", "optional": false, "type": "Param_GenericObject"}], "preset_items": [], "availability": "INSTANTIATED", "source": "C:/Program Files/ladybug_tools/grasshopper/ladybug_grasshopper/user_objects\\LB Radiation Dome.ghuser", "id": "LB-054", "group": "圖表與視覺化", "hub_status": "待接入 Hub", "base_guid": "410755b1-224a-4c1e-a407-bf32fb45ea7e", "sha256": "bd79bcd84768ba44b79d9af81406b6e29137c04d36af53668966c3811cb0bde3"}, {"file": "LB Radiation Rose.ghuser", "name": "LB Radiation Rose", "nickname": "", "category": "Ladybug", "subcategory": "2 :: Visualize Data", "guid": "1989e696-ffc9-4b9b-80a6-9169a753b718", "description": "Visualize the solar energy falling on different direction as a rose.\r\n_\r\nBy default, the Radiation Rose depicts the amount of solar energy received\r\nby a vertical wall facing each of the directions of the compass rose.\r\n_\r\nThis is useful for understanding the radiation harm/benefit experienced by\r\ndifferent building orientations or the orientations with the highest peak cooling\r\nload (for sky matrices of clear skies). The tilt_angle can be used to assess the\r\nsolar energy falling on geometries that are not perfectly vertical, such\r\nas tilted photovoltaic panels.\r\n-", "version": "None", "inputs": [{"name": "_sky_mtx", "description": "A Sky Matrix from the \"LB Cumulative Sky Matrix\" component or the\r\n\"LB Benefit Sky Matrix\" component, which describes the radiation\r\ncoming from the various patches of the sky.", "optional": true, "type": "Param_ScriptVariable"}, {"name": "context_", "description": "Rhino Breps and/or Rhino Meshes representing context geometry\r\nthat can block solar radiation to the center of the radiation rose.", "optional": true, "type": "Param_ScriptVariable"}, {"name": "_dir_count_", "description": "An integer greater than or equal to 3, which notes the number of\r\narrows to be generated for the radiation rose. (Default: 36).", "optional": true, "type": "Param_ScriptVariable"}, {"name": "_tilt_angle_", "description": "A number between 0 and 90 that sets the vertical tilt angle (aka.\r\nthe altitude) for all of the directions. By default, the Radiation\r\nRose depicts the amount of solar energy received by a vertical\r\nwall (tilt_angle=0). The tilt_angle can be changed to a specific\r\nvalue to assess the solar energy falling on geometries that are not\r\nperfectly vertical, such as a tilted photovoltaic panel. (Default: 0).", "optional": true, "type": "Param_ScriptVariable"}, {"name": "_center_pt_", "description": "A point for the center of the radiation rose. (Default: (0, 0, 0))", "optional": true, "type": "Param_ScriptVariable"}, {"name": "_scale_", "description": "A number to set the scale of the Radiation Rose. The default is 1,\r\nwhich corresponds to a radius of 100 meters in the current Rhino\r\nmodel's unit system.", "optional": true, "type": "Param_ScriptVariable"}, {"name": "_arrow_scale_", "description": "A fractional number to note the scale of the radiation rose arrows\r\nin relation to the entire graphic. (Default: 1).", "optional": true, "type": "Param_ScriptVariable"}, {"name": "max_rad_", "description": "An optional number to set the level of radiation or irradiance associated\r\nwith the full radius of the rose. If unspecified, this is determined\r\nby the maximum level of radiation in the input data but a number\r\ncan be specified here to fix this at a specific value. This is\r\nparticularly useful when comparing different roses to one another.", "optional": true, "type": "Param_ScriptVariable"}, {"name": "irradiance_", "description": "Boolean to note whether the radiation rose should be plotted with units\r\nof cumulative Radiation (kWh/m2) [False] or with units of average\r\nIrradiance (W/m2) [True]. (Default: False).", "optional": true, "type": "Param_ScriptVariable"}, {"name": "show_comp_", "description": "Boolean to indicate whether only one rose with total radiation\r\nshould be displayed (False) or three roses with the solar radiation\r\ncomponents (total, direct, and diffuse) should be shown. (Default: False).", "optional": true, "type": "Param_ScriptVariable"}, {"name": "legend_par_", "description": "An optional LegendParameter object to change the display of the\r\nRadiation Rose
