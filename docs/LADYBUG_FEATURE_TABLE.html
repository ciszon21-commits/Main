1ae"}, {"file": "LB Import EPW.ghuser", "name": "LB Import EPW", "nickname": "", "category": "Ladybug", "subcategory": "0 :: Import", "guid": "1d43c9d4-c21b-4e48-ad92-0da42c4ded07", "description": "Import climate data from a standard .epw file.\r\n-", "version": "None", "inputs": [{"name": "_epw_file", "description": "An .epw file path on your system as a string.", "optional": true, "type": "Param_ScriptVariable"}], "outputs": [{"name": "location", "description": "A Ladybug Location object describing the location data in the\r\nweather file.", "optional": false, "type": "Param_GenericObject"}, {"name": "dry_bulb_temperature", "description": "The houlry dry bulb temperature, in C.\r\nNote that this is a full numeric field (i.e. 23.6) and not an integer\r\nrepresentation with tenths. Valid values range from 70 C to\r\n70 C. Missing value for this field is 99.9.", "optional": false, "type": "Param_GenericObject"}, {"name": "dew_point_temperature", "description": "The hourly dew point temperature, in C.\r\nNote that this is a full numeric field (i.e. 23.6) and not an integer\r\nrepresentation with tenths. Valid values range from 70 C to\r\n70 C. Missing value for this field is 99.9.", "optional": false, "type": "Param_GenericObject"}, {"name": "relative_humidity", "description": "The hourly Relative Humidity in percent.\r\nValid values range from 0% to 110%. Missing value for this field is 999.", "optional": false, "type": "Param_GenericObject"}, {"name": "wind_speed", "description": "The hourly wind speed in m/sec.\r\nValues can range from 0 to 40. Missing value is 999.", "optional": false, "type": "Param_GenericObject"}, {"name": "wind_direction", "description": "The hourly wind direction in degrees.\r\nThe convention is North=0.0, East=90.0, South=180.0, West=270.0.\r\nIf wind is calm for the given hour, the direction equals zero.\r\nValues can range from 0 to 360. Missing value is 999.", "optional": false, "type": "Param_GenericObject"}, {"name": "direct_normal_rad", "description": "The hourly Direct Normal Radiation in Wh/m2.\r\nDirec Normal Radiation is the amount of solar radiation in Wh/m2\r\nreceived directly from the solar disk on a surface perpendicular\r\nto the sun's rays. Missing values are (9999).", "optional": false, "type": "Param_GenericObject"}, {"name": "diffuse_horizontal_rad", "description": "The hourly Diffuse Horizontal Radiation in Wh/m2.\r\nDiffuse Horizontal Radiation is the amount of solar radiation in\r\nWh/m2 received from the sky (excluding the solar disk) on a\r\nhorizontal surface. Missing values are (9999).", "optional": false, "type": "Param_GenericObject"}, {"name": "global_horizontal_rad", "description": "The hourly Global Horizontal Radiation in Wh/m2.\r\nGlobal Horizontal Radiation is the total amount of direct and\r\ndiffuse solar radiation in Wh/m2 received on a horizontal surface.\r\nIt is not currently used inbEnergyPlus calculations. It should\r\nhave a minimum value of 0; missing value for this field is 9999.", "optional": false, "type": "Param_GenericObject"}, {"name": "horizontal_infrared_rad", "description": "The Horizontal Infrared Radiation Intensity in Wh/m2.\r\nIf it is missing, EnergyPlus calculates it from the Opaque Sky Cover\r\nfield. It should have a minimum value of 0; missing value is 9999.", "optional": false, "type": "Param_GenericObject"}, {"name": "direct_normal_ill", "description": "The hourly Direct Normal Illuminance in lux.\r\nDirect Normal Illuminance is the average amount of illuminance in\r\nlux received directly from the solar disk on a surface\r\nperpendicular to the sun's rays. It is not currently used in\r\nEnergyPlus calculations. It should have a minimum value of 0;\r\nmissing value is 999999.", "optional": false, "type": "Param_GenericObject"}, {"name": "diffuse_horizontal_ill", "description": "The hourly Diffuse Horizontal Illuminance in lux.\r\nDiffuse Horizontal Illuminance is the average amount of illuminance\r\nin lux received from the sky (excluding the solar disk) on a\r\nhorizontal surface. It is not currently used in EnergyPlus\r\ncalculations. It should have a minimum value of 0; missing\r\nvalue is 999999.", "optional": false, "type": "Param_GenericObject"}, {"name": "global_horizontal_ill", "description": "The hourly Global Horizontal Illuminance in lux.\r\nGlobal Horizontal Illuminance is the average total amount of\r\ndirect and diffuse illuminance in lux received on a horizontal\r\nsurface. It is not currently used in EnergyPlus calculations.\r\nIt should have a minimum value of 0; missing value is 999999.", "optional": false, "type": "Param_GenericObject"}, {"name": "total_sky_cover", "description": "The fraction for Total Sky Cover  in tenths of coverage.\r\n(eg. 1 is 1/10 covered. 10 is total coverage). Total Sky Cover is\r\nthe amount of the sky dome covered by clouds or obscuring phenomena.\r\nMinium value is 0; maximum value is 10; missing value is 99.", "optional": false, "type": "Param_GenericObject"}, {"name": "barometric_pressure", "description": "The hourly weather station pressure in Pa.\r\nValid values range from 31,000 to 120,000. Missing value is 999999.", "optional": false, "type": "Param_GenericObject"}, {"name": "model_year", "description": "The year from which the hourly data has been extracted.\r\nEPW files are synthesized from real recorded data from different\r\nyears in a given climate. This is done to ensure that, for each\r\nmonth, the selected data is statistically representative of the\r\naverage monthly conditions over the 18+ years of recording the data.\r\nDifferent EPW files will be synthesized from different years\r\ndepeding on whether they are TMY (Typical Meteorological Year),\r\nTMY2, TMY3, AMY (Actual Meteorological Year) or other.", "optional": false, "type": "Param_GenericObject"}, {"name": "ground_temperature", "description": "Monthly ground temperature data if it exists within\r\nthe EPW file. Typically, each data collection in this list\r\nrepresents monthly temperatures at three different depths.\r\n- 0.5 meters\r\n- 2.0 meters\r\n- 4.0 meters", "optional": false, "type": "Param_GenericObject"}], "preset_items": [], "availability": "INSTANTIATED", "source": "C:/Program Files/ladybug_tools/grasshopper/ladybug_grasshopper/user_objects\\LB Import EPW.ghuser", "id": "LB-009", "group": "氣象與地點匯入", "hub_status": "已接入並實測", "base_guid": "410755b1-224a-4c1e-a407-bf32fb45ea7e", "sha256": "20b28ad970bdc440cb6f0c1d7caa86faa9e5998efb8d56e5765675cd683c1150"}, {"file": "LB Import Location.ghuser", "name": "LB Import Location", "nickname": "", "category": "Ladybug", "subcategory": "0 :: Import", "guid": "181bbbdb-1ee9-4310-a84e-5212df2fe352", "description": "Import location from an epw file.\r\n-", "version": "None", "inputs": [{"name": "_epw_file", "description": "An epw file path on your system as a string.", "optional": true, "type": "Param_ScriptVariable"}], "outputs": [{"name": "location", "description": "Location data (use this output to construct the sun path).", "optional": false, "type": "Param_GenericObject"}], "preset_items": [], "availability": "INSTANTIATED", "source": "C:/Program Files/ladybug_tools/grasshopper/ladybug_grasshopper/user_objects\\LB Import Location.ghuser", "id": "LB-010", "group": "氣象與地點匯入", "hub_status": "待接入 Hub", "base_guid": "410755b1-224a-4c1e-a407-bf32fb45ea7e", "sha256": "33e855aa28bc6707559d7773f5872914e57aea8b2f2555adefaa628d3f429558"}, {"file": "LB Import STAT.ghuser", "name": "LB Import STAT", "nickname": "", "category": "Ladybug", "subcategory": "0 :: Import", "guid": "7a1e3c7e-ebea-4661-b01f-3e5b5e12e294", "description": "Import data from a standard .stat file.\r\n-", "version": "None", "inputs": [{"name": "_stat_file", "description": "A .stat file path on your system as a string.", "optional": true, "type": "Param_ScriptVariable"}], "outputs": [{"name": "location", "description": "A Ladybug Location object describing the location data in the STAT file.", "optional": false, "type": "Param_GenericObject"}, {"name": "ashrae_zone", "description": "The ASHRAE climate zone of the STAT file. Numbers in the zone\r\ndenote average temperature (0 = Hottest; 8 = Coldest). Letters in\r\nthe zone denote wetness (A = Humid; B = Dry; C = Marine)", "optional": false, "type": "Param_GenericObject"}, {"name": "koppen_zone", "description": "The Koppen climate zone of the STAT file. The Koppen climate\r\nsystem uses vegetation as in indicator fo climate and combines\r\naverage monthly temperatures, precipitation, and the seasonality\r\nof precipitation.", "optional": false, "type": "Param_GenericObject"}, {"name": "clear_dir_norm_rad", "description": "The hourly \"Clear Sky\" Direct Normal Radiation in Wh/m2.\r\nSuch clear sky radiation is typically used for sizing cooling\r\nsystems. If monthly optical depths are found within the STAT\r\nfile, these values will come from the Revised ASHARAE Clear Sky\r\n(Tau model). If no optical depths are found, they will come from\r\nthe original ASHARE lear sky model.", "optional": false, "type": "Param_GenericObject"}, {"name": "clear_diff_horiz_rad", "description": "The hourly \"Clear Sky\" Diffuse Horizontal Radiation\r\nin Wh/m2. Such clear sky radiation is typically used for sizing\r\ncooling systems. If monthly optical depths are found within the\r\nSTAT file, these values will come from the Revised ASHARAE Clear Sky\r\n(Tau model). If no optical depths are found, they will come from\r\nthe original ASHARE lear sky model.", "optional": false, "type": "Param_GenericObject"}, {"name": "ann_heat_dday_996", "description": "A DesignDay object representing the annual 99.6%\r\nheating design day.", "optional": false, "type": "Param_GenericObject"}, {"name": "ann_heat_dday_990", "description": "A DesignDay object representing the annual 99.0%\r\nheating design day.", "optional": false, "type": "Param_GenericObject"}, {"name": "ann_cool_dday_004", "description": "A DesignDay object representing the annual 0.4%\r\ncooling design day.", "optional": false, "type": "Param_GenericObject"}, {"name": "ann_cool_dday_010", "description": "A DesignDay object representing the annual 1.0%\r\ncooling design day.", "optional": false, "type": "Param_GenericObject"}, {"name": "monthly_ddays_050", "description": "A list of 12 DesignDay objects representing monthly\r\n5.0% cooling design days.", "optional": false, "type": "Param_GenericObject"}, {"name": "monthly_ddays_100", "description": "A list of 12 DesignDay objects representing monthly\r\n10.0% cooling design days.", "optional": false, "type": "Param_GenericObject"}, {"name": "extreme_cold_week", "description": "A Ladybug AnalysisPeriod object representing the\r\ncoldest week within the corresponding EPW.", "optional": false, "type": "Param_GenericObject"}, {"name": "extreme_hot_week", "description": "A Ladybug AnalysisPeriod object representing the\r\nhottest week within the corresponding EPW.", "optional": false, "type": "Param_GenericObject"}, {"name": "typical_weeks", "description": "A list of Ladybug AnalysisPeriod objects representing\r\ntypical weeks within the corresponding EPW.\r\nThe type of week can vary depending on the climate.\r\n_\r\nFor mid and high lattitude climates with 4 seasons (eg. New York),\r\nthese weeks are for each of the 4 seasons ordered as follows:\r\nWinter, Spring, Summer, Autumn\r\n_\r\nFor low lattitude climates with wet/dry seasons (eg. Mumbai),\r\nthese weeks might also include:\r\nWet Season, Dry Season\r\n_\r\nFor equitorial climates with no seasons (eg. Singapore),\r\nThis output is usually a single week representing typical\r\nconditions of the entire year.", "optional": false, "type": "Param_GenericObject"}], "preset_items": [], "availability": "INSTANTIATED", "source": "C:/Program Files/ladybug_tools/grasshopper/ladybug_grasshopper/user_objects\\LB Import STAT.ghuser", "id": "LB-011", "group": "氣象與地點匯入", "hub_status": "待接入 Hub", "base_guid": "410755b1-224a-4c1e-a407-bf32fb45ea7e", "sha256": "815849fcca8f6fb305c69641ba395dd72fa4bb7fdd746c7537931fc25fd5292b"}, {"file": "LB Adaptive Comfort.ghuser", "name": "LB Adaptive Comfort", "nickname": "", "category": "Ladybug", "subcategory": "1 :: Analyze Data", "guid": "d0385f14-397c-4032-b5e0-d7aed3b87062", "description": "Calculate Adaptive thermal comfort.\r\n-\r\nThe Adaptive thermal comfort model is for use on the interior of buildings where\r\na heating or cooling system is not operational and occupants have the option to\r\nopen windows for natural ventilation.\r\n-\r\nNote that, for fully conditioned buildings, the PMV thermal comfort model should\r\nbe used.\r\n-", "version": "None", "inputs": [{"name": "_out_temp", "description": "Outdoor temperatures in one of the following formats:\r\n* A Data Collection of outdoor dry bulb temperatures recorded over\r\nthe entire year. This Data Collection must be continouous and\r\nmust either be an Hourly Collection or Daily Collection. In the event\r\nthat the input adapt_par_ has a _avgm_or_runmean_ set to True,\r\nMonthly collections are also acceptable here. Note that, because\r\nan annual input is required, this input collection does not have\r\nto align with the _air_temp or _mrt_ inputs.\r\n* A Data Collection of prevailing outdoor temperature values in C.\r\nThis Data Collection must align with the _air_temp or _mrt_\r\ninputs and bear the PrevailingOutdoorTemperature data type in\r\nits header.\r\n* A single prevailing outdoor temperature value in C to be used\r\nfor all of the _air_temp or _mrt_ inputs.", "optional": true, "type": "Param_ScriptVariable"}, {"name": "_air_temp", "description": "Data Collection or individual value for air temperature in C.", "optional": true, "type": "Param_ScriptVariable"}, {"name": "_mrt_", "description": "Data Collection or individual value for mean radiant temperature\r\n(MRT) in C. Default is the same as the air_temp.", "optional": true, "type": "Param_ScriptVariable"}, {"name": "_air_speed_", "description": "Data Collection or individual value for air speed in m/s.\r\nNote that higher air speeds in the adaptive model only widen the\r\nupper boundary of the comfort range at temperatures above 24 C\r\nand will not affect the lower temperature of the comfort range.\r\nDefault is a very low speed of 0.1 m/s.", "optional": true, "type": "Param_ScriptVariable"}, {"name": "adapt_par_", "description": "Optional comfort parameters from the \"LB Adaptive Comfort Parameters\"\r\ncomponent to specify the criteria under which conditions are\r\nconsidered acceptable/comfortable. The default will use ASHRAE-55\r\nadaptive comfort criteria.", "optional": true, "type": "Param_ScriptVariable"}, {"name": "_run", "description": "Set to True to run the component.", "optional": true, "type": "Param_ScriptVariable"}], "outputs": [{"name": "out", "description": "Reports, errors, warnings, etc.", "optional": false, "type": "Param_String"}, {"name": "prevail_temp", "description": "Data Collection of prevailing outdoor temperature in\r\ndegrees C.", "optional": false, "type": "Param_GenericObject"}, {"name": "neutral_temp", "description": "Data Collection of the desired neutral temperature in\r\ndegrees C.", "optional": false, "type": "Param_GenericObject"}, {"name": "deg_neutral", "description": "Data Collection of the degrees from desired neutral\r\ntemperature in degrees C.", "optional": false, "type": "Param_GenericObject"}, {"name": "comfort", "description": "Integers noting whether the input conditions are acceptable\r\naccording to the assigned comfort_parameter.\r\n_\r\nValues are one of the following:\r\n* 0 = uncomfortable\r\n* 1 = comfortable", "optional": false, "type": "Param_GenericObject"}, {"name": "condition", "description": "Integers noting the thermal status of a subject according to\r\nthe assigned comfort_parameter.\r\n_\r\nValues are one of the following:\r\n* -1 = cold\r\n*  0 = netural\r\n* +1 = hot", "optional": false, "type": "Param_GenericObject"}, {"name": "comf_obj", "description": "A Python object containing all inputs and results of the\r\nanalysis.  This can be plugged into components like the \"Comfort\r\nStatistics\" component to get further information.", "optional": false, "type": "Param_GenericObject"}], "preset_items": [], "availability": "INSTANTIATED", "source": "C:/Program Files/ladybug_tools/grasshopper/ladybug_grasshopper/user_objects\\LB Adaptive Comfort.ghuser", "id": "LB-012", "group": "資料與熱舒適分析", "hub_status": "待接入 Hub", "base_guid": "410755b1-224a-4c1e-a407-bf32fb45ea7e", "sha256": "809f896b69cbb1e54e3072af4540ad279721a4f564c4c95075df767f5d5fdc6b"}, {"file": "LB Analysis Period.ghuser", "name": "LB Analysis Period", "nickname": "", "category": "Ladybug", "subcategory": "1 :: Analyze Data", "guid": "7aa844c2-9af6-406d-ae5d-ee71ccfb8793", "description": "Create an Analysis Period to describe a slice of time during the year.\r\n-", "version": "None", "inputs": [{"name": "_start_month_", "description": "Start month (1-12).", "optional": true, "type": "Param_ScriptVariable"}, {"name": "_start_day_", "description": "Start day (1-31).", "optional": true, "type": "Param_ScriptVariable"}, {"name": "_start_hour_", "description": "Start hour (0-23).", "optional": true, "type": "Param_ScriptVariable"}, {"name": "_end_month_", "description": "End month (1-12).", "optional": true, "type": "Param_ScriptVariable"}, {"name": "_end_day_", "description": "End day (1-31).", "optional": true, "type": "Param_ScriptVariable"}, {"name": "_end_hour_", "description": "End hour (0-23).", "optional": true, "type": "Param_ScriptVariable"}, {"name": "_timestep_", "description": "An integer number for the number of time steps per hours.\r\nAcceptable inputs include: 1, 2, 3, 4, 5, 6, 10, 12, 15, 20, 30, 60", "optional": true, "type": "Param_ScriptVariable"}], "outputs": [{"name": "period", "description": "Analysis period.", "optional": false, "type": "Param_GenericObject"}, {"name": "hoys", "description": "List of dates in this analysis period.", "optional": false, "type": "Param_GenericObject"}, {"name": "dates", "description": "List of hours of the year in this analysis period.", "optional": false, "type": "Param_GenericObject"}], "preset_items": [], "availability": "INSTANTIATED", "source": "C:/Program Files/ladybug_tools/grasshopper/ladybug_grasshopper/user_objects\\LB Analysis Period.ghuser", "id": "LB-013", "group": "資料與熱舒適分析", "hub_status": "待接入 Hub", "base_guid": "410755b1-224a-4c1e-a407-bf32fb45ea7e", "sha256": "8d08e96ed50ffc791f170f395b66ec1a6f336e6c4cd03c9f02d2a6f0d92f375f"}, {"file": "LB Ankle Draft.ghuser", "name": "LB Ankle Draft", "nickname": "", "category": "Ladybug", "subcategory": "1 :: Analyze Data", "guid": "e7bc78b1-0bd5-46ae-950c-5f0416de09ad", "description": "Calculate the percentage of people dissatisfied from cold drafts at ankle-level.\r\n_\r\nThe original tests used to create the model involved blowing cold air on\r\nsubject's ankles at a height of 10 cm off of the ground.\r\nThe formula was officially incorporated in the ASHRAE 55 standard in 2020\r\nwith a recommendation that PPD from ankle draft not exceed 20%.\r\n_\r\nFor more information on the methods used to create this model see the following:\r\nLiu, S., S. Schiavon, A. Kabanshi, W. Nazaroff. 2016. \"Predicted\r\npercentage of dissatisfied with ankle draft.\" Accepted Author Manuscript.\r\nIndoor Environmental Quality. http://escholarship.org/uc/item/9076254n\r\n-", "version": "None", "inputs": [{"name": "_full_body_pmv", "description": "The full-body predicted mean vote (PMV) of the subject.\r\nAnkle draft depends on full-body PMV because subjects are more likely\r\nto feel uncomfortably cold at their extremities when their whole body\r\nis already feeling colder than neutral. The \"LB PMV Comfort\"\r\ncomponent can be used to obatin this input here.", "optional": true, "type": "Param_ScriptVariable"}, {"name": "_draft_velocity", "description": "The velocity of the draft in m/s at ankle level\r\n(10cm above the floor).", "optional": true, "type": "Param_ScriptVariable"}], "outputs": [{"name": "ppd", "description": "The percentage of people dissatisfied (PPD) from cold drafts at ankle level.", "optional": false, "type": "Param_GenericObject"}], "preset_items": [], "availability": "INSTANTIATED", "source": "C:/Program Files/ladybug_tools/grasshopper/ladybug_grasshopper/user_objects\\LB Ankle Draft.ghuser", "id": "LB-014", "group": "資料與熱舒適分析", "hub_status": "待接入 Hub", "base_guid": "410755b1-224a-4c1e-a407-bf32fb45ea7e", "sha256": "60d656b2761563d4b8f832c6e68b39f1feeddc1ceb6ddff5ba430b50607045a1"}, {"file": "LB Apply Analysis Period.ghuser", "name": "LB Apply Analysis Period", "nickname": "", "category": "Ladybug", "subcategory": "1 :: Analyze Data", "guid": "e870c759-eb98-4471-b91b-2b1e93c60ac1", "description": "Apply an analysis period to a data collection.\r\n-", "version": "None", "inputs": [{"name": "_data", "description": "A Ladybug data collection object.", "optional": true, "type": "Param_ScriptVariable"}, {"name": "_period", "description": "A Ladybug analysis period from the \"LB AnalysisPeriod\" component.", "optional": true, "type": "Param_ScriptVariable"}], "outputs": [{"name": "data", "description": "The data collection with the analysis period applied to it.", "optional": false, "type": "Param_GenericObject"}], "preset_items": [], "availability": "INSTANTIATED", "source": "C:/Program Files/ladybug_tools/grasshopper/ladybug_grasshopper/user_objects\\LB Apply Analysis Period.ghuser", "id": "LB-015", "group": "資料與熱舒適分析", "hub_status": "待接入 Hub", "base_guid": "410755b1-224a-4c1e-a407-bf32fb45ea7e", "sha256": "a685160418305a945139ee8f839db3ac59d33d352178c6376f74f3972ec11f29"}, {"file": "LB Apply Conditional Statement.ghuser", "name": "LB Apply Conditional Statement", "nickname": "", "category": "Ladybug", "subcategory": "1 :: Analyze Data", "guid": "067df95b-1fe5-46c7-b889-7f15901b0ec8", "description": "Apply a conditional statement to a data collection.\r\n-", "version": "None", "inputs": [{"name": "_data", "description": "A list of aligned Data Collections to be evaluated against\r\nthe _statement.", "optional": true, "type": "Param_ScriptVariable"}, {"name": "_statement", "description": "A conditional statement as a string (e.g. a > 25).\r\n_\r\nThe variable of the first data collection should always be named 'a'\r\n(without quotations), the variable of the second list should be\r\nnamed 'b', and so on.\r\n_\r\nFor example, if three data collections are connected to _data\r\nand the following statement is applied:\r\n'18 \u003c a \u003c 26 and b \u003c 80 and c > 2'\r\nThe resulting collections will only include values where the first\r\ndata collection is between 18 and 26, the second collection is less\r\nthan 80 and the third collection is greater than 2.", "optional": true, "type": "Param_ScriptVariable"}], "outputs": [{"name": "data", "description": "A list of Data Collections that have been filtered by the _statement.", "optional": false, "type": "Param_GenericObject"}], "preset_items": [], "availability": "INSTANTIATED", "source": "C:/Program Files/ladybug_tools/grasshopper/ladybug_grasshopper/user_objects\\LB Apply Conditional Statement.ghuser", "id": "LB-016", "group": "資料與熱舒適分析", "hub_status": "待接入 Hub", "base_guid": "410755b1-224a-4c1e-a407-bf32fb45ea7e", "sha256": "ccfef79d62e2648a561d8813bffd68111a2c334a5f2d1030ed3711087cadd1d1"}, {"file": "LB Apply Metadata.ghuser", "name": "LB Apply Metadata", "nickname": "", "category": "Ladybug", "subcategory": "1 :: Analyze Data", "guid": "c42d286e-d383-4e41-a0a2-3d1cd73b5522", "description": "Apply metadata to a Ladybug data collection.\r\n-", "version": "None", "inputs": [{"name": "_data", "description": "A Ladybug data collection object or a list of data collections.", "optional": true, "type": "Param_ScriptVariable"}, {"name": "_metadata_", "description": "Optional metadata to be associated with the Header. The input\r\nshould be a list of text strings with a property name and value for\r\nthe property separated by a colon. For example:\r\n_\r\n.    source: TMY\r\n.    city: New York\r\n.    country: USA\r\n_\r\nBy default, the connected metadata will be merged with the existing\r\nmetadata on the data collection. If the same key exists in both\r\nplaces, the new value will overwrite the old one.", "optional": true, "type": "Param_ScriptVariable"}, {"name": "override_", "description": "Boolean to note whether the existing metadata should be\r\noverwritten instead of merged. If True, only the connected metadata\r\nwill remain on the output data collection. If no _metadata_ is\r\nconnected, this input can be used to clear all existing metadata.", "optional": true, "type": "Param_ScriptVariable"}], "outputs": [{"name": "data", "description": "The data collection with the metadata applied to it.", "optional": false, "type": "Param_GenericObject"}], "preset_items": [], "availability": "INSTANTIATED", "source": "C:/Program Files/ladybug_tools/grasshopper/ladybug_grasshopper/user_objects\\LB Apply Metadata.ghuser", "id": "LB-017", "group": "資料與熱舒適分析", "hub_status": "待接入 Hub", "base_guid": "410755b1-224a-4c1e-a407-bf32fb45ea7e", "sha256": "d16ccf0311114d375431392f1eb77696ad35ed3f9899d0d177ccb995f6359305"}, {"file": "LB Apply Pattern.ghuser", "name": "LB Apply Pattern", "nickname": "", "category": "Ladybug", "subcategory": "1 :: Analyze Data", "guid": "34d2779f-441a-4bfe-866b-0c4472189d4e", "description": "Filter a data collection or list of data collections by a pattern of True/False\r\nvalues. True values will be kept while False values will be filtered out.\r\n-", "version": "None", "inputs": [{"name": "_data", "description": "A Data Collection or list of aligned Data Collections to be filtered\r\nby a pattern.", "optional": true, "type": "Param_ScriptVariable"}, {"name": "_pattern", "description": "A list of True/False values. Typically, list has a length matching\r\nthe length of the Data Collection(s)'s values. However, it can also\r\nbe a pattern to be repeated over the Data Collection(s)'s values.", "optional": true, "type": "Param_ScriptVariable"}], "outputs": [{"name": "data", "description": "A list of Data Collections that have been filtered by the _pattern.", "optional": false, "type": "Param_GenericObject"}], "preset_items": [], "availability": "INSTANTIATED", "source": "C:/Program Files/ladybug_tools/grasshopper/ladybug_grasshopper/user_objects\\LB Apply Pattern.ghuser", "id": "LB-018", "group": "資料與熱舒適分析", "hub_status": "待接入 Hub", "base_guid": "410755b1-224a-4c1e-a407-bf32fb45ea7e", "sha256": "5671d481cc22b857acfbbcd79cb1a330e77923993842fe1bdcbd8bbdb3baa4d3"}, {"file": "LB Arithmetic Operation.ghuser", "name": "LB Arithmetic Operation", "nickname": "", "category": "Ladybug", "subcategory": "1 :: Analyze Data", "guid": "31698a73-5804-4bd1-a376-b515a0e3bf10", "description": "Perform simple arithmetic operations between Data Collections. For example,\r\nadding two Data Collections together, subtracting one collection from another,\r\nor multiplying/dividing a data in a collection by a factor.\r\n-\r\nNote that Data Collections must be aligned in order for this component to run\r\nsuccessfully.\r\n-\r\nUsing this component will often be much faster and more elegant compared to\r\ndeconstructing the data collection, performing the operation with native\r\nGrasshopper components, and rebuilding the collection.\r\n-", "version": "None", "inputs": [{"name": "_data_1", "description": "The first Data Collection in the operation. If the operator is\r\nnot commutative, this collection comes before the operator. For\r\nexample, in subtraction, this is the collection being subtracted from.\r\nThis can also be a list of Data Collections that align with _data_2.\r\nIt cal also be a single number that will be added, multiplied, etc.\r\nto all of _data_2.", "optional": true, "type": "Param_ScriptVariable"}, {"name": "_data_2", "description": "The second Data Collection in the operation. If the operator is\r\nnot commutative, this collection comes after the operator. For\r\nexample, in subtraction, this is the collection being subtracted with.\r\nThis can also be a list of Data Collections that align with _data_1.\r\nIt cal also be a single number that will be added, multiplied, etc.\r\nto all of _data_1.", "optional": true, "type": "Param_ScriptVariable"}, {"name": "_operator_", "description": "Text for the operator to use between the two Data Collections.\r\nValid examples include (+, -, *, /). By default this is + for addition.", "optional": true, "type": "Param_ScriptVariable"}, {"name": "type_", "description": "Optional text for a new \"type\" key in the Data Collection's metadata.\r\nThis will usually show up in most Ladybug visualiztions and it should\r\nusually change for most types of operations.", "optional": true, "type": "Param_ScriptVariable"}], "outputs": [{"name": "data", "description": "A Ladybug data collection object derived from the operation between\r\nthe two data inputs.", "optional": false, "type": "Param_GenericObject"}], "preset_items": [], "availability": "INSTANTIATED", "source": "C:/Program Files/ladybug_tools/grasshopper/ladybug_grasshopper/user_objects\\LB Arithmetic Operation.ghuser", "id": "LB-019", "group": "資料與熱舒適分析", "hub_status": "待接入 Hub", "base_guid": "410755b1-224a-4c1e-a407-bf32fb45ea7e", "sha256": "b9b600838a4a51a9976a37bfdfb6d036089c97712feac64668cfa01ef15b3f7b"}, {"file": "LB Calculate HOY.ghuser", "name": "LB Calculate HOY", "nickname": "", "category": "Ladybug", "subcategory": "1 :: Analyze Data", "guid": "9e74fb6d-64c8-460f-89b7-216f4bb865b4", "description": "Calculate hour of the year from month, day, hour, minute.\r\n-", "version": "None", "inputs": [{"name": "_month_", "description": "Integer for month (1-12).", "optional": true, "type": "Param_ScriptVariable"}, {"name": "_day_", "description": "Integer for day (1-31).", "optional": true, "type": "Param_ScriptVariable"}, {"name": "_hour_", "description": "Integer for hour (0-23).", "optional": true, "type": "Param_ScriptVariable"}, {"name": "_minute_", "description": "Integer for minute (0-59).", "optional": true, "type": "Param_ScriptVariable"}], "outputs": [{"name": "hoy", "description": "Hour of the year.", "optional": false, "type": "Param_GenericObject"}, {"name": "doy", "description": "Day of the year.", "optional": false, "type": "Param_GenericObject"}, {"name": "date", "description": "Human readable date time.", "optional": false, "type": "Param_GenericObject"}], "preset_items": [], "availability": "INSTANTIATED", "source": "C:/Program Files/ladybug_tools/grasshopper/ladybug_grasshopper/user_objects\\LB Calculate HOY.ghuser", "id": "LB-020", "group": "資料與熱舒適分析", "hub_status": "待接入 Hub", "base_guid": "410755b1-224a-4c1e-a407-bf32fb45ea7e", "sha256": "7c7179fff4ee95d847cd97a40b5af34650a70172904c54b173feed6af4e14ffd"}, {"file": "LB Clothing by Temperature.ghuser", "name": "LB Clothing by Temperature", "nickname": "", "category": "Ladybug", "subcategory": "1 :: Analyze Data", "guid": "d0a0a45d-427f-4936-bdb0-8bb0a7dbc0be", "description": "Estimate levels of clothing using a temperature value or data collection of\r\ntemperatures to which a human subject is adapting (typically the outdoor\r\nair temperature).\r\n_\r\nThis resulting clothing values can be plugged into the _clothing_ input of the\r\n\"LB PMV Comfort\" component or the \"LB PET Comfort\" component. They can also\r\nbe used in thermal mapping recipes.\r\n_\r\nBy default, this function derives clothing levels using a model developed by\r\nSchiavon, Stefano based on outdoor air temperature, which is implemented in the\r\nCBE comfort tool (https://comfort.cbe.berkeley.edu/).\r\n_\r\nThe version of the model implemented here allows changing of the maximum and minimum\r\nclothing levels, which the Schiavon model sets at 1 and 0.46 respectively, and the\r\ntemperatures at which these clothing levels occur, which the Schiavon model sets\r\nat -5 C and 26 C respectively.\r\n-", "version": "None", "inputs": [{"name": "_temperature", "description": "A data collection or single number representing the temperature to\r\nwhich the human subject adapts their clothing. This is typically the\r\ndry bulb temperature obtained from the \"LB Import EPW\" component.", "optional": true, "type": "Param_ScriptVariable"}, {"name": "period_", "description": "If you have hooked up annual temperatures from the importEPW component, use this input to ", "optional": true, "type": "Param_ScriptVariable"}, {"name": "_max_clo_", "description": "A number for the maximum clo value that the human subject wears\r\non the coldest days. (Default: 1 clo, per the original Schiavon\r\nclothing function).", "optional": true, "type": "Param_ScriptVariable"}, {"name": "_max_clo_temp_", "description": "A number for the temperature below which the _max_clo_ value\r\nis applied (in Celsius). (Default: -5 C, per the original\r\nSchiavon clothing function with outdoor temperature).", "optional": true, "type": "Param_ScriptVariable"}, {"name": "_min_clo_", "description": "A number for the minimum clo value that the human subject wears\r\nwears on the hotest days. (Default: 0.46 clo,\r\nper the original Schiavon clothing function).", "optional": true, "type": "Param_ScriptVariable"}, {"name": "_min_clo_temp_", "description": "A number for the temperature above which the _min_clo_ value\r\nis applied (in Celsius). (Default: 26 C, per the original\r\nSchiavon clothing function).", "optional": true, "type": "Param_ScriptVariable"}], "outputs": [{"name": "out", "description": "Reports, errors, warnings, etc.", "optional": false, "type": "Param_String"}, {"name": "clo", "description": "A single number or data collection of numbers representing the clothing\r\nthat would be worn (in clo). Note that, if you have hooked up an\r\nhourly continuous data collection, the clothing levels will change\r\non a 12-hour basis to simulate the typical cycle on which a human\r\nchanges their clothing.", "optional": false, "type": "Param_GenericObject"}], "preset_items": [], "availability": "INSTANTIATED", "source": "C:/Program Files/ladybug_tools/grasshopper/ladybug_grasshopper/user_objects\\LB Clothing by Temperature.ghuser", "id": "LB-021", "group": "資料與熱舒適分析", "hub_status": "待接入 Hub", "base_guid": "410755b1-224a-4c1e-a407-bf32fb45ea7e", "sha256": "a503d8ed3d28e91b3d79c3533c3406c10d31818013323480a1e3bab4e6b73247"}, {"file": "LB Comfort Statistics.ghuser", "name": "LB Comfort Statistics", "nickname": "", "category": "Ladybug", "subcategory": "1 :: Analyze Data", "guid": "998943e2-1e2c-4413-b617-06875fc9c46a", "description": "Get statitics of thermal comfort from a Ladybug Comfort Object.\r\n-", "version": "None", "inputs": [{"name": "_comf_obj", "description": "A Ladybug ComfortCollection object from any of the comfort\r\nmodel components.", "optional": true, "type": "Param_ScriptVariable"}], "outputs": [{"name": "pct_hot", "description": "The percent of time that conditions are hotter than acceptable limits.", "optional": false, "type": "Param_GenericObject"}, {"name": "pct_neutral", "description": "The percent of time that conditions are within acceptable limits\r\n(aka. the percent of time comfortable).", "optional": false, "type": "Param_GenericObject"}, {"name": "pct_cold", "description": "The percent of time that conditions are colder than acceptable limits.", "optional": false, "type": "Param_GenericObject"}], "preset_items": [], "availability": "INSTANTIATED", "source": "C:/Program Files/ladybug_tools/grasshopper/ladybug_grasshopper/user_objects\\LB Comfort Statistics.ghuser", "id": "LB-022", "group": "資料與熱舒適分析", "hub_status": "待接入 Hub", "base_guid": "410755b1-224a-4c1e-a407-bf32fb45ea7e", "sha256": "3c3d2e989c699c742ab5b5da6642292178be15a65531a6995f6c2ddafe4fa521"}, {"file": "LB Construct Data.ghuser", "name": "LB Construct Data", "nickname": "", "category": "Ladybug", "subcategory": "1 :: Analyze Data", "guid": "50b99a26-3512-46cc-8af7-dc28c62aa42d", "description": "Construct a Ladybug data collection from header and values.\r\n-", "version": "None", "inputs": [{"name": "_header", "description": "A Ladybug header object describing the metadata of the data collection.", "optional": true, "type": "Param_ScriptVariable"}, {"name": "_values", "description": "A list of numerical values for the data collection.", "optional": true, "type": "Param_ScriptVariable"}, {"name": "_interval_", "description": "Text to indicate the time interval of the data collection, which\r\ndetermines the type of collection that is output. (Default: hourly).\r\n_\r\nChoose from the following:\r\n- hourly\r\n- daily\r\n- monthly\r\n- monthly-per-hour\r\n_\r\nNote that the \"hourly\" input is also used to represent sub-hourly\r\nintervals (in this case, the timestep of the analysis period\r\nmust not be 1).", "optional": true, "type": "Param_ScriptVariable"}], "outputs": [{"name": "data", "description": "A Ladybug data collection object.", "optional": false, "type": "Param_GenericObject"}], "preset_items": [], "availability": "INSTANTIATED", "source": "C:/Program Files/ladybug_tools/grasshopper/ladybug_grasshopper/user_objects\\LB Construct Data.ghuser", "id": "LB-023", "group": "資料與熱舒適分析", "hub_status": "待接入 Hub", "base_guid": "410755b1-224a-4c1e-a407-bf32fb45ea7e", "sha256": "6a17c7667194c1cff7779577abca4ffdca084fbf6c1e58fa7d240e05d5f6d413"}, {"file": "LB Construct Data Type.ghuser", "name": "LB Construct Data Type", "nickname": "", "category": "Ladybug", "subcategory": "1 :: Analyze Data", "guid": "02e16585-563b-49cf-837c-e6fba0a41c2e", "description": "Construct a Ladybug DataType to be used in the header of a ladybug DataCollection.\r\n-", "version": "None", "inputs": [{"name": "_name", "description": "A name for the data type as a string.", "optional": true, "type": "Param_ScriptVariable"}, {"name": "_unit", "description": "A unit for the data type as a string.", "optional": true, "type": "Param_ScriptVariable"}, {"name": "cumulative_", "description": "Boolean to tell whether the data type can be cumulative when it\r\nis represented over time (True) or it can only be averaged over time\r\nto be meaningful (False).", "optional": true, "type": "Param_ScriptVariable"}, {"name": "categories_", "description": "An optional list of text for categories to be associated with\r\nthe data type. These categories will show up in the legend whenever\r\ndata with this data type is visualized. The input should be\r\ntext strings with a category number (integer) and name separated\r\nby a colon. For example:\r\n_\r\n.    -1: Cold\r\n.     0: Neutral\r\n.     1: Hot", "optional": true, "type": "Param_ScriptVariable"}], "outputs": [{"name": "type", "description": "A Ladybug DataType object that can be assigned to the header\r\nof a Ladybug DataCollection.", "optional": false, "type": "Param_GenericObject"}], "preset_items": [], "availability": "INSTANTIATED", "source": "C:/Program Files/ladybug_tools/grasshopper/ladybug_grasshopper/user_objects\\LB Construct Data Type.ghuser", "id": "LB-024", "group": "資料與熱舒適分析", "hub_status": "待接入 Hub", "base_guid": "410755b1-224a-4c1e-a407-bf32fb45ea7e", "sha256": "51364df17314f43386d47b9f709be0a36dcde427186ad686c511863ba7042cc4"}, {"file": "LB Construct Header.ghuser", "name": "LB Construct Header", "nickname": "", "category": "Ladybug", "subcategory": "1 :: Analyze Data", "guid": "c830b76b-d0c8-4ac7-9a94-e26dba1de2f8", "description": "Construct a Ladybug Header to be used to create a ladybug DataCollection.\r\n-", "version": "None", "inputs": [{"name": "_data_type", "description": "Text representing the type of data (e.g. Temperature). A full list\r\nof acceptable inputs can be seen by checking the all_u output of\r\nthe \"LB Unit Converter\" component. This input can also be a custom\r\nDataType object that has been created with the \"LB Construct Data\r\nType\" component.", "optional": true, "type": "Param_ScriptVariable"}, {"name": "_unit_", "description": "Units of the data_type (e.g. C). Default is to use the\r\nbase unit of the connected_data_type.", "optional": true, "type": "Param_ScriptVariable"}, {"name": "_a_period_", "description": "Script variable constrData", "optional": true, "type": "Param_ScriptVariable"}, {"name": "metadata_", "description": "Optional metadata to be associated with the Header. The input should\r\nbe a list of text strings with a property name and value for the\r\nproperty separated by a colon. For example:\r\n_\r\n.    source: TMY\r\n.    city: New York\r\n.    country: USA", "optional": true, "type": "Param_ScriptVariable"}], "outputs": [{"name": "header", "description": "A Ladybug Header object.", "optional": false, "type": "Param_GenericObject"}], "preset_items": [], "availability": "INSTANTIATED", "source": "C:/Program Files/ladybug_tools/grasshopper/ladybug_grasshopper/user_objects\\LB Construct Header.ghuser", "id": "LB-025", "group": "資料與熱舒適分析", "hub_status": "待接入 Hub", "base_guid": "410755b1-224a-4c1e-a407-bf32fb45ea7e", "sha256": "9e87b510afeb83cb0bf9eb1cdb861e13e27077f8f2fcba7c336a0689c93fdb27"}, {"file": "LB Convert to Timestep.ghuser", "name": "LB Convert to Timestep", "nickname": "", "category": "Ladybug", "subcategory": "1 :: Analyze Data", "guid": "09ff1ba5-d4d3-42a4-8dce-0ef1f8345329", "description": "Convert a hourly Ladybug data collection to a continuous collection at a\r\nspecific timestep.\r\n_\r\nThis will be done either through linear interpolation or by culling out values\r\nthat do not fit the timestep.  It can also be used to convert a discontinous\r\ndata collection to a continuous one by linearly interpolating over holes in\r\nthe data set.\r\n-", "version": "None", "inputs": [{"name": "_data", "description": "A Ladybug Hourly DataCollection object.  This can be either\r\ncontinuous or discontinuous.", "optional": true, "type": "Param_ScriptVariable"}, {"name": "_timestep_", "description": "The timestep to which the data will be converted. If this\r\nis higher than the input _data timestep, values will be\r\nlinerarly interpolated to the new timestep.  If it is lower,\r\nvalues that do not fit the timestep will be removed from the\r\nDataCollection. (Defaut: 1)", "optional": true, "type": "Param_ScriptVariable"}], "outputs": [{"name": "data", "description": "A Continuous DataCollection at the input _timestep_.", "optional": false, "type": "Param_GenericObject"}], "preset_items": [], "availability": "INSTANTIATED", "source": "C:/Program Files/ladybug_tools/grasshopper/ladybug_grasshopper/user_objects\\LB Convert to Timestep.ghuser", "id": "LB-026", "group": "資料與熱舒適分析", "hub_status": "待接入 Hub", "base_guid": "410755b1-224a-4c1e-a407-bf32fb45ea7e", "sha256": "d3772fc98ec53d40473d8ebb25b838519cde379a8c93f0b07d064e76bd1e990a"}, {"file": "LB Data DateTimes.ghuser", "name": "LB Data DateTimes", "nickname": "", "category": "Ladybug", "subcategory": "1 :: Analyze Data", "guid": "b03564f7-1302-4f3a-9383-0711d25503a0", "description": "Get the hours, days, or months of the year associated with the values of a data collection.\r\n-", "version": "None", "inputs": [{"name": "_data", "description": "An hourly, daily, or monthly collection from which hours, days, or\r\nmonths of the year will be retrieved.", "optional": true, "type": "Param_ScriptVariable"}], "outputs": [{"name": "hoys", "description": "Numbers for the, hours, days or months of the year in the data collection.", "optional": false, "type": "Param_GenericObject"}], "preset_items": [], "availability": "INSTANTIATED", "source": "C:/Program Files/ladybug_tools/grasshopper/ladybug_grasshopper/user_objects\\LB Data DateTimes.ghuser", "id": "LB-027", "group": "資料與熱舒適分析", "hub_status": "待接入 Hub", "base_guid": "410755b1-224a-4c1e-a407-bf32fb45ea7e", "sha256": "d62180244696816f7fc67b89869fbb80a343340ff3eeb5c3523dbf95099424bc"}, {"file": "LB Day Solar Information.ghuser", "name": "LB Day Solar Information", "nickname": "", "category": "Ladybug", "subcategory": "1 :: Analyze Data", "guid": "1d2a2b40-1d1a-469a-9d60-507e95d95f3d", "description": "Compute solar infomation about a day of the year at a particular location. This includes\r\nthe time of sunrise, sunset, solar noon, and the length of the day in hours.\r\n_\r\nNote that these times are intended to represent a typical year and they will often\r\nvary by a few minutes depending on where in the leap year cycle a given year falls.\r\n-", "version": "None", "inputs": [{"name": "_location", "description": "A ladybug Location that has been output from the \"LB Import EPW\"\r\ncomponent or the \"LB Construct Location\" component.", "optional": true, "type": "Param_ScriptVariable"}, {"name": "_doy", "description": "An integer for the day of the year for which solar information is\r\nbe computed. The \"LB Calculate HOY\" component can be used to compute\r\nthe day of the year from month and day inputs.", "optional": true, "type": "Param_ScriptVariable"}, {"name": "_depression_", "description": "An angle in degrees indicating the additional period before/after\r\nthe edge of the sun has passed the horizon where the sun is still\r\nconsidered up. Setting this value to 0 will compute sunrise/sunset\r\nas the time when the edge of the sun begins to touch the horizon.\r\nSetting it to the angular diameter of the sun (0.5334) will compute\r\nsunrise/sunset as the time when the sun just finishes passing the\r\nhorizon (actual physical sunset). Setting it to 0.833 will compute\r\nthe apparent sunrise/sunset, accounting for atmospheric refraction.\r\nSetting this to 6 will compute sunrise/sunset as the beginning/end\r\nof civil twilight. Setting this to 12 will compute sunrise/sunset\r\nas the beginning/end of nautical twilight. Setting this to 18 will\r\ncompute sunrise/sunset as the beginning/end of astronomical\r\ntwilight. (Default: 0.5334 for the physical sunset).", "optional": true, "type": "Param_ScriptVariable"}, {"name": "solar_time_", "description": "A boolean to indicate if the output datetimes for sunrise,\r\nnoon and sunset should be in solar time as opposed to the time zone\r\nof the location. (Default: False).", "optional": true, "type": "Param_ScriptVariable"}, {"name": "dl_saving_", "description": "An optional analysis period for daylight saving time. This will be used\r\nto adjust the output times by an hour when applicable. If unspecified,\r\nno daylight saving time will be used", "optional": true, "type": "Param_ScriptVariable"}], "outputs": [{"name": "sunrise", "description": "The time of sunrise expressed as HH:MM where hours range from 0 to 23.\r\nNote that this may be None if there is no sunrise or sunset on the\r\nspecified day. (eg. at the north pole on the winter solstice).", "optional": false, "type": "Param_GenericObject"}, {"name": "sunset", "description": "The time of sunset expressed as HH:MM where hours range from 0 to 23.\r\nNote that this may be None if there is no sunrise or sunset on the\r\nspecified day. (eg. at the north pole on the winter solstice).", "optional": false, "type": "Param_GenericObject"}, {"name": "solar_noon", "description": "The time of solar noon when the sun is at its highest point in the\r\nsky, expressed as HH:MM.", "optional": false, "type": "Param_GenericObject"}, {"name": "noon_alt", "description": "The altitude of the sun at solar noon in degrees. This is the maximum\r\naltitude that will be expereinced on the input day.", "optional": false, "type": "Param_GenericObject"}, {"name": "day_length", "description": "The length of the input day in hours.", "optional": false, "type": "Param_GenericObject"}], "preset_items": [], "availability": "INSTANTIATED", "source": "C:/Program Files/ladybug_tools/grasshopper/ladybug_grasshopper/user_objects\\LB Day Solar Information.ghuser", "id": "LB-028", "group": "資料與熱舒適分析", "hub_status": "待接入 Hub", "base_guid": "410755b1-224a-4c1e-a407-bf32fb45ea7e", "sha256": "764f2d4c2ca204d09fe24e254907f10921073a7c38fe00e8f552069e939a717d"}, {"file": "LB Deconstruct Data.ghuser", "name": "LB Deconstruct Data", "nickname": "", "category": "Ladybug", "subcategory": "1 :: Analyze Data", "guid": "17324427-2eb8-44c8-8d23-cc147bad5add", "description": "Deconstruct a Ladybug DataCollection into a header and values.\r\n-", "version": "None", "inputs": [{"name": "_data", "description": "A Ladybug DataCollection object.", "optional": true, "type": "Param_ScriptVariable"}], "outputs": [{"name": "header", "description": "The header of the DataCollection (containing metadata).", "optional": false, "type": "Param_GenericObject"}, {"name": "values", "description": "The numerical values of the DataCollection.", "optional": false, "type": "Param_GenericObject"}], "preset_items": [], "availability": "INSTANTIATED", "source": "C:/Program Files/ladybug_tools/grasshopper/ladybug_grasshopper/user_objects\\LB Deconstruct Data.ghuser", "id": "LB-029", "group": "資料與熱舒適分析", "hub_status": "待接入 Hub", "base_guid": "410755b1-224a-4c1e-a407-bf32fb45ea7e", "sha256": "eea5ab65e9dba15656ecae30d2de89fc6aa6342bb07aa393fce51439538fb555"}, {"file": "LB Deconstruct Header.ghuser", "name": "LB Deconstruct Header", "nickname": "", "category": "Ladybug", "subcategory": "1 :: Analyze Data", "guid": "2cdb01fc-042b-4e51-8ba7-ec3a115df59b", "description": "Deconstruct a Ladybug Header into its components.\r\n-", "version": "None", "inputs": [{"name": "_header", "description": "The header of the DataCollection (containing metadata).", "optional": true, "type": "Param_ScriptVariable"}], "outputs": [{"name": "data_type", "description": "Type of data (e.g. Temperature) (Default: unknown).", "optional": false, "type": "Param_GenericObject"}, {"name": "unit", "description": "Units of the data_type (e.g. C) (Default: unknown)", "optional": false, "type": "Param_GenericObject"}, {"name": "a_period", "description": "A Ladybug AnalysisPeriod object.", "optional": false, "type": "Param_GenericObject"}, {"name": "metadata", "description": "Optional metadata associated with the Header.", "optional": false, "type": "Param_GenericObject"}], "preset_items": [], "availability": "INSTANTIATED", "source": "C:/Program Files/ladybug_tools/grasshopper/ladybug_grasshopper/user_objects\\LB Deconstruct Header.ghuser", "id": "LB-030", "group": "資料與熱舒適分析", "hub_status": "待接入 Hub", "base_guid": "410755b1-224a-4c1e-a407-bf32fb45ea7e", "sha256": "b4111223d07b4256d4d2d44bf742a045dd3ea1b7798e819dce048e4536504075"}, {"file": "LB Degree Days.ghuser", "name": "LB Degree Days", "nickname": "", "category": "Ladybug", "subcategory": "1 :: Analyze Data", "guid": "4bc76d08-bc50-4577-9dd2-43ea4e5ab504", "description": "Calculate heating and cooling degree-days from outdoor dry bulb temperature.\r\n-", "version": "None", "inputs": [{"name": "_dry_bulb", "description": "A data collection representing outdoor dry bulb temperature [C]", "optional": true, "type": "Param_ScriptVariable"}, {"name": "_heat_base_", "description": "A number for the base temperature below which a given hour\r\nis considered to be in heating mode. Default is 18 Celcius, which is\r\na common balance point for buildings.", "optional": true, "type": "Param_ScriptVariable"}, {"name": "_cool_base_", "description": "A number for the base temperature above which a given hour\r\nis considered to be in cooling mode. Default is 23 Celcius, which is\r\na common balance point for buildings.", "optional": true, "type": "Param_ScriptVariable"}], "outputs": [{"name": "hourly_heat", "description": "A data collection of heating degree-days.\r\nPlug this into the 'Time Interval Operation' component to get\r\nthe number of degree-days at different time intervals.", "optional": false, "type": "Param_GenericObject"}, {"name": "hourly_cool", "description": "A data collection of cooling degree-days.\r\nPlug this into the 'Time Interval Operation' component to get\r\nthe number of degree-days at different time intervals.", "optional": false, "type": "Param_GenericObject"}, {"name": "heat_deg_days", "description": "A value indicating the total number of heating degree-days\r\nover the entire input _dry_bulb collection.", "optional": false, "type": "Param_GenericObject"}, {"name": "cool_deg_days", "description": "A value indicating the total number of cooling degree-days\r\nover the entire input _dry_bulb collection.", "optional": false, "type": "Param_GenericObject"}], "preset_items": [], "availability": "INSTANTIATED", "source": "C:/Program Files/ladybug_tools/grasshopper/ladybug_grasshopper/user_objects\\LB Degree Days.ghuser", "id": "LB-031", "group": "資料與熱舒適分析", "hub_status": "待接入 Hub", "base_guid": "410755b1-224a-4c1e-a407-bf32fb45ea7e", "sha256": "f2d5fe7d40e3483a60c766e80aaa32b033d7b6742897afc32f3306f450b9b93e"}, {"file": "LB Directional Solar Irradiance.ghuser", "name": "LB Directional Solar Irradiance", "nickname": "", "category": "Ladybug", "subcategory": "1 :: Analyze Data", "guid": "99ea97fe-fb27-483d-9053-2bd279ea8239", "description": "Compute the hourly solar irradiance or illuminance falling on an unobstructed surface\r\nthat faces any direction.\r\n_\r\nThe calculation method of this component is faster than running \"LB Incident\r\nRadiation\" studies on an hour-by-hour basis and it is slighty more realistic since\r\nit accounts for ground reflection. However, this comes at the cost of not being\r\nable to account for any obstructions that block the sun.\r\n-", "version": "None", "inputs": [{"name": "_location", "description": "A Ladybug Location object, used to determine the altitude and\r\nazimuth of the sun at each hour.", "optional": true, "type": "Param_ScriptVariable"}, {"name": "_direct_norm", "description": "Hourly Data Collection with the direct normal solar\r\nirradiance in W/m2 or Illuminance in lux.", "optional": true, "type": "Param_ScriptVariable"}, {"name": "_diffuse_horiz", "description": "Hourly Data Collection with diffuse horizontal solar\r\nirradiance in W/m2 or Illuminance in lux.", "optional": true, "type": "Param_ScriptVariable"}, {"name": "_srf_azimuth_", "description": "A number between 0 and 360 that represents the azimuth at which\r\nirradiance is being evaluated in degrees.  0 = North, 90 = East,\r\n180 = South, and 270 = West.  (Default: 180).", "optional": true, "type": "Param_ScriptVariable"}, {"name": "_srf_altitude_", "description": "A number between -90 and 90 that represents the altitude at which\r\nirradiance is being evaluated in degrees. A value of 0 means the\r\nsurface is facing the horizon and a value of 90 means a surface is\r\nfacing straight up. (Default: 0).", "optional": true, "type": "Param_ScriptVariable"}, {"name": "_ground_ref_", "description": "A number between 0 and 1 that represents the reflectance of the\r\nground. (Default: 0.2). Some common ground reflectances are:\r\n*   urban: 0.18\r\n*   grass: 0.20\r\n*   fresh grass: 0.26\r\n*   soil: 0.17\r\n*   sand: 0.40\r\n*   snow: 0.65\r\n*   fresh_snow: 0.75\r\n*   asphalt: 0.12\r\n*   concrete: 0.30\r\n*   sea: 0.06", "optional": true, "type": "Param_ScriptVariable"}, {"name": "anisotrophic_", "description": "A boolean value that sets whether an anisotropic sky is used\r\n(as opposed to an isotropic sky). An isotrophic sky assumes an\r\neven distribution of diffuse irradiance across the sky while an\r\nanisotropic sky places more diffuse irradiance near the solar\r\ndisc. (Default: False).", "optional": true, "type": "Param_ScriptVariable"}], "outputs": [{"name": "out", "description": "...", "optional": false, "type": "Param_String"}, {"name": "total", "description": "A data collection of total solar irradiance or illuminance in the\r\ndirection of the _srf_azimuth_ and _srf_altitude_.", "optional": false, "type": "Param_GenericObject"}, {"name": "direct", "description": "A data collection of direct solar irradiance or illuminance in the\r\ndirection of the _srf_azimuth_ and _srf_altitude_.", "optional": false, "type": "Param_GenericObject"}, {"name": "diff", "description": "A data collection of diffuse sky solar irradiance or illuminance in\r\nthe direction of the _srf_azimuth_ and _srf_altitude_.", "optional": false, "type": "Param_GenericObject"}, {"name": "reflect", "description": "A data collection of ground reflected solar irradiance or\r\nilluminance in the direction of the _srf_azimuth_ and _srf_altitude_.", "optional": false, "type": "Param_GenericObject"}], "preset_items": [], "availability": "INSTANTIATED", "source": "C:/Program Files/ladybug_tools/grasshopper/ladybug_grasshopper/user_objects\\LB Directional Solar Irradiance.ghuser", "id": "LB-032", "group": "資料與熱舒適分析", "hub_status": "待接入 Hub", "base_guid": "410755b1-224a-4c1e-a407-bf32fb45ea7e", "sha256": "b13973a1744835cf1026fe38be4d3c336492462742f755dc277007526a1eb556"}, {"file": "LB HOY to DateTime.ghuser", "name": "LB HOY to DateTime", "nickname": "", "category": "Ladybug", "subcategory": "1 :: Analyze Data", "guid": "5d13fd9f-733b-407d-b87d-608f1112ccf4", "description": "Calculate date information from an hour of the year.\r\n_\r\nDate information includes the month of the year, day of the month and the\r\nhour + minute of the day.\r\n-", "version": "None", "inputs": [{"name": "_hoy", "description": "A number between 0 and 8759 for an hour of the year.", "optional": true, "type": "Param_ScriptVariable"}], "outputs": [{"name": "month", "description": "The month of the year on which the input hoy falls.", "optional": false, "type": "Param_GenericObject"}, {"name": "day", "description": "The day of the month on which the input hoy falls.", "optional": false, "type": "Param_GenericObject"}, {"name": "hour", "description": "The hour of the day on which the input hoy falls.", "optional": false, "type": "Param_GenericObject"}, {"name": "minute", "description": "The minute of the hour on which the input hoy falls.", "optional": false, "type": "Param_GenericObject"}, {"name": "date", "description": "The input information as a human-readable date time.", "optional": false, "type": "Param_GenericObject"}], "preset_items": [], "availability": "INSTANTIATED", "source": "C:/Program Files/ladybug_tools/grasshopper/ladybug_grasshopper/user_objects\\LB HOY to DateTime.ghuser", "id": "LB-033", "group": "資料與熱舒適分析", "hub_status": "待接入 Hub", "base_guid": "410755b1-224a-4c1e-a407-bf32fb45ea7e", "sha256": "9193437f8f1d1ef71f8d1ffd67d35de87c748a3fd88f925f0da564e5b71f0e94"}, {"file": "LB Humidity Metrics.ghuser", "name": "LB Humidity Metrics", "nickname": "", "category": "Ladybug", "subcategory": "1 :: Analyze Data", "guid": "f09ee010-488a-4494-b714-8b4f815332f4", "description": "Calculate humidity metrics from relative humidity, dry bulb temperature and\r\n(if present) atmospheric pressure.\r\n-", "version": "None", "inputs": [{"name": "_dry_bulb", "description": "A value or data collection representing  dry bulb temperature [C]", "optional": true, "type": "Param_ScriptVariable"}, {"name": "_rel_humid", "description": "A value or data collection representing relative humidity [%]", "optional": true, "type": "Param_ScriptVariable"}, {"name": "_pressure_", "description": "A value or data collection representing atmospheric pressure [Pa]\r\nDefault is to use air pressure at sea level (101,325 Pa).", "optional": true, "type": "Param_ScriptVariable"}], "outputs": [{"name": "humid_ratio", "description": "A data collection or value for humidity ratio\r\n(aka. absolute humidity). Units are fractional (kg water / kg air).", "optional": false, "type": "Param_GenericObject"}, {"name": "enthalpy", "description": "A data collection or value for enthalpy (kJ / Kg).", "optional": false, "type": "Param_GenericObject"}, {"name": "wet_bulb", "description": "A data collection or value for wet bulb temperature (C).", "optional": false, "type": "Param_GenericObject"}, {"name": "dew_point", "description": "A data collection or value for dew point temperature (C).", "optional": false, "type": "Param_GenericObject"}], "preset_items": [], "availability": "INSTANTIATED", "source": "C:/Program Files/ladybug_tools/grasshopper/ladybug_grasshopper/user_objects\\LB Humidity Metrics.ghuser", "id": "LB-034", "group": "資料與熱舒適分析", "hub_status": "待接入 Hub", "base_guid": "410755b1-224a-4c1e-a407-bf32fb45ea7e", "sha256": "af8ea5f5e3710926a16519f268085851dc8b76ed708a34bc4453710a49a304b7"}, {"file": "LB Indoor Solar MRT.ghuser", "name": "LB Indoor Solar MRT", "nickname": "", "category": "Ladybug", "subcategory": "1 :: Analyze Data", "guid": "58967fac-6a3b-42b5-bc91-6d3a673422b0", "description": "Calculate Mean Radiant Temperature (MRT) as a result of outdoor shortwave\r\nsolar shining directly onto people as well as longwave radiant exchange\r\nwith the sky.\r\n-\r\nThis component uses the SolarCal model of ASHRAE-55 to estimate the effects\r\nof shortwave solar and a simple sky exposure method to determine longwave\r\nradiant exchange.\r\n-", "version": "None", "inputs": [{"name": "_location", "description": "A Ladybug Location object, used to determine the altitude and\r\nazimuth of the sun.", "optional": true, "type": "Param_ScriptVariable"}, {"name": "_longwave_mrt", "description": "A single number or an hourly data collection with the long-wave\r\nmean radiant temperature around the person in degrees C.\r\nThis includes the temperature of the ground and any other\r\nsurfaces between the person and their view to the sky.\r\nTypically, indoor air temperature is used when such surface\r\ntemperatures are unknown.", "optional": true, "type": "Param_ScriptVariable"}, {"name": "_dir_norm_rad", "description": "Hourly Data Collection with the direct normal solar\r\nirradiance in W/m2.", "optional": true, "type": "Param_ScriptVariable"}, {"name": "_diff_horiz_rad", "description": "Hourly Data Collection with diffuse horizontal solar\r\nirradiance in W/m2.", "optional": true, "type": "Param_ScriptVariable"}, {"name": "fract_body_exp_", "description": "A single number between 0 and 1 or a data collection for\r\nthe fraction of the body exposed to direct sunlight. The \"LB\r\nHuman to Sky Relationship\" component can be used to estimate this\r\ninput for a given set of context geometry and position of the\r\nhuman. Note that this parameter does NOT include the body’s\r\nself-shading. It only includes the shading from furniture and\r\nsurroundings. (Default: 1 for an area surrounded by glass).", "optional": true, "type": "Param_ScriptVariable"}, {"name": "sky_exposure_", "description": "A single number between 0 and 1 or a data collection representing\r\nthe fraction of the sky vault in the human subject’s view. The \"LB\r\nHuman to Sky Relationship\" component can be used to estimate this\r\ninput for a given set of context geometry and position of the\r\nhuman. (Default: 0.5 for a person next to an all glass facade).", "optional": true, "type": "Param_ScriptVariable"}, {"name": "_ground_ref_", "description": "A single number between 0 and 1 or a data collection\r\nthat represents the reflectance of the floor. Default is for 0.25\r\nwhich is characteristic of concrete.", "optional": true, "type": "Param_ScriptVariable"}, {"name": "_window_trans_", "description": "A Data Collection or number between 0 and 1 that represents the\r\nbroadband solar transmittance of the window through which the\r\nsun is coming. Such values tend to be slightly less than the\r\nSHGC. Values might be as low as 0.2 and could be as high as 0.85\r\nfor a single pane of glass. Default is 0.4 assuming a double pane\r\nwindow with a relatively mild low-e coating.", "optional": true, "type": "Param_ScriptVariable"}, {"name": "_solar_body_par_", "description": "Optional solar body parameters from the \"LB Solar Body Parameters\"\r\nobject to specify the properties of the human geometry assumed in the\r\nshortwave MRT calculation. The default assumes average skin/clothing\r\nabsorptivity and a human subject always has their back to the sun\r\nat a 45-degree angle (SHARP = 135).", "optional": true, "type": "Param_ScriptVariable"}, {"name": "_run", "description": "Set to True to run the component.", "optional": true, "type": "Param_ScriptVariable"}], "outputs": [{"name": "out", "description": "Reports, errors, warnings, etc.", "optional": false, "type": "Param_String"}, {"name": "erf", "description": "Data collection of effective radiant field (ERF) in W/m2.", "optional": false, "type": "Param_GenericObject"}, {"name": "dmrt", "description": "Data collection of mean radiant temperature delta in C.", "optional": false, "type": "Param_GenericObject"}, {"name": "mrt", "description": "Data collection of mean radiant temperature in C.", "optional": false, "type": "Param_GenericObject"}], "preset_items": [], "availability": "INSTANTIATED", "source": "C:/Program Files/ladybug_tools/grasshopper/ladybug_grasshopper/user_objects\\LB Indoor Solar MRT.ghuser", "id": "LB-035", "group": "資料與熱舒適分析", "hub_status": "待接入 Hub", "base_guid": "410755b1-224a-4c1e-a407-bf32fb45ea7e", "sha256": "3d43a8ae40e13b6568a4c019b9fd212ffecd385ac65b91828faf4472e44a9adc"}, {"file": "LB Mass Arithmetic Operation.ghuser", "name": "LB Mass Arithmetic Operation", "nickname": "", "category": "Ladybug", "subcategory": "1 :: Analyze Data", "guid": "0488a732-3096-4adc-bf06-551de5b34279", "description": "Perform a \"mass\" arithmetic operation between Data Collections. For example,\r\nadding a list of Data Collections into one Data Collection.\r\n-\r\nNote that Data Collections must be aligned in order for this component to run\r\nsuccessfully.\r\n-\r\nUsing this component will often be much faster and more elegant compared to\r\ndeconstructing the data collection, performing the operation with native\r\nGrasshopper components, and rebuilding the collection.\r\n-", "version": "None", "inputs": [{"name": "_data", "description": "A list of Data Collections to be used in the arithmetic operation.", "optional": true, "type": "Param_ScriptVariable"}, {"name": "_operator_", "description": "Text for the operator to use between the Data Collections.\r\nValid examples include (+, -, *, /). By default this is + for addition.", "optional": true, "type": "Param_ScriptVariable"}, {"name": "type_", "description": "Optional text for a new \"type\" key in the Data Collection's metadata.\r\nThis will usually show up in most Ladybug visualiztions and it should\r\nusually change for most types of operations.", "optional": true, "type": "Param_ScriptVariable"}], "outputs": [{"name": "data", "description": "A Ladybug data collection object derived from the operation between\r\nthe two data inputs.", "optional": false, "type": "Param_GenericObject"}], "preset_items": [], "availability": "INSTANTIATED", "source": "C:/Program Files/ladybug_tools/grasshopper/ladybug_grasshopper/user_objects\\LB Mass Arithmetic Operation.ghuser", "id": "LB-036", "group": "資料與熱舒適分析", "hub_status": "待接入 Hub", "base_guid": "410755b1-224a-4c1e-a407-bf32fb45ea7e", "sha256": "0397c168d1100a1e9fe223cb197119db859463337e54da9a489374da1129100a"}, {"file": "LB Outdoor Solar MRT.ghuser", "name": "LB Outdoor Solar MRT", "nickname": "", "category": "Ladybug", "subcategory": "1 :: Analyze Data", "guid": "7affd467-7d27-431d-896e-0b2d33561813", "description": "Calculate Mean Radiant Temperature (MRT) as a result of outdoor shortwave\r\nsolar shining directly onto people as well as longwave radiant exchange\r\nwith the sky.\r\n-\r\nThis component uses the SolarCal model of ASHRAE-55 to estimate the effects\r\nof shortwave solar and a simple sky exposure method to determine longwave\r\nradiant exchange.\r\n-", "version": "None", "inputs": [{"name": "_location", "description": "A Ladybug Location object, used to determine the altitude and\r\nazimuth of the sun.", "optional": true, "type": "Param_ScriptVariable"}, {"name": "_surface_temp", "description": "A single number or an hourly data collection with the temperature\r\nof surfaces around the person in degrees C. This includes the\r\nground and any other surfaces blocking the view to the sky.\r\nTypically, outdoor dry bulb temperature is used when such surface\r\ntemperatures are unknown.", "optional": true, "type": "Param_ScriptVariable"}, {"name": "_dir_norm_rad", "description": "Hourly Data Collection with the direct normal solar\r\nirradiance in W/m2.", "optional": true, "type": "Param_ScriptVariable"}, {"name": "_diff_horiz_rad", "description": "Hourly Data Collection with diffuse horizontal solar\r\nirradiance in W/m2.", "optional": true, "type": "Param_ScriptVariable"}, {"name": "_horiz_infrared", "description": "Hourly Data Collection with the horizontal infrared\r\nradiation intensity from the sky in W/m2.", "optional": true, "type": "Param_ScriptVariable"}, {"name": "fract_body_exp_", "description": "A single number between 0 and 1 or a data collection for\r\nthe fraction of the body exposed to direct sunlight. The \"LB\r\nHuman to Sky Relationship\" component can be used to estimate this\r\ninput for a given set of context geometry and position of the\r\nhuman. Note that this parameter does NOT include the body’s\r\nself-shading. It only includes the shading from furniture and\r\nsurroundings. (Default: 1 for an open area).", "optional": true, "type": "Param_ScriptVariable"}, {"name": "sky_exposure_", "description": "A single number between 0 and 1 or a data collection representing\r\nthe fraction of the sky vault in the human subject’s view. The \"LB\r\nHuman to Sky Relationship\" component can be used to estimate this\r\ninput for a given set of context geometry and position of the\r\nhuman. (Default: 1 for a person standing in an open area).", "optional": true, "type": "Param_ScriptVariable"}, {"name": "_ground_ref_", "description": "A single number between 0 and 1 or a data collection\r\nthat represents the reflectance of the floor. Default is for 0.25\r\nwhich is characteristic of outdoor grass or dry bare soil.", "optional": true, "type": "Param_ScriptVariable"}, {"name": "_solar_body_par_", "description": "Optional solar body parameters from the \"LB Solar Body Parameters\"\r\nobject to specify the properties of the human geometry assumed in the\r\nshortwave MRT calculation. The default assumes average skin/clothing\r\nabsorptivity and a human subject always has their back to the sun\r\nat a 45-degree angle (SHARP = 135).", "optional": true, "type": "Param_ScriptVariable"}, {"name": "_run", "description": "Set to True to run the component.", "optional": true, "type": "Param_ScriptVariable"}], "outputs": [{"name": "out", "description": "Reports, errors, warnings, etc.", "optional": false, "type": "Param_String"}, {"name": "short_erf", "description": "Data collection of shortwave effective radiant field (ERF) in W/m2.", "optional": false, "type": "Param_GenericObject"}, {"name": "long_erf", "description": "Data collection of longwave effective radiant field (ERF) in W/m2.", "optional": false, "type": "Param_GenericObject"}, {"name": "short_dmrt", "description": "Data collection of shortwave mean radiant temperature delta in C.", "optional": false, "type": "Param_GenericObject"}, {"name": "long_dmrt", "description": "Data collection of longwave mean radiant temperature delta in C.", "optional": false, "type": "Param_GenericObject"}, {"name": "mrt", "description": "Data collection of mean radiant temperature in C.  This accounts for\r\nboth the shortwave solar shining directly onto people as well as\r\nlongwave radiant exchange with the sky.", "optional": false, "type": "Param_GenericObject"}], "preset_items": [], "availability": "INSTANTIATED", "source": "C:/Program Files/ladybug_tools/grasshopper/ladybug_grasshopper/user_objects\\LB Outdoor Solar MRT.ghuser", "id": "LB-037", "group": "資料與熱舒適分析", "hub_status": "待接入 Hub", "base_guid": "410755b1-224a-4c1e-a407-bf32fb45ea7e", "sha256": "1c38401571df67ea601ed9533122ad9c41d079e0f9082d142b9f7079acb8948e"}, {"file": "LB PET Comfort.ghuser", "name": "LB PET Comfort", "nickname": "", "category": "Ladybug", "subcategory": "1 :: Analyze Data", "guid": "c5ad4513-eeae-450c-8c83-63112eab56fa", "description": "Calculate Physiological Equivalent Temperature (PET).\r\n_\r\nPET uses the Munich Energy Balance Model (MEMI), which is arguably the most\r\ndetailed 3-node human energy balance model in common use today. It can account\r\nfor various physiological features of the human subject, including age, sex,\r\nheight, and body mass, making it one of the only models that is suitable for\r\nforecasting the thermal experience of a specific individual. This also makes\r\nit one of the better models for estimating core body temperature and whether\r\na given set of conditions is likely to induce hypothermia or hyperthermia in\r\na specific individual.\r\n-", "version": "None", "inputs": [{"name": "_air_temp", "description": "Data Collection or individual value for air temperature in C.", "optional": true, "type": "Param_ScriptVariable"}, {"name": "_mrt_", "description": "Data Collection or individual value of mean radiant temperature\r\n(MRT) in C. Default is the same as the air_temp.", "optional": true, "type": "Param_ScriptVariable"}, {"name": "_rel_humid", "description": "Data Collection or individual value for relative humidity in %.\r\nNote that percent values are between 0 and 100.", "optional": true, "type": "Param_ScriptVariable"}, {"name": "_air_speed_", "description": "Data Collection or individual value for air speed in m/s.\r\nDefault is a very low speed of 0.1 m/s, which is typical of the\r\nroom air speeds induced by HVAC systems.", "optional": true, "type": "Param_ScriptVariable"}, {"name": "_pressure_", "description": "A value or data collection representing atmospheric pressure [Pa]\r\nDefault is to use air pressure at sea level (101,325 Pa).", "optional": true, "type": "Param_ScriptVariable"}, {"name": "_met_rate_", "description": "Data Collection or individual value of metabolic rate in met.\r\nNote that the original PET model requires that the activity of\r\nthe human subject be accounted for as additional Watts above\r\nthe basal metabolism, which is often difficult to estimate. In\r\norder to accept an input in [met], it is assumed that 1 met refers\r\nto Resting Metabolic Rate (RMR) and this is 1.17 times the male\r\nBasal Metabolic Rate (BMR) or 1.22 times the female BMR.\r\nDefault is set to 2.4 met for walking. Typical values include\r\nthe following.\r\n_\r\n* 1 met = Metabolic rate of a resting seated person\r\n* 1.2 met = Metabolic rate of a standing person\r\n* 2.4 met = Metabolic rate of a person walking at ~1 m/s (2 mph)", "optional": true, "type": "Param_ScriptVariable"}, {"name": "_clothing_", "description": "Data Collection or individual value of clothing insulation in clo.\r\nDefault is set to 0.7 clo for long sleeve shirt and pants. Typical values\r\ninclude the following.\r\n_\r\n* 1 clo = Three-piece suit\r\n* 0.5 clo = Shorts + T-shirt\r\n* 0 clo = No clothing", "optional": true, "type": "Param_ScriptVariable"}, {"name": "pet_par_", "description": "Optional comfort parameters from the \"LB PET Body Parameters\"\r\ncomponent to specify the body properties of the human subject.\r\nThis includes the age, height, sex, body mass, and more.\r\nThe default attempts to model as average of a human body as\r\npossible.", "optional": true, "type": "Param_ScriptVariable"}, {"name": "_run", "description": "Set to True to run the component.", "optional": true, "type": "Param_ScriptVariable"}], "outputs": [{"name": "out", "description": "Reports, errors, warnings, etc.", "optional": false, "type": "Param_String"}, {"name": "pet", "description": "Physiological Equivalent Temperature (PET) [C]. PET is a \"feels like\"\r\ntemperature value and is defined as the operative temperature\r\nof a reference environment that would cause the same physiological\r\nresponse in the human subject as the environment under study.\r\nThat is, the same skin temperature and core body temperature.", "optional": false, "type": "Param_GenericObject"}, {"name": "core_temp", "description": "The core body temperature of the human subject [C].", "optional": false, "type": "Param_GenericObject"}, {"name": "skin_temp", "description": "The skin temperature of the human subject underneath the\r\nclothing layer [C].", "optional": false, "type": "Param_GenericObject"}, {"name": "comfort", "description": "Integers noting whether the input conditions result in no\r\nthermal stress (aka. they are comfortable.\r\n_\r\nValues are one of the following:\r\n* 0 = uncomfortable\r\n* 1 = comfortable", "optional": false, "type": "Param_GenericObject"}, {"name": "condition", "description": "Integers noting the thermal status of a subject.\r\n_\r\nValues are one of the following:\r\n* -1 = cold\r\n*  0 = netural\r\n* +1 = hot", "optional": false, "type": "Param_GenericObject"}, {"name": "category", "description": "Integers noting the thermal status on a nine-point scale.\r\n_\r\nValues are one of the following:\r\n* -4 = very strong/extreme cold stress\r\n* -3 = strong cold stress\r\n* -2 = moderate cold stress\r\n* -1 = slight cold stress\r\n* 0 = no thermal stress\r\n* +1 = slight heat stress\r\n* +2 = moderate heat stress\r\n* +3 = strong heat stress\r\n* +4 = very strong/extreme heat stress", "optional": false, "type": "Param_GenericObject"}, {"name": "core_cond", "description": "Integers noting the classification of core body temperature.\r\n_\r\nValues are one of the following:\r\n* -2 = Hypothermia\r\n* -1 = Cold\r\n* 0 = Normal\r\n* +1 = Hot\r\n* +2 = Hyperthermia", "optional": false, "type": "Param_GenericObject"}, {"name": "comf_obj", "description": "A Python object containing all inputs and results of the\r\nanalysis.  This can be plugged into components like the \"Comfort\r\nStatistics\" component to get further information.", "optional": false, "type": "Param_GenericObject"}], "preset_items": [], "availability": "INSTANTIATED", "source": "C:/Program Files/ladybug_tools/grasshopper/ladybug_grasshopper/user_objects\\LB PET Comfort.ghuser", "id": "LB-038", "group": "資料與熱舒適分析", "hub_status": "待接入 Hub", "base_guid": "410755b1-224a-4c1e-a407-bf32fb45ea7e", "sha256": "4b977fd464e688e7be59ed1bf4bb46428fde6c917acdc2d5f830bb591266b060"}, {"file": "LB PMV Comfort.ghuser", "name": "LB PMV Comfort", "nickname": "", "category": "Ladybug", "subcategory": "1 :: Analyze Data", "guid": "d7cbb0be-c3ce-4647-a18e-dbd58b17fcc2", "description": "Calculate Predicted Mean Vote (PMV).\r\n-\r\nPMV is a thermal comfort model for use on the interior of buildings where a\r\nheating or cooling system is operational. For naturally ventilated buildings,\r\nthe Adaptive thermal comfort model is recommended and, for outdoor conditions,\r\nmodels such as Universal Thermal Climate Index (UTCI) or Physiological\r\nEquivalent Temperature (PET) are recommended.\r\n-", "version": "None", "inputs": [{"name": "_air_temp", "description": "Data Collection or individual value for air temperature in C.", "optional": true, "type": "Param_ScriptVariable"}, {"name": "_mrt_", "description": "Data Collection or individual value of mean radiant temperature\r\n(MRT) in C. Default is the same as the air_temp.", "optional": true, "type": "Param_ScriptVariable"}, {"name": "_rel_humid", "description": "Data Collection or individual value for relative humidity in %.\r\nNote that percent values are between 0 and 100.", "optional": true, "type": "Param_ScriptVariable"}, {"name": "_air_speed_", "description": "Data Collection or individual value for air speed in m/s.\r\nDefault is a very low speed of 0.1 m/s, which is typical of the\r\nroom air speeds induced by HVAC systems.", "optional": true, "type": "Param_ScriptVariable"}, {"name": "_met_rate_", "description": "Data Collection or individual value of metabolic rate in met.\r\nDefault is set to 1.1 met for seated, typing. Typical values include\r\nthe following.\r\n_\r\n* 1 met = Metabolic rate of a resting seated person\r\n* 1.2 met = Metabolic rate of a standing person\r\n* 2.4 met = Metabolic rate of a person walking at ~1 m/s (2 mph)", "optional": true, "type": "Param_ScriptVariable"}, {"name": "_clothing_", "description": "Data Collection or individual value of clothing insulation in clo.\r\n
