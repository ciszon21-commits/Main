shopper/ladybug_grasshopper/user_objects\\LB Generate Point Grid.ghuser", "id": "LB-092", "group": "輔助工具與預設選單", "hub_status": "待接入 Hub", "base_guid": "410755b1-224a-4c1e-a407-bf32fb45ea7e", "sha256": "fe28e8d4524a0d08aa73f1e03a8223aef74f6888680568e6ad51e8f7fd39981e"}, {"file": "LB Legend 2D Parameters.ghuser", "name": "LB Legend 2D Parameters", "nickname": "", "category": "Ladybug", "subcategory": "4 :: Extra", "guid": "4d2f998b-b0be-43f1-9cc8-88997a1393ea", "description": "Customize the properties of a screen-oreinted 2D legend displaying with the\r\n\"LB Preview VisualizationSet\" component.\r\n-", "version": "None", "inputs": [{"name": "origin_x_", "description": "An integer in pixels to note the X coordinate of the base point from\r\nwhere the 2D legend will be generated (assuming an origin in the\r\nupper-left corner of the screen with higher positive values of\r\nX moving to the right). Alternatively, this can be a text string\r\nending in a % sign to denote the percentage of the screen where\r\nthe X coordinate exists (eg. 5%). The default is set to make the\r\nlegend clearly visible in the upper-left corner of the\r\nscreen (10 pixels).", "optional": true, "type": "Param_ScriptVariable"}, {"name": "origin_y_", "description": "An integer in pixels to note the Y coordinate of the base point from\r\nwhere the legend will be generated (assuming an origin in the\r\nupper-left corner of the screen with higher positive values of\r\nY moving downward). Alternatively, this can be a text string\r\nending in a % sign to denote the percentage of the screen where\r\nthe X coordinate exists (eg. 5%). The default is set to make the\r\nlegend clearly visible in the upper-left corner of the\r\nscreen (50 pixels).", "optional": true, "type": "Param_ScriptVariable"}, {"name": "seg_height_", "description": "A integer in pixels to note the height for each of the legend segments.\r\nAlternatively, this can be a text string ending in a % sign to\r\ndenote the percentage of the screen (eg. 5%). The default is set\r\nto make most legends readable on standard resolution\r\nscreens (25px for horizontal and 36px for vertical).", "optional": true, "type": "Param_ScriptVariable"}, {"name": "seg_width_", "description": "An integer in pixels to set the width of each of the legend segments.\r\nAlternatively, this can be a text string ending in a % sign to\r\ndenote the percentage of the screen (eg. 5%). The default is set\r\nto make most legends readable on standard resolution\r\nscreens (36px for horizontal and 25px for vertical).", "optional": true, "type": "Param_ScriptVariable"}, {"name": "text_height_", "description": "An integer in pixels to set the height for the legend text.\r\nAlternatively, this can be a text string ending in a % sign to\r\ndenote the percentage of the screen (eg. 2%).", "optional": true, "type": "Param_ScriptVariable"}], "outputs": [{"name": "leg_par2d", "description": "A legend parameter object that can be plugged into any of the\r\nLadybug components with a legend.", "optional": false, "type": "Param_GenericObject"}], "preset_items": [], "availability": "INSTANTIATED", "source": "C:/Program Files/ladybug_tools/grasshopper/ladybug_grasshopper/user_objects\\LB Legend 2D Parameters.ghuser", "id": "LB-093", "group": "輔助工具與預設選單", "hub_status": "待接入 Hub", "base_guid": "410755b1-224a-4c1e-a407-bf32fb45ea7e", "sha256": "e8bfc41426c7d9aa757fd15dc4096acc4a1a892366f585101837928f55146e98"}, {"file": "LB Legend Parameters.ghuser", "name": "LB Legend Parameters", "nickname": "", "category": "Ladybug", "subcategory": "4 :: Extra", "guid": "f2bb077b-003c-40ba-aecf-54951a8076a2", "description": "Use this component to change the colors, numerical range, and/or number of divisions\r\nof any Ladybug legend along with the corresponding colored mesh that the legend refers to.\r\n-\r\nAny Ladybug component that outputs a colored mesh and a legend will have an input\r\nthat can accept Legend Parameters from this component.\r\n-", "version": "None", "inputs": [{"name": "min_", "description": "A number to set the lower boundary of the legend. If None, the\r\nminimum of the values associated with the legend will be used.", "optional": true, "type": "Param_ScriptVariable"}, {"name": "max_", "description": "A number to set the upper boundary of the legend. If None, the\r\nmaximum of the values associated with the legend will be used.", "optional": true, "type": "Param_ScriptVariable"}, {"name": "seg_count_", "description": "An interger representing the number of steps between\r\nthe high and low boundary of the legend. The default is set to 11\r\nand any custom values input in here should always be greater than or\r\nequal to 2.", "optional": true, "type": "Param_ScriptVariable"}, {"name": "colors_", "description": "An list of color objects. Default is Ladybug's original colorset.", "optional": true, "type": "Param_ScriptVariable"}, {"name": "continuous_leg_", "description": "Boolean. If True, the colors along the legend will be in\r\na continuous gradient. If False, they will be categorized in\r\nincremental groups according to the number_of_segments.\r\nDefault is False for depicting discrete categories.", "optional": true, "type": "Param_ScriptVariable"}, {"name": "num_decimals_", "description": "An optional integer to set the number of decimal\r\nplaces for the numbers in the legend text. Default is 2.", "optional": true, "type": "Param_ScriptVariable"}, {"name": "larger_smaller_", "description": "Boolean noting whether to include larger than and\r\nsmaller than (> and \u003c) values after the upper and lower legend segment\r\ntext. Default is False.", "optional": true, "type": "Param_ScriptVariable"}, {"name": "vert_or_horiz_", "description": "Boolean. If True, the legend mesh and text points\r\nwill be generated vertically.  If False, they will genrate a\r\nhorizontal legend. Default is True for a vertically-oriented legend.", "optional": true, "type": "Param_ScriptVariable"}, {"name": "base_plane_", "description": "A Plane to note the starting point and orientation from\r\nwhere the legend will be genrated. The default is the world XY plane\r\nat origin (0, 0, 0).", "optional": true, "type": "Param_ScriptVariable"}, {"name": "seg_height_", "description": "An optional number to set the height of each of the legend\r\nsegments. Default is 1.", "optional": true, "type": "Param_ScriptVariable"}, {"name": "seg_width_", "description": "An optional number to set the width of each of the legend\r\nsegments. Default is 1 when legend is vertical. When horizontal, the\r\ndefault is (text_height * (number_decimal_places + 2)).", "optional": true, "type": "Param_ScriptVariable"}, {"name": "text_height_", "description": "An optional number to set the size of the text in model units.\r\nDefault is half of the segment_height.", "optional": true, "type": "Param_ScriptVariable"}, {"name": "font_", "description": "An optional text string to specify the font to be used for the text.\r\nExamples include \"Arial\", \"Times New Roman\", \"Courier\" (all without\r\nquotations). Default is \"Arial\".", "optional": true, "type": "Param_ScriptVariable"}], "outputs": [{"name": "leg_par", "description": "A legend parameter object that can be plugged into any of the\r\nLadybug components with a legend.", "optional": false, "type": "Param_GenericObject"}], "preset_items": [], "availability": "INSTANTIATED", "source": "C:/Program Files/ladybug_tools/grasshopper/ladybug_grasshopper/user_objects\\LB Legend Parameters.ghuser", "id": "LB-094", "group": "輔助工具與預設選單", "hub_status": "待接入 Hub", "base_guid": "410755b1-224a-4c1e-a407-bf32fb45ea7e", "sha256": "f92d33759ef753bef2bf83b56493fb53c08ddcc3044ff4dfeabf00d69a32e049"}, {"file": "LB Legend Parameters Categorized.ghuser", "name": "LB Legend Parameters Categorized", "nickname": "", "category": "Ladybug", "subcategory": "4 :: Extra", "guid": "88cf3633-b714-4754-831f-f9c81d17e2b7", "description": "Use this component to change the colors, range, and display of any Ladybug legend\r\nalong with the corresponding colored mesh that the legend refers to.\r\n-\r\nThe legend parameters from this component have more limitations than the normal\r\nLegend Parameters. However, these legend parameters will do auto-categorization\r\nof data, binning values into groups based on custom ranges.\r\n-", "version": "None", "inputs": [{"name": "_domain", "description": "A list of one or more numbers noting the bondaries of the data\r\ncategories. For example, [100, 2000] creates three categories of\r\n(\u003c100, 100-2000, >2000). Values must always be ordered from lowest\r\nto highest.", "optional": true, "type": "Param_ScriptVariable"}, {"name": "_colors", "description": "An list of color objects with a length equal to the number of items\r\nin the domain + 1. These are used to color each of the categories of data.", "optional": true, "type": "Param_ScriptVariable"}, {"name": "categories_", "description": "An optional list of text strings with a length equal to the\r\ncolors. These will be used to name each of the categories in the legend.\r\nIf None, the legend text will simply mark the numerical ranges of the\r\ncategories. (Default: None).", "optional": true, "type": "Param_ScriptVariable"}, {"name": "continuous_cols_", "description": "Boolean noting whether colors generated are continuous\r\nor discrete. If True, the colors generated from the corresponding\r\nlegend will be in a continuous gradient. If False, they will be\r\ncategorized in incremental groups according to the segment_count.", "optional": true, "type": "Param_ScriptVariable"}, {"name": "continuous_leg_", "description": "Boolean. If True, the colors along the legend will be in\r\na continuous gradient. If False, they will be categorized in\r\nincremental groups according to the number_of_segments.\r\nDefault is False for depicting discrete categories.", "optional": true, "type": "Param_ScriptVariable"}, {"name": "num_decimals_", "description": "An optional integer to set the number of decimal\r\nplaces for the numbers in the legend text. Default is 2.", "optional": true, "type": "Param_ScriptVariable"}, {"name": "larger_smaller_", "description": "Boolean noting whether to include larger than and\r\nsmaller than (> and \u003c) values after the upper and lower legend segment\r\ntext. Default is False.", "optional": true, "type": "Param_ScriptVariable"}, {"name": "vert_or_horiz_", "description": "Boolean. If True, the legend mesh and text points\r\nwill be generated vertically.  If False, they will genrate a\r\nhorizontal legend. Default is True for a vertically-oriented legend.", "optional": true, "type": "Param_ScriptVariable"}, {"name": "base_plane_", "description": "A Plane to note the starting point and orientation from\r\nwhere the legend will be genrated. The default is the world XY plane\r\nat origin (0, 0, 0).", "optional": true, "type": "Param_ScriptVariable"}, {"name": "seg_height_", "description": "An optional number to set the height of each of the legend\r\nsegments. Default is 1.", "optional": true, "type": "Param_ScriptVariable"}, {"name": "seg_width_", "description": "An optional number to set the width of each of the legend\r\nsegments. Default is 1 when legend is vertical. When horizontal, the\r\ndefault is (text_height * (number_decimal_places + 2)).", "optional": true, "type": "Param_ScriptVariable"}, {"name": "text_height_", "description": "An optional number to set the size of the text in model units.\r\nDefault is half of the segment_height.", "optional": true, "type": "Param_ScriptVariable"}, {"name": "font_", "description": "An optional text string to specify the font to be used for the text.\r\nExamples include \"Arial\", \"Times New Roman\", \"Courier\" (all without\r\nquotations). Default is \"Arial\".", "optional": true, "type": "Param_ScriptVariable"}], "outputs": [{"name": "leg_par", "description": "A legend parameter object that can be plugged into any of the\r\nLadybug components with a legend.", "optional": false, "type": "Param_GenericObject"}], "preset_items": [], "availability": "INSTANTIATED", "source": "C:/Program Files/ladybug_tools/grasshopper/ladybug_grasshopper/user_objects\\LB Legend Parameters Categorized.ghuser", "id": "LB-095", "group": "輔助工具與預設選單", "hub_status": "待接入 Hub", "base_guid": "410755b1-224a-4c1e-a407-bf32fb45ea7e", "sha256": "0511bc15e715bced983457376bde5d57ec80d7fd98671e537ee8c06f9156d033"}, {"file": "LB Load Data.ghuser", "name": "LB Load Data", "nickname": "", "category": "Ladybug", "subcategory": "4 :: Extra", "guid": "2828041b-f3de-4c0a-935f-36ee8b4fd661", "description": "Load Ladybug data collections from a CSV, JSON, or PKL file.\r\n-", "version": "None", "inputs": [{"name": "_data_file", "description": "A file path to a CSV, JSON or PKL file from which data collections\r\nwill be loaded.", "optional": true, "type": "Param_ScriptVariable"}, {"name": "_load", "description": "Set to \"True\" to load the data collections from the _data_file.", "optional": true, "type": "Param_ScriptVariable"}], "outputs": [{"name": "out", "description": "Reports, errors, warnings, etc.", "optional": false, "type": "Param_String"}, {"name": "data", "description": "A list of honeybee objects that have been re-serialized from\r\nthe input file.", "optional": false, "type": "Param_GenericObject"}], "preset_items": [], "availability": "INSTANTIATED", "source": "C:/Program Files/ladybug_tools/grasshopper/ladybug_grasshopper/user_objects\\LB Load Data.ghuser", "id": "LB-096", "group": "輔助工具與預設選單", "hub_status": "待接入 Hub", "base_guid": "410755b1-224a-4c1e-a407-bf32fb45ea7e", "sha256": "558f7e0a7521af447bb326f91250ee967d7ac43571debfd313f87a2e2ae838cb"}, {"file": "LB Magnetic to True North.ghuser", "name": "LB Magnetic to True North", "nickname": "", "category": "Ladybug", "subcategory": "4 :: Extra", "guid": "8e9e66e3-90c3-4aa5-9ba9-3e6ecf421bab", "description": "Compute a True North angle and vector from Magnetic North at a given location.\r\n_\r\nThis component uses then World Magnetic Model (WMM) developed and maintained by NOAA.\r\nhttps://www.ncei.noaa.gov/products/world-magnetic-model\r\n-", "version": "None", "inputs": [{"name": "_location", "description": "A ladybug Location that has been output from the \"LB Import EPW\"\r\ncomponent or the \"LB Construct Location\" component. This is used\r\nto determine the difference between magnetic and true North.", "optional": true, "type": "Param_ScriptVariable"}, {"name": "_mag_north", "description": "A number between -360 and 360 for the counterclockwise difference\r\nbetween Magnetic North and the positive Y-axis in degrees. Counterclockwise\r\nmeans \"90 is West and 270 is East\". This can also be Vector for the\r\nmagnetic North direction.", "optional": true, "type": "Param_ScriptVariable"}, {"name": "_year_", "description": "A number for the year in which the Magnetic North was evaluated. Decimal\r\nvalues are accepted. This is needed as the location of Magnetic\r\nNorth has been moving at a rate of roughly 50 km/year for the\r\npast couple of decades. (Default: 2025).", "optional": true, "type": "Param_ScriptVariable"}, {"name": "cof_file_", "description": "An optional path to a .COF file containing the coefficients that form the\r\ninputs for the World Magnetic Model (WMM). A new set of coefficients\r\nis published roughly every 5 years as the magnetic poles continue to\r\nmove. If unspecified, coefficients will be taken from the most\r\nrecent model. COF files with the most recent coefficients and\r\nhistorical values are available at:", "optional": true, "type": "Param_ScriptVariable"}], "outputs": [{"name": "mag_declination", "description": "The magnetic declination in degrees. Magnetic declination is the\r\ndifference between magnetic North and true North at a given location on\r\nthe globe (expressed in terms of degrees).", "optional": false, "type": "Param_GenericObject"}, {"name": "true_north", "description": "A number between -360 and 360 for the True North angle in degrees.", "optional": false, "type": "Param_GenericObject"}, {"name": "true_north_vec", "description": "A vector for the True North direction. This can be plugged into\r\nany of the north_ inputs of the other LAdybug Tools components.", "optional": false, "type": "Param_GenericObject"}], "preset_items": [], "availability": "INSTANTIATED", "source": "C:/Program Files/ladybug_tools/grasshopper/ladybug_grasshopper/user_objects\\LB Magnetic to True North.ghuser", "id": "LB-097", "group": "輔助工具與預設選單", "hub_status": "待接入 Hub", "base_guid": "410755b1-224a-4c1e-a407-bf32fb45ea7e", "sha256": "67ad06f90045c45cfbf9716c4e934ce68dd48d47051bfdaea36d95b7c90ece5f"}, {"file": "LB Mesh Threshold Selector.ghuser", "name": "LB Mesh Threshold Selector", "nickname": "", "category": "Ladybug", "subcategory": "4 :: Extra", "guid": "b1a9307b-f191-4475-87e9-f08a6ba9cd18", "description": "Select a sub-region of a mesh using aligned values and conditional criteria.\r\n_\r\nThis has multiple uses and can be applied to any study that outputs a list of\r\nresults that are aligned with a mesh. For example, quantifying the daylit area\r\nfrom a daylight analysis, selecting the portion of a roof with enough solar\r\nradiation for photovoltaic panels, etc.\r\n-", "version": "None", "inputs": [{"name": "_values", "description": "A list of numbers that correspond to either the number of faces\r\nor vertices of the _mesh.", "optional": true, "type": "Param_ScriptVariable"}, {"name": "_mesh", "description": "The mesh from which a sub-region will be selected. This is typically\r\na colored mesh output from a study.", "optional": true, "type": "Param_ScriptVariable"}, {"name": "_operator_", "description": "A text string representing an operator for the the conditional statement. \r\nThe default is greater than (>).  This must be an operator in python\r\nand examples include the following:\r\n* > - Greater Than\r\n* \u003c - Less Than\r\n* >= - Greater or Equal\r\n* \u003c= - Less or Equal\r\n* == - Equals\r\n* != - Does not Equal", "optional": true, "type": "Param_ScriptVariable"}, {"name": "_pct_threshold_", "description": "A number between 0 and 100 that represents the percentage\r\nof the mesh faces or vertices to be included in the resulting\r\nsub_mesh. (Default: 25%).", "optional": true, "type": "Param_ScriptVariable"}, {"name": "abs_threshold_", "description": "An optional number that represents the absolute threshold above\r\nwhich a given mesh face or vertex is included in the resulting\r\nsub_mesh. An input here will override the percent threshold input\r\nabove.", "optional": true, "type": "Param_ScriptVariable"}], "outputs": [{"name": "out", "description": "Reports, errors, warnings, etc.", "optional": false, "type": "Param_String"}, {"name": "total_value", "description": "The sum of each value that meets the criteria multiplied by the\r\ncorresponding mesh face area. This can generally be used to\r\nunderstand how much value is captured according to the conditional\r\ncritera. For example, if the input _mesh is a radiation study,\r\nthis is equal to the total radiation falling on the sub_mesh.\r\nThis may or may not be meaningful depending on the units of the\r\nconnected _values. This output will always be zero for cases\r\nwhere values correspond to mesh vertices and not faces.", "optional": false, "type": "Param_GenericObject"}, {"name": "total_area", "description": "The area of the sub_mesh that meets the criteria.", "optional": false, "type": "Param_GenericObject"}, {"name": "sub_mesh", "description": "A new mesh with the faces or vertices removed to reveal just the portion\r\nthat satisfies the conditional criteria. By default, this is hidden\r\nto that just the outline appears in the geometry preview.", "optional": false, "type": "Param_GenericObject"}, {"name": "outline", "description": "A set of lines outlining the portion of the mesh that is above\r\nthe threshold.", "optional": false, "type": "Param_GenericObject"}], "preset_items": [], "availability": "INSTANTIATED", "source": "C:/Program Files/ladybug_tools/grasshopper/ladybug_grasshopper/user_objects\\LB Mesh Threshold Selector.ghuser", "id": "LB-098", "group": "輔助工具與預設選單", "hub_status": "待接入 Hub", "base_guid": "410755b1-224a-4c1e-a407-bf32fb45ea7e", "sha256": "eaaf52883fa5337aa4bb4e7cf157a816412fa3b81ce2899ac7f34b769a9ba03e"}, {"file": "LB Mesh to Hatch.ghuser", "name": "LB Mesh to Hatch", "nickname": "", "category": "Ladybug", "subcategory": "4 :: Extra", "guid": "a4b30e5e-5505-448f-ac9f-02b0d650b5aa", "description": "Bake a clored mesh into the Rhino scene as a group of colored hatches.\r\n_\r\nThis is useful when exporting ladybug graphics from Rhino to vector-based programs\r\nlike Inkscape or Illustrator since hatches are exported from Rhino as colored-filled\r\npolygons.\r\n-", "version": "None", "inputs": [{"name": "_mesh", "description": "A colored mesh (or list of colored meshes) to be baked into the Rhino\r\nscene as groups of colored hatches.", "optional": true, "type": "Param_ScriptVariable"}, {"name": "layer_", "description": "Text for the layer name on which the hatch will be added. If unspecified,\r\nit will be baked onto the currently active layer.", "optional": true, "type": "Param_ScriptVariable"}, {"name": "_run", "description": "Set to 'True' to bake the mesh into the scene as hatches.", "optional": true, "type": "Param_ScriptVariable"}], "outputs": [{"name": "out", "description": "Reports, errors, warnings ...", "optional": false, "type": "Param_String"}], "preset_items": [], "availability": "INSTANTIATED", "source": "C:/Program Files/ladybug_tools/grasshopper/ladybug_grasshopper/user_objects\\LB Mesh to Hatch.ghuser", "id": "LB-099", "group": "輔助工具與預設選單", "hub_status": "待接入 Hub", "base_guid": "410755b1-224a-4c1e-a407-bf32fb45ea7e", "sha256": "48951c5ddcfb71afaa71e08d8c28a51d301eb602368aad4f7254a40e4d3f3506"}, {"file": "LB Open Directory.ghuser", "name": "LB Open Directory", "nickname": "", "category": "Ladybug", "subcategory": "4 :: Extra", "guid": "8a69bcee-82ab-4c0f-85cc-d2c84b9b6413", "description": "Open a file's directory in Windows Explorer or Mac Finder.\r\nThis is useful for understanding weather data or simulation files.\r\n-", "version": "None", "inputs": [{"name": "_file_path", "description": "Full path to a file or directory to be opened in Explorer/Finder.", "optional": true, "type": "Param_ScriptVariable"}], "outputs": [{"name": "out", "description": "Reports, errors, warnings, etc.", "optional": false, "type": "Param_String"}], "preset_items": [], "availability": "INSTANTIATED", "source": "C:/Program Files/ladybug_tools/grasshopper/ladybug_grasshopper/user_objects\\LB Open Directory.ghuser", "id": "LB-100", "group": "輔助工具與預設選單", "hub_status": "待接入 Hub", "base_guid": "410755b1-224a-4c1e-a407-bf32fb45ea7e", "sha256": "8c68e2ce1186add43a3e7b585b8ab9d508bdc0dd7cbaf4103777821ba1428c96"}, {"file": "LB Open File.ghuser", "name": "LB Open File", "nickname": "", "category": "Ladybug", "subcategory": "4 :: Extra", "guid": "c0fc3e08-7246-42fa-9def-e24d012ed06f", "description": "Open a file in whatever program is associated with the file extension.\r\nThis can be used to open simulation files in particular applications (eg. opening\r\nan OSM file in the OpenStudio Application).\r\n-", "version": "None", "inputs": [{"name": "_file_path", "description": "Full path to a file to be opened.", "optional": true, "type": "Param_ScriptVariable"}], "outputs": [{"name": "out", "description": "Reports, errors, warnings, etc.", "optional": false, "type": "Param_String"}], "preset_items": [], "availability": "INSTANTIATED", "source": "C:/Program Files/ladybug_tools/grasshopper/ladybug_grasshopper/user_objects\\LB Open File.ghuser", "id": "LB-101", "group": "輔助工具與預設選單", "hub_status": "待接入 Hub", "base_guid": "410755b1-224a-4c1e-a407-bf32fb45ea7e", "sha256": "0bdd5a2a1b056ecdd5ea5842acc0d949c4a0d5c95bfc02c49a9985f5ab9730b4"}, {"file": "LB Orient to Camera.ghuser", "name": "LB Orient to Camera", "nickname": "", "category": "Ladybug", "subcategory": "4 :: Extra", "guid": "d526dac0-390c-4172-bbd8-903229ffe1ac", "description": "Orient a series of geometries to the active viewport camera.\r\n-", "version": "None", "inputs": [{"name": "_geo", "description": "A series of geometries to be oriented to the camera of the active\r\nRhino viewport.", "optional": true, "type": "Param_ScriptVariable"}, {"name": "_position_", "description": "A point to be used as the origin around which the the geometry\r\nwill be oriented. If None, the lower left corner of the bounding box\r\naround the geometry will be used.", "optional": true, "type": "Param_ScriptVariable"}, {"name": "refresh_", "description": "Connect a Grasshopper \"button\" component to refresh the orientation\r\nupon hitting the button. You can also connect a Grasshopper \"Timer\"\r\ncomponent to update the view in real time as you navigate through\r\nthe Rhino scene.", "optional": true, "type": "Param_ScriptVariable"}], "outputs": [{"name": "geo", "description": "The input geometry that has been oriented to the camera of the active\r\nRhino viewport.", "optional": false, "type": "Param_GenericObject"}], "preset_items": [], "availability": "INSTANTIATED", "source": "C:/Program Files/ladybug_tools/grasshopper/ladybug_grasshopper/user_objects\\LB Orient to Camera.ghuser", "id": "LB-102", "group": "輔助工具與預設選單", "hub_status": "待接入 Hub", "base_guid": "410755b1-224a-4c1e-a407-bf32fb45ea7e", "sha256": "3b3966461d98b3678be5f99abb4fd550f6fb7e39eafa0411af27a987d998cd43"}, {"file": "LB PET Body Parameters.ghuser", "name": "LB PET Body Parameters", "nickname": "", "category": "Ladybug", "subcategory": "4 :: Extra", "guid": "0336e4b1-11d7-452a-a35b-9ab42fe88d83", "description": "Create a set of parameters that define the body characteristics for the PET model.\r\n-\r\nThese parameters can be plugged into any of the components that compute\r\nPET thermal comfort.\r\n-", "version": "None", "inputs": [{"name": "_age_", "description": "The age of the human subject in years. (Default: 36 years for middle age\r\nof the average worldwide life expectancy).", "optional": true, "type": "Param_ScriptVariable"}, {"name": "_sex_", "description": "A value between 0 and 1 to indicate the sex of the human subject,\r\nwhich influences the computation of basal metabolism. 0 indicates male.\r\n1 indicates female and any number in between denotes a weighted average\r\nbetween the two. (Default: 0.5).", "optional": true, "type": "Param_ScriptVariable"}, {"name": "_height_", "description": "The height of the human subject in meters. Average male height\r\nis around 1.75m while average female height is 1.55m. (Default: 1.65m\r\nfor a worldwide average between male and female height).", "optional": true, "type": "Param_ScriptVariable"}, {"name": "_body_mass_", "description": "The body mass of the human subject in kilograms. (Default: 62 kg\r\nfor the worldwide average adult human body mass).", "optional": true, "type": "Param_ScriptVariable"}, {"name": "_posture_", "description": "A text string indicating the posture of the body. Letters must\r\nbe lowercase. Default is \"standing\". Choose from the following:\r\n_\r\n* standing\r\n* seated\r\n* crouching", "optional": true, "type": "Param_ScriptVariable"}, {"name": "humid_acclim_", "description": "A boolean to note whether the human subject is acclimated\r\nto a humid/tropical climate (True) or is acclimated to a temperate\r\nclimate (False). When True, the categories developed by Lin and\r\nMatzarakis (2008) will be used to assess comfort instead of the original\r\ncategories developed by Matzarakis and Mayer (1996).", "optional": true, "type": "Param_ScriptVariable"}], "outputs": [{"name": "pet_par", "description": "A PET comfort parameter object that can be plugged into any of the\r\ncomponents that compute PET thermal comfort.", "optional": false, "type": "Param_GenericObject"}], "preset_items": [], "availability": "INSTANTIATED", "source": "C:/Program Files/ladybug_tools/grasshopper/ladybug_grasshopper/user_objects\\LB PET Body Parameters.ghuser", "id": "LB-103", "group": "輔助工具與預設選單", "hub_status": "待接入 Hub", "base_guid": "410755b1-224a-4c1e-a407-bf32fb45ea7e", "sha256": "2d260b3e057264362bf45a78d4042293c719cad91cbd3c1faad8ee3efc45e8c9"}, {"file": "LB PMV Comfort Parameters.ghuser", "name": "LB PMV Comfort Parameters", "nickname": "", "category": "Ladybug", "subcategory": "4 :: Extra", "guid": "6498e7e2-2938-4d43-aaff-ed55ea9f2875", "description": "Create a set of parameters that define the acceptable conditions of the\r\nPredicted Mean Vote (PMV) thermal comfort model.\r\n-\r\nThese parameters can be plugged into any of the components that compute\r\nPMV thermal comfort.\r\n-", "version": "None", "inputs": [{"name": "_ppd_thresh_", "description": "A number between 5 and 100 that represents the upper\r\nthreshold of PPD that is considered acceptable.\r\nDefault is 10, which charcterizes most buildings in the\r\nASHRAE-55 and EN-15251 standards.", "optional": true, "type": "Param_ScriptVariable"}, {"name": "_hr_upper_", "description": "A number between 0 and 1 indicating the upper limit of\r\nhumidity ratio that is considered acceptable.\r\nDefault is 1 for essentially no limit.", "optional": true, "type": "Param_ScriptVariable"}, {"name": "_hr_lower_", "description": "A number between 0 and 1 indicating the lower limit of\r\nhumidity ratio considered acceptable.\r\nDefault is 0 for essentially no limit.", "optional": true, "type": "Param_ScriptVariable"}, {"name": "_still_air_thresh_", "description": "The air speed threshold in m/s at which the standard\r\neffective temperature (SET) model will be used to correct for the\r\ncooling effect of elevated air speeds.\r\nDefault is 0.1 m/s, which is the limit according to ASHRAE-55.", "optional": true, "type": "Param_ScriptVariable"}], "outputs": [{"name": "pmv_par", "description": "A PMV comfort parameter object that can be plugged into\r\nany of the components that compute PMV thermal comfort.", "optional": false, "type": "Param_GenericObject"}], "preset_items": [], "availability": "INSTANTIATED", "source": "C:/Program Files/ladybug_tools/grasshopper/ladybug_grasshopper/user_objects\\LB PMV Comfort Parameters.ghuser", "id": "LB-104", "group": "輔助工具與預設選單", "hub_status": "待接入 Hub", "base_guid": "410755b1-224a-4c1e-a407-bf32fb45ea7e", "sha256": "0a2a0814cacf1593231a3d4e9d96c7db4120ed6b5c23a322d1da5c29ec2757f0"}, {"file": "LB Passive Strategies.ghuser", "name": "LB Passive Strategies", "nickname": "Strategies", "category": "Ladybug", "subcategory": "4 :: Extra", "guid": "23de340c-b8c3-4f47-9c0c-cd3257d24c0e", "description": "Provides a list of passive thermal strategies to be plugged into the \"LB PMV Polygon\" component.", "version": "Preset value list", "inputs": [], "outputs": [{"name": "Selection", "description": "Preset value list", "optional": false, "type": "ValueList"}], "preset_items": [{"name": "Evaporative Cooling", "expression": "\"Evaporative Cooling\""}, {"name": "Mass + Night Vent", "expression": "\"Mass + Night Vent\""}, {"name": "Occupant Use of Fans", "expression": "\"Occupant Use of Fans\""}, {"name": "Capture Internal Heat", "expression": "\"Capture Internal Heat\""}, {"name": "Passive Solar Heating", "expression": "\"Passive Solar Heating\""}], "availability": "INSTANTIATED", "source": "C:/Program Files/ladybug_tools/grasshopper/ladybug_grasshopper/user_objects\\LB Passive Strategies.ghuser", "id": "LB-105", "group": "輔助工具與預設選單", "hub_status": "待接入 Hub", "base_guid": "00027467-0d24-4fa7-b178-8dc0ac5f42ec", "sha256": "961aaf72893fac954635e30620118cf8de331d5a38960132720fc8ac6fc99848"}, {"file": "LB Passive Strategy Parameters.ghuser", "name": "LB Passive Strategy Parameters", "nickname": "", "category": "Ladybug", "subcategory": "4 :: Extra", "guid": "fc3b4520-4fcf-4a2d-9fbc-9eae840bab03", "description": "Adjust the assumptions of the passive strategies that can be overalid on the\r\nPsychrometric Chart using the \"LB PMV Polygon\" component. The default assumptions\r\nof each of the strategies are as follows: \r\n_\r\nThermal Mass + Night Vent - The polygon represents the conditions under which\r\nshaded, night-flushed thermal mass can keep occupants cool. By default, this\r\npolygon assumes that temperatures can get as high as 12 C above the max temperature\r\nof the comfort polygon as long temperatures 8 hours before the hot hour are\r\n3.0 C lower than the max temperture of the comfort polygon. This parameter\r\ncomponent can be used to adjust these two temperature values and the number of\r\nhours that the building keeps its \"coolth\".\r\n_\r\nOccupant Use of Fans - This polygon is made by assuming that an air speed of 1.0 m/s\r\nis the maximum speed tolerable before papers start blowing around and conditions\r\nbecome annoying to occupants. The polygon is determined by running a PMV model\r\nwith this fan air speed and the PMV inputs of the warmest comfort conditions.\r\nThis parameter component can be used to adjust this maximum acceptable air speed.\r\n_\r\nCapture Internal Heat - The polygon is made by assuming a minimum building balance\r\npoint of 12.8 C and any conditions that are warmer than that will keep occupants\r\ncomfortable (up to the comfort polygon). It is assumed that, above this building\r\nbalance temperature, the building is free-running and occupants are able to open\r\nwindows as they wish to keep conditions from overshooting the comfort polygon.\r\nNote that the default balance temperature of 12.8 C is fairly low and assumes a\r\nsignificant amount of internal heat from people, equipment. etc. Or the building \r\nas a well-insulated envelope to ensure what internal heat there is can leave the\r\nbuilding slowly. This parameter component can be used to adjust the balance\r\ntemperature.\r\n_\r\nPassive Solar Heating - The polygon represents the conditions under which\r\nsun-exposed thermal mass can keep occupants warm in winter. By default, this\r\npolygon assumes that temperatures can get as high as 12 C above the max temperature\r\nof the comfort polygon as long temperatures 8 hours before the hot hour are\r\n3.0 C lower than the max temperture of the comfort polygon. This parameter\r\ncomponent can be used to adjust these two temperature values and the number of\r\nhours that the building keeps its \"coolth\".\r\n-", "version": "None", "inputs": [{"name": "_day_above_comf_", "description": "A number in degrees Celsius representing the maximum daily\r\ntemperature above the comfort range which can still be counted in\r\nthe \"Mass + Night Vent\" polygon. (Default: 12 C).", "optional": true, "type": "Param_ScriptVariable"}, {"name": "_night_below_comf_", "description": "A number in degrees Celsius representing the minimum temperature\r\nbelow the maximum comfort polygon temperature that the outdoor\r\ntemperature must drop at night in order to count towards the \"Mass\r\n+ Night Vent\" polygon. (Default: 3C).", "optional": true, "type": "Param_ScriptVariable"}, {"name": "_fan_air_speed_", "description": "The air speed around the occupants that the fans create in m/s.\r\nThis is used to create the \"Occupant Use of Fans\" polygon. Note that\r\nvalues above 1 m/s tend to blow papers off desks. (Default: 1.0 m/3)", "optional": true, "type": "Param_ScriptVariable"}, {"name": "_balance_temp_", "description": "The balance temperature of the building in Celsius when accounting\r\nfor all internal heat. This is used to create the \"Capture Internal\r\nHeat\" polygon. This value must be greater or equal to 5 C (balance\r\ntemperatures below 10 C are exceedingly rare) and it should be less\r\nthan the coldest temperature of the merged comfort polygon in order\r\nto be meaningful. (Default: 12.8 C)", "optional": true, "type": "Param_ScriptVariable"}, {"name": "_solar_heat_cap_", "description": "A number representing the amount of outdoor solar flux (W/m2)\r\nthat is needed to raise the temperature of the theoretical building by\r\n1 degree Celsius. The lower this number, the more efficiently the\r\nspace is able to absorb passive solar heat. The default assumes a\r\nrelatively small passively solar heated zone without much mass. A\r\nhigher number will be required the larger the space is and the more\r\nmass that it has. (Default: 50 W/m2)", "optional": true, "type": "Param_ScriptVariable"}, {"name": "_time_constant_", "description": "A number that represents the amount of time in hours that a\r\ntherortical building can passively maintain its temperature. This\r\nis used to determine how many hours a space can maintain a cool\r\ntemperature after night flushing for the \"Mass + Night Vent\" polygon.\r\nIt is also used to determine how many hours a space can store solar\r\nradiation for the \"Passive Solar Heating\" polygon. The default\r\nassumes a relatively well-isulated building with a thermal mass\r\ntypical of most contemporary buildings. Higher mass buildings will\r\nbe able to support a longer time constant. (Default: 8 hours).", "optional": true, "type": "Param_ScriptVariable"}], "outputs": [{"name": "strategy_par", "description": "Passive strategy parameters that can be plugged into the \"LB\r\nPMV Polygon\" to adjust the assumptions of the passive strategy\r\npolygons.", "optional": false, "type": "Param_GenericObject"}], "preset_items": [], "availability": "INSTANTIATED", "source": "C:/Program Files/ladybug_tools/grasshopper/ladybug_grasshopper/user_objects\\LB Passive Strategy Parameters.ghuser", "id": "LB-106", "group": "輔助工具與預設選單", "hub_status": "待接入 Hub", "base_guid": "410755b1-224a-4c1e-a407-bf32fb45ea7e", "sha256": "b447f4976f3fa39f032bc2d780783cea54ac72ee3019b5349aa9bc1cdf5a37fc"}, {"file": "LB Preview VisualizationSet.ghuser", "name": "LB Preview VisualizationSet", "nickname": "", "category": "Ladybug", "subcategory": "4 :: Extra", "guid": "9f8b2770-5643-483b-9eed-ad7dd6404e86", "description": "Preview a VisualizationSet from any component with a vis_set output.\r\n_\r\nThe VisualizationSet is often a much more detailed view of the geometry that\r\nthe component typically generates and includes features like recommended line\r\nweights/types, display modes (eg. wireframe vs. shaded), transparency, and more.\r\n-", "version": "None", "inputs": [{"name": "_vis_set", "description": "VisualizationSet arguments from any Ladybug Tools component with a vis_set\r\noutput. This can also be the path to a .vsf file that exists on this\r\nmachine (these files are often written with the \"LB Dump VisualizationSet\"\r\ncomponent). Lastly, this input can be a custom VisualizationSet that\r\nhas been created with the Ladybug Tools SDK.", "optional": true, "type": "Param_ScriptVariable"}, {"name": "leg_par_", "description": "Script variable VisSet", "optional": true, "type": "Param_ScriptVariable"}, {"name": "leg_par2d_", "description": "Optional 2D LegendParameters from the \"LB Legend Parameters 2D\"\r\ncomponent, which will be used to customize a legend in the plane\r\nof the screen so that it functions like a head-up display (HUD).\r\nIf unspecified, the VisualizationSet will be rendered with 3D\r\nlegends in the Rhino scene much like the other native Ladybug\r\nTools components.", "optional": true, "type": "Param_ScriptVariable"}, {"name": "data_set_", "description": "Optional text or an integer to select a specific data set from analysis\r\ngeometries within the Visualization Set. Note that this input only has\r\nmeaning for Visualization Sets that contain multiple data sets assigned\r\nto the same geometry. When using an integer, this will refer to the\r\nindex of the data set to be visualized (starting with 0). When using\r\ntext, this will refer to the name of the data type for the data set\r\nto be displayed.", "optional": true, "type": "Param_ScriptVariable"}, {"name": "viewport_", "description": "Text for the name of the Rhino viewport in which the VisualizationSet\r\nwill be rendered. Multiple viewports can be connected to have the\r\nVisualizationSet display in several viewports. If unspecified, the\r\nVisualizationSet is rendered in all viewports. Acceptable inputs include:\r\n-\r\nPerspective\r\nTop\r\nBottom\r\nLeft\r\nRight\r\nFront\r\nBack\r\nany view name that has been saved within the Rhino file", "optional": true, "type": "Param_ScriptVariable"}], "outputs": [{"name": "vs", "description": "A VisualizationSet object that can be baked into the Rhino document by\r\nrunning \"Bake\" on this component or written to a standalone file\r\nusing the \"LB Dump VisualizationSet\" component.", "optional": false, "type": "Param_GenericObject"}], "preset_items": [], "availability": "INSTANTIATED", "source": "C:/Program Files/ladybug_tools/grasshopper/ladybug_grasshopper/user_objects\\LB Preview VisualizationSet.ghuser", "id": "LB-107", "group": "輔助工具與預設選單", "hub_status": "待接入 Hub", "base_guid": "410755b1-224a-4c1e-a407-bf32fb45ea7e", "sha256": "a734e315c34756d5ad2e33ded46be6b355c4e4007c899300e5f8e68137f04235"}, {"file": "LB Screen Oriented Text.ghuser", "name": "LB Screen Oriented Text", "nickname": "", "category": "Ladybug", "subcategory": "4 :: Extra", "guid": "cff8702b-38e3-4a0e-871e-79eca017cef5", "description": "Generate screen-oriented text that displays in the Rhino scene as a head-up\r\ndisplay (HUD).\r\n_\r\nThis is useful when there are certain summary results or information that should\r\nalways be displayed on-screen.\r\n-", "version": "None", "inputs": [{"name": "_text", "description": "Text string to be displayed in the plane of the screen.", "optional": true, "type": "Param_ScriptVariable"}, {"name": "leg_par2d_", "description": "Optional 2D LegendParameters from the \"LB Legend Parameters 2D\"\r\ncomponent, which will be used to customize a text in the plane\r\nof the screen. Note that only the text_height, origin_x and origin_y\r\ninputs of this component affect the placement of the text.", "optional": true, "type": "Param_ScriptVariable"}, {"name": "_font_", "description": "An optional text string to specify the font to be used for the text.\r\nExamples include \"Arial\", \"Times New Roman\", \"Courier\" (all without\r\nquotations). Default is \"Arial\".", "optional": true, "type": "Param_ScriptVariable"}, {"name": "_color_", "description": "An optional color to set the color of the text. If unspecified,\r\nit will be black.", "optional": true, "type": "Param_ScriptVariable"}, {"name": "viewport_", "description": "Text for the name of the Rhino viewport to which the 2D screen-oriented\r\ntext will be rendered. Multiple viewports can be connected to have the\r\ntext display in several viewports. If unspecified, the text is rendered\r\nin all viewports. Acceptable inputs include:\r\n-\r\nPerspective\r\nTop\r\nBottom\r\nLeft\r\nRight\r\nFront\r\nBack\r\nany view name that has been saved within the Rhino file", "optional": true, "type": "Param_ScriptVariable"}], "outputs": [], "preset_items": [], "availability": "INSTANTIATED", "source": "C:/Program Files/ladybug_tools/grasshopper/ladybug_grasshopper/user_objects\\LB Screen Oriented Text.ghuser", "id": "LB-108", "group": "輔助工具與預設選單", "hub_status": "待接入 Hub", "base_guid": "410755b1-224a-4c1e-a407-bf32fb45ea7e", "sha256": "3a515dd1366604e2802546542510ea8ccba4c00801ab8a33026f426d6abf5b1b"}, {"file": "LB Set View.ghuser", "name": "LB Set View", "nickname": "", "category": "Ladybug", "subcategory": "4 :: Extra", "guid": "86e09905-888c-4fc6-83d8-cd0cfcd0eb4d", "description": "Open a new viewport in Rhino that shows the parallel-projected view from the sun.\r\n_\r\nThis is useful for understanding what parts of Rhino geometry are shaded at a\r\nparticular hour of the day.\r\n-", "version": "None", "inputs": [{"name": "_direction", "description": "A vector for the direction that the viewport camera faces.", "optional": true, "type": "Param_ScriptVariable"}, {"name": "_position_", "description": "A point for the position of the vieport camera in 3D space.\r\nIf no point is provided, the Rhino origin will be used (0, 0, 0).", "optional": true, "type": "Param_ScriptVariable"}, {"name": "look_around_", "description": "Optional 2D point (aka. UV coordinates) to tilt the viewport\r\ncamera off from from the input _direction. Values for UV\r\ncoordinates must be between 0 and 1 and these correspond to a\r\ntilt of 90 degrees in either direction (with 0.5, 0.5 being\r\ncentered on the _direction). Inputting a native Grasshopper\r\nSlider MD component will allow the most control of view offsetting.", "optional": true, "type": "Param_ScriptVariable"}, {"name": "width_", "description": "An optional interger for the width (in pixels) of the Rhino\r\nviewport that will be generated.", "optional": true, "type": "Param_ScriptVariable"}, {"name": "height_", "description": "An optional interger for the height (in pixels) of the Rhino\r\nviewport that will be generated.", "optional": true, "type": "Param_ScriptVariable"}, {"name": "lens_len_", "description": "An optional number that sets the lens length of the viewport\r\ncamera in mm. Typical values are around 20-50mm but wider angle\r\nviews can be achieved by lowering this number to 10 or less.\r\nIf unspecified, the lens length of the currently active Rhino\r\nviewport will be used.", "optional": true, "type": "Param_ScriptVariable"}, {"name": "mode_", "description": "An optional text input for the display mode of the Rhino viewport\r\nthat will be generated. For example: Wireframe, Shaded, Rendered, etc.\r\nIf unspecified, the mode of the currenlty active Rhino viewport\r\nwill be used", "optional": true, "type": "Param_ScriptVariable"}], "outputs": [{"name": "out", "description": "The name of the viewport that was opened.", "optional": false, "type": "Param_String"}], "preset_items": [], "availability": "INSTANTIATED", "source": "C:/Program Files/ladybug_tools/grasshopper/ladybug_grasshopper/user_objects\\LB Set View.ghuser", "id": "LB-109", "group": "輔助工具與預設選單", "hub_status": "待接入 Hub", "base_guid": "410755b1-224a-4c1e-a407-bf32fb45ea7e", "sha256": "6944eeacb13544ee9cfb92fa186840f06c4b382824822912c18fb5b572e74248"}, {"file": "LB Solar Body Parameters.ghuser", "name": "LB Solar Body Parameters", "nickname": "", "category": "Ladybug", "subcategory": "4 :: Extra", "guid": "f4475d08-f6cf-4837-9b98-04969a931c0f", "description": "Create a set of parameters that define the characteristics of a human\r\nin relation to the sun that falls on them.\r\n-\r\nThese parameters can be plugged into any of the components that estimate\r\nmean radiant temperature (MRT) deltas as a result of being in the sun.\r\n-", "version": "None", "inputs": [{"name": "_posture_", "description": "A text string indicating the posture of the body. Letters must\r\nbe lowercase. Default is \"standing\". Choose from the following:\r\n- standing\r\n- seated\r\n- supine", "optional": true, "type": "Param_ScriptVariable"}, {"name": "_sharp_", "description": "A number between 0 and 180 representing the solar horizontal\r\nangle relative to front of person (SHARP). 0 signifies sun that is\r\nshining directly into the person's face and 180 signifies sun that\r\nis shining at the person's back. Default is 135, asuming that a person\r\ntypically faces their side or back to the sun to avoid glare.", "optional": true, "type": "Param_ScriptVariable"}, {"name": "_body_az_", "description": "A number between 0 and 360 representing the direction that\r\nthe human is facing in degrees (0=North, 90=East, 180=South, 270=West).\r\nDefault is None, which will assume that the sharp input dictates the\r\ndegrees the human is facing from the sun.", "optional": true, "type": "Param_ScriptVariable"}, {"name": "_absorptivity_", "description": "A number between 0 and 1 representing the average\r\nshortwave absorptivity of the body (including clothing and skin color).\r\nTypical clothing values - white: 0.2, khaki: 0.57, black: 0.88\r\nTypical skin values - white: 0.57, brown: 0.65, black: 0.84\r\nDefault is 0.7 for average (brown) skin and medium clothing.", "optional": true, "type": "Param_ScriptVariable"}, {"name": "_emissivity_", "description": "A number between 0 and 1 representing the average\r\nlongwave emissivity of the body.  Default is 0.95, which is almost\r\nalways the case except in rare situations of wearing metalic clothing.", "optional": true, "type": "Param_ScriptVariable"}], "outputs": [{"name": "sol_body_par", "description": "A solar body parameter object that can be plugged into\r\nany of the components that estimate mean radiant temperature (MRT)\r\ndeltas as a result of being in the sun.", "optional": false, "type": "Param_GenericObject"}], "preset_items": [], "availability": "INSTANTIATED", "source": "C:/Program Files/ladybug_tools/grasshopper/ladybug_grasshopper/user_objects\\LB Solar Body Parameters.ghuser", "id": "LB-110", "group": "輔助工具與預設選單", "hub_status": "待接入 Hub", "base_guid": "410755b1-224a-4c1e-a407-bf32fb45ea7e", "sha256": "93ca48d9bcea26c8363bd8969263326dc213987f400e9cccd81431bd6fbbcfb8"}, {"file": "LB Spatial Heatmap.ghuser", "name": "LB Spatial Heatmap", "nickname": "", "category": "Ladybug", "subcategory": "4 :: Extra", "guid": "fb5d8d5f-e7a2-4fbe-be1f-7377468cdf8e", "description": "Color a mesh as a heatmap using values that align with the mesh faces or vertices.\r\n_\r\nNote that any brep can be converted to a gridded mesh that can be consumed by \r\nthis component using the \"LB Generate Point Grid\" component.\r\n-", "version": "None", "inputs": [{"name": "_values", "description": "A list of numerical values with which to color the mesh.\r\nThe number of values must match the number of faces or vertices\r\nin the mesh.", "optional": true, "type": "Param_ScriptVariable"}, {"name": "_mesh", "description": "A Mesh object, with a number of faces or vertices that match\r\nthe number of input values and will be colored with results.", "optional": true, "type": "Param_ScriptVariable"}, {"name": "offset_dom_", "description": "Optional domain (or number for distance), which will\r\nbe used to offset the mesh faces or verticesto according to the\r\nvalues. Higher values will be offset further.", "optional": true, "type": "Param_ScriptVariable"}, {"name": "legend_par_", "description": "Optional legend parameters from the Ladybug\r\n'Legend Parameters' component.", "optional": true, "type": "Param_ScriptVariable"}, {"name": "legend_title_", "description": "A text string for Legend title. Typically, the units\r\nof the data are used here but the type of data might also be used.\r\nDefault is an empty string.", "optional": true, "type": "Param_ScriptVariable"}, {"name": "global_title_", "description": "A text string to label the entire mesh.  It will be\r\ndisplayed in the lower left of the result mesh. Default is for no\r\ntitle.", "optional": true, "type": "Param_ScriptVariable"}], "outputs": [{"name": "mesh", "description": "The input _mesh that has been colored with results.", "optional": false, "type": "Param_GenericObject"}, {"name": "legend", "description": "Geometry representing the legend for the mesh.", "optional": false, "type": "Param_GenericObject"}, {"name": "title", "description": "A text object for the global_title.", "optional": false, "type": "Param_GenericObject"}, {"name": "colors", "description": "The colors associated with each input value.", "optional": false, "type": "Param_GenericObject"}, {"name": "legend_par", "description": "The input legend parameters with defaults filled for\r\nunset properties.", "optional": false, "type": "Param_GenericObject"}, {"name": "vis_set", "description": "A VisualizationSet object for drawing a detailed version of the\r\nheatmap in the Rhino scene. This can be connected to\r\nthe \"LB Preview Visualization Set\" component to display this\r\nversion of the heatmap in Rhino.", "optional": false, "type": "Param_GenericObject"}], "preset_items": [], "availability": "INSTANTIATED", "source": "C:/Program Files/ladybug_tools/grasshopper/ladybug_grasshopper/user_objects\\LB Spatial Heatmap.ghuser", "id": "LB-111", "group": "輔助工具與預設選單", "hub_status": "待接入 Hub", "base_guid": "410755b1-224a-4c1e-a407-bf32fb45ea7e", "sha256": "d7e1f25f87c1780ed9111dd3fa69d46ad22fbe7abfa5508b56cd29d01f2be0e2"}, {"file": "LB Time Aggregate.ghuser", "name": "LB Time Aggregate", "nickname": "", "category": "Ladybug", "subcategory": "4 :: Extra", "guid": "7a8500c6-d4e1-4d60-b708-aa12467f6920", "description": "Convert a DataCollection of point-in-time values to its time-aggregated equivalent.\r\n_\r\nFor example, if the collection has a Power data type in W, this method will\r\nreturn a collection with an Energy data type in kWh.\r\n-", "version": "None", "inputs": [{"name": "_data", "description": "A houry, sub-hourly or daily data collection that can be aggregated\r\nover time to yield data of a different metric. (eg. a data collection\r\nof Power values in W).", "optional": true, "type": "Param_ScriptVariable"}], "outputs": [{"name": "data_aggr", "description": "The data collection aggregated over time. (eg. a data collection\r\nof Energy values in kWh).", "optional": false, "type": "Param_GenericObject"}], "preset_items": [], "availability": "INSTANTIATED", "source": "C:/Program Files/ladybug_tools/grasshopper/ladybug_grasshopper/user_objects\\LB Time Aggregate.ghuser", "id": "LB-112", "group": "輔助工具與預設選單", "hub_status": "待接入 Hub", "base_guid": "410755b1-224a-4c1e-a407-bf32fb45ea7e", "sha256": "c93bbf048b8ed2b8c1765d9975d33f93928b9bcff57ca3deb8a5b1287ca8d926"}, {"file": "LB Time Rate of Change.ghuser", "name": "LB Time Rate of Change", "nickname": "", "category": "Ladybug", "subcategory": "4 :: Extra", "guid": "1f40dff1-58dc-4313-aa99-110bb1cfd83f", "description": "Convert a DataCollection of time-aggregated values to time rate of change units.\r\n_\r\nFor example, if the collection has an Energy data type in kWh, this method will\r\nreturn a collection with an Power data type in W.\r\n-", "version": "None", "inputs": [{"name": "_data", "description": "A houry, sub-hourly or daily data collection that can converted to\r\na time rate of change metric. (eg. a data collection of Energy\r\nvalues in kWh).", "optional": true, "type": "Param_ScriptVariable"}], "outputs": [{"name": "data_rate", "description": "The data collection converted to time rate of changevalues.\r\n(eg. a data collection of Energy values in kWh).", "optional": false, "type": "Param_GenericObject"}], "preset_items": [], "availability": "INSTANTIATED", "source": "C:/Program Files/ladybug_tools/grasshopper/ladybug_grasshopper/user_objects\\LB Time Rate of Change.ghuser", "id": "LB-113", "group": "輔助工具與預設選單", "hub_status": "待接入 Hub", "base_guid": "410755b1-224a-4c1e-a407-bf32fb45ea7e", "sha256": "589b64fdc5da02a77cd34bc31fcddf82cee6f623d8a133c8b50714af22607db0"}, {"file": "LB To IP.ghuser", "name": "LB To IP", "nickname": "", "category": "Ladybug", "subcategory": "4 :: Extra", "guid": "114e8ea2-f1cf-4871-9f8f-0f72bf38faff", "description": "Convert a DataCollection to IP values.\r\n-", "version": "None", "inputs": [{"name": "_data_si", "description": "A DataCollection in SI units.", "optional": true, "type": "Param_ScriptVariable"}], "outputs": [{"name": "data_ip", "description": "The DataCollection in IP units.", "optional": false, "type": "Param_GenericObject"}], "preset_items": [], "availability": "INSTANTIATED", "source": "C:/Program Files/ladybug_tools/grasshopper/ladybug_grasshopper/user_objects\\LB To IP.ghuser", "id": "LB-114", "group": "輔助工具與預設選單", "hub_status": "待接入 Hub", "base_guid": "410755b1-224a-4c1e-a407-bf32fb45ea7e", "sha256": "8dcc90563549da3dab4f97a5eb00249af0e9ecdcc161e4b5f206a7dbb42612c2"}, {"file": "LB To SI.ghuser", "name": "LB To SI", "nickname": "", "category": "Ladybug", "subcategory": "4 :: Extra", "guid": "756c1e8d-31e1-4c99-ad26-dc20863708b6", "description": "Convert a DataCollection to SI values.\r\n-", "version": "None", "inputs": [{"name": "_data_ip", "description": "A DataCollection in IP (or other) units.", "optional": true, "type": "Param_ScriptVariable"}], "outputs": [{"name": "data_si", "description": "The DataCollection in SI units.", "optional": false, "type": "Param_GenericObject"}], "preset_items": [], "availability": "INSTANTIATED", "source": "C:/Program Files/ladybug_tools/grasshopper/ladybug_grasshopper/user_objects\\LB To SI.ghuser", "id": "LB-115", "group": "輔助工具與預設選單", "hub_status": "待接入 Hub", "base_guid": "410755b1-224a-4c1e-a407-bf32fb45ea7e", "sha256": "048483e4c74545cdd191f3af0b8f2f2bf61c10ba8aa3b37b5582ba82e831705a"}, {"file": "LB To Unit.ghuser", "name": "LB To Unit", "nickname": "", "category": "Ladybug", "subcategory": "4 :: Extra", "guid": "38af88ef-19cf-4786-ae4b-ef2af8044b74", "description": "Convert a DataCollection to the input _to_unit.\r\n-", "version": "None", "inputs": [{"name": "_data", "description": "A DataCollection to be converted to different units.", "optional": true, "type": "Param_ScriptVariable"}, {"name": "to_unit_", "description": "Text representing the unit to convert the DataCollection to (eg. m2).\r\nConnect the _data and see the all_unit output for a list of all\r\ncurrently-supported units for a given collection. The default won't\r\nperform any unit conversion on the output data.", "optional": true, "type": "Param_ScriptVariable"}], "outputs": [{"name": "all_unit", "description": "A list of all possible units that the input _data can be converted to.", "optional": false, "type": "Param_GenericObject"}, {"name": "data", "description": "The converted DataCollection.", "optional": false, "type": "Param_GenericObject"}], "preset_items": [], "availability": "INSTANTIATED", "source": "C:/Program Files/ladybug_tools/grasshopper/ladybug_grasshopper/user_objects\\LB To Unit.ghuser", "id": "LB-116", "group": "輔助工具與預設選單", "hub_status": "待接入 Hub", "base_guid": "410755b1-224a-4c1e-a407-bf32fb45ea7e", "sha256": "9e22e66dbd9793d10e6b54b32c36584ca1e4b38e2d1f3cde6ff7fe6044a1e8d9"}, {"file": "LB UTCI Comfort Parameters.ghuser", "name": "LB UTCI Comfort Parameters", "nickname": "", "category": "Ladybug", "subcategory": "4 :: Extra", "guid": "aa9c2106-db22-4e74-be50-732b9733ae27", "description": "Create a set of parameters that define the acceptable conditions of the\r\nUniversal Thermal Climate Index (UTCI) comfort model.\r\n-\r\nThese parameters can be plugged into any of the components that compute UTCI comfort.\r\n-", "version": "None", "inputs": [{"name": "_cold_thresh_", "description": "Temperature in Celsius below which the UTCI represents\r\ncold stress. (Default: 9C).", "optional": true, "type": "Param_ScriptVariable"}, {"name": "_heat_thresh_", "description": "Temperature in Celsius above which the UTCI represents\r\nheat stress. (Default: 26C).", "optional": true, "type": "Param_ScriptVariable"}], "outputs": [{"name": "utci_par", "description": "A UTCI comfort parameter object that can be plugged into\r\nany of the components that compute UTCI thermal comfort.", "optional": false, "type": "Param_GenericObject"}], "preset_items": [], "availability": "INSTANTIATED", "source": "C:/Program Files/ladybug_tools/grasshopper/ladybug_grasshopper/user_objects\\LB UTCI Comfort Parameters.ghuser", "id": "LB-117", "group": "輔助工具與預設選單", "hub_status": "待接入 Hub", "base_guid": "410755b1-224a-4c1e-a407-bf32fb45ea7e", "sha256": "3fe33feb6d5453e530c0be1ae9aacb0d6132feec250921b9a0ec86edc374e179"}, {"file": "LB Unit Converter.ghuser", "name": "LB Unit Converter", "nickname": "", "category": "Ladybug", "subcategory": "4 :: Extra", "guid": "61cd1a7e-4a8e-4bb6-b747-47d36f49f314", "description": "Convert a value or list of values from one unit to another.\r\n-", "version": "None", "inputs": [{"name": "_values", "description": "Values to be converted from one unit type to another.", "optional": true, "type": "Param_ScriptVariable"}, {"name": "_from_u", "description": "Text indicating the units of the input _values (eg. 'C')", "optional": true, "type": "Param_ScriptVariable"}, {"name": "_to_u", "description": "Text indicating the units of the output values (eg. 'K')", "optional": true, "type": "Param_ScriptVariable"}], "outputs": [{"name": "all_u", "description": "A text string indicating all possible units\r\nthat can be plugged into _from_u and _to_u.", "optional": false, "type": "Param_GenericObject"}, {"name": "values", "description": "The converted numerical values.", "optional": false, "type": "Param_GenericObject"}], "preset_items": [], "availability": "INSTANTIATED", "source": "C:/Program Files/ladybug_tools/grasshopper/ladybug_grasshopper/user_objects\\LB Unit Converter.ghuser", "id": "LB-118", "group": "輔助工具與預設選單", "hub_status": "待接入 Hub", "base_guid": "410755b1-224a-4c1e-a407-bf32fb45ea7e", "sha256": "68744d0a3fe2896dfb88012fa29ae0858e847805b31af72191d7e01044e8c16b"}, {"file": "LB Export UserObject.ghuser", "name": "LB Export UserObject", "nickname": "", "category": "Ladybug", "subcategory": "5 :: Version", "guid": "4eea5d37-1287-4fc7-be68-f2f18e9a4e0f", "description": "Export a Ladybug Tools Grasshopper GHPython component as a UserObject that can\r\nbe installed on other's machines.\r\n-", "version": "None", "inputs": [{"name": "_components", "description": "A Ladybug Tools GHPython component to be exported. This\r\ncan also be a list of of components to be exported together. Lastly,\r\nthis can be a \"*\" and all of the Ladybug Tools components on the\r\nGrasshopper canvass will be exported.", "optional": true, "type": "Param_ScriptVariable"}, {"name": "_folder", "description": "Full path to folder to copy the updated UserObject and the\r\nsource code. It is usually path to where you have cloned the\r\nrepository from GitHub. Exported contents will be created under src\r\nand userobject folders.", "optional": true, "type": "Param_ScriptVariable"}, {"name": "_change_type_", "description": "One of the values listed below based on the type of\r\nchange made to the component. Export component will validate the\r\nversion of the newly created UserObject against the version of the\r\ncurrent installed UserObject with the same name based on the change\r\ntype. If an older version of the component does not exist the\r\ncurrent version of the component will be used. The version is\r\nstructured as major.minor.patch. (Default: fix)\r\n_\r\n* release: You are changing the versions for a new release.\r\nBump the major with 1 and set minor and patch to 0.\r\n_\r\n* feat: You have added a new feature. Adding a new feature usually\r\nresults in a change in inputs or outputs of the component.\r\nBump minor by 1 and set patch to 0.\r\n_\r\n* perf: You have improved the component for better performance.\r\nSimilar to adding a feature you should bump the minor by 1 and\r\nset patch to 0.\r\n_\r\n* fix: You have fixed the code inside the component. It results in\r\na single bump in patch.\r\n_\r\n* docs: You have improved the documentation. No change in version.\r\n_\r\n* ignore: This is an exception to the rule and you want the change\r\ntype to be ignored. You should use this option only in rare\r\noccasional cases.", "optional": true, "type": "Param_ScriptVariable"}, {"name": "_export", "description": "Set to True to export the component.", "optional": true, "type": "Param_ScriptVariable"}], "outputs": [{"name": "out", "description": "Errors, warnings, etc.", "optional": false, "type": "Param_String"}], "preset_items": [], "availability": "INSTANTIATED", "source": "C:/Program Files/ladybug_tools/grasshopper/ladybug_grasshopper/user_objects\\LB Export UserObject.ghuser", "id": "LB-119", "group": "版本與維護", "hub_status": "待接入 Hub", "base_guid": "410755b1-224a-4c1e-a407-bf32fb45ea7e", "sha256": "e124147a8223955369e4c19fb5fea9b765a9dbca03c7460450585fba65701222"}, {"file": "LB Legacy Updater.ghuser", "name": "LB Legacy Updater", "nickname": "", "category": "Ladybug", "subcategory": "5 :: Version", "guid": "94390f98-d4f0-49bb-b2a4-fab939eb94d8", "description": "Drop suggested Ladybug Tools components into a Grasshopper file for every\r\nLegacy Ladybug + Honeybee component on the canvas.\r\n-\r\nAll existing LBT and native Grasshopper components will be left as they are and\r\nonly the Legacy components will be circled in Red and have the suggested LBT\r\ncomponent placed next to them (if applicable). Note that, after this component\r\nruns, you must then connect the new LBT components to the others and delete the\r\nLegacy components.\r\n-\r\nWhere applicable, each red circle will have a message about how the LBT component\r\ndiffers from the Legacy one or if there may be a more appropirate LBT component\r\nin the future. Also note that some Legacy workflows have been heavily refactored\r\nsince Legacy, meaning a different number of components may be necessary to achieve\r\nthe same thing (typically fewer in LBT than Legacy, meaning some LEgacy components\r\nshould be deleted without replacement).\r\n-", "version": "None", "inputs": [{"name": "_update", "description": "Set to \"True\" to have this component to search through the current\r\nGrasshopper file and drop suggested Ladybug Tools components\r\nfor every Legacy Ladybug + Honeybee component on the canvas.", "optional": true, "type": "Param_ScriptVariable"}], "outputs": [{"name": "out", "description": "Errors, warnings, etc.", "optional": false, "type": "Param_String"}], "preset_items": [], "availability": "INSTANTIATED", "source": "C:/Program Files/ladybug_tools/grasshopper/ladybug_grasshopper/user_objects\\LB Legacy Updater.ghuser", "id": "LB-120", "group": "版本與維護", "hub_status": "待接入 Hub", "base_guid": "410755b1-224a-4c1e-a407-bf32fb45ea7e", "sha256": "45e442ce7a9ce957c44471deb7171807c7196bcae36f420b6938ee5c0955c406"}, {"file": "LB Sync Grasshopper File.ghuser", "name": "LB Sync Grasshopper File", "nickname": "", "category": "Ladybug", "subcategory": "5 :: Version", "guid": "369f7737-2361-4c92-8c8b-32856625b132", "description": "Sync the Ladybug Tools components in a Grasshopper file with the version of the\r\ncomponents that currently exist in the Grasshopper toolbar.\r\n-\r\nThis is useful for updating old Grasshopper definitions to newer plugin versions.\r\nHowever, this component will sync components regardless of version number or\r\ndate, even if the components in the toolbar are of an older version than those\r\ncurrently on the Grasshopper canvass.\r\n-\r\nAny components that cannot be updated automatically (because their inputs or\r\noutputs have changed) will be circled in red and should be replaced manually.\r\n-", "version": "None", "inputs": [{"name": "_sync", "description": "Set to \"True\" to have this component to search through the\r\ncurrent Grasshopper file and sync all Ladybug Tools components\r\nwith the version in the Grasshopper toolbar.", "optional": true, "type": "Param_ScriptVariable"}], "outputs": [{"name": "report", "description": "Errors, warnings, etc.", "optional": false, "type": "Param_GenericObject"}], "preset_items": [], "availability": "INSTANTIATED", "source": "C:/Program Files/ladybug_tools/grasshopper/ladybug_grasshopper/user_objects\\LB Sync Grasshopper File.ghuser", "id": "LB-121", "group": "版本與維護", "hub_status": "待接入 Hub", "base_guid": "410755b1-224a-4c1e-a407-bf32fb45ea7e", "sha256": "7f55b637577d247d561b3515adcaf7253060c1f792123656b215a90e4f38a177"}, {"file": "LB Versioner.ghuser", "name": "LB Versioner", "nickname": "", "category": "Ladybug", "subcategory": "5 :: Version", "guid": "1e33b512-9871-4027-958c-8ab0fa5b6ce7", "description": "This component updates the Ladybug Tools core libraries and grasshopper components\r\nto either the latest development version available (default) or to a specific\r\nversion of the grasshopper plugin.\r\n_\r\nThe input version_ does not need to be newer than the current installation and can\r\nbe older but grasshopper plugin versions less than 0.3.0 are not supported.\r\nA list of all versions of the Grasshopper plugin and corresponding release notes\r\ncan be found at: https://github.com/ladybug-tools/lbt-grasshopper/releases\r\n-", "version": "None", "inputs": [{"name": "_update", "description": "Set to True to update your installation of Ladybug Tools to the\r\nlatest development version or to be at the version specified below.", "optional": true, "type": "Param_ScriptVariable"}, {"name": "version_", "description": "An optional text string for the version of the grasshopper\r\nplugin which you would like to update to. The input should contain\r\nonly integers separated by two periods (eg. 1.0.0). The version does\r\nnot need to be newer than the current installation and can be older\r\nbut grasshopper plugin versions less than 0.3.0 are not supported.\r\nA list of all versions of the Grasshopper plugin can be found\r\nhere - https://github.com/ladybug-tools/lbt-grasshopper/releases", "optional": true, "type": "Param_ScriptVariable"}], "outputs": [{"name": "out", "description": "!!!", "optional": false, "type": "Param_String"}], "preset_items": [], "availability": "INSTANTIATED", "source": "C:/Program Files/ladybug_tools/grasshopper/ladybug_grasshopper/user_objects\\LB Versioner.ghuser", "id": "LB-122", "group": "版本與維護", "hub_status": "待接入 Hub", "base_guid": "410755b1-224a-4c1e-a407-bf32fb45ea7e", "sha256": "fd71ac857a7b199c173e480a4396a317cd4885c336ddc02c1528934b46753ac2"}];const box=document.querySelector('#entries'),search=document.querySelector('#search'),group=document.querySelector('#group'),status=document.querySelector('#status');
