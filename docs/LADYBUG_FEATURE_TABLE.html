.", "optional": true, "type": "Param_ScriptVariable"}], "outputs": [{"name": "out", "description": "...", "optional": false, "type": "Param_String"}, {"name": "mesh", "description": "A colored mesh of arrows, representing the intensity of radiation\r\nfrom different cardinal directions.", "optional": false, "type": "Param_GenericObject"}, {"name": "compass", "description": "A set of circles, lines and text objects that mark the cardinal\r\ndirections in relation to the radiation rose.", "optional": false, "type": "Param_GenericObject"}, {"name": "orient_lines", "description": "A list of line segments marking the orientation of each arrow.", "optional": false, "type": "Param_GenericObject"}, {"name": "legend", "description": "A legend showing the kWh/m2 or W/m2 values that correspond to the colors\r\nof the mesh.", "optional": false, "type": "Param_GenericObject"}, {"name": "title", "description": "A text object for the title of the radiation rose.", "optional": false, "type": "Param_GenericObject"}, {"name": "dir_vecs", "description": "A list of vectors for each of the directions the rose is facing.\r\nAll vectors are unit vectors.", "optional": false, "type": "Param_GenericObject"}, {"name": "dir_values", "description": "Radiation values for each of the rose directions in kWh/m2 or W/m2.\r\nThis will be one list if show_comp_ is \"False\" and a list of 3\r\nlists (aka. a Data Tree) for total, direct, diffuse if show_comp_\r\nis \"True\".", "optional": false, "type": "Param_GenericObject"}, {"name": "vis_set", "description": "Script variable RadRose", "optional": false, "type": "Param_GenericObject"}], "preset_items": [], "availability": "INSTANTIATED", "source": "C:/Program Files/ladybug_tools/grasshopper/ladybug_grasshopper/user_objects\\LB Radiation Rose.ghuser", "id": "LB-055", "group": "圖表與視覺化", "hub_status": "待接入 Hub", "base_guid": "410755b1-224a-4c1e-a407-bf32fb45ea7e", "sha256": "d65c203e6bd214dec9b8e85a99494d5bacea3e89ed1fa326b0320c005b3d7418"}, {"file": "LB Sky Dome.ghuser", "name": "LB Sky Dome", "nickname": "", "category": "Ladybug", "subcategory": "2 :: Visualize Data", "guid": "ca9fcf9a-2258-43be-9072-a41f6ea2b460", "description": "Visualize a sky matrix from the \"LB Cumulative Sky Matrix\" component as a colored\r\ndome, subdivided into patches with a radiation value for each patch.\r\n-", "version": "None", "inputs": [{"name": "_sky_mtx", "description": "A Sky Matrix from the \"LB Cumulative Sky Matrix\" component or the\r\n\"LB Benefit Sky Matrix\" component, which describes the radiation\r\ncoming from the various patches of the sky.", "optional": true, "type": "Param_ScriptVariable"}, {"name": "_center_pt_", "description": "A point for the center of the dome. (Default: (0, 0, 0))", "optional": true, "type": "Param_ScriptVariable"}, {"name": "_scale_", "description": "A number to set the scale of the sky dome. The default is 1,\r\nwhich corresponds to a radius of 100 meters in the current Rhino\r\nmodel's unit system.", "optional": true, "type": "Param_ScriptVariable"}, {"name": "projection_", "description": "Optional text for the name of a projection to use from the sky\r\ndome hemisphere to the 2D plane. If None, a 3D sky dome will be drawn\r\ninstead of a 2D one. (Default: None) Choose from the following:\r\n* Orthographic\r\n* Stereographic\r\n* Equidistant\r\n* Equisolid", "optional": true, "type": "Param_ScriptVariable"}, {"name": "irradiance_", "description": "Boolean to note whether the sky dome should be plotted with units of\r\ncumulative Radiation (kWh/m2) [False] or with units of average\r\nIrradiance (W/m2) [True]. (Default: False).", "optional": true, "type": "Param_ScriptVariable"}, {"name": "show_comp_", "description": "Boolean to indicate whether only one dome with total radiation\r\nshould be displayed (False) or three domes with the solar radiation\r\ncomponents (total, direct, and diffuse) should be shown. (Default: False).", "optional": true, "type": "Param_ScriptVariable"}, {"name": "legend_par_", "description": "An optional LegendParameter object to change the display of the\r\nsky dome (Default: None).", "optional": true, "type": "Param_ScriptVariable"}], "outputs": [{"name": "out", "description": "...", "optional": false, "type": "Param_String"}, {"name": "mesh", "description": "A colored mesh representing the intensity of radiation for each of\r\nthe sky patches within the sky dome.", "optional": false, "type": "Param_GenericObject"}, {"name": "compass", "description": "A set of circles, lines and text objects that mark the cardinal\r\ndirections in relation to the sky dome.", "optional": false, "type": "Param_GenericObject"}, {"name": "legend", "description": "A legend showing the kWh/m2 or W/m2 values that correspond to the colors\r\nof the mesh.", "optional": false, "type": "Param_GenericObject"}, {"name": "title", "description": "A text object for the title of the sky dome.", "optional": false, "type": "Param_GenericObject"}, {"name": "patch_vecs", "description": "A list of vectors for each of the patches of the sky dome.\r\nAll vectors are unit vectors and point from the center towards each\r\nof the patches. They can be used to construct visualizations of the\r\nrays used to perform radiation analysis.", "optional": false, "type": "Param_GenericObject"}, {"name": "patch_values", "description": "Radiation values for each of the sky patches in kWh/m2 or W/m2.\r\nThis will be one list if show_comp_ is \"False\" and a list of 3\r\nlists (aka. a Data Tree) for total, direct, diffuse if show_comp_\r\nis \"True\".", "optional": false, "type": "Param_GenericObject"}, {"name": "mesh_values", "description": "Radiation values for each face of the dome mesh in kWh/m2. This\r\ncan be used to post-process the radiation data and then regenerate\r\nthe dome visualization using the mesh output from this component\r\nand the \"LB Spatial Heatmap\" component. Examples of useful post-\r\nprocessing include converting the units to something other than\r\nkWh/m2, inverting the +/- sign of radiation values depending on\r\nwhether radiation is helpful or harmful to building thermal loads,\r\netc. This will be one list if show_comp_ is \"False\" and a list of\r\n3 lists (aka. a Data Tree) for total, direct, diffuse if show_comp_\r\nis \"True\".", "optional": false, "type": "Param_GenericObject"}, {"name": "vis_set", "description": "An object containing VisualizationSet arguments for drawing a detailed\r\nversion of the Sky Dome in the Rhino scene. This can be connected to\r\nthe \"LB Preview Visualization Set\" component to display this version\r\nof the Sky Dome in Rhino.", "optional": false, "type": "Param_GenericObject"}], "preset_items": [], "availability": "INSTANTIATED", "source": "C:/Program Files/ladybug_tools/grasshopper/ladybug_grasshopper/user_objects\\LB Sky Dome.ghuser", "id": "LB-056", "group": "圖表與視覺化", "hub_status": "待接入 Hub", "base_guid": "410755b1-224a-4c1e-a407-bf32fb45ea7e", "sha256": "e73fb0a6e8c5b2f19790b72fa04df854a3349053d117192a6b88006a02a6aabd"}, {"file": "LB SunPath.ghuser", "name": "LB SunPath", "nickname": "", "category": "Ladybug", "subcategory": "2 :: Visualize Data", "guid": "bd92a51e-4edb-4e7d-8d74-c21fbbe75e9b", "description": "Output a Sunpath (aka. sun plot) graphic into the Rhino scene.\r\n-\r\nThe component also outputs sun vectors that can be used for solar access\r\nanalysis and shading design.\r\n-", "version": "None", "inputs": [{"name": "north_", "description": "A number between -360 and 360 for the counterclockwise\r\ndifference between the North and the positive Y-axis in degrees.\r\n90 is West and 270 is East. This can also be Vector for the\r\ndirection to North. (Default: 0)", "optional": true, "type": "Param_ScriptVariable"}, {"name": "_location", "description": "A ladybug Location that has been output from the \"LB Import EPW\"\r\ncomponent or the \"LB Construct Location\" component.", "optional": true, "type": "Param_ScriptVariable"}, {"name": "hoys_", "description": "A number or list of numbers between 0 and 8760 that represent the\r\nhour of the year at which to evaluate the sun position. The\r\n\"LB Calculate HOY\" component can output this number given a month,\r\nday and hour. The \"LB Analysis Period\" component can output a\r\nlist of HOYs within a certain hour or date range.", "optional": true, "type": "Param_ScriptVariable"}, {"name": "dl_saving_", "description": "An optional analysis period for daylight saving time.\r\nIf None, no daylight saving time will be used. (Default: None)", "optional": true, "type": "Param_ScriptVariable"}, {"name": "solar_time_", "description": "A boolean to indicate if the input hours should be treated\r\nas solar time instead of standard or daylight time. (Default: False)", "optional": true, "type": "Param_ScriptVariable"}, {"name": "_center_pt_", "description": "A point for the center of the sun path. (Default: (0, 0, 0))", "optional": true, "type": "Param_ScriptVariable"}, {"name": "_scale_", "description": "A number to set the scale of the sun path. The default is 1,\r\nwhich corresponds to a radius of 100 meters in the current Rhino\r\nmodel's unit system.", "optional": true, "type": "Param_ScriptVariable"}, {"name": "projection_", "description": "Optional text for the name of a projection to use from the sky\r\ndome hemisphere to the 2D plane. If None, a 3D sun path will be drawn\r\ninstead of a 2D one. (Default: None) Choose from the following:\r\n* Orthographic\r\n* Stereographic\r\n* Equidistant\r\n* Equisolid", "optional": true, "type": "Param_ScriptVariable"}, {"name": "daily_", "description": "Boolean to note whether the sunpath should display only one daily\r\narc for each unique day in the input hoys_ (True) or whether the\r\noutput sun path geometry should be for the entire year, complete\r\nwith analemmas for all sun-up hours and a daily arc for each\r\nmonth (False). (Default: False)", "optional": true, "type": "Param_ScriptVariable"}, {"name": "data_", "description": "Optional HourlyContinuousCollection objects, which will be used\r\nto generate colors that align with each of the sun_pts. This data\r\ncan also be used along with the statement_ below to select out\r\nsun positions that meet certain conditions.", "optional": true, "type": "Param_ScriptVariable"}, {"name": "statement_", "description": "A conditional statement as a string (e.g. a > 25).\r\n.\r\nThe variable of the first data collection should always be named 'a'\r\n(without quotations), the variable of the second list should be\r\nnamed 'b', and so on.\r\n.\r\nFor example, if three data collections are connected to _data\r\nand the following statement is applied:\r\n'18 \u003c a \u003c 26 and b \u003c 80 and c > 2'\r\nThe resulting collections will only include values where the first\r\ndata collection is between 18 and 26, the second collection is less\r\nthan 80 and the third collection is greater than 2.", "optional": true, "type": "Param_ScriptVariable"}, {"name": "legend_par_", "description": "An optional LegendParameter object to change the display\r\nof the data on the sun path. This can also be a list of legend\r\nparameters to be applied to the different connected data_.", "optional": true, "type": "Param_ScriptVariable"}], "outputs": [{"name": "out", "description": "Reports, errors, warnings, etc.", "optional": false, "type": "Param_String"}, {"name": "vectors", "description": "Vector(s) indicating the direction of sunlight for each sun\r\nposition on the sun path. Note that these vectors point downwards\r\ntowards the ground.", "optional": false, "type": "Param_GenericObject"}, {"name": "altitudes", "description": "Number(s) indicating the sun altitude(s) in degrees for\r\neach sun position on the sun path.", "optional": false, "type": "Param_GenericObject"}, {"name": "azimuths", "description": "Number(s) indicating the sun azimuths in degrees for each\r\nsun position on the sun path.", "optional": false, "type": "Param_GenericObject"}, {"name": "hoys", "description": "The hour of the year for each sun positions on the sun path.", "optional": false, "type": "Param_GenericObject"}, {"name": "sun_pts", "description": "Point(s) representing the location of the sun on the sunpath.", "optional": false, "type": "Param_GenericObject"}, {"name": "analemma", "description": "A set of curves that mark the hourly positions of the sun\r\nthroughout the different months of the year.", "optional": false, "type": "Param_GenericObject"}, {"name": "daily", "description": "A set of arcs that mark the path of the sun across the sky\r\ndome over the course of a day.", "optional": false, "type": "Param_GenericObject"}, {"name": "compass", "description": "A set of circles, lines and text objects that mark the cardinal\r\ndirections in relation to the sun path.", "optional": false, "type": "Param_GenericObject"}, {"name": "legend", "description": "Geometry representing the legend for the input data_. Will be None\r\nif no _data is connected.", "optional": false, "type": "Param_GenericObject"}, {"name": "title", "description": "A text object for the title of the sunpath.", "optional": false, "type": "Param_GenericObject"}, {"name": "color_pts", "description": "A list of points colored with the input data_, which will display\r\nin the Rhino scene in accordance with the legend. Note that\r\nthe text representation of these objects bears the RGB color of each\r\npoint. So casting this output to text and then to a color will\r\nyeild color objects that can be used for previewing other types\r\nof geometry with the input data_. Will be None if no _data is connected.", "optional": false, "type": "Param_GenericObject"}, {"name": "vis_set", "description": "An object containing VisualizationSet arguments for drawing a detailed\r\nversion of the Sunpath in the Rhino scene. This can be connected to\r\nthe \"LB Preview Visualization Set\" component to display this version\r\nof the Sunpath in Rhino.", "optional": false, "type": "Param_GenericObject"}], "preset_items": [], "availability": "INSTANTIATED", "source": "C:/Program Files/ladybug_tools/grasshopper/ladybug_grasshopper/user_objects\\LB SunPath.ghuser", "id": "LB-057", "group": "圖表與視覺化", "hub_status": "待接入 Hub", "base_guid": "410755b1-224a-4c1e-a407-bf32fb45ea7e", "sha256": "ab2f5500ecea5618c5fc2543002d03c7c810bbb516117d53940dc39e5cfa6eb9"}, {"file": "LB UTCI Polygon.ghuser", "name": "LB UTCI Polygon", "nickname": "", "category": "Ladybug", "subcategory": "2 :: Visualize Data", "guid": "3b800e49-e84a-4015-b70f-635463f2c2f2", "description": "Draw thermal comfort polygons on a Psychrometric Chart using the UTCI outdoor\r\nthermal comfort model.\r\n-", "version": "None", "inputs": [{"name": "_psych_chart", "description": "A hourly, daily, or sub-hourly data collection of temperature values\r\nor a single temperature value in Celcius to be used for the whole\r\nanalysis. If this input data collection is in in Farenheit, the\r\nentire chart will be drawn using IP units. Operative temperature\r\nshould be used if it is available. Otherwise, air temperature\r\n(aka. dry bulb temperature) is suitable.", "optional": true, "type": "Param_ScriptVariable"}, {"name": "_mrt_", "description": "A number or list of numbers for the mean radiant temperature. These\r\nshould be in Celsius if the Psychrometric Chart is in SI and\r\nFarenheit if the Psychrometric Chart is in IP. If None, a polygon for\r\noperative temperature will be plot, assuming that radiant temperature\r\nand air temperature are the same. (Default: None).", "optional": true, "type": "Param_ScriptVariable"}, {"name": "_wind_speed_", "description": "A number or list of numbers for for the meteorological wind speed\r\nvalues in m/s (measured 10 m above the ground). If None, this will\r\ndefault to a low wind speed of 0.5 m/s, which is the lowest input\r\nspeed that is recommended for the UTCI model.", "optional": true, "type": "Param_ScriptVariable"}, {"name": "utci_par_", "description": "Optional UTCIParameter object to specify parameters under\r\nwhich conditions are considered acceptable. If None, default will\r\nassume comfort thresholds consistent with those used by meteorologists\r\nto categorize outdoor conditions.", "optional": true, "type": "Param_ScriptVariable"}, {"name": "merge_poly_", "description": "Boolean to note whether all comfort polygons should be merged\r\ninto a single polygon instead of separate polygons for each set of\r\ninput conditions. (Default: False).", "optional": true, "type": "Param_ScriptVariable"}, {"name": "plot_stress_", "description": "Boolean to note whether polygons for heat/cold stress should be plotted\r\nin the output. This will include 3 polygons on either side of the comfort\r\npolygon(s) for...\r\n_\r\n* Moderate Stress\r\n* Strong Stress\r\n* Very Strong Stress", "optional": true, "type": "Param_ScriptVariable"}], "outputs": [{"name": "out", "description": "...", "optional": false, "type": "Param_String"}, {"name": "total_comfort", "description": "The percent of the data on the psychrometric chart that\r\nare inside all comfort polygons.", "optional": false, "type": "Param_GenericObject"}, {"name": "total_comf_data", "description": "Data collection or a 0/1 value noting whether each of the data\r\npoints on the psychrometric chart lies inside of a comfort polygon.\r\n_\r\nThis can be connected to the \"LB Create Legend\" component to generate\r\na list of colors that can be used to color the points output from\r\n\"LB Psychrometric Chart\" component to see exactly which points are\r\ncomfortable and which are not.\r\n_\r\nValues are one of the following:\r\n0 = uncomfortable\r\n1 = comfortable", "optional": false, "type": "Param_GenericObject"}, {"name": "polygons", "description": "A list of Breps representing the range of comfort (or heat/cold stress) for the\r\ninput mrt and air speed.", "optional": false, "type": "Param_GenericObject"}, {"name": "polygon_names", "description": "A list of names for each of the polygons which correspond with the polygons\r\noutput above. This will include both the comfort polygons and the\r\ncold/heat stress polygons.", "optional": false, "type": "Param_GenericObject"}, {"name": "polygon_data", "description": "A list of data collections or 0/1 values indicating whether each \r\nof the data points on the psychrometric chart lies inside each of\r\nthe comfort polygons. Each data collection or here corresponds to the\r\nnames in the polygon_names output above.\r\n_\r\nValues are one of the following:\r\n0 = outside\r\n1 = inside", "optional": false, "type": "Param_GenericObject"}], "preset_items": [], "availability": "INSTANTIATED", "source": "C:/Program Files/ladybug_tools/grasshopper/ladybug_grasshopper/user_objects\\LB UTCI Polygon.ghuser", "id": "LB-058", "group": "圖表與視覺化", "hub_status": "待接入 Hub", "base_guid": "410755b1-224a-4c1e-a407-bf32fb45ea7e", "sha256": "ff54508e2fbf7e26e6db2c5602385b7e25cf5a73a9121cf8e394d01275448f3b"}, {"file": "LB Wind Profile.ghuser", "name": "LB Wind Profile", "nickname": "", "category": "Ladybug", "subcategory": "2 :: Visualize Data", "guid": "3ea401a4-a011-47a3-a0cf-cf0ed402c57d", "description": "Visualize a wind profile curve for a given terrain type.\r\n_\r\nWind profiles assist with understanding how wind speed decreases as one approaches\r\nthe ground or increases as one leaves the ground. \r\n_\r\nBy default, the wind profile output by this component will be an average over the\r\n_met_wind_vel data collection (or it can be for a single meteorological wind\r\nvelocity for point-in-time studies).\r\n_\r\nIf a met_wind_dir_ data collection is connected, the wind profile will point in\r\nthe direction of prevailing wind direction by default. A profile_dir_ can then\r\nbe connected to understand the average wind profile from a specific cardinal\r\ndirection (eg. NE).\r\n-", "version": "None", "inputs": [{"name": "north_", "description": "A number between -360 and 360 for the counterclockwise\r\ndifference between the North and the positive Y-axis in degrees.\r\n90 is West and 270 is East. This can also be Vector for the\r\ndirection to North. (Default: 0)", "optional": true, "type": "Param_ScriptVariable"}, {"name": "_met_wind_vel", "description": "A data collection of meteorological wind speed measured at\r\nthe _met_height_ with the _met_terrian [m/s]. Typically, this comes\r\nfrom the \"LB Import EPW\" component. This can also be a single number\r\nfor the meteorological wind speed in m/s.", "optional": true, "type": "Param_ScriptVariable"}, {"name": "met_wind_dir_", "description": "An optional number between 0 and 360 representing the degrees\r\nfrom north that the meteorological wind is blowing. 0 = North,\r\n90 = East, 180 = South, 270 = West. This can also a data collection\r\nof meteorological wind directions. in which case the wind profile\r\nwill be oriented towards the prevailing wind (unless a profile_dir_\r\nis connected). When unspecified, the wind profile is simply drawn\r\nin the XY plane.", "optional": true, "type": "Param_ScriptVariable"}, {"name": "profile_dir_", "description": "An optional text string representing the cardinal direction that\r\nthe wind profile represents. This input only has an effect when a\r\ndata collection is connected for met_wind_dir_. It will be used\r\nto draw a wind profile for only the hours of the data collection\r\nwhere the wind is blowing in the specified direction. This can also\r\nbe an integer that codes for a particular orientation. Choose from\r\nthe following.\r\n_\r\n0 = N\r\n1 = NE\r\n2 = E\r\n3 = SE\r\n4 = S\r\n5 = SW\r\n6 = W\r\n7 = NW", "optional": true, "type": "Param_ScriptVariable"}, {"name": "_terrain_", "description": "Text string that sets the terrain class associated with the wind profile.\r\nThis can also be an integer that codes for the terrain. (Default: city).\r\nMust be one the following.\r\n_\r\n0 = city - 50% of buildings above 21m over a distance of at least 2000m upwind.\r\n1 = suburban - suburbs, wooded areas.\r\n2 = country - open, with scattered objects generally less than 10m high.\r\n3 = water - flat areas downwind of a large water body (max 500m inland).", "optional": true, "type": "Param_ScriptVariable"}, {"name": "_met_height_", "description": "A number for the height above the ground at which the meteorological\r\nwind speed is measured in meters. (Default: 10 meters, which is the\r\nstandard used by most airports and EPW files).", "optional": true, "type": "Param_ScriptVariable"}, {"name": "_met_terrain_", "description": "Text string that sets the terrain class associated with the\r\nmeteorological wind speed. This can also be an integer that codes\r\nfor the terrain. (Default: country, which is typical of most\r\nairports where wind measurements are taken). Must be one the following.\r\n_\r\n0 = city - 50% of buildings above 21m over a distance of at least 2000m upwind.\r\n1 = suburban - suburbs, wooded areas.\r\n2 = country - open, with scattered objects generally less than 10m high.\r\n3 = water - flat areas downwind of a large water body (max 500m inland).", "optional": true, "type": "Param_ScriptVariable"}, {"name": "log_law_", "description": "A boolean to note whether the wind profile should use a logarithmic\r\nlaw to determine wind speeds instead of the default power law,\r\nwhich is used by EnergyPlus. (Default: False).", "optional": true, "type": "Param_ScriptVariable"}, {"name": "_base_pt_", "description": "A point that sets the ground level frm which the wind profile is\r\ndrawn. By default, the profile is generated at the scene origin.", "optional": true, "type": "Param_ScriptVariable"}, {"name": "_max_speed_", "description": "Script variable WindProfile", "optional": true, "type": "Param_ScriptVariable"}, {"name": "_profile_height_", "description": "A number in meters to specify the maximum height of the\r\nwind profile. (Default: 30 meters).", "optional": true, "type": "Param_ScriptVariable"}, {"name": "_vec_spacing_", "description": "A number in meters to specify the difference in height between\r\neach of the mesh arrows. (Default 2 meters).", "optional": true, "type": "Param_ScriptVariable"}, {"name": "_vec_scale_", "description": "A number to denote the length dimension of a 1 m/s wind vector\r\nin meters. This can be used to change the scale of the wind\r\nvector meshes in relation to the height of the wind profile\r\ncurve. (Default: 5 meters).", "optional": true, "type": "Param_ScriptVariable"}, {"name": "legend_par_", "description": "An optional LegendParameter object to change the display of the\r\nwind profile.", "optional": true, "type": "Param_ScriptVariable"}], "outputs": [{"name": "out", "description": "Reports, errors, warnings, etc.", "optional": false, "type": "Param_String"}, {"name": "wind_speeds", "description": "A list of wind speeds in [m/s] that correspond to the wind\r\nvectors slong the height of the wind profile visualization.", "optional": false, "type": "Param_GenericObject"}, {"name": "wind_vectors", "description": "A list of vectors that built the profile. Note that the\r\nmagnitude of these vectors is scaled based on the _vec_scale_\r\ninput and a _vec_scale_ of 1 will make the magnitude of the\r\nvector equal to the wind speed in [m/s].", "optional": false, "type": "Param_GenericObject"}, {"name": "anchor_pts", "description": "A list of anchor points for each of the vectors above, which\r\ncorrespond to the height above the ground for each of the vectors.", "optional": false, "type": "Param_GenericObject"}, {"name": "mesh_arrows", "description": "A list of colored mesh objects that represent the wind speeds\r\nalong the height of the wind profile.", "optional": false, "type": "Param_GenericObject"}, {"name": "profile_curve", "description": "A curve outlining the wind speed as it changes with height.", "optional": false, "type": "Param_GenericObject"}, {"name": "speed_axis", "description": "A list of line segments and text objects that mark the X axis,\r\nwhich relates to the wind speed in (m/s).", "optional": false, "type": "Param_GenericObject"}, {"name": "height_axis", "description": "A list of line segments and text objects that mark the Y axis,\r\nwhich relates to the the height above the ground in Rhino model units.", "optional": false, "type": "Param_GenericObject"}, {"name": "legend", "description": "A legend for the colored mesh_arrows, which notes their speed.", "optional": false, "type": "Param_GenericObject"}, {"name": "title", "description": "A text object for the global_title.", "optional": false, "type": "Param_GenericObject"}, {"name": "vis_set", "description": "An object containing VisualizationSet arguments for drawing a detailed\r\nversion of the Wind Profile in the Rhino scene. This can be connected to\r\nthe \"LB Preview Visualization Set\" component to display this version\r\nof the Wind Profile in Rhino.", "optional": false, "type": "Param_GenericObject"}], "preset_items": [], "availability": "INSTANTIATED", "source": "C:/Program Files/ladybug_tools/grasshopper/ladybug_grasshopper/user_objects\\LB Wind Profile.ghuser", "id": "LB-059", "group": "圖表與視覺化", "hub_status": "待接入 Hub", "base_guid": "410755b1-224a-4c1e-a407-bf32fb45ea7e", "sha256": "9e63694cdf2da9109f63e656ca51578d8bee075ed03626ef44adcf4968d5cb47"}, {"file": "LB Wind Rose.ghuser", "name": "LB Wind Rose", "nickname": "", "category": "Ladybug", "subcategory": "2 :: Visualize Data", "guid": "3f89b08f-9ef1-40ff-bdfd-016b3d82d912", "description": "Create a plot of any hourly data by wind directions.\r\n-", "version": "None", "inputs": [{"name": "north_", "description": "An optional number between -360 and 360 for the counterclockwise\r\ndifference between the North and the positive Y-axis in degrees. 90 is West\r\nand 270 is East. This can also be Vector for the direction to North", "optional": true, "type": "Param_ScriptVariable"}, {"name": "_data", "description": "A HourlyContinuousCollection or HourlyDiscontinuousCollection of\r\nvalues corresponding to the wind directions, which is \"binned\" by\r\nthe direction intervals. This input usually consists of wind speed\r\nvalues, but is not limited to this data type. It can also be a list\r\nof data collections in which case multiple wind roses will be output.", "optional": true, "type": "Param_ScriptVariable"}, {"name": "_wind_direction", "description": "A HourlyContinuousCollection or HourlyDiscontinuousCollection\r\nof wind directions which will be used to \"bin\" the _data items for the\r\nwindrose.", "optional": true, "type": "Param_ScriptVariable"}, {"name": "_dir_count_", "description": "Number that determines the number of directions to the wind rose\r\nwill display. The number of directions must be greater then three to plot\r\nthe wind rose (Default: 36).", "optional": true, "type": "Param_ScriptVariable"}, {"name": "_center_pt_", "description": "Point3D to be used as a starting point to generate the geometry of\r\nthe plot (Default: (0, 0, 0)).", "optional": true, "type": "Param_ScriptVariable"}, {"name": "show_calm_", "description": "A boolean to indicate if the wind rose should display the fraction of\r\ntime with zero wind speed using a circle in the center of the plot.\r\nThe radius of this circle corresponds to the total amount of time\r\nwith zero values divided by the number of directions. This means that\r\nthe time period representing zero values is evenly distrobuted\r\nacross all directions. (Default: False).", "optional": true, "type": "Param_ScriptVariable"}, {"name": "show_avg_", "description": "A boolean to note whether the average value in each wind direction bin\r\nshould be displayed instead of the complete frequency of _data\r\nvalues. (Default: False).", "optional": true, "type": "Param_ScriptVariable"}, {"name": "_freq_dist_", "description": "The distance for the frequency interval in model units. If \r\nshow_calm_ is True, then the initial frequency interval corresponds\r\nto the number of calm hours in the data collection, which may not\r\nalign with this freq_dist_ (Default: 5 meters)", "optional": true, "type": "Param_ScriptVariable"}, {"name": "_freq_hours_", "description": "The number of hours in each frequency interval (Default: 50).", "optional": true, "type": "Param_ScriptVariable"}, {"name": "_max_freq_lines_", "description": "A number representing the maximum frequency intervals in\r\nthe rose, which determines the maximum amount of hours represented by the\r\noutermost ring of the windrose. Specifically, this number multiplied by the\r\n_freq_hours_ parameter will equal the maximum hours in that outermost\r\nring. By default, this value is determined by the wind direction with the\r\nlargest number of hours (the highest frequency) but you may want to change\r\nthis if you have several wind roses that you want to compare to each other.\r\nFor example, if you have wind roses for different months or seasons, which\r\neach have different maximum frequencies.", "optional": true, "type": "Param_ScriptVariable"}, {"name": "legend_par_", "description": "An optional LegendParameter object to change the display of the\r\nWindRose plot. The number of segments in the legend determines the number of\r\nfrequency intervals in the wind rose. If nothing is provided, a default\r\nLegendParameter object is computed using values from the wind data with\r\n11 segments (Default: None).", "optional": true, "type": "Param_ScriptVariable"}, {"name": "statement_", "description": "A conditional statement as a string (e.g. a > 25) for\r\nthe _data and _wind_direction inputs.\r\n.\r\nThe variable of the first collection input to _data should always\r\nbe named 'a' (without quotations), the variable of the second list\r\nshould be named 'b', and so on. The wind direction is always the\r\nlast variable, though most statements won't have a need for it.\r\n.\r\nFor example, if three data collections are connected to _data\r\nand the following statement is applied:\r\n'18 \u003c a \u003c 26 and b \u003c 80 and c > 2'\r\nThe resulting collections will only include values where the first\r\ndata collection is between 18 and 26, the second collection is less\r\nthan 80 and the third collection is greater than 2.", "optional": true, "type": "Param_ScriptVariable"}, {"name": "period_", "description": "An optional Ladybug analysis period to be applied to all of\r\nthe input data.", "optional": true, "type": "Param_ScriptVariable"}], "outputs": [{"name": "out", "description": "...", "optional": false, "type": "Param_String"}, {"name": "mesh", "description": "A colored mesh representing the wind rose derived from the input data.\r\nMultiple meshes will be output for several data collections are input.", "optional": false, "type": "Param_GenericObject"}, {"name": "compass", "description": "A set of circles, lines and text objects that mark the cardinal\r\ndirections in relation to the wind rose.", "optional": false, "type": "Param_GenericObject"}, {"name": "orient_line", "description": "Line geometries representing the edges (or \"spokes\") of the wind\r\nrose directions.", "optional": false, "type": "Param_GenericObject"}, {"name": "freq_line", "description": "Polygon geometries representing the frequency intervals of the wind\r\nrose.", "optional": false, "type": "Param_GenericObject"}, {"name": "windrose_line", "description": "Polygon geometries representing the windrose outlines. This\r\noutput is hidden by default and should be connected to a native\r\nGrasshopper Geometry component in order to be visualized.", "optional": false, "type": "Param_GenericObject"}, {"name": "legend", "description": "Geometry representing the legend for the wind rose.", "optional": false, "type": "Param_GenericObject"}, {"name": "title", "description": "A text object for the global_title.", "optional": false, "type": "Param_GenericObject"}, {"name": "prevailing", "description": "The predominant direction of the outpt wind rose in clockwise\r\ndegrees from north. 0 is North, 90 is East, 180 is South, 270 is West.", "optional": false, "type": "Param_GenericObject"}, {"name": "angles", "description": "A list of angles corresponding to each windrose directions.", "optional": false, "type": "Param_GenericObject"}, {"name": "calm_hours", "description": "The number of hours with calm wind speeds. Only returns a value\r\nif the input _data is wind speed.", "optional": false, "type": "Param_GenericObject"}, {"name": "histogram", "description": "The input _data in a histogram structure after it has gone through any of \r\nthe statement or period operations input to this component.", "optional": false, "type": "Param_GenericObject"}, {"name": "vis_set", "description": "An object containing VisualizationSet arguments for drawing a detailed\r\nversion of the Wind Rose in the Rhino scene. This can be connected to\r\nthe \"LB Preview Visualization Set\" component to display this version\r\nof the Wind Rose in Rhino.", "optional": false, "type": "Param_GenericObject"}], "preset_items": [], "availability": "INSTANTIATED", "source": "C:/Program Files/ladybug_tools/grasshopper/ladybug_grasshopper/user_objects\\LB Wind Rose.ghuser", "id": "LB-060", "group": "圖表與視覺化", "hub_status": "待接入 Hub", "base_guid": "410755b1-224a-4c1e-a407-bf32fb45ea7e", "sha256": "4d256dd109abdfa0ec010cbb248324c46dcb780ce3fed0ad310e655a0b9d0eba"}, {"file": "LB Direct Sun Hours.ghuser", "name": "LB Direct Sun Hours", "nickname": "", "category": "Ladybug", "subcategory": "3 :: Analyze Geometry", "guid": "ced122ff-fb47-4913-aa2d-17d8b170349d", "description": "Calculate the number of hours of direct sunlight received by geometry using sun\r\nvectors obtained from the \"LB SunPath\" component.\r\n_\r\nSuch direct sun calculations can be used for shadow studies of outdoor enviroments\r\nor can be used to estimate glare potential from direct sun on the indoors.\r\n_\r\nNote that this component uses the CAD environment's ray intersection methods,\r\nwhich can be fast for geometries with low complexity but does not scale well\r\nfor complex geometries or many test points. For such complex studies,\r\nhoneybee-radiance should be used.\r\n-", "version": "None", "inputs": [{"name": "_vectors", "description": "Sun vectors from the \"LB SunPath\" component, which will be used\r\nto determine the number of hours of direct sunlight received by the\r\ntest _geometry.", "optional": true, "type": "Param_ScriptVariable"}, {"name": "_timestep_", "description": "A positive integer for the number of timesteps per hour at\r\nwhich the \"LB SunPath\" component generated sun vectors. This is used\r\nto correctly interpret the time duration represented by each of\r\nthe input sun vectors. (Default: 1 for 1 vector per hour).", "optional": true, "type": "Param_ScriptVariable"}, {"name": "_geometry", "description": "Rhino Breps and/or Rhino Meshes for which direct sun analysis\r\nwill be conducted. If Breps are input, they will be subdivided using\r\nthe _grid_size to yeild individual points at which analysis will\r\noccur. If a Mesh is input, direct sun analysis analysis will be\r\nperformed for each face of this mesh instead of subdividing it.", "optional": true, "type": "Param_ScriptVariable"}, {"name": "context_", "description": "Rhino Breps and/or Rhino Meshes representing context geometry\r\nthat can block sunlight to the test _geometry.", "optional": true, "type": "Param_ScriptVariable"}, {"name": "_grid_size", "description": "A positive number in Rhino model units for the size of grid\r\ncells at which the input _geometry will be subdivided for direct sun\r\nanalysis. The smaller the grid size, the higher the resolution of\r\nthe analysis and the longer the calculation will take.  So it is\r\nrecommended that one start with a large value here and decrease\r\nthe value as needed. However, the grid size should usually be\r\nsmaller than the dimensions of the smallest piece of the _geometry\r\nand context_ in order to yield meaningful results.", "optional": true, "type": "Param_ScriptVariable"}, {"name": "_offset_dist_", "description": "A number for the distance to move points from the surfaces\r\nof the input _geometry.  Typically, this should be a small positive\r\nnumber to ensure points are not blocked by the mesh but it can be\r\nequal to zero when geo_block_ is False. (Default: 10 cm when\r\ngeo_block_ is True and zero when geo_block_ is False).", "optional": true, "type": "Param_ScriptVariable"}, {"name": "geo_block_", "description": "Set to \"True\" to count the input _geometry as opaque and\r\nset to \"False\" to discount the _geometry from the calculation and\r\nonly look at context_ that blocks the sun. (Default: True).", "optional": true, "type": "Param_ScriptVariable"}, {"name": "legend_par_", "description": "Optional legend parameters from the \"LB Legend Parameters\"\r\nthat will be used to customize the display of the results.", "optional": true, "type": "Param_ScriptVariable"}, {"name": "_cpu_count_", "description": "An integer to set the number of CPUs used in the execution of the\r\nintersection calculation. If unspecified, it will automatically default\r\nto one less than the number of CPUs currently available on the\r\nmachine or 1 if only one processor is available.", "optional": true, "type": "Param_ScriptVariable"}, {"name": "_run", "description": "Set to \"True\" to run the component and perform direct sun analysis.", "optional": true, "type": "Param_ScriptVariable"}], "outputs": [{"name": "out", "description": "...", "optional": false, "type": "Param_String"}, {"name": "points", "description": "The grid of points on the test _geometry that are be used to perform\r\nthe direct sun analysis.", "optional": false, "type": "Param_GenericObject"}, {"name": "results", "description": "A list of numbers that aligns with the points. Each number indicates\r\nthe number of hours of direct sunlight received by each of the\r\npoints.  Note that is is the number of hours out of the total\r\nnumber of connected _vectors.", "optional": false, "type": "Param_GenericObject"}, {"name": "mesh", "description": "A colored mesh of the test _geometry representing the hours of direct\r\nsunlight received by this input _geometry", "optional": false, "type": "Param_GenericObject"}, {"name": "legend", "description": "A legend showing the number of hours that correspond to the colors\r\nof the mesh.", "optional": false, "type": "Param_GenericObject"}, {"name": "title", "description": "A text object for the study title.", "optional": false, "type": "Param_GenericObject"}, {"name": "int_mtx", "description": "A Matrix object that can be connected to the \"LB Deconstruct Matrix\"\r\ncomponent to obtain detailed vector-by-vector results of the study.\r\nEach sub-list of the matrix (aka. branch of the Data Tree) represents\r\none of the points used for analysis. The length of each sub-list\r\nmatches the number of _vectors used for the analysis. Each value\r\nin the sub-list is either a \"1\", indicating that the sun is visible\r\nfor that vector, or a \"0\", indicating that the sun is not visible\r\nfor that vector.", "optional": false, "type": "Param_GenericObject"}], "preset_items": [], "availability": "INSTANTIATED", "source": "C:/Program Files/ladybug_tools/grasshopper/ladybug_grasshopper/user_objects\\LB Direct Sun Hours.ghuser", "id": "LB-061", "group": "幾何與環境分析", "hub_status": "待接入 Hub", "base_guid": "410755b1-224a-4c1e-a407-bf32fb45ea7e", "sha256": "cfa373e17b4dfbaa58ef611e6d36e23c4f35979267be8951a3b72c61d34ae313"}, {"file": "LB Human to Sky Relation.ghuser", "name": "LB Human to Sky Relation", "nickname": "", "category": "Ladybug", "subcategory": "3 :: Analyze Geometry", "guid": "1b3c6b4c-d06a-402a-b808-92d9881a3a66", "description": "Calculate parameters for the relationship between human geometry and the sky given\r\nthe position of a human subject and context geometry surrounding this position.\r\n_\r\nThe outputs of this component can be plugged into either the \"LB Outdoor Solar MRT\"\r\nor the \"LB Indoor Solar MRT\" in order to account for context shading around a\r\nhuman subject in these MRT calculations.\r\n-", "version": "None", "inputs": [{"name": "north_", "description": "A number between -360 and 360 for the counterclockwise\r\ndifference between the North and the positive Y-axis in degrees.\r\n90 is West and 270 is East. This can also be Vector for the\r\ndirection to North. (Default: 0)", "optional": true, "type": "Param_ScriptVariable"}, {"name": "_location", "description": "A ladybug Location that has been output from the \"LB Import EPW\"\r\ncomponent, the \"LB Import Location\" component, or the \"LB Construct\r\nLocation\" component. This will be used to compute hourly sun\r\npositions for the fract_body_exp.", "optional": true, "type": "Param_ScriptVariable"}, {"name": "_position", "description": "A point for the position of the human subject in the Rhino scene.\r\nThis is used to understand where a person is in relationship to the\r\n_context. The point input here should be at the feet of the human\r\na series of points will be generated above. This can also be a list\r\nof points, which will result in several outputs.", "optional": true, "type": "Param_ScriptVariable"}, {"name": "_context", "description": "Rhino Breps and/or Rhino Meshes representing context geometry\r\nthat can block the human subject's direct sun and view to the sky.", "optional": true, "type": "Param_ScriptVariable"}, {"name": "_pt_count_", "description": "A positive integer for the number of points used to represent\r\nthe human subject geometry. Points are evenly distributed over the\r\n_height_ and are used to compute fracitonal values for the\r\nfract_body_exp in the case that only some of the points can see the\r\nsun. When context shade around the subject is large or coarse,\r\nusing a single point is likely to return similar results as using\r\nseveral points. However, this number should be increased when\r\ncontext is detailed and has the potential to shade only part of\r\nthe human subject at a given time. (Default: 1).", "optional": true, "type": "Param_ScriptVariable"}, {"name": "_height_", "description": "A number for the the height of the human subject in the current Rhino\r\nModel units. (Default: 1.8 m in the equivalent Rhino Model units;\r\nroughly the average height of a standing adult).", "optional": true, "type": "Param_ScriptVariable"}, {"name": "_cpu_count_", "description": "An integer to set the number of CPUs used in the execution of the\r\nintersection calculation. If unspecified, it will automatically default\r\nto one less than the number of CPUs currently available on the\r\nmachine or 1 if only one processor is available.", "optional": true, "type": "Param_ScriptVariable"}, {"name": "_run", "description": "Set to \"True\" to run the component and compute the human/sky relationship.\r\nIf set to \"False\" but all other required inputs are specified, this\r\ncomponent will output points showing the human subject.", "optional": true, "type": "Param_ScriptVariable"}], "outputs": [{"name": "out", "description": "...", "optional": false, "type": "Param_String"}, {"name": "human_points", "description": "The points used to represent the human subject in the calculation\r\nof the fraction of the body exposed to sun. Note that these are\r\ngenerated even when _run is set to \"False\".", "optional": false, "type": "Param_GenericObject"}, {"name": "human_line", "description": "Line representing the height of the human subject. Note that this\r\nis generated even when _run is set to \"False\".", "optional": false, "type": "Param_GenericObject"}, {"name": "fract_body_exp", "description": "A data collection for the fraction of the body exposed to\r\ndirect sunlight at each hour of the year. This can be plugged into\r\nthe \"Solar MRT\" components in order to account for context shading\r\nin the computation of MRT.", "optional": false, "type": "Param_GenericObject"}, {"name": "sky_exposure", "description": "A single number between 0 and 1 for the fraction of the sky\r\nvault in human subject’s view. This can be plugged into the\r\n\"Solar MRT\" components in order to account for context shading\r\nin the computation of MRT.", "optional": false, "type": "Param_GenericObject"}], "preset_items": [], "availability": "INSTANTIATED", "source": "C:/Program Files/ladybug_tools/grasshopper/ladybug_grasshopper/user_objects\\LB Human to Sky Relation.ghuser", "id": "LB-062", "group": "幾何與環境分析", "hub_status": "待接入 Hub", "base_guid": "410755b1-224a-4c1e-a407-bf32fb45ea7e", "sha256": "8a31d589e75771b2355a5f614e3830823c73c0f0b297b5fac1153f006afb209e"}, {"file": "LB Incident Radiation.ghuser", "name": "LB Incident Radiation", "nickname": "", "category": "Ladybug", "subcategory": "3 :: Analyze Geometry", "guid": "dc3680de-7923-492e-bc38-e5796410e7da", "description": "Calculate the incident radiation on geometry using a sky matrix from the \"Cumulative\r\nSky Matrix\" component.\r\n_\r\nSuch studies of incident radiation can be used to apprxomiate the energy that can\r\nbe collected from photovoltaic or solar thermal systems. They are also useful\r\nfor evaluating the impact of a building's orientation on both energy use and the\r\nsize/cost of cooling systems. For studies of photovoltaic potential or building\r\nenergy use impact, a sky matrix from EPW radiation should be used. For studies\r\nof cooling system size/cost, a sky matrix derived from the STAT file's clear sky\r\nradiation should be used.\r\n_\r\nNOTE THAT NO REFLECTIONS OF SOLAR ENERGY ARE INCLUDED\r\nIN THE ANALYSIS PERFORMED BY THIS COMPONENT.\r\n_\r\nGround reflected irradiance is crudely acounted for by means of an emissive\r\n\"ground hemisphere,\" which is like the sky dome hemisphere and is derived from\r\nthe ground reflectance that is associated with the connected _sky_mtx. This\r\nmeans that including geometry that represents the ground surface will effectively\r\nblock such crude ground reflection.\r\n_\r\nAlso note that this component uses the CAD environment's ray intersection methods,\r\nwhich can be fast for geometries with low complexity but does not scale well for\r\ncomplex geometries or many test points. For such complex cases and situations\r\nwhere relfection of solar energy are important, honeybee-radiance should be used.\r\n-", "version": "None", "inputs": [{"name": "_sky_mtx", "description": "A Sky Matrix from the \"LB Cumulative Sky Matrix\" component or the\r\n\"LB Benefit Sky Matrix\" component, which describes the radiation\r\ncoming from the various patches of the sky. The \"LB Sky Dome\"\r\ncomponent can be used to visualize any sky matrix to understand\r\nits relationship to the test geometry.", "optional": true, "type": "Param_ScriptVariable"}, {"name": "_geometry", "description": "Rhino Breps and/or Rhino Meshes for which incident radiation analysis\r\nwill be conducted. If Breps are input, they will be subdivided using\r\nthe _grid_size to yeild individual points at which analysis will\r\noccur. If a Mesh is input, radiation analysis analysis will be\r\nperformed for each face of this mesh instead of subdividing it.", "optional": true, "type": "Param_ScriptVariable"}, {"name": "context_", "description": "Rhino Breps and/or Rhino Meshes representing context geometry\r\nthat can block solar radiation to the test _geometry.", "optional": true, "type": "Param_ScriptVariable"}, {"name": "_grid_size", "description": "A positive number in Rhino model units for the size of grid\r\ncells at which the input _geometry will be subdivided for incident\r\nradiation analysis. The smaller the grid size, the higher the\r\nresolution of the analysis and the longer the calculation will take.\r\nSo it is recommended that one start with a large value here and\r\ndecrease the value as needed. However, the grid size should usually\r\nbe smaller than the dimensions of the smallest piece of the _geometry\r\nand context_ in order to yield meaningful results.", "optional": true, "type": "Param_ScriptVariable"}, {"name": "_offset_dist_", "description": "A number for the distance to move points from the surfaces\r\nof the input _geometry.  Typically, this should be a small positive\r\nnumber to ensure points are not blocked by the mesh. (Default: 10 cm\r\nin the equivalent Rhino Model units).", "optional": true, "type": "Param_ScriptVariable"}, {"name": "irradiance_", "description": "Boolean to note whether the study should output units of cumulative\r\nRadiation (kWh/m2) [False] or units of average Irradiance (W/m2)\r\n[True].  (Default: False).", "optional": true, "type": "Param_ScriptVariable"}, {"name": "legend_par_", "description": "Optional legend parameters from the \"LB Legend Parameters\"\r\nthat will be used to customize the display of the results.", "optional": true, "type": "Param_ScriptVariable"}, {"name": "_cpu_count_", "description": "An integer to set the number of CPUs used in the execution of the\r\nintersection calculation. If unspecified, it will automatically default\r\nto one less than the number of CPUs currently available on the\r\nmachine or 1 if only one processor is available.", "optional": true, "type": "Param_ScriptVariable"}, {"name": "_run", "description": "Set to \"True\" to run the component and perform incident radiation\r\nanalysis.", "optional": true, "type": "Param_ScriptVariable"}], "outputs": [{"name": "out", "description": "...", "optional": false, "type": "Param_String"}, {"name": "points", "description": "The grid of points on the test _geometry that are be used to perform\r\nthe incident radiation analysis.", "optional": false, "type": "Param_GenericObject"}, {"name": "results", "description": "A list of numbers that aligns with the points. Each number indicates\r\nthe cumulative incident radiation received by each of the points\r\nfrom the sky matrix in kWh/m2.", "optional": false, "type": "Param_GenericObject"}, {"name": "total", "description": "A number for the total incident solar energy falling on all input geometry\r\nin kWh. Note that, unlike the radiation results above, which are\r\nnormlaized by area, these values are not area-normalized and so\r\nthe input geometry must be represented correctly in the Rhino\r\nmodel's unit system in order for this output to be meaningful.", "optional": false, "type": "Param_GenericObject"}, {"name": "mesh", "description": "A colored mesh of the test _geometry representing the cumulative\r\nincident radiation received by the input _geometry.", "optional": false, "type": "Param_GenericObject"}, {"name": "legend", "description": "A legend showing the kWh/m2 that correspond to the colors of the mesh.", "optional": false, "type": "Param_GenericObject"}, {"name": "title", "description": "A text object for the study title.", "optional": false, "type": "Param_GenericObject"}, {"name": "int_mtx", "description": "A Matrix object that can be connected to the \"LB Deconstruct Matrix\"\r\ncomponent to obtain detailed patch-by-patch results of the study.\r\nEach sub-list of the matrix (aka. branch of the Data Tree) represents\r\none of the points used for analysis. The length of each sub-list\r\nmatches the number of sky patches in the input sky matrix (145 for\r\nthe default Tregenza sky and 577 for the high_density Reinhart sky).\r\nEach value in the sub-list is a value between 0 and 1 indicating the\r\nrelationship between the point and the patch of the sky. A value of\r\n\"0\", indicates that the patch is not visible for that point at all\r\nwhile a value of \"1\" indicates that the patch hits the surface that\r\nthe point represents head on.", "optional": false, "type": "Param_GenericObject"}], "preset_items": [], "availability": "INSTANTIATED", "source": "C:/Program Files/ladybug_tools/grasshopper/ladybug_grasshopper/user_objects\\LB Incident Radiation.ghuser", "id": "LB-063", "group": "幾何與環境分析", "hub_status": "已接入並實測", "base_guid": "410755b1-224a-4c1e-a407-bf32fb45ea7e", "sha256": "11c31356354066c279bcf33e675f1753f9f6f6c50f88e4b3fccdbdb3f13b9a03"}, {"file": "LB Real Time Incident Radiation.ghuser", "name": "LB Real Time Incident Radiation", "nickname": "", "category": "Ladybug", "subcategory": "3 :: Analyze Geometry", "guid": "f339273d-9e6e-4900-9534-56ba4943acd6", "description": "Compute Incident Radiation values for any sky matrix in real time using the Geometry/Sky\r\nintersection matrix produced by the \"LB Incident Radiation\" component.\r\n_\r\nUsing this component enables one to scroll through radiation on an hour-by-hour\r\nor month-by-month basis in a manner that is an order of magnitude faster than\r\nrunning each sky matrix through the \"LB Incident Radiation\" component.\r\n_\r\nThe speed of this component is thanks to the fact that the Geometry/Sky intersection\r\nmatrix contains the relationship between the geometry and each patch of the sky.\r\nSo computing new radiation values is as simple as multiplying the sky matrix by\r\nthe intersection matrix.\r\n-", "version": "None", "inputs": [{"name": "_int_mtx", "description": "A Geometry/Sky Intersection Matrix from the \"LB Incident Radiation\" \r\ncomponent. This matrix contains the relationship between each point of\r\nthe analyzed geometry and each patch of the sky.", "optional": true, "type": "Param_ScriptVariable"}, {"name": "_sky_mtx", "description": "A Sky Matrix from the \"LB Cumulative Sky Matrix\" component, which\r\ndescribes the radiation coming from the various patches of the sky.\r\nThe \"LB Sky Dome\" component can be used to visualize any sky matrix.", "optional": true, "type": "Param_ScriptVariable"}], "outputs": [{"name": "results", "description": "A list of numbers that aligns with the points of the original analysis\r\nperformed with the \"LB Incident Radiation\"  component. Each number\r\nindicates the cumulative incident radiation received by each of the\r\npoints from the sky matrix in kWh/m2. To visualize these radiation\r\nvalues in the Rhino scene, connect these values to the \"LB Spatial\r\nHeatmap\" component along with the mesh output from the original\r\nanalysis with the \"LB Incident Radiation\"  component.", "optional": false, "type": "Param_GenericObject"}], "preset_items": [], "availability": "INSTANTIATED", "source": "C:/Program Files/ladybug_tools/grasshopper/ladybug_grasshopper/user_objects\\LB Real Time Incident Radiation.ghuser", "id": "LB-064", "group": "幾何與環境分析", "hub_status": "待接入 Hub", "base_guid": "410755b1-224a-4c1e-a407-bf32fb45ea7e", "sha256": "12abfd83137ca3a01d0eeab8635e708b0c4ee9799e054a45d3b908687e102a21"}, {"file": "LB Set Rhino Sun.ghuser", "name": "LB Set Rhino Sun", "nickname": "", "category": "Ladybug", "subcategory": "3 :: Analyze Geometry", "guid": "d3a7b727-1f34-430c-8340-b40339e42174", "description": "Set the sun in the Rhino scene to correspond to a given location and date/time.\r\n_\r\nThis can be help coordinate Rhino visualizations with Ladybug analyses.\r\n-", "version": "None", "inputs": [{"name": "north_", "description": "A number between -360 and 360 for the counterclockwise\r\ndifference between the North and the positive Y-axis in degrees.\r\n90 is West and 270 is East. This can also be Vector for the\r\ndirection to North. (Default: 0)", "optional": true, "type": "Param_ScriptVariable"}, {"name": "_location", "description": "A ladybug Location that has been output from the \"LB Import EPW\"\r\ncomponent or the \"LB Construct Location\" component.", "optional": true, "type": "Param_ScriptVariable"}, {"name": "_hoy", "description": "Script variable rhinoSun", "optional": true, "type": "Param_ScriptVariable"}, {"name": "_run", "description": "Set to True to run the component set the Rhino Sun.", "optional": true, "type": "Param_ScriptVariable"}], "outputs": [{"name": "out", "description": "Reports, errors, warnings, etc.", "optional": false, "type": "Param_String"}], "preset_items": [], "availability": "INSTANTIATED", "source": "C:/Program Files/ladybug_tools/grasshopper/ladybug_grasshopper/user_objects\\LB Set Rhino Sun.ghuser", "id": "LB-065", "group": "幾何與環境分析", "hub_status": "待接入 Hub", "base_guid": "410755b1-224a-4c1e-a407-bf32fb45ea7e", "sha256": "6361a7d7fdeb91125e97ce3e61034c575bbd28341e398930a6787d16692f080e"}, {"file": "LB Shade Benefit.ghuser", "name": "LB Shade Benefit", "nickname": "", "category": "Ladybug", "subcategory": "3 :: Analyze Geometry", "guid": "bac02d8b-54a8-4fb3-9998-4024c1a6c57c", "description": "Visualize the desirability of shade in terms of the time period of blocked\r\nsun vectors for each part of a shade geometry.\r\n_\r\nThe calculation assumes that all input _vectors represent sun to be blocked, which\r\nis often the case when evaluating shade in terms of its benefit for glare reduction\r\nand occupant visual comfort. It can also be the case when sun vectors have been\r\nfiltered to account for times of peak cooling demand or for the heat stress of\r\nhuman subjects.\r\n_\r\nThe component outputs a colored mesh of the shade illustrating the helpfulness of\r\nshading each part of the _shade_geo. A higher saturation of blue indicates that\r\nshading the cell blocks more hours of sun and is therefore more desirable.\r\n_\r\nThe units for shade desirability are hrs/square Rhino unit, which note the amount\r\nof time that sun is blocked by a given cell. So, if a given square meter of input\r\n_shade_geo has a shade desirability of 10 hrs/m2, this means that a shade in\r\nthis location blocks an average of 10 hours to each of the _study_points.\r\n-", "version": "None", "inputs": [{"name": "_vectors", "description": "Sun vectors from the \"LB SunPath\" component, which will be used\r\nto determine the number of hours of sun blocked by the _shade_geo.\r\nWhen evaluating shade benefit in terms of glare reduction, these\r\nvectors are typically for any sun-up hour of the year since looking\r\ninto the sun at practically any hour is likely to induce glare.\r\nWhen using this component to approximate reductions to cooling\r\ndemand or human heat stress, it's more appropriate to filter\r\nsun vectors using a conditional statement or use other types of\r\nshade benefit analysis like the \"LB Thermal Shade Benefit\"\r\ncomponent or the \"HB Energy Shade Benefit\" component.", "optional": true, "type": "Param_ScriptVariable"}, {"name": "_study_points", "description": "Points representing an location in space for which shading\r\ndesirability is being evaluated. For a study of shade desirability for\r\nreducing glare, this is often the location of the human subject's\r\nview. For a study of shade desirability over a surface like a desk\r\nor a window, the \"LB Generate Point Grid\" component can be used to\r\ncreate a set of points over the surface to input here.", "optional": true, "type": "Param_ScriptVariable"}, {"name": "study_directs_", "description": "Optional Vectors that align with the _study_points and represent\r\nthe direction in which shade desirability is being evaluated. For a\r\nstudy of shade desirability for reducing glare, this is the direction\r\nin which human subject is looking. For a study of shade desirability\r\nover a surface like a desk or a window, the vectors output of the\r\n\"LB Generate Point Grid\" component should be input here. If not\r\nsupplied, sun vectors coming from any direction will be used to\r\nevualuate shade desirability.", "optional": true, "type": "Param_ScriptVariable"}, {"name": "_shade_geo", "description": "Rhino Breps and/or Rhino Meshes representing shading to be evaluated\r\nin terms of its benefit. Note that, in the case that multiple\r\nshading geometries are connected, this component does not account\r\nfor the interaction between the different shading surfaces and will\r\njust evaluate each part of the shade independently.", "optional": true, "type": "Param_ScriptVariable"}, {"name": "context_", "description": "Rhino Breps and/or Rhino Meshes representing context geometry that can\r\nblock sunlight to the _study_points, therefore discounting any benefit\r\nor harm that could come to the region.", "optional": true, "type": "Param_ScriptVariable"}, {"name": "_grid_size", "description": "A positive number in Rhino model units for the size of grid cells at\r\nwhich the input _shade_geo will be subdivided for shade benefit\r\nanalysis. The smaller the grid size, the higher the resolution of\r\nthe analysis and the longer the calculation will take.  So it is\r\nrecommended that one start with a large value here and decrease\r\nthe value as needed. However, the grid size should usually be\r\nsmaller than the dimensions of the smallest piece of the _shade_geo\r\nand context_ in order to yield meaningful results.", "optional": true, "type": "Param_ScriptVariable"}, {"name": "_timestep_", "description": "A positive integer for the number of timesteps per hour at which\r\nthe \"LB SunPath\" component generated sun vectors. This is used\r\nto correctly interpret the time duration represented by each of\r\nthe input sun vectors. (Default: 1 for 1 vector per hour).", "optional": true, "type": "Param_ScriptVariable"}, {"name": "legend_par_", "description": "Optional legend parameters from the \"LB Legend Parameters\"\r\nthat will be used to customize the display of the results.", "optional": true, "type": "Param_ScriptVariable"}, {"name": "_cpu_count_", "description": "An integer to set the number of CPUs used in the execution of the\r\nintersection calculation. If unspecified, it will automatically default\r\nto one less than the number of CPUs currently available on the\r\nmachine or 1 if only one processor is available.", "optional": true, "type": "Param_ScriptVariable"}, {"name": "_run", "description": "Set to \"True\" to run the component and perform shade benefit analysis.", "optional": true, "type": "Param_ScriptVariable"}], "outputs": [{"name": "out", "description": "...", "optional": false, "type": "Param_String"}, {"name": "mesh", "description": "A colored mesh of the _shade_geo showing where shading is helpful (in blue),\r\nand where it does not make much of a difference (white or desaturated\r\ncolors). Note that the colors can change depending upon the input legend_par_.", "optional": false, "type": "Param_GenericObject"}, {"name": "legend", "description": "Legend showing the numeric values of hrs / square unit that correspond to\r\nthe colors in the shade mesh.", "optional": false, "type": "Param_GenericObject"}, {"name": "title", "description": "A text object for the study title.", "optional": false, "type": "Param_GenericObject"}, {"name": "shade_help", "description": "The cumulative hrs / square unit helped by shading the given cell. If a given\r\nsquare meter of _shade_geo has a shade helpfulness of 10 hrs/m2,\r\nthis means that a shade in this location blocks an average of 10 hours\r\nto each of the _study_points.", "optional": false, "type": "Param_GenericObject"}], "preset_items": [], "availability": "INSTANTIATED", "source": "C:/Program Files/ladybug_tools/grasshopper/ladybug_grasshopper/user_objects\\LB Shade Benefit.ghuser", "id": "LB-066", "group": "幾何與環境分析", "hub_status": "待接入 Hub", "base_guid": "410755b1-224a-4c1e-a407-bf32fb45ea7e", "sha256": "e2733653cec2ba358e9d6a6aad05942b2953194d1cba5eda2ecf42a98e7b1fab"}, {"file": "LB Sky Mask.ghuser", "name": "LB Sky Mask", "nickname": "", "category": "Ladybug", "subcategory": "3 :: Analyze Geometry", "guid": "25a0b3c4-c81c-4a6b-b4c5-3f9746abc121", "description": "Visualize the portion of the sky dome that is masked by context geometry or shading\r\nstrategies around a given point.\r\n_\r\nSeparate meshs will be generated for the portions of the sky dome that are masked\r\nvs visible. The percentage of the sky that is masked by the context geometry and\r\nis visible will also be computed.\r\n-", "version": "None", "inputs": [{"name": "context_", "description": "Rhino Breps and/or Rhino Meshes representing context geometry that\r\ncan block the sky to the center of the sky mask.", "optional": true, "type": "Param_ScriptVariable"}, {"name": "orientation_", "description": "A number between 0 and 360 that sets the direction of a vertically-\r\noriented surface for which the sky view will be visualized and\r\ncomputed. Alternatively, this input can be the words \"north\",\r\n\"east\", \"south\" or \"west.\" An input here will result in the output\r\nof an orient_mask, which blocks the portion of the sky that is not\r\nvisible from a vertical surface with this orientation. Furthermore,\r\nall of the view-related outputs will be computed for a surface with\r\nthe specified orientation (overriding any plane input for the _center_).", "optional": true, "type": "Param_ScriptVariable"}, {"name": "overhang_proj_", "description": "A number between 0 and 90 that sets the angle between the _center_\r\nand the edge of an imagined horizontal overhang projecting past\r\nthe point. Note that this option is only available when there is\r\nan input for orientation_ above. An input here will result in the\r\noutput of a strategy_mask, which blocks the portion of the sky\r\ntaken up by an overhang with the input projection angle.", "optional": true, "type": "Param_ScriptVariable"}, {"name": "left_fin_proj_", "description": "A number between 0 and 180 that sets the angle between the _center_\r\nand the edge of an imagined vertical fin projecting past the left\r\nside of the point. Note that this option is only available when\r\nthere is an input for orientation_ above. An input here will result\r\nin the output of a strategy_mask, which blocks the portion of the\r\nsky taken up by a vertical fin with the input projection angle.", "optional": true, "type": "Param_ScriptVariable"}, {"name": "right_fin_proj_", "description": "A number between 0 and 180 that sets the angle between the _center_\r\nand the edge of an imagined vertical fin projecting past the right\r\nside of the point. Note that this option is only available when\r\nthere is an input for orientation_ above. An input here will result\r\nin the output of a strategy_mask, which blocks the portion of the\r\nsky taken up by a vertical fin with the input projection angle.", "optional": true, "type": "Param_ScriptVariable"}, {"name": "_density_", "description": "An integer that is greater than or equal to 1, which to sets the\r\nnumber of times that the sky patches are split. Higher numbers\r\ninput here will ensure a greater accuracy but will also take\r\nlonger to run. A value of 3 should result in sky view factors\r\nwith less than 1% error from the true value. (Default: 1).", "optional": true, "type": "Param_ScriptVariable"}, {"name": "_center_", "description": "A point or plane for which the visible portion of the sky will\r\nbe evaluated. If a point is input here, the view-related outputs\r\nwill be indiferent to orientation and the sky_view outut will\r\ntechnically be Sky Exposure (or the fraction of the sky hemisphere\r\nthat is visible from the point). If a plane is input here (or an\r\norientation_ is connected), the view-related outputs will be\r\nsensitive to orientation and the sky_view output will be true\r\nSky View (or the fraction of the sky visible from a surface in\r\na plane). If no value is input here, the center will be a point\r\n(Sky Exposure) at the Rhino origin (0, 0, 0).", "optional": true, "type": "Param_ScriptVariable"}, {"name": "_scale_", "description": "A number to set the scale of the sky mask. The default is 1,\r\nwhich corresponds to a radius of 100 meters in the current Rhino\r\nmodel's unit system.", "optional": true, "type": "Param_ScriptVariable"}, {"name": "projection_", "description": "Optional text for the name of a projection to use from the sky\r\ndome hemisphere to the 2D plane. If None, a 3D dome will be drawn\r\ninstead of a 2D one. Choose from the following:\r\n* Orthographic\r\n* Stereographic\r\n* Equidistant\r\n* Equisolid", "optional": true, "type": "Param_ScriptVariable"}], "outputs": [{"name": "out", "description": "...", "optional": false, "type": "Param_String"}, {"name": "context_mask", "description": "A mesh for the portion of the sky dome masked by the context_\r\ngeometry.", "optional": false, "type": "Param_GenericObject"}, {"name": "orient_mask", "description": "A mesh for the portion of the sky dome that is not visible from\r\na surface is facing a given orientation.", "optional": false, "type": "Param_GenericObject"}, {"name": "strategy_mask", "description": "A mesh of the portion of the sky dome masked by the overhang,\r\nleft fin, and right fin projections.", "optional": false, "type": "Param_GenericObject"}, {"name": "sky_mask", "description": "A mesh of the portion of the sky dome visible by the _center_\r\nthrough the strategies and context_ geometry.", "optional": false, "type": "Param_GenericObject"}, {"name": "context_view", "description": "The percentage of the sky dome masked by the context_ geometry.", "optional": false, "type": "Param_GenericObject"}, {"name": "orient_view", "description": "The percentage of the sky dome that is not visible from a\r\nsurface is facing a given orientation.", "optional": false, "type": "Param_GenericObject"}, {"name": "strategy_view", "description": "The percentage of the sky dome viewed by the overhang, left\r\nfin, and right fin projections.", "optional": false, "type": "Param_GenericObject"}, {"name": "sky_view", "description": "The percentage of the sky dome visible by the _center_ through\r\nthe strategies and context_ geometry.", "optional": false, "type": "Param_GenericObject"}], "preset_items": [], "availability": "INSTANTIATED", "source": "C:/Program Files/ladybug_tools/grasshopper/ladybug_grasshopper/user_objects\\LB Sky Mask.ghuser", "id": "LB-067", "group": "幾何與環境分析", "hub_status": "待接入 Hub", "base_guid": "410755b1-224a-4c1e-a407-bf32fb45ea7e", "sha256": "eda57663b5aa57a79aa9f1fc1a93605e548e2cffd831798958777647a3dbb135"}, {"file": "LB Solar Envelope.ghuser", "name": "LB Solar Envelope", "nickname": "", "category": "Ladybug", "subcategory": "3 :: Analyze Geometry", "guid": "57b5a62f-d93b-495c-bbb1-a21e83ab580a", "description": "Generate a solar envelope boundary for a given geometry, set of sun vectors, and\r\ncontext (obstacle) geometry.\r\n_\r\nSolar collection envelopes show the height above which one will have solar access\r\nto certain sun positions on a given site.\r\n_\r\nSolar rights envelopes illustrate the volume in which one can build while ensuring\r\nthat a new development does not shade the surrounding properties for certain sun\r\npositions.\r\n-", "version": "None", "inputs": [{"name": "_geometry", "description": "Rhino Breps and/or Rhino Meshes for which the solar envelope will\r\nbe computed. If Breps are input, they will be subdivided using\r\nthe _grid_size to yeild individual points at which analysis will\r\noccur. If a Mesh is input, the analysis will be performed for each\r\nvertex of the mesh instead of subdividing it.", "optional": true, "type": "Param_ScriptVariable"}, {"name": "_obstacles", "description": "A list of horizontal planar Breps or curves indicating the tops (in the\r\ncase of solar collection) or bottoms (in the case of solar rights)\r\nof context geometries. Being above a solar collection boundary\r\nensures these top surfaces don't block the sun vectors to ones\r\nposition. Being below a solar rights boundary ensures these bottom\r\nsurfaces are protected from shade.", "optional": true, "type": "Param_ScriptVariable"}, {"name": "_vectors", "description": "Sun vectors from the \"LB SunPath\" component, which determine the\r\ntimes of the year when sun should be accessible.", "optional": true, "type": "Param_ScriptVariable"}, {"name": "_grid_size", "description": "A positive number in Rhino model units for the size of grid\r\ncells at which the input _geometry will be subdivided for envelope\r\nanalysis. The smaller the grid size, the higher the resolution of\r\nthe analysis and the longer the calculation will take.  So it is\r\nrecommended that one start with a large value here and decrease\r\nthe value as needed. The default will be a relativel coarse\r\nauto-calculated from the bounding box around the _geometry.", "optional": true, "type": "Param_ScriptVariable"}, {"name": "_height_limit_", "description": "A positive number for the minimum distance below (for collections)\r\nor maximum distance above (for rights) the average _geometry height\r\nthat the envelope points can be. This is used when there are no\r\nvectors blocked for a given point. (Default: 100 meters).", "optional": true, "type": "Param_ScriptVariable"}, {"name": "solar_rights_", "description": "Set to True to compute a solar rights boundary and False to compute\r\na solar collection boundary. Solar rights boundaries represent the\r\nboundary below which one can build without shading the surrounding\r\nobstacles from any of the _vectors. Solar collection boundaries\r\nrepresent the boundary above which one will have direct solar\r\naccess to all of the input _vectors. (Default: False).", "optional": true, "type": "Param_ScriptVariable"}, {"name": "_run", "description": "Set to \"True\" to run the component and get a solar envelope.", "optional": true, "type": "Param_ScriptVariable"}], "outputs": [{"name": "readMe!", "description": "...", "optional": false, "type": "Param_String"}, {"name": "points", "description": "The grid of points above the test _geometry representing the height to\r\nwhich the solar envelope boundary reaches.", "optional": false, "type": "Param_GenericObject"}, {"name": "mesh", "description": "A mesh representing the solar envelope. For solar collections (the default),\r\nthis represents the boundary above which the one will have direct\r\nsolar access to all of the input _vectors. For solar rights envelopes,\r\nthis represents the boundary below which one can build without shading\r\nthe surrounding obstacles from any of the _vectors.", "optional": false, "type": "Param_GenericObject"}], "preset_items": [], "availability": "INSTANTIATED", "source": "C:/Program Files/ladybug_tools/grasshopper/ladybug_grasshopper/user_objects\\LB Solar Envelope.ghuser", "id": "LB-068", "group": "幾何與環境分析", "hub_status": "待接入 Hub", "base_guid": "410755b1-224a-4c1e-a407-bf32fb45ea7e", "sha256": "5d0f36b48a8d0530dce884cca209d7773381aa4af9ac9d9e8bc0cbe9f3b07b04"}, {"file": "LB Surface Ray Tracing.ghuser", "name": "LB Surface Ray Tracing", "nickname": "", "category": "Ladybug", "subcategory": "3 :: Analyze Geometry", "guid": "c15bd3dc-5207-4ec8-8b4f-abcfacdafa01", "description": "Get a ray tracing visualization of direct sunlight rays reflected off of _source_geo\r\nand subsequently bouncing through a set of context_ geometries.\r\n_\r\nExamples where this visualization could be useful include understading the\r\nreflection of light by a light shelf or testing to see whether a parabolic\r\nglass or metal building geometry might focus sunlight to dangerous levels at\r\ncertain times of the year.\r\n_\r\nNote that this component assumes that all sun light is reflected specularly\r\n(like a mirror) and, for more detailed raytracing analysis with diffuse\r\nscattering, the Honeybee Radiance components should be used.\r\n-", "version": "None", "inputs": [{"name": "_vector", "description": "A sun vector (typically from the \"LB SunPath\" component), which will\r\nbe used to evaluate the light boucing off of the _source_geo and\r\nthrough the context_.", "optional": true, "type": "Param_ScriptVariable"}, {"name": "_source_geo", "description": "A brep or mesh representing a surface off of which sun rays first\r\nbounce. Lists of breps or meshes are also acceptable. These surfaces\r\nwill be used to generate the initial sun rays in a grid-like pattern.", "optional": true, "type": "Param_ScriptVariable"}, {"name": "context_", "description": "Breps or meshes for conext geometry, which will reflect the sun rays\r\nafter they bounce off of the _source_geo. They can also block the\r\nsun rays to the _source_geo if context_block_ is set to True.", "optional": true, "type": "Param_ScriptVariable"}, {"name": "receiver_", "description": "Optional breps or meshes for receiver geometry for which sun ray\r\nintersection is being studied. If specified, only sun rays that\r\nreflect off of the _source_geo and have their last bounce intersect\r\nthis receiver within the _last_length_ distance will appear in\r\nthe result. This can help filter results to only an area of\r\nintersect where the impact of reflected sun rays is a concern.", "optional": true, "type": "Param_ScriptVariable"}, {"name": "_grid_size", "description": "A positive number in Rhino model units for the average distance between\r\nsun ray points to generate along the _source_geo.", "optional": true, "type": "Param_ScriptVariable"}, {"name": "_bounce_count_", "description": "An positive integer for the number of ray bounces to trace\r\nthe sun rays forward. (Default: 1).", "optional": true, "type": "Param_ScriptVariable"}, {"name": "_first_length_", "description": "A positive number in Rhino model units for the length of the\r\nsun ray before the first bounce. If unspecified, this will be\r\nthe diagonal of the bounding box surrounding all input geometries.", "optional": true, "type": "Param_ScriptVariable"}, {"name": "_last_length_", "description": "A positive number in Rhino model units representing the length\r\nof the sun ray after the last bounce. If unspecified, this will be\r\nthe diagonal of the bounding box surrounding all input geometries.", "optional": true, "type": "Param_ScriptVariable"}, {"name": "context_block_", "description": "Set to \"True\" to count the input _context as something that fully\r\nblocks rays as opposed to having the rays simply bounce off of it.\r\nThis can be particularly useful in cases with lots of rays where\r\nyou are only concered about the rays that can actually hit the\r\n_source_geo. (Default: False).", "optional": true, "type": "Param_ScriptVariable"}, {"name": "_run", "description": "Set to \"True\" to run the component and perform the ray tracing study.",
