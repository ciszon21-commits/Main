<!-- AJAX 版本的文件上傳表單，用於 Modal -->
<style>
    .luxury-form {
        display: flex;
        flex-direction: column;
        gap: 1.5rem;
    }

    .form-group {
        display: flex;
        flex-direction: column;
        gap: 0.75rem;
    }

    .form-group label {
        font-size: 0.95rem;
        font-weight: 700;
        color: #1e293b;
    }

    .form-group input[type="file"] {
        padding: 0.75rem;
        border: 2px dashed #cbd5e1;
        border-radius: 1rem;
        background: #f8fafc;
        cursor: pointer;
        transition: all 0.3s;
    }

    .form-group input[type="file"]:hover {
        border-color: #2563eb;
        background: #eff6ff;
    }

    .form-group textarea {
        width: 100%;
        padding: 1rem 1.25rem;
        border: 2px solid #e2e8f0;
        border-radius: 1rem;
        font-family: inherit;
        font-size: 1rem;
        font-weight: 600;
        color: #0f172a;
        transition: all 0.3s;
        background: white;
        resize: vertical;
        min-height: 80px;
    }

    .form-group textarea:focus {
        outline: none;
        border-color: #2563eb;
        box-shadow: 0 0 0 5px rgba(37, 99, 235, 0.08);
    }

    .form-group select {
        width: 100%;
        padding: 1rem 1.25rem;
        border: 2px solid #e2e8f0;
        border-radius: 1rem;
        font-family: inherit;
        font-size: 1rem;
        font-weight: 600;
        color: #0f172a;
        transition: all 0.3s;
        background: white;
    }

    .form-group select:focus {
        outline: none;
        border-color: #2563eb;
        box-shadow: 0 0 0 5px rgba(37, 99, 235, 0.08);
    }

    .help-text {
        font-size: 0.8rem;
        color: #94a3b8;
        font-weight: 500;
    }

    .error-text {
        font-size: 0.8rem;
        color: #ef4444;
        font-weight: 600;
    }

    .modal-footer {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-top: 1.5rem;
        padding-top: 1.5rem;
        border-top: 1px solid #f1f5f9;
    }

    .modal-actions-right {
        display: flex;
        gap: 1rem;
        margin-left: auto;
    }

    .btn-cancel {
        color: #64748b;
        font-weight: 700;
        text-decoration: none;
        padding: 0.75rem 1.5rem;
        border-radius: 0.75rem;
        font-size: 0.875rem;
        background: transparent;
        border: none;
        cursor: pointer;
        transition: all 0.2s;
    }

    .btn-cancel:hover {
        color: #1e293b;
        background: #f1f5f9;
    }

    .btn-submit {
        background: #2563eb;
        color: white;
        border: none;
        padding: 0.75rem 1.75rem;
        border-radius: 0.75rem;
        font-size: 0.875rem;
        font-weight: 800;
        cursor: pointer;
        display: inline-flex;
        align-items: center;
        gap: 0.5rem;
        transition: all 0.3s;
        box-shadow: 0 10px 15px -3px rgba(37, 99, 235, 0.3);
    }

    .btn-submit:hover {
        background: #1d4ed8;
        transform: translateY(-3px);
        box-shadow: 0 15px 25px -5px rgba(37, 99, 235, 0.4);
    }
</style>

<form method="post" enctype="multipart/form-data" class="luxury-form" id="fileUploadForm">
    {% csrf_token %}

    <input type="hidden" name="discipline" value="{{ discipline_id }}">
    {% if budget_type %}
    <input type="hidden" name="budget_type" value="{{ budget_type }}">
    {% endif %}

    <div class="form-group">
        <label for="id_file">選擇檔案{% if multiple_files %} (可多選){% endif %}</label>
        <input type="file" name="file" id="id_file" required {% if multiple_files %}multiple{% endif %} {% if accept_formats %}accept="{{ accept_formats }}" {% endif %}>
        <p class="help-text">
            {% if upload_type == 'price_inquiry' %}
            支援的檔案格式：Excel (.xlsx, .xls), PDF (.pdf), 圖片 (.jpg, .png)，可一次選擇多個檔案
            {% else %}
            支援的檔案格式：Excel (.xlsx, .xls), PDF (.pdf)
            {% endif %}
        </p>
    </div>

    <div class="form-group">
        <label for="id_description">版本說明（選填）</label>
        <textarea name="description" id="id_description" rows="3" placeholder="請描述此版本的更新內容..."></textarea>
    </div>

    <div class="modal-footer">
        <div></div>
        <div class="modal-actions-right">
            <button type="button" class="btn-cancel" onclick="closeCurrentModal()">取消</button>
            <button type="submit" class="btn-submit">
                <svg width="16" height="16" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12" />
                </svg>
                上傳檔案
            </button>
        </div>
    </div>
</form>
