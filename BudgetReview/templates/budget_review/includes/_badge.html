{# 徽章組件 #}
{# 使用範例: {% include 'budget_review/includes/_badge.html' with text="已提送" variant="success" size="md" icon="check" %} #}
{# variant: success|warning|danger|info|neutral #}
{# size: sm|md|lg #}

{% if text %}
<span class="badge badge-{{ variant|default:'neutral' }} badge-{{ size|default:'md' }}">
    {% if icon %}
    <svg class="badge-icon" width="14" height="14" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        {% if icon == 'check' %}
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7" />
        {% elif icon == 'clock' %}
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z" />
        {% elif icon == 'alert' %}
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" />
        {% elif icon == 'info' %}
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
        {% endif %}
    </svg>
    {% endif %}
    <span class="badge-text">{{ text }}</span>
</span>
{% endif %}
