{# Toast 訊息組件 #}
{# 使用範例: {% include 'budget_review/includes/_toast.html' %} #}

<div id="toast-container" class="toast-container">
    <!-- Toast messages will be dynamically inserted here by JavaScript -->
</div>

<script>
    // Toast 顯示函數（全域可用）
    window.showToast = function (message, variant = 'info', duration = 3000) {
        const container = document.getElementById('toast-container');
        if (!container) return;

        const toast = document.createElement('div');
        toast.className = `toast toast-${variant}`;

        // Icon
        let iconPath = '';
        if (variant === 'success') {
            iconPath = 'M5 13l4 4L19 7';
        } else if (variant === 'warning' || variant === 'danger') {
            iconPath = 'M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z';
        } else {
            iconPath = 'M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z';
        }

        toast.innerHTML = `
        <svg class="toast-icon" width="20" height="20" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="${iconPath}"/>
        </svg>
        <span class="toast-message">${message}</span>
        <button class="toast-close" onclick="this.parentElement.remove()">
            <svg width="16" height="16" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
            </svg>
        </button>
    `;

        container.appendChild(toast);

        // 自動移除
        if (duration > 0) {
            setTimeout(() => {
                toast.classList.add('toast-fadeout');
                setTimeout(() => toast.remove(), 300);
            }, duration);
        }
    };
</script>
