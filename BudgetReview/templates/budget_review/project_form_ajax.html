<!-- AJAX 版本的表單，用於 Modal -->
<style>
    /* 確保使用設計系統的變數 */
    .luxury-form {
        display: flex;
        flex-direction: column;
        gap: 1.5rem;
    }

    .form-group {
        display: flex;
        flex-direction: column;
        gap: 0.75rem;
    }

    .form-group label {
        font-size: 0.95rem;
        font-weight: 700;
        color: #1e293b;
    }

    .form-group input,
    .form-group textarea,
    .form-group select {
        width: 100%;
        padding: 1rem 1.25rem;
        border: 2px solid #e2e8f0;
        border-radius: 1rem;
        font-family: inherit;
        font-size: 1rem;
        font-weight: 600;
        color: #0f172a;
        transition: all 0.3s;
        background: white;
    }

    .form-group input:focus,
    .form-group textarea:focus,
    .form-group select:focus {
        outline: none;
        border-color: #2563eb;
        box-shadow: 0 0 0 5px rgba(37, 99, 235, 0.08);
    }

    .form-group textarea {
        resize: vertical;
        min-height: 100px;
    }

    .help-text {
        font-size: 0.8rem;
        color: #94a3b8;
        font-weight: 500;
    }

    .error-text {
        font-size: 0.8rem;
        color: #ef4444;
        font-weight: 600;
    }

    .modal-footer {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-top: 1.5rem;
        padding-top: 1.5rem;
        border-top: 1px solid #f1f5f9;
    }

    .btn-delete-modal {
        background: #fee2e2;
        color: #ef4444;
        border: 1px solid #ef4444;
        padding: 0.75rem 1.5rem;
        border-radius: 0.75rem;
        font-size: 0.875rem;
        font-weight: 700;
        cursor: pointer;
        transition: all 0.3s;
    }

    .btn-delete-modal:hover {
        background: #ef4444;
        color: white;
        transform: translateY(-2px);
        box-shadow: 0 10px 20px -5px rgba(239, 68, 68, 0.4);
    }

    .modal-actions-right {
        display: flex;
        gap: 1rem;
    }

    .btn-cancel {
        color: #64748b;
        font-weight: 700;
        text-decoration: none;
        padding: 0.75rem 1.5rem;
        border-radius: 0.75rem;
        font-size: 0.875rem;
        background: transparent;
        border: none;
        cursor: pointer;
        transition: all 0.2s;
    }

    .btn-cancel:hover {
        color: #1e293b;
        background: #f1f5f9;
    }

    .btn-submit {
        background: #2563eb;
        color: white;
        border: none;
        padding: 0.75rem 1.75rem;
        border-radius: 0.75rem;
        font-size: 0.875rem;
        font-weight: 800;
        cursor: pointer;
        display: inline-flex;
        align-items: center;
        gap: 0.5rem;
        transition: all 0.3s;
        box-shadow: 0 10px 15px -3px rgba(37, 99, 235, 0.3);
    }

    .btn-submit:hover {
        background: #1d4ed8;
        transform: translateY(-3px);
        box-shadow: 0 15px 25px -5px rgba(37, 99, 235, 0.4);
    }
</style>

<form method="post" class="luxury-form">
    {% csrf_token %}
    {% for field in form %}
    <div class="form-group">
        <label for="{{ field.id_for_label }}">{{ field.label }}</label>
        {{ field }}
        {% if field.help_text %}<p class="help-text">{{ field.help_text }}</p>{% endif %}
        {% for error in field.errors %}<p class="error-text">{{ error }}</p>{% endfor %}
    </div>
    {% endfor %}

    <div class="modal-footer">
        <!-- 刪除按鈕（左側） -->
        {% if project.pk %}
        <button type="button" class="btn-delete-modal" onclick="deleteProject({{ project.pk }})">
            刪除
        </button>
        {% else %}
        <div></div>
        {% endif %}

        <!-- 取消和儲存按鈕（右側） -->
        <div class="modal-actions-right">
            <button type="button" class="btn-cancel" onclick="closeCurrentModal()">取消</button>
            <button type="submit" class="btn-submit">
                儲存
            </button>
        </div>
    </div>
</form>

<script>
    // deleteProject 函數在 Modal 內部定義
    function deleteProject(projectId) {
        if (confirm('確定要刪除此標案嗎？所有相關資料將被移除。')) {
            fetch(`/budget/project/${projectId}/delete/`, {
                method: 'POST',
                headers: {
                    'X-CSRFToken': document.querySelector('[name=csrfmiddlewaretoken]').value,
                }
            })
                .then(response => {
                    if (response.ok) {
                        if (typeof editModal !== 'undefined' && editModal) {
                            editModal.close();
                        }
                        window.location.reload();
                    } else {
                        alert('刪除失敗，請重試。');
                    }
                })
                .catch(error => {
                    console.error('Error:', error);
                    alert('刪除失敗，請重試。');
                });
        }
    }
</script>
