{% load static %}
<!DOCTYPE html>
<html lang="zh-TW">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{% block title %}排洪演算平台{% endblock %}</title>

    <!-- favicon -->
    <link rel="icon" type="image/x-icon" href="{% static 'Reservoir_Hydro/images/logo.ico' %}" /> 
    <!-- Bootstrap CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css"
      rel="stylesheet"
    />

    <!-- 水庫水文水理計算平台專屬 CSS -->
    <link rel="stylesheet" href="{% static 'Reservoir_Hydro/css/reservoir_hydro.css' %}" />
    {% block extra_css %}
    <style>
      .rh-header {
        background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
      }
      .content-wrapper {
        background: #f8f9fa;
        min-height: calc(100vh - 80px);
      }
    </style>
    {% endblock %}
  </head>
  <body>
    <header>
      <div class="px-2 py-1 rh-header">
        <div class="container">
          <div
            class="d-flex flex-wrap align-items-center justify-content-center justify-content-lg-start"
          >
            <!-- 使用專屬的 logo -->
            <a
              href="{% url 'reservoir_hydro:reservoir_hydro_home' %}"
              class="d-flex align-items-center my-2 my-lg-0 me-lg-auto text-white text-decoration-none ps-0"
            >
              <img
                src="{% static 'Reservoir_Hydro/images/logo.png' %}"
                alt="Logo"
                class="me-3"
                style="height: 40px"
              />
              <h5 class="text-light">
                <strong
                  >{% block header_title %}水庫水文水理計算平台{% endblock %}</strong
                >
              </h5>
            </a>
            </div>
          </div>
        </div>
      </div>
    </header>

    <div class="container-fluid d-flex p-0 content-wrapper">
      <main class="main-content col-sm-12 col-lg-12">
        {% block template %} {% endblock %}
      </main>
    </div>

    <!-- JavaScript -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://code.highcharts.com/highcharts.js"></script>
    <script src="https://code.highcharts.com/modules/exporting.js"></script>
    <script src="https://code.highcharts.com/modules/accessibility.js"></script>

    <!-- 額外 JavaScript Block -->
    {% block extra_js %}{% endblock %}
  </body>
</html>
