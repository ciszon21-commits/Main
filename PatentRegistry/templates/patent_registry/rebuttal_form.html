{% extends "patent_registry/base.html" %}
{% block title %}新增答辯 - 專利管理系統{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-6">
        <div class="card shadow">
            <div class="card-header bg-warning text-dark">
                <h4 class="mb-0"><i class="bi bi-reply me-2"></i>新增答辯記錄</h4>
            </div>
            <div class="card-body">
                <div class="alert alert-info mb-4"><i class="bi bi-info-circle me-2"></i>專利申請：<strong>
                    {{ application.name }}</strong></div>
                <form method="post" novalidate>{% csrf_token %}
                    <div class="mb-3"><label class="form-label">答辯類別 <span class="text-danger">*</span></label>
                        {{ form.rebuttal_type }}</div>
                    <div class="row mb-3">
                        <div class="col-md-6"><label class="form-label">單據日期 <span
                                    class="text-danger">*</span></label>{{ form.document_date }}</div>
                        <div class="col-md-6"><label class="form-label">費用</label>
                            <div class="input-group"><span class="input-group-text">NT$</span>{{ form.fee }}</div>
                        </div>
                    </div>
                    <div class="mb-3"><label class="form-label">備註</label>{{ form.notes }}</div>
                    <hr class="my-4">
                    <div class="d-flex justify-content-between"><a
                            href="{% url 'patent_registry:application_detail' application.pk %}"
                            class="btn btn-outline-secondary"><i class="bi bi-arrow-left me-1"></i>返回</a><button
                            type="submit" class="btn btn-warning"><i class="bi bi-check-lg me-1"></i>儲存答辯記錄</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
