{% extends 'EngineerRPG/base.html' %}
{% load static %}

{% block title %}變更頭像 - 監造冒險者公會{% endblock %}

{% block content %}
<div class="rpg-container">
    <div class="mb-lg">
        <a href="{% url 'engineer_rpg:dashboard' %}" class="rpg-btn">
            <i class="fas fa-arrow-left"></i> 返回儀表板
        </a>
    </div>

    <div class="rpg-card" style="max-width: 600px; margin: 0 auto;">
        <h2 class="text-center mb-lg">
            <i class="fas fa-user-edit"></i>
            變更頭像
        </h2>

        <!-- 目前頭像預覽 -->
        <div class="text-center mb-lg">
            <div class="mb-sm" style="color: var(--color-stone);">目前頭像</div>
            <div class="character-avatar preview-avatar"
                style="width: 150px; height: 150px; margin: 0 auto; background-image: url('{{ profile.get_avatar_url }}'); border: 4px solid var(--color-primary); border-radius: 50%;">
            </div>
        </div>

        <form method="post" enctype="multipart/form-data" id="avatarForm">
            {% csrf_token %}
            <input type="hidden" name="avatar_index" id="id_avatar_index" value="0">
            <input type="file" name="avatar_image" id="id_avatar_image" accept="image/*" style="display: none;">

            <!-- 操作按鈕 -->
            <div class="grid grid-2 gap-md mb-lg">
                <div class="rpg-btn rpg-btn-primary" onclick="document.getElementById('id_avatar_image').click()"
                    style="cursor: pointer; text-align: center;">
                    <i class="fas fa-upload"></i> 上傳專屬頭像
                </div>
                <div class="rpg-btn rpg-btn-secondary" onclick="openAvatarModal()"
                    style="cursor: pointer; text-align: center;">
                    <i class="fas fa-user-circle"></i> 選擇預設頭像
                </div>
            </div>

            <div class="text-center">
                <button type="submit" class="rpg-btn rpg-btn-success" style="padding: 0.8rem 2.5rem; font-size: 1.1rem;">
                    <i class="fas fa-save"></i> 儲存頭像
                </button>
            </div>
        </form>
    </div>
</div>

<!-- Avatar Selection Modal -->
<div id="avatarModal" class="modal-overlay"
    style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 9999; justify-content: center; align-items: center;">
    <div class="rpg-card"
        style="width: 90%; max-width: 600px; max-height: 80vh; display: flex; flex-direction: column; position: relative;">
        <div
            style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; border-bottom: 1px solid var(--color-primary); padding-bottom: 10px;">
            <h3 style="margin: 0;"><i class="fas fa-images"></i> 選擇預設頭像</h3>
            <button type="button" onclick="closeAvatarModal()"
                style="background: none; border: none; color: var(--color-text); font-size: 1.5rem; cursor: pointer;">&times;</button>
        </div>

        <div style="overflow-y: auto; flex: 1; padding: 10px;">
            <div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); gap: 15px;">
                {% for avatar_id, avatar_title in avatar_data %}
                <div class="default-avatar-option text-center" onclick="selectDefaultAvatar({{ avatar_id }}, this)"
                    style="cursor: pointer; border: 3px solid transparent; border-radius: 10px; padding: 5px; transition: all 0.3s;">
                    <img src="{% static 'EngineerRPG/img/avatars/' %}default_avatar_{{ avatar_id }}.png"
                        style="width: 80px; height: 80px; object-fit: cover; border-radius: 50%; box-shadow: 0 4px 6px rgba(0,0,0,0.3);"
                        alt="Avatar {{ avatar_id }}">
                    <div style="font-size: 0.75rem; margin-top: 5px; font-weight: bold; color: var(--color-secondary);">
                        #{{ avatar_id }} - {{ avatar_title }}</div>
                </div>
                {% endfor %}
            </div>
        </div>

        <div class="text-center mt-md pt-md" style="border-top: 1px solid var(--color-border);">
            <button type="button" class="rpg-btn" onclick="closeAvatarModal()">關閉</button>
        </div>
    </div>
</div>

<style>
    .character-avatar {
        background-size: cover;
        background-position: center;
        background-repeat: no-repeat;
        box-shadow: 0 0 15px rgba(212, 175, 55, 0.3);
    }

    .default-avatar-option:hover {
        background: rgba(255, 255, 255, 0.1);
        border-color: var(--color-primary) !important;
        transform: translateY(-5px);
    }

    .default-avatar-option.selected {
        border-color: var(--color-safety) !important;
        background: rgba(46, 204, 113, 0.2);
        box-shadow: 0 0 15px var(--color-safety);
    }

    .rpg-btn-secondary {
        background: transparent;
        border: 2px solid var(--color-primary);
        color: var(--color-primary);
    }

    .rpg-btn-secondary:hover {
        background: var(--color-primary);
        color: var(--color-background);
    }
</style>

<script>
    function openAvatarModal() {
        document.getElementById('avatarModal').style.display = 'flex';
    }

    function closeAvatarModal() {
        document.getElementById('avatarModal').style.display = 'none';
    }

    // Close modal when clicking outside
    document.getElementById('avatarModal').addEventListener('click', function (e) {
        if (e.target === this) {
            closeAvatarModal();
        }
    });

    // 上傳預覽
    document.getElementById('id_avatar_image').addEventListener('change', function (e) {
        if (e.target.files && e.target.files[0]) {
            var reader = new FileReader();
            reader.onload = function (ev) {
                document.querySelector('.preview-avatar').style.backgroundImage = 'url("' + ev.target.result + '")';
            };
            reader.readAsDataURL(e.target.files[0]);

            // 清除預設選擇
            document.getElementById('id_avatar_index').value = "0";
            document.querySelectorAll('.default-avatar-option').forEach(function (el) {
                el.classList.remove('selected');
            });
        }
    });

    // 選擇預設頭像
    function selectDefaultAvatar(index, element) {
        document.getElementById('id_avatar_index').value = index;

        // 更新樣式
        document.querySelectorAll('.default-avatar-option').forEach(function (el) {
            el.classList.remove('selected');
        });
        element.classList.add('selected');

        // 更新預覽
        var url = "{% static 'EngineerRPG/img/avatars/' %}" + "default_avatar_" + index + ".png";
        document.querySelector('.preview-avatar').style.backgroundImage = 'url("' + url + '")';

        // 清除上傳檔案
        document.getElementById('id_avatar_image').value = '';

        // 關閉 Modal
        closeAvatarModal();
    }
</script>
{% endblock %}
