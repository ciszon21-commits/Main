{% extends 'EngineerRPG/base.html' %}
{% load static %}

{% block title %}技能樹管理 - 監造冒險者公會{% endblock %}

{% block content %}
<div class="rpg-container">
    <div class="mb-lg">
        <h1 class="text-center">
            <i class="fas fa-tree"></i>
            技能樹管理
        </h1>
    </div>

    <div class="grid grid-2 gap-lg">
        <!-- 技能樹編輯器 -->
        <div class="rpg-card">
            <h3><i class="fas fa-edit"></i> 技能樹編輯器</h3>
            <p>視覺化編輯技能節點、位置與連結關係。</p>
            <div class="mt-md">
                <a href="{% url 'engineer_rpg:skill_tree_editor' %}" class="rpg-btn rpg-btn-primary">
                    進入編輯器
                </a>
            </div>
        </div>

        <!-- 課程管理 -->
        <div class="rpg-card">
            <h3><i class="fas fa-book"></i> 課程管理</h3>
            <p>管理與技能關聯的學習課程內容。</p>
            <div class="mt-md">
                <a href="{% url 'engineer_rpg:course_management' %}" class="rpg-btn">
                    管理課程
                </a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
