{% extends 'EngineerRPG/base.html' %}
{% load static %}

{% block title %}編輯公告 | 監造冒險者公會{% endblock %}

{% block content %}
<div class="rpg-container fade-in">
    <!-- 頁面標題 -->
    <div class="mb-lg">
        <h2 class="rpg-title mb-xs">
            <i class="fas fa-edit"></i> 編輯公告
        </h2>
        <div class="rpg-breadcrumbs">
            <a href="{% url 'engineer_rpg:guild_dashboard' %}" style="color: #FFD700; text-decoration: none;">公會大廳</a>
            <span>>></span>
            <a href="{% url 'engineer_rpg:guild_post_detail' post.id %}"
                style="color: #FFD700; text-decoration: none;">公告詳情</a>
            <span>>></span>
            <span style="color: #CCCCCC;">編輯公告</span>
        </div>
    </div>

    <div class="rpg-card" style="max-width: 800px; margin: 0 auto;">
        <div class="rpg-card-header">
            <h3 class="rpg-card-title">修改公告內容</h3>
            <p class="text-stone" style="font-size: 0.85rem; margin-top: 8px;">
                <i class="fas fa-info-circle"></i> 公告將顯示在公會大廳的公告欄中，請謹慎撰寫
            </p>
        </div>
        <div class="rpg-card-body">
            <form method="post" action="{% url 'engineer_rpg:guild_announcement_edit' post.id %}">
                {% csrf_token %}

                <div class="form-group mb-md">
                    <label class="form-label"
                        style="display: block; margin-bottom: 8px; color: var(--color-gold);">標題</label>
                    <input type="text" name="title" class="rpg-input" required placeholder="請輸入公告標題"
                        value="{{ post.title }}"
                        style="width: 100%; padding: 10px; background: rgba(0,0,0,0.2); border: 1px solid var(--color-border); color: var(--color-text); border-radius: 4px;">
                </div>

                <div class="form-group mb-xl">
                    <label class="form-label"
                        style="display: block; margin-bottom: 8px; color: var(--color-gold);">內容</label>
                    <textarea name="content" class="rpg-textarea" required rows="12" placeholder="請輸入公告內容..."
                        style="width: 100%; padding: 10px; background: rgba(0,0,0,0.2); border: 1px solid var(--color-border); color: var(--color-text); border-radius: 4px; line-height: 1.6;">{{ post.content }}</textarea>
                    <p class="text-stone mt-xs" style="font-size: 0.85rem;">
                        <i class="fas fa-info-circle"></i> 支援基本 Markdown 語法
                    </p>
                </div>

                <div class="flex flex-between">
                    <a href="{% url 'engineer_rpg:guild_post_detail' post.id %}" class="rpg-btn rpg-btn-outline">
                        <i class="fas fa-times"></i> 取消
                    </a>
                    <button type="submit" class="rpg-btn rpg-btn-primary">
                        <i class="fas fa-save"></i> 儲存變更
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
