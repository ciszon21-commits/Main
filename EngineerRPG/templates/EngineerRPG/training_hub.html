{% extends 'EngineerRPG/base.html' %}

{% block title %}試煉場 - 監造冒險者公會{% endblock %}

{% block extra_css %}
<style>
    /* 覆蓋連結預設顏色，確保卡片說明文字和圖示始終為白色 */
    .rpg-card p,
    .rpg-card i {
        color: #ffffff !important;
    }

    .rpg-card:link p,
    .rpg-card:visited p,
    .rpg-card:hover p,
    .rpg-card:active p,
    .rpg-card:link i,
    .rpg-card:visited i,
    .rpg-card:hover i,
    .rpg-card:active i {
        color: #ffffff !important;
    }

    /* 移除連結底線 */
    .rpg-card,
    .rpg-card:link,
    .rpg-card:visited,
    .rpg-card:hover,
    .rpg-card:active {
        text-decoration: none !important;
    }

    /* 確保標題也沒有底線 */
    .rpg-card h2 {
        text-decoration: none !important;
    }
</style>
{% endblock %}

{% block content %}
<div class="container py-lg">
    <!-- Header -->
    <div class="text-center mb-xl">
        <h1 class="text-3xl font-bold mb-sm">
            <i class="fas fa-khanda text-primary"></i> 試煉場
        </h1>
        <p class="text-stone">選擇你的試煉場，提升專業技能！</p>
    </div>

    <!-- Mode Selection Grid -->
    <div class="grid grid-3 gap-lg max-w-6xl mx-auto">

        <!-- Daily Trial -->
        <a href="{% url 'engineer_rpg:daily_trial_list' %}"
            class="rpg-card p-xl flex flex-col items-center justify-center text-center relative overflow-hidden group hover:-translate-y-2 transition-transform h-80">
            <div class="absolute inset-0 bg-white/5 group-hover:bg-white/10 transition-colors"></div>
            <div
                class="w-24 h-24 rounded-full bg-white/10 flex items-center justify-center mb-lg group-hover:scale-110 transition-transform">
                <i class="fas fa-calendar-day text-5xl text-white"></i>
            </div>
            <h2 class="text-2xl font-bold text-white mb-sm">每日副本</h2>
            <p class="text-white group-hover:text-white transition-colors">每日隨機挑戰，獲取穩定經驗值</p>
            <div
                class="absolute bottom-0 left-0 w-full h-1 bg-white/30 transform scale-x-0 group-hover:scale-x-100 transition-transform">
            </div>
        </a>

        <!-- Dungeon Challenge -->
        <div
            class="rpg-card p-xl flex flex-col items-center justify-center text-center relative overflow-hidden opacity-50 cursor-not-allowed h-80">
            <div class="w-24 h-24 rounded-full bg-white/10 flex items-center justify-center mb-lg">
                <i class="fas fa-dungeon text-5xl text-stone"></i>
            </div>
            <h2 class="text-2xl font-bold text-stone mb-sm">地下城</h2>
            <p class="text-stone text-sm">主題式副本，攻略特定領域知識 (Coming Soon)</p>
            <i class="fas fa-lock absolute top-4 right-4 text-stone/50 text-xl"></i>
        </div>

        <!-- Tower of Trials -->
        <div
            class="rpg-card p-xl flex flex-col items-center justify-center text-center relative overflow-hidden opacity-50 cursor-not-allowed h-80">
            <div class="w-24 h-24 rounded-full bg-white/10 flex items-center justify-center mb-lg">
                <i class="fas fa-tower-observation text-5xl text-stone"></i>
            </div>
            <h2 class="text-2xl font-bold text-stone mb-sm">試煉之塔</h2>
            <p class="text-stone text-sm">層層挑戰極限 (Coming Soon)</p>
            <i class="fas fa-lock absolute top-4 right-4 text-stone/50 text-xl"></i>
        </div>

    </div>
</div>
{% endblock %}
