{% extends 'EngineerRPG/base.html' %}

{% block title %}練功坊 - 監造冒險者公會{% endblock %}

{% block content %}
<div class="container py-lg">
    <!-- Header -->
    <div class="text-center mb-xl">
        <h1 class="text-3xl font-bold mb-sm">
            <i class="fas fa-dumbbell text-primary"></i> 練功坊
        </h1>
        <p class="text-stone">選擇你的試煉場，提升專業技能！</p>
    </div>

    <!-- Mode Selection Grid -->
    <div class="grid grid-3 gap-lg max-w-6xl mx-auto">

        <!-- Daily Trial -->
        <a href="{% url 'engineer_rpg:daily_trial_list' %}"
            class="rpg-card p-xl flex flex-col items-center justify-center text-center relative overflow-hidden group hover:-translate-y-2 transition-transform h-80">
            <div class="absolute inset-0 bg-primary/5 group-hover:bg-primary/10 transition-colors"></div>
            <div
                class="w-24 h-24 rounded-full bg-primary/20 flex items-center justify-center mb-lg group-hover:scale-110 transition-transform">
                <i class="fas fa-calendar-day text-5xl text-primary"></i>
            </div>
            <h2 class="text-2xl font-bold text-white mb-sm">每日副本</h2>
            <p class="text-stone group-hover:text-white transition-colors">每日隨機挑戰，獲取穩定經驗值</p>
            <div
                class="absolute bottom-0 left-0 w-full h-1 bg-primary transform scale-x-0 group-hover:scale-x-100 transition-transform">
            </div>
        </a>

        <!-- Dungeon Challenge -->
        <a href="{% url 'engineer_rpg:dungeon_list' %}"
            class="rpg-card p-xl flex flex-col items-center justify-center text-center relative overflow-hidden group hover:-translate-y-2 transition-transform h-80">
            <div class="absolute inset-0 bg-secondary/5 group-hover:bg-secondary/10 transition-colors"></div>
            <div
                class="w-24 h-24 rounded-full bg-secondary/20 flex items-center justify-center mb-lg group-hover:scale-110 transition-transform">
                <i class="fas fa-dungeon text-5xl text-secondary"></i>
            </div>
            <h2 class="text-2xl font-bold text-white mb-sm">地下城挑戰</h2>
            <p class="text-stone group-hover:text-white transition-colors">主題式副本，攻略特定領域知識</p>
            <div
                class="absolute bottom-0 left-0 w-full h-1 bg-secondary transform scale-x-0 group-hover:scale-x-100 transition-transform">
            </div>
        </a>

        <!-- Tower of Trials -->
        <div
            class="rpg-card p-xl flex flex-col items-center justify-center text-center relative overflow-hidden opacity-50 cursor-not-allowed h-80">
            <div class="w-24 h-24 rounded-full bg-white/10 flex items-center justify-center mb-lg">
                <i class="fas fa-tower-observation text-5xl text-stone"></i>
            </div>
            <h2 class="text-2xl font-bold text-stone mb-sm">試煉之塔</h2>
            <p class="text-stone text-sm">層層挑戰極限 (Coming Soon)</p>
            <i class="fas fa-lock absolute top-4 right-4 text-stone/50 text-xl"></i>
        </div>

    </div>
</div>
{% endblock %}
