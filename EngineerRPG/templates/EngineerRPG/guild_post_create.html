{% extends 'EngineerRPG/base.html' %}
{% load static %}

{% block title %}發表文章 | 監造冒險者公會{% endblock %}

{% block content %}
<div class="rpg-container fade-in">
    <!-- 頁面標題 -->
    <div class="mb-lg">
        <h2 class="rpg-title mb-xs">
            <i class="fas fa-pen-nib"></i> 發表新文章
        </h2>
        <div class="rpg-breadcrumbs">
            <a href="{% url 'engineer_rpg:guild_dashboard' %}" style="color: #FFD700; text-decoration: none;">公會大廳</a>
            <span>>></span>
            <a href="{% url 'engineer_rpg:guild_exchange_list' %}"
                style="color: #FFD700; text-decoration: none;">交流區</a>
            <span>>></span>
            <span style="color: #CCCCCC;">發表文章</span>
        </div>
    </div>

    <div class="rpg-card" style="max-width: 800px; margin: 0 auto;">
        <div class="rpg-card-header">
            <h3 class="rpg-card-title">撰寫內容</h3>
        </div>
        <div class="rpg-card-body">
            <form method="post" action="{% url 'engineer_rpg:guild_post_create' %}">
                {% csrf_token %}

                <div class="form-group mb-md">
                    <label class="form-label"
                        style="display: block; margin-bottom: 8px; color: var(--color-gold);">標題</label>
                    <input type="text" name="title" class="rpg-input" required placeholder="請輸入標題"
                        style="width: 100%; padding: 10px; background: rgba(0,0,0,0.2); border: 1px solid var(--color-border); color: var(--color-text); border-radius: 4px;">
                </div>

                <div class="form-group mb-md">
                    <label class="form-label"
                        style="display: block; margin-bottom: 8px; color: var(--color-gold);">分類看板</label>
                    <select name="category" class="rpg-select" required
                        style="width: 100%; padding: 10px; background: rgba(0,0,0,0.4); border: 1px solid var(--color-border); color: var(--color-text); border-radius: 4px;">
                        <option value="" disabled selected style="background: #1a1a1a; color: #999;">請選擇分類</option>
                        {% for code, name in categories %}
                        <option value="{{ code }}" style="background: #1a1a1a; color: #e0e0e0; padding: 8px;">{{ name }}
                        </option>
                        {% endfor %}
                    </select>
                </div>

                <div class="form-group mb-xl">
                    <label class="form-label"
                        style="display: block; margin-bottom: 8px; color: var(--color-gold);">內容</label>
                    <textarea name="content" class="rpg-textarea" required rows="12" placeholder="請輸入文章內容..."
                        style="width: 100%; padding: 10px; background: rgba(0,0,0,0.2); border: 1px solid var(--color-border); color: var(--color-text); border-radius: 4px; line-height: 1.6;"></textarea>
                    <p class="text-stone mt-xs" style="font-size: 0.85rem;">
                        <i class="fas fa-info-circle"></i> 支援基本 Markdown 語法
                    </p>
                </div>

                <div class="flex flex-between">
                    <a href="{% url 'engineer_rpg:guild_exchange_list' %}" class="rpg-btn rpg-btn-outline">
                        <i class="fas fa-times"></i> 取消
                    </a>
                    <button type="submit" class="rpg-btn rpg-btn-primary">
                        <i class="fas fa-paper-plane"></i> 發布文章
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
