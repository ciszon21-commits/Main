{% extends 'EngineerRPG/base.html' %}
{% load static %}

{% block title %}選擇您的職業 - 監造冒險者公會{% endblock %}

{% block content %}
<div class="rpg-container" style="display: flex; justify-content: center; align-items: center; min-height: 80vh;">
    <div class="rpg-card" style="width: 100%; max-width: 1000px;">
        <h2 class="text-center mb-lg">
            <i class="fas fa-hat-wizard"></i> 選擇您的職業
        </h2>
        
        <p class="text-center mb-xl" style="color: var(--color-text-muted);">
            歡迎來到監造冒險者公會！<br>
            為了開始您的冒險，請先選擇一個職業。<br>
            這將決定您的技能樹與成長方向。
        </p>
        
        <form method="post" id="selectClassForm">
            {% csrf_token %}
            
            <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: var(--spacing-lg);">
                {% for char_class in character_classes %}
                <label class="class-selection-card" style="cursor: pointer;">
                    <input type="radio" name="character_class" value="{{ char_class.id }}" 
                        style="display: none;" onchange="updateSelection(this)" required>
                    <div class="class-card-content rpg-card" style="height: 100%; transition: all 0.3s; border: 2px solid transparent;">
                        <div class="text-center mb-md">
                            {% if char_class.code == 'CIVIL' %}
                            <i class="fas fa-hammer fa-3x" style="color: #e67e22;"></i>
                            {% elif char_class.code == 'ME' %}
                            <i class="fas fa-bolt fa-3x" style="color: #f1c40f;"></i>
                            {% elif char_class.code == 'SAFETY' %}
                            <i class="fas fa-shield-alt fa-3x" style="color: #2ecc71;"></i>
                            {% else %}
                            <i class="fas fa-user fa-3x"></i>
                            {% endif %}
                        </div>
                        <h3 class="text-center mb-sm">{{ char_class.name }}</h3>
                        <div class="text-center mb-md">
                            <span class="rpg-tag" style="background: rgba(255, 255, 255, 0.1); font-size: 0.8rem;">{{ char_class.get_code_display }}</span>
                        </div>
                        
                        <div class="mb-md" style="font-size: 0.95rem; text-align: left; padding: 0 10px;">
                            <p class="mb-sm">{{ char_class.description }}</p>
                            
                            <ul style="list-style-type: none; padding: 0; margin-top: 10px;">
                                {% if char_class.code == 'CIVIL' %}
                                <li class="mb-xs"><i class="fas fa-check text-success"></i> <strong>結構專精</strong>：擅長基礎建設與結構分析。</li>
                                <li class="mb-xs"><i class="fas fa-check text-success"></i> <strong>防禦優勢</strong>：擁有較高的耐久度與抗壓性。</li>
                                <li><i class="fas fa-check text-success"></i> <strong>適合風格</strong>：穩紮穩打，注重細節與規範。</li>
                                {% elif char_class.code == 'ME' %}
                                <li class="mb-xs"><i class="fas fa-check text-success"></i> <strong>系統整合</strong>：精通電力、給排水與消防系統。</li>
                                <li class="mb-xs"><i class="fas fa-check text-success"></i> <strong>靈活多變</strong>：能適應各種複雜的機電挑戰。</li>
                                <li><i class="fas fa-check text-success"></i> <strong>適合風格</strong>：邏輯清晰，善於解決動態問題。</li>
                                {% elif char_class.code == 'SAFETY' %}
                                <li class="mb-xs"><i class="fas fa-check text-success"></i> <strong>法規守護</strong>：熟知職安法規，守護團隊安全。</li>
                                <li class="mb-xs"><i class="fas fa-check text-success"></i> <strong>風險控制</strong>：擅長識別危害與預防事故。</li>
                                <li><i class="fas fa-check text-success"></i> <strong>適合風格</strong>：嚴謹細心，重視生命與標準程序。</li>
                                {% endif %}
                            </ul>
                        </div>
                    </div>
                </label>
                {% endfor %}
            </div>
            
            <div class="text-center mt-xl">
                <button type="submit" class="rpg-btn rpg-btn-primary" style="padding: 1rem 3rem; font-size: 1.2rem;">
                    <i class="fas fa-check-circle"></i> 確認選擇
                </button>
            </div>
        </form>
    </div>
</div>

<style>
    .class-selection-card input:checked + .class-card-content {
        border-color: var(--color-primary);
        background: rgba(212, 175, 55, 0.1);
        transform: translateY(-5px);
        box-shadow: 0 5px 15px rgba(212, 175, 55, 0.3);
    }
    .class-card-content:hover {
        border-color: rgba(212, 175, 55, 0.5);
    }
</style>

<script>
    function updateSelection(input) {
        // Remove style from all inputs
        // CSS handles logic mostly via :checked
    }
</script>
{% endblock %}
