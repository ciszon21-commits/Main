{% extends 'EngineerRPG/base.html' %}
{% load static %}

{% block title %}新增使用者 | 管理中心{% endblock %}

{% block content %}
<div class="rpg-container fade-in">
    <!-- 頁面標題 -->
    <div class="text-center mb-xl">
        <h2 class="rpg-title">
            <i class="fas fa-user-plus"></i> 新增使用者
        </h2>
        <p class="text-stone">創建新的冒險者帳號</p>
    </div>

    <!-- 返回按鈕 -->
    <div class="mb-lg">
        <a href="{% url 'engineer_rpg:user_management' %}" class="rpg-btn rpg-btn-secondary">
            <i class="fas fa-arrow-left"></i> 返回使用者列表
        </a>
    </div>

    <!-- 表單 -->
    <div class="rpg-card">
        <div class="rpg-card-header">
            <h3 class="rpg-card-title"><i class="fas fa-edit"></i> 使用者資訊</h3>
        </div>
        <div class="rpg-card-body">
            <form method="post" action="{% url 'engineer_rpg:create_user' %}">
                {% csrf_token %}

                <div class="form-grid">
                    <!-- 使用者名稱 -->
                    <div class="form-group">
                        <label for="username" class="form-label">
                            使用者名稱 <span class="text-danger">*</span>
                        </label>
                        <input type="text" id="username" name="username" class="form-input" required
                            placeholder="請輸入使用者名稱">
                        <small class="form-hint">用於登入系統，不可重複</small>
                    </div>

                    <!-- 密碼 -->
                    <div class="form-group">
                        <label for="password" class="form-label">
                            密碼 <span class="text-danger">*</span>
                        </label>
                        <input type="password" id="password" name="password" class="form-input" required
                            placeholder="請輸入密碼">
                        <small class="form-hint">建議至少 8 個字元</small>
                    </div>

                    <!-- 員工編號 -->
                    <div class="form-group">
                        <label for="employee_id" class="form-label">
                            員工編號 <span class="text-danger">*</span>
                        </label>
                        <input type="text" id="employee_id" name="employee_id" class="form-input" required
                            placeholder="請輸入員工編號">
                        <small class="form-hint">唯一識別碼，不可重複</small>
                    </div>

                    <!-- Email -->
                    <div class="form-group">
                        <label for="email" class="form-label">
                            Email
                        </label>
                        <input type="email" id="email" name="email" class="form-input"
                            placeholder="請輸入 Email（選填）">
                    </div>

                    <!-- 職業 -->
                    <div class="form-group">
                        <label for="character_class" class="form-label">
                            職業 <span class="text-danger">*</span>
                        </label>
                        <select id="character_class" name="character_class" class="form-select" required>
                            <option value="">請選擇職業</option>
                            {% for char_class in character_classes %}
                            <option value="{{ char_class.id }}">{{ char_class.name }}</option>
                            {% endfor %}
                        </select>
                    </div>

                    <!-- 角色 -->
                    <div class="form-group">
                        <label for="role" class="form-label">
                            角色 <span class="text-danger">*</span>
                        </label>
                        <select id="role" name="role" class="form-select" required>
                            {% for value, label in role_choices %}
                            <option value="{{ value }}" {% if value == 'ADVENTURER' %}selected{% endif %}>
                                {{ label }}
                            </option>
                            {% endfor %}
                        </select>
                        <small class="form-hint">預設為「冒險者」</small>
                    </div>
                </div>

                <!-- 提交按鈕 -->
                <div class="form-actions">
                    <button type="submit" class="rpg-btn rpg-btn-primary">
                        <i class="fas fa-check"></i> 創建使用者
                    </button>
                    <a href="{% url 'engineer_rpg:user_management' %}" class="rpg-btn rpg-btn-outline">
                        <i class="fas fa-times"></i> 取消
                    </a>
                </div>
            </form>
        </div>
    </div>
</div>

<style>
    .form-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
        gap: var(--spacing-lg);
        margin-bottom: var(--spacing-xl);
    }

    .form-group {
        display: flex;
        flex-direction: column;
        gap: var(--spacing-xs);
    }

    .form-label {
        font-weight: bold;
        color: var(--color-gold);
        font-size: 0.95rem;
    }

    .form-input,
    .form-select {
        padding: var(--spacing-sm);
        background: rgba(0, 0, 0, 0.3);
        border: 1px solid var(--color-border);
        border-radius: 4px;
        color: var(--color-text);
        font-size: 1rem;
        transition: border-color 0.3s;
    }

    .form-input:focus,
    .form-select:focus {
        outline: none;
        border-color: var(--color-primary);
        box-shadow: 0 0 0 2px rgba(var(--rgb-primary), 0.2);
    }

    .form-hint {
        color: var(--color-stone);
        font-size: 0.85rem;
    }

    .text-danger {
        color: var(--color-danger, #e74c3c);
    }

    .form-actions {
        display: flex;
        gap: var(--spacing-md);
        justify-content: flex-start;
        padding-top: var(--spacing-lg);
        border-top: 1px solid rgba(255, 255, 255, 0.1);
    }
</style>
{% endblock %}
