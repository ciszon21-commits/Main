{% extends 'EngineerRPG/base.html' %}
{% load static %}

{% block title %}技能樹 - 監造冒險者公會{% endblock %}

{% block content %}
<div class="rpg-container">
    <div class="mb-lg">
        <h1 class="text-center">
            <i class="fas fa-project-diagram"></i>
            {{ profile.character_class.name }} 技能樹
        </h1>
        <p class="text-center" style="color: var(--color-secondary); font-size: 1.1rem;">
            完成技能學習，解鎖更多強大能力！
        </p>
    </div>

    <!-- 技能樹說明 -->
    <div class="rpg-card mb-lg">
        <div class="grid grid-4 gap-md text-center">
            <div>
                <div style="font-size: 1.5rem; color: var(--color-stone); margin-bottom: 0.5rem;">
                    <i class="fas fa-lock"></i>
                </div>
                <div style="font-weight: 600;">未解鎖</div>
                <div style="font-size: 0.85rem; color: var(--color-stone);">需完成前置技能</div>
            </div>
            <div>
                <div style="font-size: 1.5rem; color: var(--color-secondary); margin-bottom: 0.5rem;">
                    <i class="fas fa-book-open"></i>
                </div>
                <div style="font-weight: 600;">可學習</div>
                <div style="font-size: 0.85rem; color: var(--color-stone);">點擊開始學習</div>
            </div>
            <div>
                <div style="font-size: 1.5rem; color: var(--color-civil); margin-bottom: 0.5rem;">
                    <i class="fas fa-spinner"></i>
                </div>
                <div style="font-weight: 600;">學習中</div>
                <div style="font-size: 0.85rem; color: var(--color-stone);">繼續完成課程</div>
            </div>
            <div>
                <div style="font-size: 1.5rem; color: var(--color-safety); margin-bottom: 0.5rem;">
                    <i class="fas fa-check-circle"></i>
                </div>
                <div style="font-weight: 600;">已完成</div>
                <div style="font-size: 0.85rem; color: var(--color-stone);">獲得經驗值</div>
            </div>
        </div>
    </div>

    <!-- 視覺化技能樹 -->
    <div class="rpg-card"
        style="padding: 0; overflow: hidden; background: #1a1a1a; border: 2px solid var(--color-stone);">
        <div id="skill-tree-container" style="min-height: 800px; position: relative; overflow: auto; cursor: grab;">
            <svg id="skill-tree-svg" width="100%" height="800">
                <defs>
                    <marker id="arrow-head" markerWidth="7" markerHeight="4" refX="7" refY="2" orient="auto">
                        <polygon points="0 0, 7 2, 0 4" fill="var(--color-stone)" />
                    </marker>
                    <marker id="arrow-head-completed" markerWidth="7" markerHeight="4" refX="7" refY="2" orient="auto">
                        <polygon points="0 0, 7 2, 0 4" fill="#ffffff" />
                    </marker>
                    <marker id="arrow-head-available" markerWidth="7" markerHeight="4" refX="7" refY="2" orient="auto">
                        <polygon points="0 0, 7 2, 0 4" fill="var(--color-secondary)" />
                    </marker>
                </defs>
            </svg>
        </div>
    </div>

    <!-- JSON 數據儲存區 -->
    <script id="skill-tree-data-json" type="application/json">
        {{ skill_tree_json|safe }}
    </script>
</div>

<style>
    #skill-tree-container {
        background-color: #0c0c0c;
        background-image:
            linear-gradient(rgba(255, 255, 255, 0.03) 1px, transparent 1px),
            linear-gradient(90deg, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
        background-size: 50px 50px;
    }

    .skill-node-group {
        cursor: pointer;
        transition: all 0.2s ease;
    }

    .skill-node-group:hover .skill-node-frame {
        stroke: var(--color-secondary);
        stroke-width: 2px;
        filter: drop-shadow(0 0 8px var(--color-secondary));
    }

    .skill-node-frame {
        fill: #1e1e1e;
        stroke: #444;
        stroke-width: 2px;
        rx: 4px;
        transition: all 0.3s ease;
    }

    /* 節點類型樣式 */
    .skill-node-ROOT .skill-node-frame {
        stroke: var(--color-safety);
    }

    .skill-node-CORE .skill-node-frame {
        stroke: var(--color-civil);
    }

    .skill-node-ADVANCED .skill-node-frame {
        stroke: var(--color-me);
    }

    /* 狀態樣式 */
    .status-LOCKED .skill-node-frame {
        fill: #111;
        stroke: #333;
        opacity: 0.8;
    }

    .status-LOCKED text {
        filter: grayscale(100%) brightness(0.5);
    }

    .status-AVAILABLE .skill-node-frame {
        stroke: var(--color-secondary);
        animation: pulse-border 2s infinite;
    }

    .status-IN_PROGRESS .skill-node-frame {
        stroke: var(--color-civil);
        stroke-dasharray: 4, 2;
        animation: rotate-dash 5s linear infinite;
    }

    .status-COMPLETED .skill-node-frame {
        fill: #252525;
        stroke-width: 3px;
    }

    .status-COMPLETED.skill-node-ROOT .skill-node-frame {
        stroke: var(--color-safety);
    }

    .status-COMPLETED.skill-node-CORE .skill-node-frame {
        stroke: var(--color-civil);
    }

    .status-COMPLETED.skill-node-ADVANCED .skill-node-frame {
        stroke: var(--color-me);
    }

    .skill-connection {
        fill: none;
        stroke: #444;
        stroke-width: 2px;
        marker-end: url(#arrow-head);
        transition: all 0.5s ease;
    }

    .skill-connection.completed {
        stroke: #ffffff;
        marker-end: url(#arrow-head-completed);
    }

    .skill-connection.available,
    .skill-connection.in-progress {
        stroke: var(--color-secondary);
        stroke-dasharray: 5, 5;
        animation: dash-flow 30s linear infinite;
        marker-end: url(#arrow-head-available);
    }

    .group-box {
        fill: rgba(255, 255, 255, 0.03);
        stroke: #666;
        stroke-width: 1px;
        stroke-dasharray: 4 4;
        rx: 10;
    }

    .skill-text-name {
        fill: #e0e0e0;
        font-size: 14px;
        font-weight: bold;
        text-anchor: middle;
        pointer-events: none;
    }

    @keyframes pulse-border {
        0% {
            stroke-opacity: 1;
        }

        50% {
            stroke-opacity: 0.5;
        }

        100% {
            stroke-opacity: 1;
        }
    }

    @keyframes rotate-dash {
        to {
            stroke-dashoffset: -12;
        }
    }

    @keyframes dash-flow {
        to {
            stroke-dashoffset: -1000;
        }
    }
</style>

<script>
    // 定義主繪圖函數
    function drawSkillTree() {
        // 從 Script 標籤獲取資料 (更安全的方式)
        const dataScript = document.getElementById('skill-tree-data-json');
        let skillTreeData = [];

        if (dataScript) {
            try {
                skillTreeData = JSON.parse(dataScript.textContent);
            } catch (e) {
                console.error('Failed to parse skill tree JSON:', e);
            }
        }

        const svg = document.getElementById('skill-tree-svg');
        const container = document.getElementById('skill-tree-container');

        // 如果沒有資料或元素，直接返回
        if (!skillTreeData || !svg || !container) {
            console.error('Missing data or SVG container');
            return;
        }

        // 清空 SVG（保留 defs，這很重要）
        // 我們不使用 innerHTML = ''，而是移除除了 defs 以外的所有子元素
        const childNodes = Array.from(svg.childNodes);
        childNodes.forEach(node => {
            if (node.tagName !== 'defs' && node.tagName !== 'DEFS') {
                svg.removeChild(node);
            }
        });

        // 設定參數
        const CONFIG = {
            nodeWidth: 60,
            nodeHeight: 60,
            padding: 50  // 畫布邊距
        };

        // 1. 資料處理：直接使用資料庫座標
        const positions = {};

        skillTreeData.forEach(item => {
            positions[item.skill.id] = {
                x: (item.skill.position_x || 0) + CONFIG.padding,
                y: (item.skill.position_y || 0) + CONFIG.padding,
                item: item
            };
        });

        // 定義單位間距與文字避讓判定
        const yCoordinates = [...new Set(Object.values(positions).map(p => p.y))].sort((a, b) => a - b);
        let yUnit = 100; // 預設值
        if (yCoordinates.length > 1) {
            yUnit = yCoordinates[1] - yCoordinates[0];
        }

        // 檢查節點是否有文字避讓需求 (同一 X 軸上下有相鄰節點)
        const nodeNeedsLeftEntry = {};
        skillTreeData.forEach(item => {
            const node = item.skill;
            const neighbors = skillTreeData.filter(other =>
                other.skill.id !== node.id &&
                Math.abs(other.skill.position_x - node.position_x) < 5 && // 相同 X
                Math.abs(other.skill.position_y - node.position_y) < yUnit * 1.5 // 緊鄰
            );
            if (neighbors.length > 0) {
                nodeNeedsLeftEntry[node.id] = true;
            }
        });

        // --- 識別與生成符合原則的群組 ---
        const visualGroups = [];
        const drawnConnections = new Set();

        // 1. 收集每個子節點「按類型分類」後的潛在群組 (原則 1: 僅區分 ROOT 與 其他)
        const childToPotentialGroups = {};
        skillTreeData.forEach(child => {
            const childId = child.skill.id;
            // 原則 1: 僅區分 ROOT 與 其他 (CORE/ADVANCED 合併)
            const parentsByGroupType = { 'ROOT': [], 'OTHER': [] };

            child.skill.parent_skills.forEach(pid => {
                const p = positions[pid];
                if (p) {
                    const gType = p.item.skill.node_type === 'ROOT' ? 'ROOT' : 'OTHER';
                    parentsByGroupType[gType].push(pid);
                }
            });

            childToPotentialGroups[childId] = [];

            Object.entries(parentsByGroupType).forEach(([gType, pids]) => {
                if (pids.length < 2) return;

                // 找出最大的連續子集 (原則 2: X 相同、Y 連續、無路人)
                pids.sort((a, b) => positions[a].y - positions[b].y);

                let currentChunk = [pids[0]];
                for (let i = 1; i < pids.length; i++) {
                    const p1 = positions[pids[i - 1]];
                    const p2 = positions[pids[i]];

                    // 原則 2: 中間不得跨越其他的技能節點 (路人檢查)
                    // 只要是位於兩點之間且在同一 X 軸的節點，且不屬於當前父節點集合，就是路人
                    const hasTrespasser = skillTreeData.some(other => {
                        const op = positions[other.skill.id];
                        return Math.abs(op.x - p1.x) < 5 &&
                            op.y > p1.y + 5 &&
                            op.y < p2.y - 5 &&
                            !pids.includes(other.skill.id);
                    });

                    // 檢查 Y 是否相鄰 (150 為標準間距，容許較大範圍以應對自動佈局的位移)
                    // 如果中間沒有任何路人，我們可以放寬距離限制，將其視為同一組
                    const yDiff = p2.y - p1.y;
                    if (yDiff > 0 && yDiff <= 250 && !hasTrespasser) {
                        currentChunk.push(pids[i]);
                    } else {
                        if (currentChunk.length >= 2) {
                            childToPotentialGroups[childId].push({ pids: [...currentChunk], gType });
                        }
                        currentChunk = [pids[i]];
                    }
                }
                if (currentChunk.length >= 2) {
                    childToPotentialGroups[childId].push({ pids: currentChunk, gType });
                }
            });
        });

        // 2. 原則 4/5: 統計群組頻率並優化子群組提取
        const groupFrequency = {};
        Object.values(childToPotentialGroups).forEach(groupList => {
            groupList.forEach(g => {
                const key = g.pids.sort().join(',');
                groupFrequency[key] = (groupFrequency[key] || 0) + 1;
            });
        });

        const finalGroupsMap = {};
        Object.entries(childToPotentialGroups).forEach(([childId, groups]) => {
            groups.forEach(g => {
                const pids = g.pids.sort();

                // 原則 4: 尋找被更多子節點使用的子集
                let finalPids = [...pids];
                if (groupFrequency[pids.join(',')] === 1) {
                    for (let otherKey in groupFrequency) {
                        if (groupFrequency[otherKey] > 1) {
                            const subset = otherKey.split(',').map(Number);
                            if (subset.every(val => pids.includes(val))) {
                                finalPids = subset;
                                break;
                            }
                        }
                    }
                }

                const key = `${g.gType}-${finalPids.join(',')}`;
                if (!finalGroupsMap[key]) {
                    const nodes = finalPids.map(id => positions[id]);
                    const minY = Math.min(...nodes.map(n => n.y));
                    const maxY = Math.max(...nodes.map(n => n.y));
                    const padding = 20;
                    finalGroupsMap[key] = {
                        parents: finalPids,
                        gType: g.gType,
                        children: [],
                        x: nodes[0].x,
                        width: CONFIG.nodeWidth + padding * 2,
                        height: (maxY - minY) + CONFIG.nodeHeight + padding * 2,
                        visualX: nodes[0].x - CONFIG.nodeWidth / 2 - padding,
                        visualY: minY - CONFIG.nodeHeight / 2 - padding
                    };
                }
                if (!finalGroupsMap[key].children.includes(Number(childId))) {
                    finalGroupsMap[key].children.push(Number(childId));
                }
            });
        });

        const visualGroupsData = Object.values(finalGroupsMap);

        // 繪製 SVG 元素
        // -------------------------------------------------------------------

        // 設定 SVG 最終尺寸
        const allX = Object.values(positions).map(p => p.x);
        const allY = Object.values(positions).map(p => p.y);
        const maxX = allX.length > 0 ? Math.max(...allX) : 800;
        const maxY = allY.length > 0 ? Math.max(...allY) : 800;
        svg.setAttribute('width', maxX + CONFIG.padding + CONFIG.nodeWidth);
        svg.setAttribute('height', maxY + CONFIG.padding + CONFIG.nodeHeight);

        // 1. 繪製 Group 框 (放在底層)
        visualGroupsData.forEach(g => {
            const rect = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
            rect.setAttribute('x', g.visualX);
            rect.setAttribute('y', g.visualY);
            rect.setAttribute('width', g.width);
            rect.setAttribute('height', g.height);
            rect.setAttribute('class', 'group-box');
            svg.insertBefore(rect, svg.firstChild.nextSibling);
        });

        // 2. 繪製連接線
        skillTreeData.forEach(item => {
            const childId = item.skill.id;
            const childPos = positions[childId];
            if (!childPos) return;

            // 判斷哪些父節點已經透過 Group 處理了
            const handledParentIds = new Set();
            visualGroupsData.forEach(g => {
                if (g.children.includes(childId)) {
                    const connKey = `group-${g.gType}-${g.parents.join(',')}-to-${childId}`;
                    if (!drawnConnections.has(connKey)) {
                        // 連線出發點：群組框右側
                        let sx = g.visualX + g.width;
                        let sy = g.visualY + g.height / 2;

                        // 連線進入點：子節點左側 (由用戶指令要求)
                        let ex = childPos.x - CONFIG.nodeWidth / 2;
                        let ey = childPos.y;

                        drawSmartLine(svg, sx, sy, ex, ey, item.status, 'RIGHT', 'LEFT');
                        drawnConnections.add(connKey);
                    }
                    g.parents.forEach(pid => handledParentIds.add(pid));
                }
            });

            // 處理剩餘的單獨連線 (原則 4: 不在群組中的父節點單獨連線)
            item.skill.parent_skills.forEach(pid => {
                if (handledParentIds.has(pid)) return; // 已經由群組連線涵蓋

                const parentPos = positions[pid];
                if (parentPos) {
                    let sx, sy, ex, ey, exitDir = 'RIGHT', entryDir = 'LEFT';

                    if (Math.abs(parentPos.x - childPos.x) < 10) {
                        // 禁止同 X 軸繼承連線 (後端亦會落實此規則，此處為前端防禦)
                        // 若真的不幸重疊，依然使用右出左進以符合使用者最高原則
                        sx = parentPos.x + CONFIG.nodeWidth / 2;
                        sy = parentPos.y;
                        ex = childPos.x - CONFIG.nodeWidth / 2;
                        ey = childPos.y;
                        exitDir = 'RIGHT'; entryDir = 'LEFT';
                    } else {
                        sx = parentPos.x + CONFIG.nodeWidth / 2;
                        sy = parentPos.y;
                        ex = childPos.x - CONFIG.nodeWidth / 2;
                        ey = childPos.y;
                        exitDir = 'RIGHT'; entryDir = 'LEFT';
                    }
                    drawSmartLine(svg, sx, sy, ex, ey, item.status, exitDir, entryDir);
                }
            });
        });

        // 4. 繪製節點
        Object.values(positions).forEach(pos => {
            const item = pos.item;
            const g = document.createElementNS('http://www.w3.org/2000/svg', 'g');
            g.setAttribute('class', `skill-node-group status-${item.status} skill-node-${item.skill.node_type}`);
            g.setAttribute('transform', `translate(${pos.x}, ${pos.y})`); // Use transform for easier positioning
            g.style.cursor = 'pointer';

            g.addEventListener('click', () => {
                window.location.href = `/rpg/skill/${item.skill.id}/`;
            });

            // 節點框
            const frame = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
            frame.setAttribute('x', -CONFIG.nodeWidth / 2);
            frame.setAttribute('y', -CONFIG.nodeHeight / 2);
            frame.setAttribute('width', CONFIG.nodeWidth);
            frame.setAttribute('height', CONFIG.nodeHeight);
            frame.setAttribute('class', 'skill-node-frame');
            g.appendChild(frame);

            // 圖示
            const iconText = document.createElementNS('http://www.w3.org/2000/svg', 'text');
            iconText.setAttribute('y', 5);
            iconText.setAttribute('text-anchor', 'middle');
            iconText.setAttribute('fill', item.status === 'LOCKED' ? '#555' : '#fff');
            iconText.setAttribute('font-size', '24px');
            iconText.style.pointerEvents = 'none';

            let iconChar = '⚔️';
            if (item.skill.node_type === 'ROOT') iconChar = '🌱';
            else if (item.skill.name.includes('無人機')) iconChar = '🚁';
            else if (item.skill.name.includes('測繪')) iconChar = '🗺️';
            else if (item.skill.name.includes('BIM')) iconChar = '🏢';
            else if (item.skill.name.includes('熱影像')) iconChar = '🌡️';
            else if (item.skill.name.includes('MR')) iconChar = '👓';
            else if (item.skill.name.includes('氣體')) iconChar = '🌫️';
            else if (item.skill.name.includes('噪音')) iconChar = '🔊';
            else if (item.skill.name.includes('VR')) iconChar = '🥽';
            else if (item.skill.name.includes('環景')) iconChar = '📷';

            iconText.textContent = iconChar;
            g.appendChild(iconText);

            // 名稱標籤
            const nameStr = item.skill.name;
            const MAX_CHARS_PER_LINE = 6;
            let lines = [];
            for (let i = 0; i < nameStr.length; i += MAX_CHARS_PER_LINE) {
                lines.push(nameStr.substring(i, i + MAX_CHARS_PER_LINE));
            }
            const bgHeight = 20 + (lines.length - 1) * 16;

            const textBg = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
            textBg.setAttribute('x', -50);
            textBg.setAttribute('y', CONFIG.nodeHeight / 2 + 5);
            textBg.setAttribute('width', 100);
            textBg.setAttribute('height', bgHeight);
            textBg.setAttribute('rx', 4);
            textBg.setAttribute('fill', 'rgba(0,0,0,0.8)');
            g.appendChild(textBg);

            const text = document.createElementNS('http://www.w3.org/2000/svg', 'text');
            text.setAttribute('class', 'skill-text-name');
            lines.forEach((lineText, idx) => {
                const tspan = document.createElementNS('http://www.w3.org/2000/svg', 'tspan');
                tspan.setAttribute('x', 0);
                tspan.setAttribute('y', CONFIG.nodeHeight / 2 + 19 + idx * 16);
                tspan.setAttribute('text-anchor', 'middle');
                tspan.textContent = lineText;
                text.appendChild(tspan);
            });
            g.appendChild(text);

            svg.appendChild(g);
        });

        // 拖曳功能
        let isDown = false;
        let startX;
        let scrollLeft;
        let startY;
        let scrollTop;

        container.addEventListener('mousedown', (e) => {
            isDown = true;
            container.classList.add('active');
            startX = e.pageX - container.offsetLeft;
            scrollLeft = container.scrollLeft;
            startY = e.pageY - container.offsetTop;
            scrollTop = container.scrollTop;
            container.style.cursor = 'grabbing';
        });

        container.addEventListener('mouseleave', () => {
            isDown = false;
            container.style.cursor = 'grab';
        });

        container.addEventListener('mouseup', () => {
            isDown = false;
            container.style.cursor = 'grab';
        });

        container.addEventListener('mousemove', (e) => {
            if (!isDown) return;
            e.preventDefault();
            const x = e.pageX - container.offsetLeft;
            const walkX = (x - startX) * 2;
            container.scrollLeft = scrollLeft - walkX;

            const y = e.pageY - container.offsetTop;
            const walkY = (y - startY) * 2;
            container.scrollTop = scrollTop - walkY;
        });
    }

    function drawSmartLine(svg, x1, y1, x2, y2, status, exitDir, entryDir) {
        const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
        let d = '';

        if (exitDir === 'BOTTOM' && entryDir === 'TOP') {
            // 直線向下
            d = `M ${x1} ${y1} L ${x2} ${y2}`;
        } else if (exitDir === 'TOP' && entryDir === 'BOTTOM') {
            // 直線向上
            d = `M ${x1} ${y1} L ${x2} ${y2}`;
        } else if (exitDir === 'RIGHT' && entryDir === 'LEFT') {
            // 水平階梯線：使用固定通道 (Lane) 概念，避免壓到中間節點
            // 轉折點 X 座標公式：父節點中心 + 125
            // 由於 x1 是父節點右緣 (中心 + 30)，所以轉折點 = x1 + 95
            const midX = x1 + 95;
            d = `M ${x1} ${y1} L ${midX} ${y1} L ${midX} ${y2} L ${x2} ${y2}`;
        } else {
            // 後備：一般折線
            const midX = x1 + 95;
            d = `M ${x1} ${y1} L ${midX} ${y1} L ${midX} ${y2} L ${x2} ${y2}`;
        }

        path.setAttribute('d', d);
        let className = 'skill-connection';
        if (status === 'COMPLETED') className += ' completed';
        else if (status === 'AVAILABLE' || status === 'IN_PROGRESS') className += ' available';
        path.setAttribute('class', className);

        svg.insertBefore(path, svg.firstChild);
    }

    // 頁面載入後繪製
    document.addEventListener('DOMContentLoaded', drawSkillTree);
    window.addEventListener('resize', drawSkillTree);
</script>
{% endblock %}
