{% extends "SinoTemplate/base.html" %}
{% load static %}

{% block title %}風玫瑰圖繪製工具 | Wind Rose Chart{% endblock %}

{% block head_block %}
<style>
    :root {
        --primary-gradient: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
        --accent-color: #00d4aa;
        --surface-dark: #0f1724;
        --surface-card: rgba(30, 42, 66, 0.95);
        --text-primary: #ffffff;
        --text-secondary: rgba(255, 255, 255, 0.7);
        --border-glow: rgba(0, 212, 170, 0.3);
    }

    .cwa-container {
        min-height: 100vh;
        background: var(--surface-dark);
        padding: 2rem;
    }

    .page-header {
        text-align: center;
        margin-bottom: 2rem;
        padding: 2rem;
        background: var(--primary-gradient);
        border-radius: 16px;
        box-shadow: 0 4px 20px rgba(74, 144, 217, 0.3);
    }

    .page-header h1 {
        color: #ffffff;
        font-size: 2.5rem;
        font-weight: 700;
        margin-bottom: 0.5rem;
    }

    .page-header p {
        color: var(--text-secondary);
        font-size: 1.1rem;
    }

    .control-panel {
        background: var(--surface-card);
        border-radius: 16px;
        padding: 1.5rem;
        margin-bottom: 2rem;
        border: 1px solid var(--border-glow);
    }

    .control-row {
        display: flex;
        flex-wrap: wrap;
        gap: 1rem;
        align-items: flex-end;
    }

    .control-group {
        flex: 1;
        min-width: 150px;
    }

    .control-group label {
        display: block;
        color: var(--text-secondary);
        font-size: 1.25rem;
        font-weight: bold;
        margin-bottom: 0.5rem;
    }

    .control-group select,
    .control-group input[type="text"],
    .control-group input[type="number"] {
        width: 100%;
        padding: 0.75rem 1rem;
        background: rgba(255, 255, 255, 0.05);
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 8px;
        color: var(--text-primary);
        font-size: 1.25rem;
    }

    .control-group select:focus,
    .control-group input[type="text"]:focus,
    .control-group input[type="number"]:focus {
        outline: none;
        border-color: var(--accent-color);
        box-shadow: 0 0 10px var(--border-glow);
    }

    .control-group select option {
        background: var(--surface-dark);
        color: var(--text-primary);
    }

    .control-group input[type="text"]::placeholder {
        color: var(--text-secondary);
        opacity: 0.7;
    }

    .btn-primary-custom {
        background: linear-gradient(135deg, var(--accent-color), #00a88a);
        border: none;
        padding: 0.75rem 2rem;
        border-radius: 8px;
        color: #fff;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.3s ease;
    }

    .btn-primary-custom:hover {
        transform: translateY(-2px);
        box-shadow: 0 8px 25px rgba(0, 212, 170, 0.4);
    }

    .btn-secondary-custom {
        background: rgba(255, 255, 255, 0.1);
        border: 1px solid rgba(255, 255, 255, 0.2);
        padding: 0.75rem 2rem;
        border-radius: 8px;
        color: var(--text-primary);
        cursor: pointer;
    }

    .station-info {
        background: linear-gradient(135deg, rgba(30, 60, 114, 0.8), rgba(42, 82, 152, 0.8));
        border-radius: 16px;
        padding: 1.5rem;
        margin-bottom: 2rem;
        border: 1px solid var(--border-glow);
    }

    .station-info h3 {
        color: var(--accent-color);
        font-size: 1.5rem;
        margin-bottom: 1rem;
    }

    .station-details {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
        gap: 1rem;
    }

    .station-detail-item .label {
        color: var(--text-secondary);
        font-size: 0.8rem;
    }

    .station-detail-item .value {
        color: var(--text-primary);
        font-size: 1rem;
        font-weight: 500;
    }

    .data-table-container {
        background: var(--surface-card);
        border-radius: 16px;
        padding: 1.5rem;
        border: 1px solid var(--border-glow);
        overflow-x: auto;
    }

    .data-table-container h3 {
        color: var(--text-primary);
        font-size: 1.25rem;
        margin-bottom: 1rem;
    }

    .data-table {
        width: 100%;
        border-collapse: collapse;
    }

    .data-table thead {
        background: linear-gradient(135deg, #1e3c72, #2a5298);
    }

    .data-table th {
        padding: 1rem 0.75rem;
        text-align: center;
        color: var(--text-primary);
        font-weight: 600;
        border-bottom: 2px solid var(--accent-color);
    }

    .data-table tbody tr {
        border-bottom: 1px solid rgba(255, 255, 255, 0.05);
    }

    .data-table tbody tr:hover {
        background: rgba(0, 212, 170, 0.1);
    }

    .data-table td {
        padding: 0.875rem 0.75rem;
        text-align: center;
        color: var(--text-secondary);
    }

    .data-table td:first-child {
        color: var(--accent-color);
        font-weight: 600;
    }

    .temp-high {
        color: #ff6b6b !important;
    }

    .temp-low {
        color: #4ecdc4 !important;
    }

    .empty-state {
        text-align: center;
        padding: 4rem 2rem;
        color: var(--text-secondary);
    }

    .loading-overlay {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background: rgba(15, 23, 36, 0.9);
        display: none;
        justify-content: center;
        align-items: center;
        z-index: 9999;
        flex-direction: column;
        gap: 1rem;
    }

    .loading-overlay.active {
        display: flex;
    }

    .spinner {
        width: 60px;
        height: 60px;
        border: 4px solid rgba(255, 255, 255, 0.1);
        border-top-color: var(--accent-color);
        border-radius: 50%;
        animation: spin 1s linear infinite;
    }

    @keyframes spin {
        to {
            transform: rotate(360deg);
        }
    }

    .loading-text {
        color: var(--text-primary);
        font-size: 1.25rem;
    }

    .toast {
        position: fixed;
        bottom: 2rem;
        right: 2rem;
        padding: 1rem 1.5rem;
        background: var(--surface-card);
        border-radius: 8px;
        border-left: 4px solid var(--accent-color);
        color: var(--text-primary);
        box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
        transform: translateX(120%);
        transition: transform 0.3s ease;
        z-index: 9999;
    }

    .toast.show {
        transform: translateX(0);
    }

    .toast.error {
        border-left-color: #ff6b6b;
    }

    .stats-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
        gap: 1rem;
        margin-bottom: 2rem;
    }

    .stat-card {
        background: var(--surface-card);
        border-radius: 12px;
        padding: 1.25rem;
        border: 1px solid var(--border-glow);
        text-align: center;
    }

    .stat-icon {
        font-size: 2rem;
        margin-bottom: 0.5rem;
    }

    .stat-value {
        font-size: 1.75rem;
        font-weight: 700;
        color: var(--accent-color);
    }

    .stat-label {
        color: var(--text-secondary);
        font-size: 0.875rem;
    }

    .wind-rose-container {
        background: var(--surface-card);
        border-radius: 16px;
        padding: 1.5rem;
        border: 1px solid var(--border-glow);
    }

    .wind-rose-container h3 {
        color: var(--text-primary);
        font-size: 1.5rem;
        margin-bottom: 1rem;
        text-align: center;
    }

    .chart-placeholder {
        text-align: center;
        padding: 3rem;
        color: var(--text-secondary);
    }

    .chart-placeholder p {
        font-size: 1.1rem;
    }

    .chart-info {
        margin-top: 1rem;
        padding: 1rem;
        background: #f0f0f0;
        border-radius: 8px;
        text-align: center;
    }

    .chart-info p {
        color: #333333;
        margin: 0.25rem 0;
    }

    .chart-info .highlight {
        color: #00a88a;
        font-weight: 600;
    }
</style>
{% endblock %}

{% block main_block %}
<div class="cwa-container">
    <div class="page-header">
        <h1>🌬️ 風玫瑰圖繪製工具</h1>

            </div>

            <div class="control-group"
                style="display: flex; align-items: center; justify-content: center; flex: 0 0 40px;">
                <span style="color: var(--text-secondary); font-size: 1.5rem;">→</span>
            </div>

            <div class="control-group" style="flex: 0 0 70px;">
                <label>結束年份</label>
                <input type="number" id="endYearInput" value="{{ selected_year }}" min="1980" max="2100"
                    placeholder="2025">
            </div>

            <div class="control-group" style="flex: 0 0 55px;">
                <label>結束月份</label>

    <!-- 季度圖表容器 -->
    <div class="quarter-charts-container"

        <div class="wind-rose-container" id="loadingQ1"
            style="display: none; width: fit-content; background: #ffffff; flex-direction: column; align-items: center; padding: 20px; border-radius: 16px;">
            <div id="windRoseChartQ1" style="width: 1100px; height: 1160px;"></div>
            <div class="chart-footer" style="margin-top: 10px;">
                <button class="btn-primary-custom download-png" style="margin-right: 0.5rem;">📥 下載 PNG</button>
                <button class="btn-primary-custom download-jpeg">📥 下載 JPEG</button>
            </div>
        </div>
        <div class="wind-rose-container" id="loadingQ2"
            style="display: none; width: fit-content; background: #ffffff; flex-direction: column; align-items: center; padding: 20px; border-radius: 16px;">
            <div id="windRoseChartQ2" style="width: 1100px; height: 1160px;"></div>
            <div class="chart-footer" style="margin-top: 10px;">
                <button class="btn-primary-custom download-png" style="margin-right: 0.5rem;">📥 下載 PNG</button>
                <button class="btn-primary-custom download-jpeg">📥 下載 JPEG</button>
            </div>
        </div>
        <div class="wind-rose-container" id="loadingQ3"
            style="display: none; width: fit-content; background: #ffffff; flex-direction: column; align-items: center; padding: 20px; border-radius: 16px;">
            <div id="windRoseChartQ3" style="width: 1100px; height: 1160px;"></div>
            <div class="chart-footer" style="margin-top: 10px;">
                <button class="btn-primary-custom download-png" style="margin-right: 0.5rem;">📥 下載 PNG</button>
                <button class="btn-primary-custom download-jpeg">📥 下載 JPEG</button>
            </div>
        </div>
        <div class="wind-rose-container" id="loadingQ4"
            style="display: none; width: fit-content; background: #ffffff; flex-direction: column; align-items: center; padding: 20px; border-radius: 16px;">
            <div id="windRoseChartQ4" style="width: 1100px; height: 1160px;"></div>
            <div class="chart-footer" style="margin-top: 10px;">
                <button class="btn-primary-custom download-png" style="margin-right: 0.5rem;">📥 下載 PNG</button>

<div class="loading-overlay" id="loadingOverlay">
    <div class="spinner"></div>
    <div class="loading-text">正在搜尋資料，請稍候...</div>
</div>

<div class="toast" id="toast"></div>

<!-- Plotly.js -->
<script src="https://cdn.plot.ly/plotly-2.27.0.min.js"></script>

<script>
    document.addEventListener('DOMContentLoaded', function () {
        // 強制重新整理後捲動到最上方
        if (history.scrollRestoration) {
            history.scrollRestoration = 'manual';
        }
        window.addEventListener('load', function () {
            window.scrollTo(0, 0);
        });

        // 獲取 DOM 元素
        var searchBtn = document.getElementById('searchBtn');
        var loadingOverlay = document.getElementById('loadingOverlay');
        var toast = document.getElementById('toast');
        var tableContainer = document.querySelector('.data-table-container');
        var globalDataInfo = document.getElementById('globalDataInfo'); // 新增

        function showToast(message, isError) {
            toast.textContent = message;
            toast.className = 'toast show' + (isError ? ' error' : '');
            setTimeout(function () {
                toast.className = 'toast';
            }, 3000);
        }

        function formatDate(dateStr) {
            if (!dateStr) return '-';
            // 格式: 2025-12-01 -> 2025/12/01
            var parts = dateStr.split('-');
            if (parts.length >= 3) {
                return parts[0] + '/' + parts[1] + '/' + parts[2];
            }
            return dateStr;
        }

        function renderWindRose(containerId, windRoseData, titleText) {
            var container = document.getElementById(containerId).parentElement;

            // 顯示容器
            container.style.display = 'flex';
            container.style.flexDirection = 'column';
            container.style.alignItems = 'center';

            // 隱藏 placeholder (僅對主圖表)
            if (containerId === 'windRoseChart') {
                var placeholder = container.querySelector('.chart-placeholder');
                if (placeholder) placeholder.style.display = 'none';
            }

            // 顯示下載按鈕容器
            var footer = container.querySelector('.chart-footer');
            if (footer) {
                footer.style.display = 'block';

                // 綁定下載按鈕事件
                var station = titleText.split('站')[0];
                var pngBtn = footer.querySelector('.download-png');
                var jpegBtn = footer.querySelector('.download-jpeg');

                // 移除舊事件避免重複綁定 (雖然每次重新繪圖會重置 DOM，但保險起見)
                var newPngBtn = pngBtn.cloneNode(true);
                var newJpegBtn = jpegBtn.cloneNode(true);
                pngBtn.parentNode.replaceChild(newPngBtn, pngBtn);
                jpegBtn.parentNode.replaceChild(newJpegBtn, jpegBtn);

                newPngBtn.onclick = function () {
                    downloadChart('png', station, titleText, containerId);
                };
                newJpegBtn.onclick = function () {
                    downloadChart('jpeg', station, titleText, containerId);
                };
            }

            // 準備 Plotly 資料
            var directions = windRoseData.directions;
            var speedBins = windRoseData.speed_bins;
            var data = windRoseData.data;

            // 將方位轉換為角度 (北=0度，順時針)
            var theta = directions.map(function (d, i) {
                return i * 22.5;  // 每個方位 22.5 度
            });

            // 計算最大頻率值以設定軸範圍
            var maxVal = 0;
            speedBins.forEach(function (bin) {
                var binData = data[bin.name];
                for (var i = 0; i < 16; i++) {
                    var sum = 0;
                    speedBins.forEach(function (b) {
                        sum += data[b.name][i];
                    });
                    if (sum > maxVal) maxVal = sum;
                }
            });
            // 四捨五入至5的倍數再加5
            var maxRange = Math.ceil(maxVal / 5) * 5 + 5;

            // 建立 Plotly traces (堆疊式)
            var traces = speedBins.map(function (bin) {
                return {
                    type: 'barpolar',
                    name: bin.name,
                    r: data[bin.name],
                    theta: theta,
                    width: Array(16).fill(360 / 16), // 填滿 22.5 度無縫隙
                    marker: {
                        color: bin.color,
                        line: {
                            color: '#000000', // 黑線邊框
                            width: 1
                        }
                    },
                    hovertemplate: '<b>%{text}</b><br>' + bin.name + ': %{r:.1f}%<extra></extra>',
                    text: directions
                };
            });

            // Plotly layout - 白色背景，置中對齊
            var layout = {
                title: {
                    text: titleText + '<br>(頻率百分比 %)',
                    font: { size: 36, color: '#333333' },
                    x: 0.5,
                    xanchor: 'center',
                    y: 0.95
                },
                polar: {
                    domain: { x: [0.10, 0.90], y: [0.10, 0.90] },  // 調整顯示範圍
                    angularaxis: {
                        tickmode: 'array',
                        tickvals: theta,
                        ticktext: directions,
                        direction: 'clockwise',
                        rotation: 90,
                        showline: true,
                        linecolor: '#666666',
                        linewidth: 1,
                        gridcolor: '#cccccc',
                        tickfont: { color: '#333333', size: 20 }
                    },
                    radialaxis: {
                        ticksuffix: '%',
                        tickmode: 'linear',
                        tick0: 0,
                        dtick: 5,  // 5% 間隔
                        range: [0, maxRange],
                        showline: false,
                        gridcolor: '#cccccc',
                        tickfont: { color: '#666666', size: 16 }
                    },
                    bgcolor: '#ffffff'
                },
                showlegend: true,
                legend: {
                    font: { color: '#333333', size: 24 },
                    bgcolor: 'rgba(255, 255, 255, 0)',
                    borderwidth: 0,
                    orientation: 'h',
                    x: 0.5,
                    y: 0.05,
                    xanchor: 'center',
                    yanchor: 'top',
                    itemwidth: 30
                },
                annotations: [{
                    text: '有效資料筆數: ' + windRoseData.valid_count + ' 筆',
                    x: 0.5,
                    y: 0.01,
                    xref: 'paper',
                    yref: 'paper',
                    showarrow: false,
                    font: {
                        size: 20,
                        color: '#333333'
                    },
                    xanchor: 'center',
                    yanchor: 'top'
                }],
                paper_bgcolor: '#ffffff',
                plot_bgcolor: '#ffffff',
                font: { color: '#333333' },
                margin: { l: 20, r: 20, t: 60, b: 80 },
                barmode: 'stack',
                width: 1100,
                height: 1160
            };

            var config = {
                responsive: false,  // 固定尺寸
                displayModeBar: false,
                displaylogo: false
            };

            Plotly.newPlot(containerId, traces, layout, config);
        }

        // 下載圖片函數 - 1200px -> 調整為配合 1100x1160
        function downloadChart(format, station, filenameSuffix, divId) {
            Plotly.toImage(divId, {
                format: format,
                width: 1100,
                height: 1160,
                scale: 1
            }).then(function (dataUrl) {
                var link = document.createElement('a');
                link.download = station + '_' + filenameSuffix + '.' + format;
                link.href = dataUrl;
                link.click();
            });
        }

        searchBtn.addEventListener('click', function () {
            var stationName = document.getElementById('stationInput').value;
            var startYear = document.getElementById('startYearInput').value;
            var startMonth = document.getElementById('startMonthInput').value;
            var endYear = document.getElementById('endYearInput').value;
            var endMonth = document.getElementById('endMonthInput').value;

            if (!stationName) {
                showToast('❌ 請輸入測站名稱', true);
                return;
            }

            // 驗證日期範圍
            var startDate = new Date(startYear, startMonth - 1, 1);
            var endDate = new Date(endYear, endMonth - 1, 1);
            if (startDate > endDate) {
                showToast('❌ 起始日期不能晚於結束日期', true);
                return;
            }

            // 計算月數
            var monthCount = (parseInt(endYear) - parseInt(startYear)) * 12 + (parseInt(endMonth) - parseInt(startMonth)) + 1;

            loadingOverlay.classList.add('active');
            document.querySelector('.loading-text').textContent = '正在連接...';
            searchBtn.disabled = true;

            // 使用 fetch + SSE 讀取串流
            fetch('{% url "codis_windrose_plotter:search_data" %}', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    station_name: stationName,
                    start_year: parseInt(startYear),
                    start_month: parseInt(startMonth),
                    end_year: parseInt(endYear),
                    end_month: parseInt(endMonth),
                    headless: true
                })
            })
                .then(function (response) {
                    var reader = response.body.getReader();
                    var decoder = new TextDecoder();
                    var buffer = '';

                    function processStream() {
                        return reader.read().then(function (result) {
                            if (result.done) {
                                loadingOverlay.classList.remove('active');
                                document.querySelector('.loading-text').textContent = '正在搜尋資料，請稍候...';
                                searchBtn.disabled = false;
                                return;
                            }

                            buffer += decoder.decode(result.value, { stream: true });
                            var lines = buffer.split('\n');
                            buffer = lines.pop();

                            lines.forEach(function (line) {
                                if (line.startsWith('data: ')) {
                                    try {
                                        var data = JSON.parse(line.substring(6));

                                        if (data.type === 'progress') {
                                            // 更新進度顯示
                                            document.querySelector('.loading-text').textContent =
                                                '正在搜尋 ' + data.year + '年' + data.month + '月 的資料 (' + data.index + '/' + data.total + ')...';
                                        } else if (data.type === 'complete') {
                                            loadingOverlay.classList.remove('active');
                                            document.querySelector('.loading-text').textContent = '正在搜尋資料，請稍候...';
                                            searchBtn.disabled = false;


                                            if (data.success) {
                                                showToast('✅ ' + data.message, false);

                                                // 顯示全域資料資訊
                                                var globalInfo = document.getElementById('globalDataInfo');
                                                globalInfo.style.display = 'block';
                                                globalInfo.innerHTML = '<p>有效資料筆數: <span class="highlight" style="color: #00a88a; font-weight: bold;">' + data.wind_rose_data.valid_count + '</span> 筆 / 總資料: ' + data.wind_rose_data.total_count + ' 筆</p>';

                                                // 繪製主圖表
                                                var mainTitle = data.station + '站風玫瑰圖(' + data.start_year + '年至' + data.end_year + '年)';
                                                renderWindRose('windRoseChart', data.wind_rose_data, mainTitle);

                                                // 繪製季度圖表
                                                var yearRange = '(' + data.start_year + '年至' + data.end_year + '年)';
                                                renderWindRose('windRoseChartQ1', data.q1_data, data.station + '站 第一季(1-3月) 風玫瑰圖' + yearRange);
                                                renderWindRose('windRoseChartQ2', data.q2_data, data.station + '站 第二季(4-6月) 風玫瑰圖' + yearRange);
                                                renderWindRose('windRoseChartQ3', data.q3_data, data.station + '站 第三季(7-9月) 風玫瑰圖' + yearRange);
                                                renderWindRose('windRoseChartQ4', data.q4_data, data.station + '站 第四季(10-12月) 風玫瑰圖' + yearRange);
                                            } else {
                                                showToast('❌ ' + data.error, true);
                                            }
                                        }
                                    } catch (e) {
                                        console.log('Parse error:', e);
                                    }
                                }
                            });

                            return processStream();
                        });
                    }

                    return processStream();
                })
                .catch(function (error) {
                    showToast('❌ 發生錯誤: ' + error.message, true);
                    loadingOverlay.classList.remove('active');
                    document.querySelector('.loading-text').textContent = '正在搜尋資料，請稍候...';
                    searchBtn.disabled = false;
                });
        });
    });
</script>
