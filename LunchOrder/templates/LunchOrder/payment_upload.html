{% extends "LunchOrder/base.html" %}

{% block title %}南工中心訂便當系統 | 繳費辨識{% endblock %}

{% block content %}
<div class="container py-4">
    <div class="row justify-content-center">
        <div class="col-md-8 col-lg-6">
            <div class="card bg-card border-secondary">
                <div class="card-header border-secondary bg-transparent">
                    <h4 class="mb-0"><i class="fas fa-file-invoice-dollar me-2 text-warning"></i>繳費單辨識</h4>
                </div>
                <div class="card-body">
                    <p class="text-muted mb-4">
                        請上傳繳費單據的照片，系統將自動辨識內容並協助標記已繳費的訂單。
                        <br>
                        <small class="text-danger">* 目前僅支援圖片格式 (JPG, PNG)</small>
                    </p>

                    <form method="post" enctype="multipart/form-data" class="d-grid gap-4">
                        {% csrf_token %}

                        <div class="upload-area p-5 text-center border rounded-3"
                            style="border-style: dashed !important; border-color: var(--border-color) !important; background-color: rgba(255,255,255,0.02);">
                            <i class="fas fa-cloud-upload-alt fa-3x mb-3 text-muted"></i>
                            <h5 class="mb-2">點擊或拖檔案至此</h5>
                            <input type="file" name="payment_image" class="form-control" accept="image/*" required
                                style="opacity: 0; position: absolute; top: 0; left: 0; width: 100%; height: 100%; cursor: pointer;">
                            <p class="small text-muted mb-0" id="fileName">尚未選擇檔案</p>
                        </div>

                        <button type="submit" class="btn btn-primary py-2 fw-bold">
                            <i class="fas fa-upload me-2"></i>開始辨識
                        </button>
                    </form>
                </div>
            </div>

            <div class="mt-4 text-center">
                <a href="{% url 'lunchorder:order_list' %}" class="text-decoration-none text-muted">
                    <i class="fas fa-arrow-left me-1"></i>返回訂單列表
                </a>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
    // 簡單的檔案名稱顯示
    const fileInput = document.querySelector('input[type="file"]');
    const fileNameDisplay = document.getElementById('fileName');
    const uploadArea = document.querySelector('.upload-area');

    // 讓 upload-area 相對定位，以便 input 絕對定位覆蓋
    uploadArea.style.position = 'relative';

    fileInput.addEventListener('change', function (e) {
        if (this.files && this.files.length > 0) {
            fileNameDisplay.textContent = this.files[0].name;
            fileNameDisplay.classList.add('text-success');
            fileNameDisplay.classList.remove('text-muted');
        } else {
            fileNameDisplay.textContent = '尚未選擇檔案';
            fileNameDisplay.classList.remove('text-success');
            fileNameDisplay.classList.add('text-muted');
        }
    });

    // 拖曳效果 (選用)
    ['dragenter', 'dragover', 'dragleave', 'drop'].forEach(eventName => {
        uploadArea.addEventListener(eventName, preventDefaults, false);
    });

    function preventDefaults(e) {
        e.preventDefault();
        e.stopPropagation();
    }

    ['dragenter', 'dragover'].forEach(eventName => {
        uploadArea.addEventListener(eventName, highlight, false);
    });

    ['dragleave', 'drop'].forEach(eventName => {
        uploadArea.addEventListener(eventName, unhighlight, false);
    });

    function highlight(e) {
        uploadArea.style.backgroundColor = 'rgba(99, 102, 241, 0.1)';
        uploadArea.style.borderColor = 'var(--primary-color) !important';
    }

    function unhighlight(e) {
        uploadArea.style.backgroundColor = 'rgba(255,255,255,0.02)';
        uploadArea.style.borderColor = 'var(--border-color) !important';
    }
</script>
{% endblock %}
