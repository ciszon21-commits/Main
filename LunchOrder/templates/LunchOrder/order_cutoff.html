{% extends "LunchOrder/base.html" %}

{% block title %}南工中心訂便當系統 | 訂餐已截止{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-8 col-lg-6">
            <div class="card border-0 shadow-lg rounded-4 overflow-hidden" style="background: var(--bg-card);">
                <div class="card-body p-5 text-center">
                    <div class="mb-4">
                        <div class="d-inline-flex align-items-center justify-content-center rounded-circle bg-danger bg-opacity-10 p-4"
                            style="width: 100px; height: 100px;">
                            <i class="fas fa-clock fa-4x text-danger"></i>
                        </div>
                    </div>

                    <h2 class="fw-bold mb-3" style="color: var(--text-main);">今日訂餐時間已截止</h2>

                    <p class="fs-5 mb-4 text-muted">每日訂餐截止時間為 <span class="fw-bold text-danger">10:15</span><br>
                        請您明日請早！</p>

                    <div class="d-grid gap-3 d-sm-flex justify-content-sm-center mt-4">
                        <a href="{% url 'lunchorder:calendar_view' %}" class="btn btn-primary btn-lg px-4 fw-bold">
                            <i class="fas fa-calendar-alt me-2"></i>查看行事曆
                        </a>
                        <a href="{% url 'lunchorder:order_list' %}"
                            class="btn btn-outline-secondary btn-lg px-4 fw-bold">
                            <i class="fas fa-list me-2"></i>查看我的訂單
                        </a>
                    </div>
                </div>
                <div class="card-footer bg-light border-0 py-3 text-center text-muted small">
                    <i class="fas fa-info-circle me-1"></i> 如有特殊需求請直接聯繫管理員
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
