{% extends "LunchOrder/base.html" %}
{% load static %}

{% block title %}南工中心訂便當系統 | 管理員登入{% endblock %}

{% block extra_css %}
<style>
    .login-wrapper {
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 70vh;
    }

    .login-card {
        background: var(--bg-card);
        border: 1px solid var(--border-color);
        border-radius: 20px;
        padding: 48px 40px;
        width: 100%;
        max-width: 420px;
        box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
    }

    .login-card h2 {
        text-align: center;
        font-weight: 700;
        margin-bottom: 8px;
        background: var(--primary-gradient);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
    }

    .login-card .subtitle {
        text-align: center;
        color: var(--text-muted);
        margin-bottom: 32px;
        font-size: 0.95rem;
    }

    .login-card .form-label {
        color: var(--text-muted);
        font-weight: 500;
        font-size: 0.9rem;
        margin-bottom: 6px;
    }

    .login-card .form-control {
        background: var(--bg-input);
        border: 1px solid var(--border-color);
        color: var(--text-main);
        border-radius: 10px;
        padding: 12px 16px;
        font-size: 1rem;
        transition: border-color 0.2s, box-shadow 0.2s;
    }

    .login-card .form-control:focus {
        border-color: var(--primary-color);
        box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.25);
        outline: none;
    }

    .login-card .form-control::placeholder {
        color: #475569;
    }

    .btn-login {
        width: 100%;
        background: var(--primary-gradient);
        border: none;
        color: white;
        padding: 12px;
        border-radius: 10px;
        font-size: 1.05rem;
        font-weight: 600;
        cursor: pointer;
        transition: opacity 0.2s, transform 0.1s;
        margin-top: 8px;
    }

    .btn-login:hover {
        opacity: 0.9;
        transform: translateY(-1px);
    }

    .btn-login:active {
        transform: translateY(0);
    }

    .login-error {
        background: rgba(239, 68, 68, 0.15);
        border: 1px solid rgba(239, 68, 68, 0.3);
        color: #fca5a5;
        padding: 12px 16px;
        border-radius: 10px;
        text-align: center;
        margin-bottom: 20px;
        font-size: 0.95rem;
    }

    .login-icon {
        text-align: center;
        margin-bottom: 20px;
    }

    .login-icon i {
        font-size: 3rem;
        background: var(--primary-gradient);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
    }
</style>
{% endblock %}

{% block content %}
<div class="login-wrapper">
    <div class="login-card">
        <div class="login-icon">
            <i class="fas fa-user-shield"></i>
        </div>
        <h2>管理員登入</h2>
        <p class="subtitle">請輸入管理員帳號密碼以進入管理區</p>

        {% if error %}
        <div class="login-error">
            <i class="fas fa-exclamation-circle me-1"></i>{{ error }}
        </div>
        {% endif %}

        <form method="post">
            {% csrf_token %}
            <div class="mb-3">
                <label for="username" class="form-label">帳號</label>
                <input type="text" class="form-control" id="username" name="username" placeholder="請輸入帳號" required
                    autofocus>
            </div>
            <div class="mb-4">
                <label for="password" class="form-label">密碼</label>
                <div class="input-group">
                    <input type="password" class="form-control" id="password" name="password" placeholder="請輸入密碼"
                        required>
                    <span class="input-group-text" id="togglePassword"
                        style="background: var(--bg-input); border-color: var(--border-color); color: var(--text-muted); cursor: pointer;">
                        <i class="fas fa-eye" id="toggleIcon"></i>
                    </span>
                </div>
            </div>
            <button type="submit" class="btn-login">
                <i class="fas fa-sign-in-alt me-2"></i>登入
            </button>
        </form>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
    document.addEventListener('DOMContentLoaded', () => {
        const input = document.getElementById('password'), icon = document.getElementById('toggleIcon');
        document.getElementById('togglePassword').onclick = () => {
            const isPwd = input.type === 'password';
            input.type = isPwd ? 'text' : 'password';
            icon.className = `fas fa-eye${isPwd ? '-slash' : ''}`;
        };
    });
</script>
{% endblock %}
