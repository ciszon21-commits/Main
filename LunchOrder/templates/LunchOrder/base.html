<!DOCTYPE html>
<html lang="zh-Hant">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}南工中心訂便當系統{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-body: #0f172a;
            --bg-card: #1e293b;
            --bg-input: #020617;
            --border-color: #334155;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --primary-color: #6366f1;
            /* Indigo 500 */
            --primary-hover: #4f46e5;
            /* Indigo 600 */
            --accent-color: #06b6d4;
            /* Cyan 500 */
            --success-color: #10b981;

            --primary-gradient: linear-gradient(135deg, #6366f1 0%, #8b5cf6 100%);
        }

        body {
            background: var(--bg-body);
            color: var(--text-main);
            font-family: 'Inter', 'Microsoft JhengHei', sans-serif;
            min-height: 100vh;
        }

        .navbar-custom {
            background: var(--bg-card);
            border-bottom: 1px solid var(--border-color);
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
        }

        .navbar-brand {
            font-weight: 700;
            font-size: 1.25rem;
            letter-spacing: -0.025em;
        }

        /* 覆蓋 Bootstrap 預設文字顏色 */
        .text-muted {
            color: var(--text-muted) !important;
        }

        .text-dark {
            color: var(--text-main) !important;
        }

        /* Dropdown Styles for Dark Theme */
        .dropdown-menu {
            background-color: var(--bg-card);
            border: 1px solid var(--border-color);
            margin-top: 0.5rem;
        }

        .dropdown-item {
            color: var(--text-main);
            transition: all 0.2s;
        }

        .dropdown-item:hover,
        .dropdown-item:focus {
            background-color: rgba(255, 255, 255, 0.1);
            color: var(--text-main);
        }
    </style>
    {% block extra_css %}{% endblock %}
</head>

<body>
    <nav class="navbar navbar-expand-lg navbar-dark navbar-custom mb-4">
        <div class="container">
            <a class="navbar-brand" href="{% url 'lunchorder:calendar_view' %}">
                <i class="fas fa-utensils me-2"></i>南工中心訂便當系統
            </a>
            <div class="navbar-nav ms-auto">
                <a class="nav-link" href="{% url 'lunchorder:order_list' %}">
                    <i class="fas fa-list me-1"></i>個人訂單列表
                </a>
                <a class="nav-link" href="{% url 'lunchorder:order_create' %}">
                    <i class="fas fa-plus me-1"></i>新增訂單
                </a>
                <a class="nav-link" href="{% url 'lunchorder:order_statistics' %}">
                    <i class="fas fa-chart-bar me-1"></i>統計報表
                </a>
                {% if request.user.is_staff %}
                <div class="nav-item dropdown">
                    <a class="nav-link dropdown-toggle" href="#" id="navbarDropdown" role="button"
                        data-bs-toggle="dropdown" aria-expanded="false">
                        <i class="fas fa-cog me-1"></i>管理區
                    </a>
                    <ul class="dropdown-menu dropdown-menu-end" aria-labelledby="navbarDropdown"
                        style="background-color: var(--bg-card); border-color: var(--border-color);">
                        <li><a class="dropdown-item text-light" href="{% url 'lunchorder:restaurant_list' %}"><i
                                    class="fas fa-store me-1"></i>所有便當店</a></li>
                        <li><a class="dropdown-item text-light" href="{% url 'lunchorder:admin_list' %}"><i
                                    class="fas fa-user-shield me-1"></i>管理員名單</a></li>
                    </ul>
                </div>
                {% endif %}
            </div>
        </div>
    </nav>

    <main>
        {% if messages %}
        <div class="container">
            {% for message in messages %}
            <div class="alert alert-{{ message.tags }} alert-dismissible fade show" role="alert">
                {{ message }}
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>
            {% endfor %}
        </div>
        {% endif %}

        {% block content %}{% endblock %}
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    {% block extra_js %}{% endblock %}
</body>

</html>
